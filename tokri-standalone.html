<script>
/* ============================================================
   NEXCART — server sync adapter

   HOW TO TURN IT ON  —  edit ONE line, no other file needed
   Scroll down slightly to API_BASE_DEFAULT and paste your backend
   link inside the quotes. Save it (Commit changes on GitHub) and
   the shop goes online. You can do this straight from your phone.

   While that line is empty the shop still works exactly as it does
   today — nothing breaks.

   Every network call is wrapped in try/catch: a dead server or a
   patchy connection must never break the shop.
   ============================================================ */
(function () {
  'use strict';

  /* ============================================================
     ✏️  EDIT THIS ONE LINE  —  paste your backend link here
     ============================================================
     Example:  var API_BASE_DEFAULT = 'https://nexcart-api.onrender.com';
     Leave it empty ('') and the app stays offline-only.        */

  var API_BASE_DEFAULT = '';

  /* ============================================================ */

  var BASE = '';
  try {
    BASE = (API_BASE_DEFAULT || window.NC_API_BASE || localStorage.getItem('nc_api_base') || '').replace(/\/+$/, '');
  } catch (e) { BASE = API_BASE_DEFAULT || window.NC_API_BASE || ''; }

  var KEY_STORE   = 'nc_admin_key';
  var TOKEN_STORE = 'nc_token';
  var POLL_MS   = 15000;
  var lastOrderSeen = 0;
  var lastCatalogHash = '';
  var busy = false;

  function getKey()   { try { return localStorage.getItem(KEY_STORE) || ''; } catch (e) { return ''; } }
  function setKey(k)  { try { localStorage.setItem(KEY_STORE, k); } catch (e) {} }

  /* The customer's sign-in token. Deliberately separate from the owner's
     ADMIN_KEY — one identifies a shopper, the other unlocks the shop. */
  function getToken() { try { return localStorage.getItem(TOKEN_STORE) || ''; } catch (e) { return ''; } }
  function setToken(t) {
    try { t ? localStorage.setItem(TOKEN_STORE, t) : localStorage.removeItem(TOKEN_STORE); } catch (e) {}
  }
  /* Tell the server who this customer is, so the owner's admin panel lists
     everyone who uses the shop. Earlier builds kept accounts on the phone only,
     which is why signed-up testers never appeared on the Customers page. This
     runs on every launch and after a login, and the server matches on phone or
     email so nobody is listed twice. Silently ignored when offline. */
  function reportCustomerProfile() {
    try {
      var D = db(); if (!D || !D.user) return;
      var u = D.user;
      var name = String(u.name || '').trim();
      var phone = String(u.phone || '').replace(/\D/g, '');
      if (phone.length > 10) phone = phone.slice(-10);
      var email = String(u.email || '').trim();
      if (!name && !phone && !email) return;
      if (!phone && !email) return;
      api('/api/customer/sync', { method: 'POST', body: {
        name: name, phone: phone, email: email, provider: u.provider || 'app'
      } }).catch(function () {});
    } catch (e) {}
  }

  function applyUser(u) {
    var D = db(); if (!D || !u) return;
    if (u.name)  D.user.name  = u.name;
    if (u.phone) D.user.phone = '+91 ' + u.phone;
    D.user.email = u.email || '';
    D.user.accountId = u.id || '';
    D.user.provider = u.provider || '';
    if (typeof persist === 'function') persist();
  }
  function clearUserAccount() {
    var D = db(); if (!D) return;
    D.user.accountId = ''; D.user.provider = ''; D.user.email = '';
    if (typeof persist === 'function') persist();
  }

  function api(path, opts) {
    opts = opts || {};
    var headers = { 'Content-Type': 'application/json' };
    if (opts.admin) headers['x-admin-key'] = getKey();
    // Attach the shopper's token whenever we have one, so orders are linked
    // to their account and /api/myorders works.
    var tk = getToken();
    if (tk) headers['Authorization'] = 'Bearer ' + tk;
    return fetch(BASE + path, {
      method: opts.method || 'GET',
      headers: headers,
      body: opts.body ? JSON.stringify(opts.body) : undefined
    }).then(function (r) {
      return r.text().then(function (t) {
        var data;
        try { data = t ? JSON.parse(t) : {}; } catch (e) { data = {}; }
        if (!r.ok) { var err = new Error(data.error || ('HTTP ' + r.status)); err.status = r.status; throw err; }
        return data;
      });
    });
  }

  /* ---------- local helpers ---------- */

  function db() { return (typeof DB !== 'undefined') ? DB : null; }

  function toast(msg, iconName) {
    try { if (typeof showToast === 'function') showToast(msg, iconName || 'checkCircle'); } catch (e) {}
  }

  function refreshVisibleCatalog() {
    try {
      // Use the real grid renderer, which also honours the selected category
      // and the search box, instead of dumping every product in.
      if (typeof window.ncApplyGrid === 'function') {
        try { window.ncApplyGrid(); } catch (e) {}
      } else {
        var grid = document.getElementById('homeProductGrid');
        if (grid && typeof renderProductGrid === 'function') renderProductGrid(grid, DB.products);
      }
      var chips = document.getElementById('catChipRow');
      if (chips && typeof renderCategoryChips === 'function') renderCategoryChips(chips);
      // The category row and the "N products" label are drawn when Home first
      // renders. A catalogue that arrives from the server afterwards must
      // redraw them too, or the shop shows old categories next to new
      // products and a product count that does not match what is on screen.
      if (typeof window.ncRenderSubs === 'function') { try { window.ncRenderSubs(); } catch (e) {} }
      if (typeof window.setGridMeta === 'function') { try { window.setGridMeta(); } catch (e) {} }
    } catch (e) {}
  }

  /* Same idea as catalogHash(), but for a catalogue that is not in DB yet. */
  function catalogSigOf(products, categories) {
    try {
      return JSON.stringify([products, categories]).length + ':' +
             (products || []).map(function (p) {
               return p.id + p.price + p.stock;
             }).join(',');
    } catch (e) { return ''; }
  }

  function catalogHash() {
    try { return JSON.stringify([DB.products, DB.categories]).length + ':' +
                 (DB.products || []).map(function (p) { return p.id + p.price + p.stock; }).join(',') +
                 ':s' + [DB.settings && DB.settings.adminPin,
                         DB.settings && DB.settings.deliveryMinDays,
                         DB.settings && DB.settings.deliveryMaxDays,
                         DB.settings && DB.settings.returnWindowDays].join('|'); }
    catch (e) { return ''; }
  }

  /* ---------- 1. pull the catalogue down ---------- */

  function pullCatalog() {
    if (window.NC2) return window.NC2.pull(true);
    return api('/api/bootstrap').then(function (d) {
      var D = db(); if (!D) return;
      // Only adopt the server's catalogue once it actually holds something.
      // Before the owner's first push it is empty, and overwriting would wipe
      // the products they already created in the app.
      // Adopt the shop-wide admin PIN whenever the server has one, so a PIN
      // change reaches every device (this runs even when the catalogue is empty).
      if (d.settings && /^[0-9]{4,10}$/.test(String(d.settings.adminPin || ''))) {
        D.settings = D.settings || {};
        D.settings.adminPin = String(d.settings.adminPin);
      }
      /* Delivery estimate + return window are shop-wide promises, so the
         value the owner saved is what every phone should show. Only adopt
         numbers that are actually sane. */
      if (d.settings) {
        D.settings = D.settings || {};
        var numRule = function (v, lo, hi) {
          var n = parseInt(v, 10);
          return (isFinite(n) && n >= lo && n <= hi) ? n : null;
        };
        var fromServer = {
          deliveryMinDays: numRule(d.settings.deliveryMinDays, 1, 60),
          deliveryMaxDays: numRule(d.settings.deliveryMaxDays, 1, 60),
          returnWindowDays: numRule(d.settings.returnWindowDays, 1, 30)
        };
        Object.keys(fromServer).forEach(function (k) {
          if (fromServer[k] !== null) D.settings[k] = fromServer[k];
        });
        if (D.settings.deliveryMinDays && D.settings.deliveryMaxDays &&
            D.settings.deliveryMaxDays < D.settings.deliveryMinDays) {
          D.settings.deliveryMaxDays = D.settings.deliveryMinDays;
        }
        if (typeof persist === 'function') persist();
      }

      /* ---- 1b. the rest of the admin panel ----
         Branding (shop name, logo, opening screen), the offer banners, the
         announcement ticker, the coupon codes, the theme and the shipping
         rules are shop-wide too: the owner changes them once, and every
         customer device must show the same shop. Each is adopted only when the
         server actually sends it — so an empty server never blanks out what
         this phone already has. The screen is redrawn only when something
         really changed, otherwise a 15-second background poll would keep
         interrupting whatever the customer is doing. */
      var cfgBefore = JSON.stringify([D.branding, D.banners, D.announcements, D.coupons,
                                      D.settings && D.settings.theme,
                                      D.settings && D.settings.freeShipThreshold,
                                      D.settings && D.settings.shippingFee,
                                      D.settings && D.settings.onlinePaymentEnabled]);
      if (d.branding && typeof d.branding === 'object') {
        D.branding = Object.assign({}, D.branding || {}, d.branding);
      }
      if (Array.isArray(d.banners) && d.banners.length) D.banners = d.banners;
      if (Array.isArray(d.announcements) && d.announcements.length) D.announcements = d.announcements;
      if (Array.isArray(d.coupons) && d.coupons.length) D.coupons = d.coupons;
      if (d.settings) {
        D.settings = D.settings || {};
        if (d.settings.theme === 'light' || d.settings.theme === 'dark') {
          D.settings.theme = d.settings.theme;
        }
        if (typeof d.settings.onlinePaymentEnabled === 'boolean') {
          D.settings.onlinePaymentEnabled = d.settings.onlinePaymentEnabled;
        }
        var cfgNum = function (v, lo, hi) {
          var n = parseInt(v, 10);
          return (isFinite(n) && n >= lo && n <= hi) ? n : null;
        };
        var shipT = cfgNum(d.settings.freeShipThreshold, 0, 100000);
        if (shipT !== null) D.settings.freeShipThreshold = shipT;
        var shipF = cfgNum(d.settings.shippingFee, 0, 10000);
        if (shipF !== null) D.settings.shippingFee = shipF;
      }
      var cfgAfter = JSON.stringify([D.branding, D.banners, D.announcements, D.coupons,
                                     D.settings && D.settings.theme,
                                     D.settings && D.settings.freeShipThreshold,
                                     D.settings && D.settings.shippingFee,
                                     D.settings && D.settings.onlinePaymentEnabled]);
      if (cfgBefore !== cfgAfter) {
        if (typeof persist === 'function') persist();
        try { if (typeof applyBranding === 'function') applyBranding(); } catch (e) {}
        try { if (typeof renderTab === 'function') renderTab(currentTab); } catch (e) {}
      }
      if (Array.isArray(d.products) && d.products.length) {
        /* Never let an older copy on the server wipe what this phone has.
           The owner's own edits win unless the server is genuinely newer.
           Both stamps at 0 means neither side is versioned yet (an older
           server), and then the server still wins — the previous behaviour. */
        var localStamp  = Number(D.catalogUpdatedAt) || 0;
        var serverStamp = Number(d.catalogUpdatedAt) || 0;
        var localCount  = ((D.products   || []).length + (D.categories || []).length);
        var serverCount = (d.products.length +
                           ((d.categories || []).length));
        var hasLocal    = (D.products || []).length > 0;
        /* Take the server's copy only when it cannot be a step backwards.
           Being "not smaller" is the extra safety net here: a device that
           holds less than this phone is never allowed to replace it, even if
           neither side carries a version stamp yet. Losing work is far worse
           than briefly missing someone else's change - the next sync uploads
           this phone's copy, so the server heals by itself. */
        var notSmaller   = serverCount >= localCount;
        var clearlyNewer = serverStamp > localStamp;
        /* ---- v53 FIX: a brand-new install never picked up the shop's catalogue
           A phone with no data starts from the built-in demo catalogue, and that
           fresh copy is stamped with "now" when it is created. That stamp makes
           the demo data look NEWER than the real catalogue on the server, so
           takeServer stayed false and the device kept showing the dummy
           products (and their random placeholder photos) forever - on every new
           phone, and for every customer. Detect that untouched demo catalogue
           and let the server win regardless of timestamps. A real catalogue
           never matches this test, because its products carry real images
           instead of the placeholder ones. */
        var isUntouchedDemo = false;
        try {
          var list = D.products || [];
          isUntouchedDemo = list.length > 0 && list.every(function (pr) {
            return /^p\d+$/.test(String(pr.id)) &&
                   String(pr.img || '').indexOf('picsum.photos') >= 0;
          }) && (D.categories || []).every(function (c) { return /^c\d+$/.test(String(c.id)); });
        } catch (e) { isUntouchedDemo = false; }
        var takeServer   = !hasLocal || clearlyNewer || (serverStamp >= localStamp && notSmaller) ||
                           isUntouchedDemo;
        if (takeServer) {
          /* v54 - a background pull must not repaint the screen when the
             catalogue is byte-for-byte what this phone already shows. */
          var serverSig = catalogSigOf(d.products, d.categories);
          var localSig  = catalogSigOf(D.products, D.categories);
          if (serverStamp) D.catalogUpdatedAt = serverStamp;
          if (serverSig && serverSig === localSig) {
            if (typeof persist === 'function') persist();
            lastCatalogHash = catalogHash();
          } else {
            D.products   = d.products;
            D.categories = Array.isArray(d.categories) && d.categories.length ? d.categories : D.categories;
            if (typeof persist === 'function') persist();
            refreshVisibleCatalog();
            // The server is now the source of truth - remember its state so we do
            // not immediately push the same catalogue straight back at it.
            lastCatalogHash = catalogHash();
          }
        } else {
          // This phone is ahead of the server. Keep it, and let the next poll
          // upload it (an empty baseline forces the comparison to differ).
          lastCatalogHash = '';
        }
      } else {
        // Server is empty: the owner has never uploaded. Leave the baseline
        // unset so the very first poll uploads what they have made in the app.
        lastCatalogHash = '';
      }
    }).catch(function () { /* offline — keep local data */ });
  }

  /* ---------- 2. push the catalogue up (admin) ---------- */

  function pushCatalog(silent) {
    if (window.NC2) return getKey() ? window.NC2.push(!!silent, false) : Promise.resolve();
    var D = db(); if (!D || !getKey()) return Promise.resolve();
    /* An empty shop is never uploaded over a real one. A device that has lost
       its catalogue must not be able to erase what is on the server. */
    if (!(D.products || []).length && !(D.categories || []).length) {
      if (!silent) toast('Nothing to upload - this device has no products or categories.');
      return Promise.resolve();
    }
    return api('/api/admin/push', {
      method: 'POST', admin: true,
      body: {
        products: D.products || [],
        categories: D.categories || [],
        /* When this catalogue last changed here. The server hands it back to
           every other device so an out-of-date copy can never overwrite a
           newer one — which is how the owner's pictures used to disappear. */
        catalogUpdatedAt: Number(D.catalogUpdatedAt) || 0,
        /* The admin PIN and the shop rules travel with the catalogue so one
           change applies to every device, not only the phone that made it.
           That includes the delivery estimate, so a customer always sees the
           dates the owner actually promised. */
        /* The whole admin-panel configuration travels with the catalogue, so
           anything the owner changes shows on every phone, customers included:
           the shop name, logo and opening screen (branding), the offer banners,
           the announcement ticker, the coupon codes, the theme and the shop
           rules. */
        branding: D.branding || null,
        banners: D.banners || [],
        announcements: D.announcements || [],
        coupons: D.coupons || [],
        settings: Object.assign({}, D.settings || {}, {
          adminPin: (D.settings && D.settings.adminPin) || '',
          deliveryMinDays: D.settings && D.settings.deliveryMinDays,
          deliveryMaxDays: D.settings && D.settings.deliveryMaxDays,
          returnWindowDays: D.settings && D.settings.returnWindowDays,
          freeShipThreshold: D.settings && D.settings.freeShipThreshold,
          shippingFee: D.settings && D.settings.shippingFee,
          theme: (D.settings && D.settings.theme) || 'light',
          onlinePaymentEnabled: !!(D.settings && D.settings.onlinePaymentEnabled)
        })
      }
    }).then(function (r) {
      lastCatalogHash = catalogHash();
      if (!silent) toast('Catalogue uploaded (' + r.products + ' products)');
    }).catch(function (e) {
      if (!silent) toast('Upload failed: ' + e.message);
    });
  }

  /* ---------- 3. send an order to the server ---------- */

  function submitOrder(order) {
    var D = db(); if (!D || !order) return;
    var items = (order.items || []).filter(function (i) { return i && i.productId; })
      .map(function (i) { return { productId: i.productId, qty: i.qty }; });
    if (!items.length) return;

    api('/api/orders', {
      method: 'POST',
      body: {
        customerName:  order.customerName || (D.user && D.user.name) || '',
        customerPhone: order.customerPhone || (D.user && D.user.phone) || '',
        /* The customer's email travels with the order so the owner can see it
           in the admin panel and write to them about the delivery. */
        customerEmail: order.customerEmail || (D.user && D.user.email) || '',
        /* Private key of this order on this phone. The owner's status change is
           matched back to it, which is how the customer gets the update. */
        trackKey:      order.trackKey || '',
        clientOrderId: order.id || '',
        address:       String(order.address || '').replace(/\n/g, ', '),
        items:         items,
        delivery:      Number(order.deliveryFee) || 0,
        claimedTotal:  Number(order.total) || 0,
        couponCode:    order.couponCode || null
      }
    }).catch(function (e) {
      // Queue for retry instead of losing the order.
      try {
        var q = JSON.parse(localStorage.getItem('nc_order_queue') || '[]');
        q.push({ order: order, at: Date.now() });
        localStorage.setItem('nc_order_queue', JSON.stringify(q.slice(-50)));
      } catch (e2) {}
      toast('Order saved on this phone. It will upload when online.', 'warn');
    });
  }

  function flushQueue() {
    var q;
    try { q = JSON.parse(localStorage.getItem('nc_order_queue') || '[]'); } catch (e) { return; }
    if (!q.length) return;
    // Empty the queue first; submitOrder re-queues anything that fails, so a
    // dropped connection can never silently lose a customer's order.
    try { localStorage.setItem('nc_order_queue', '[]'); } catch (e) {}
    q.forEach(function (entry) { submitOrder(entry.order); });
  }

  /* ---------- 3b. the owner's status change goes up to the server ----------
     This is what makes "Push Update" reach the buyer: the customer's phone asks
     the server for its own order's status (below), and the server only knows
     about the change because this call told it. */
  window.ncUpdateOrder = function (order) {
    if (!order || !order.id || !getKey() || !BASE) return Promise.resolve(false);
    return api('/api/orders/' + encodeURIComponent(order.id), {
      method: 'PATCH', admin: true,
      body: {
        status:         order.status,
        currentCity:    order.currentCity || '',
        trackingId:     order.trackingId || '',
        trackingDetail: order.trackingDetail || '',
        deliveredAt:    Number(order.deliveredAt) || 0,
        timeline:       order.timeline || []
      }
    }).then(function () { return true; }).catch(function () { return false; });
  };

  /* ---------- 3c. customer: my orders update themselves ----------
     The buyer's phone keeps its own copy of the order it placed; the server
     keeps the copy the owner updates. The phone asks about its own orders using
     the private trackKey (never the order number), and anything that has moved
     is written onto the local order — so "Shipped" or "Out for Delivery"
     appears on the customer's phone by itself, with a small toast. The answer
     contains no names, phones or addresses. */
  var lastTrackCheck = 0;
  function pollMyOrders() {
    var D = db(); if (!D || !BASE) return;
    var now = Date.now();
    if (now - lastTrackCheck < 20000) return;
    var mine = (D.orders || []).filter(function (o) { return o && o.trackKey; });
    if (!mine.length) return;
    lastTrackCheck = now;
    var keys = mine.slice(0, 40).map(function (o) { return o.trackKey; });
    api('/api/track', { method: 'POST', body: { keys: keys } }).then(function (res) {
      var list = (res && res.orders) || [];
      if (!list.length) return;
      var byKey = {};
      list.forEach(function (r) { if (r && r.key) byKey[r.key] = r; });
      var changed = 0;
      mine.forEach(function (o) {
        var r = byKey[o.trackKey];
        if (!r) return;
        var moved = (r.status && r.status !== o.status) ||
                    (r.currentCity && r.currentCity !== o.currentCity) ||
                    (r.trackingId && r.trackingId !== o.trackingId) ||
                    (r.deliveredAt && r.deliveredAt !== o.deliveredAt);
        if (!moved) return;
        if (r.status) o.status = r.status;
        if (r.currentCity) o.currentCity = r.currentCity;
        if (r.trackingId) o.trackingId = r.trackingId;
        if (r.trackingDetail) o.trackingDetail = r.trackingDetail;
        if (r.deliveredAt) o.deliveredAt = r.deliveredAt;
        if (Array.isArray(r.timeline) && r.timeline.length) o.timeline = r.timeline;
        changed++;
        toast('Order #' + o.id + ' is now ' + (r.status || o.status), 'package');
      });
      if (changed) {
        if (typeof persist === 'function') persist();
        try { if (typeof renderTab === 'function' && currentTab === 'orders') renderTab('orders'); } catch (e) {}
      }
    }).catch(function () { /* offline — the local copy stays as it is */ });
  }

  /* ---------- 4. admin: poll for new orders ---------- */

  function pollOrders() {
    if (!getKey() || busy) return;
    busy = true;
    api('/api/orders?since=' + lastOrderSeen, { admin: true }).then(function (d) {
      var D = db(); if (!D) return;
      var existing = {};
      (D.orders || []).forEach(function (o) { existing[o.id] = true; });
      var fresh = (d.orders || []).filter(function (o) { return !existing[o.id]; });
      if (fresh.length) {
        D.orders = fresh.concat(D.orders || []);
        if (typeof persist === 'function') persist();
        toast(fresh.length === 1 ? 'New order received!' : fresh.length + ' new orders!', 'package');
      }
      if (d.serverTime) lastOrderSeen = d.serverTime;
      // Auto-push the catalogue whenever the local one differs from what the
      // server last received. lastCatalogHash is only advanced after a
      // successful push (inside pushCatalog), so a failed push retries.
      // Not silent: the owner should see confirmation, not wonder.
      var h = catalogHash();
      if (h !== lastCatalogHash) pushCatalog();
    }).catch(function (e) {
      if (e && e.status === 401) askForKey(true);
    }).then(function () { busy = false; });
  }

  function askForKey(isRetry) {
    if (!BASE) return;
    var msg = (isRetry ? 'Saved sync key was rejected.\n\n' : '') +
              'Enter your ADMIN_KEY to sync orders with the server:';
    var k = window.prompt(msg, getKey());
    if (k) {
      setKey(k.trim());
      lastOrderSeen = 0;
      toast('Sync key saved');
      // Upload the catalogue straight away so the owner sees it working
      // instead of waiting for the next poll tick.
      pushCatalog();
    }
  }

  /* The Dashboard counts customers and the Customers page lists them, so the
     server's list is fetched the moment the admin panel opens — not only when
     the Customers page is visited. Cached for 30 seconds to avoid chatter. */
  var customersFetchedAt = 0;
  function refreshCustomers(force) {
    try {
      if (!getKey() || !BASE) return;
      if (typeof adminUnlocked !== 'undefined' && !adminUnlocked) return;
      if (!force && Date.now() - customersFetchedAt < 30000) return;
      customersFetchedAt = Date.now();
      window.ncFetchCustomers().then(function (list) {
        if (!Array.isArray(list)) return;
        ncServerCustomers = list;
        if (typeof ncRepaintAdmin === 'function') ncRepaintAdmin();
      }).catch(function () {});
    } catch (e) {}
  }

  /* ---------- 4b. expose the sync helpers ----------
     The admin Settings screen lives in a different script scope, so hand
     it the four things it needs to drive sync from a proper form instead
     of the "saved sync key was rejected" prompt. */
  window.ncBases  = function () { return BASE; };
  window.ncGetKey = getKey;
  window.ncSetKey = setKey;
  window.ncPush   = pushCatalog;
  window.ncPull   = pullCatalog;
  /* Everyone who has signed in on any phone, ordered or not. Used by the
     admin Customers page so it is not empty before the first order. */
  window.ncFetchCustomers = function () {
    if (!getKey() || !BASE) return Promise.resolve([]);
    return api('/api/admin/users', { admin: true })
      .then(function (d) { return (d && d.users) || []; })
      .catch(function () { return []; });
  };

  /* ---------- 5. install hooks ---------- */

  function wrapPlaceOrder() {
    if (typeof window.placeOrder !== 'function' || window.placeOrder.__ncWrapped) return;
    var original = window.placeOrder;
    var wrapped = function () {
      var before = {};
      try { (db() && db().orders || []).forEach(function (o) { before[o.id] = true; }); } catch (e) {}
      var result = original.apply(this, arguments);
      try {
        ((db() && db().orders) || []).forEach(function (o) {
          if (!before[o.id]) submitOrder(o);
        });
      } catch (e) {}
      return result;
    };
    wrapped.__ncWrapped = true;
    window.placeOrder = wrapped;
  }

  var keyAsked = false;

  /* The backend key is only needed to READ orders and PUSH the catalogue —
     in other words, only inside the admin panel. Asking for it on a normal
     page load would throw a popup in front of every shopper, so we never
     do that. It is requested the moment the owner opens the admin panel. */
  /* A visible button, shown only inside the admin panel. Without it the
     upload is completely invisible — the owner cannot tell whether their
     catalogue actually reached the server. */
  function makeSyncButton() {
    if (window.NC2) { window.NC2.showPill(); return; }
    if (document.getElementById('ncSyncBtn')) return;
    var b = document.createElement('button');
    b.id = 'ncSyncBtn';
    b.type = 'button';
    b.textContent = '\u21bb Sync shop online';
    b.style.cssText = 'position:fixed;right:14px;bottom:78px;z-index:650;padding:11px 16px;' +
      'border:0;border-radius:999px;font-size:12.5px;font-weight:700;color:#fff;' +
      'background:#FF3F6C;box-shadow:0 6px 18px rgba(0,0,0,.28);cursor:pointer;';
    b.addEventListener('click', function () {
      if (!getKey()) { askForKey(false); return; }
      var label = b.textContent;
      b.disabled = true;
      b.textContent = 'Syncing\u2026';
      // Call the internals directly rather than going through window.NC —
      // one less thing that has to exist for the button to work.
      Promise.resolve()
        .then(function () { return pullCatalog(); })
        .then(function () { return pushCatalog(); })
        .then(function () { b.disabled = false; b.textContent = label; })
        .catch(function (e) {
          b.disabled = false;
          b.textContent = label;
          toast('Sync failed: ' + ((e && e.message) || 'unknown'));
        });
    });
    document.body.appendChild(b);
  }
  function removeSyncButton() {
    if (window.NC2) { window.NC2.hidePill(); return; }
    var b = document.getElementById('ncSyncBtn');
    if (b && b.parentNode) b.parentNode.removeChild(b);
  }

  function wrapAdminOpen() {
    if (typeof window.openAdminPanel === 'function' && !window.openAdminPanel.__ncWrapped) {
      var origOpen = window.openAdminPanel;
      var wrappedOpen = function () {
        var result = origOpen.apply(this, arguments);
        // Separate try/catch: a problem with the cosmetic button must never
        // stop the admin-key prompt, which is what actually makes sync work.
        try { makeSyncButton(); } catch (e) {}
        try {
          if (!getKey() && !keyAsked) {
            keyAsked = true;
            window.setTimeout(function () { askForKey(false); }, 600);
          }
        } catch (e) {}
        /* Who has signed up — fills the Dashboard counter and the Customers
           page on the spot, instead of waiting for a visit to that page. */
        try { window.setTimeout(function () { refreshCustomers(true); }, 500); } catch (e) {}
        return result;
      };
      wrappedOpen.__ncWrapped = true;
      window.openAdminPanel = wrappedOpen;
    }
    if (typeof window.closeAdminPanel === 'function' && !window.closeAdminPanel.__ncWrapped) {
      var origClose = window.closeAdminPanel;
      var wrappedClose = function () {
        try { removeSyncButton(); } catch (e) {}
        return origClose.apply(this, arguments);
      };
      wrappedClose.__ncWrapped = true;
      window.closeAdminPanel = wrappedClose;
    }
  }

  function startPolling() {
    window.setInterval(function () {
      if (typeof adminUnlocked === 'undefined' || !adminUnlocked) return;
      // Backup path, in case the admin panel was opened some other way.
      if (!getKey() && !keyAsked) { keyAsked = true; askForKey(false); return; }
      pollOrders();
    }, POLL_MS);
  }

  /* Customers are not signed into the admin panel, so they need their own
     timer: this is the one that keeps their order status fresh. */
  function startCustomerPolling() {
    if (window.__ncCustPoll) return;
    window.__ncCustPoll = window.setInterval(pollMyOrders, 30000);
    window.setTimeout(pollMyOrders, 5000);

    /* ---- v54: keep customer and tester phones in step with the shop ----
       Before this, a customer phone asked the server for the catalogue ONCE,
       when the app started. Anyone who left the app open - or came back to it
       from the background - kept seeing the old products until a full
       restart, so the owner's changes looked like they had not been sent.
       Now the same cheap pull runs on a timer, and again the moment the app
       comes back to the front or the connection returns.
       pullCatalog() still refuses an older or identical copy, and it only
       redraws the screen when the products actually changed, so this cannot
       roll a phone backwards or interrupt what the customer is doing. */
    if (!window.__ncCustCatalog && !window.NC2) {
      window.__ncCustCatalog = window.setInterval(function () {
        if (document.visibilityState === 'visible') pullCatalog();
      }, 60000);
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') pullCatalog();
      });
      window.addEventListener('online', function () { pullCatalog(); });
    }
  }

  function boot() {
    if (!BASE) return;               // switched off — do nothing at all
    wrapPlaceOrder();
    wrapAdminOpen();
    pullCatalog();
    flushQueue();
    startPolling();
    startCustomerPolling();
    reportCustomerProfile();

    /* A phone that keeps the app open in the background never runs the launch
       code again, so the profile is re-sent whenever the app comes forward.
       At most once every five minutes. */
    var lastReport = Date.now();
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState !== 'visible') return;
      if (Date.now() - lastReport < 300000) return;
      lastReport = Date.now();
      reportCustomerProfile();
    });
  }

  // Public surface, handy for debugging or a custom admin button.
  /* ---------- customer accounts ----------
     Every call stores the returned token and mirrors the account onto
     DB.user, so the app's existing "logged in" screens just work. */
  function authCall(path, body) {
    return api(path, { method: 'POST', body: body || {} }).then(function (d) {
      if (d && d.token) setToken(d.token);
      if (d && d.user)  applyUser(d.user);
      if (d && d.user)  reportCustomerProfile();
      return d;
    });
  }

  window.NC = {
    base: BASE,
    sync: function () { return pullCatalog().then(function () { return pushCatalog(); }); },
    pushCatalog: pushCatalog,
    pollOrders: pollOrders,
    setKey: setKey,
    getKey: getKey,
    reportCustomer: reportCustomerProfile,
    removeCustomer: function (payload) {
      return api('/api/admin/user/remove', { method: 'POST', admin: true, body: payload || {} });
    },

    signedIn: function () { return !!getToken(); },
    logout: function () {
      return api('/api/auth/logout', { method: 'POST' })
        .catch(function () {})
        .then(function () { setToken(''); clearUserAccount(); });
    },
    auth: {
      signup:   function (name, phone, password) { return authCall('/api/auth/signup', { name: name, phone: phone, password: password }); },
      login:    function (phone, password)       { return authCall('/api/auth/login',  { phone: phone, password: password }); },
      google:   function (credential)            { return authCall('/api/auth/google', { credential: credential }); },
      setPhone: function (phone)                 { return authCall('/api/auth/phone',  { phone: phone }); },
      me:       function ()                      { return api('/api/auth/me'); }
    }
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { window.setTimeout(boot, 800); });
  } else {
    window.setTimeout(boot, 800);
  }
})();

</script>

<!-- NEXCART home v6 behaviour: header, tabs, voice search, wallet -->
<script id="nexcart-home-v6-js">
/* ============================================================
   NEXCART home v6 — header, tabs, voice search, wallet
   Runs after the app's own scripts. Adds behaviour only.
   ============================================================ */
(function(){

  /* ---------- line icons, matching the app's 2px stroke style ---------- */
  var S = function(inner){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" '
         + 'stroke-linecap="round" stroke-linejoin="round">' + inner + '</svg>';
  };
  var NC_ICON = {
    mic:    S('<path d="M12 2.75a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0v-6a3 3 0 0 0-3-3Z"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0"/><path d="M12 18v3"/>'),
    camera: S('<path d="M3.5 8.5h2.2l1.3-2h9l1.3 2h2.2a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H3.5a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13.5" r="3.6"/>'),
    bell:   S('<path d="M18 9a6 6 0 1 0-12 0c0 5-2 6.5-2 6.5h16S18 14 18 9Z"/><path d="M10.3 19.5a2 2 0 0 0 3.4 0"/>'),
    pin:    S('<path d="M12 21s6.5-5.7 6.5-10.5a6.5 6.5 0 1 0-13 0C5.5 15.3 12 21 12 21Z"/><circle cx="12" cy="10.5" r="2.4"/>'),
    caret:  S('<path d="M6 9.5 12 15l6-5.5"/>')
  };

  function put(id, svg){
    var el = document.getElementById(id);
    if(el) el.innerHTML = '<span class="icon">' + svg + '</span>';
  }

  /* ---------- toast ---------- */
  window.ncToast = function(msg){
    var t = document.getElementById('ncToast');
    if(!t){ t = document.createElement('div'); t.id = 'ncToast'; t.className = 'nc-toast';
            document.body.appendChild(t); }
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._tm);
    t._tm = setTimeout(function(){ t.classList.remove('show'); }, 2600);
  };

  /* ---------- wallet = cart value ---------- */
  window.ncWallet = function(){
    var el = document.getElementById('locWallet');
    if(!el) return;
    try{
      var total = ((typeof DB !== 'undefined' && DB.cart) || []).reduce(function(s,line){
        var p = (DB.products || []).filter(function(x){ return x.id === line.productId; })[0];
        return s + (p ? p.price * line.qty : 0);
      }, 0);
      el.textContent = '\u20B9' + total;
    }catch(e){ el.textContent = '\u20B90'; }
  };

  /* ---------- pincode ---------- */
  function getPin(){
    try{ return localStorage.getItem('nexcart_pin') || '530048'; }catch(e){ return '530048'; }
  }
  function paintPin(){
    var el = document.getElementById('locPin');
    if(el) el.textContent = getPin();
  }
  function openPinModal(){
    var m = document.createElement('div');
    m.className = 'nc-modal';
    m.innerHTML =
      '<div class="nc-modal-card">' +
        '<h3>Delivery pincode</h3>' +
        '<p>We use this to show delivery estimates for your area.</p>' +
        '<input id="ncPinInput" inputmode="numeric" maxlength="6" placeholder="6-digit pincode" value="' + getPin() + '">' +
        '<div class="nc-modal-actions">' +
          '<button class="nc-btn-ghost" id="ncPinCancel">Cancel</button>' +
          '<button class="nc-btn-solid" id="ncPinSave">Save</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(m);
    requestAnimationFrame(function(){ m.classList.add('show'); });
    var input = m.querySelector('#ncPinInput');
    setTimeout(function(){ input.focus(); input.select(); }, 220);

    function close(){
      m.classList.remove('show');
      setTimeout(function(){ m.remove(); }, 260);
    }
    m.querySelector('#ncPinCancel').onclick = close;
    m.onclick = function(ev){ if(ev.target === m) close(); };
    m.querySelector('#ncPinSave').onclick = function(){
      var v = (input.value || '').trim();
      if(!/^\d{6}$/.test(v)){ ncToast('Enter a 6-digit pincode'); return; }
      try{ localStorage.setItem('nexcart_pin', v); }catch(e){}
      paintPin(); close(); ncToast('Delivering to ' + v);
    };
  }

  /* ---------- grid + tabs ---------- */
  window.ncQuery = '';
  window.ncActiveCat = 'all';

  window.setGridMeta = function(){
    var el = document.getElementById('gridMeta');
    if(!el) return;
    var n = document.querySelectorAll('#homeProductGrid .product-card').length;
    el.textContent = n + (n === 1 ? ' product' : ' products');
  };

  /* ---------- brand name shown in the UI ----------
     The stored branding may be all-caps ("NEXCART"); the owner wants it
     displayed as "Nexcart", so all-caps names are converted once here. */
  window.ncBrandName = function(){
    var n = (typeof DB !== 'undefined' && DB.branding && DB.branding.appName) || 'Nexcart';
    if(n.length > 1 && n === n.toUpperCase() && /[A-Z]/.test(n)){
      n = n.charAt(0).toUpperCase() + n.slice(1).toLowerCase();
    }
    return n;
  };

  /* ---------- sub-categories, shown under the main tabs ----------
     Tapping a main tab reveals its sub-categories (like Myntra): Shirts,
     Trousers, Jeans and so on. Known category names use the list below;
     anything else is derived from that category's real product names. */
  var NC_SUBS = {
    fashion:     ['T-Shirts','Shirts','Jeans','Trousers','Track Pants','Kurtas','Dresses','Tops','Sarees','Jackets','Sweatshirts','Shorts'],
    electronics: ['Mobiles','Laptops','Headphones','Earbuds','Smart Watches','Cameras','Speakers','Power Banks','Tablets','Cables'],
    home:        ['Bedsheets','Cushions','Curtains','Cookware','Storage','Lighting','Bath','Decor','Mats'],
    beauty:      ['Lipstick','Kajal','Perfume','Face Wash','Hair Oil','Creams','Nail Polish','Serum','Sunscreen'],
    kids:        ['Kids T-Shirts','Kids Jeans','Frocks','Toys','School Bags','Baby Care','Kids Shoes','Kidswear']
  };
  var NC_STOP = ['the','and','with','for','pack','set','new','best','buy','free','size','inch','pcs','piece','combo','offer','style','premium','cotton','men','women','kids','shipping','delivery'];

  window.ncActiveSub = '';

  /* Picture for a category: its own image, else the first product photo
     in it. Used by both the sub-category row and the categories page. */
  window.ncCatImage = function(c){
    if(!c) return '';
    if(c.img) return c.img;
    var p = (DB.products || []).filter(function(x){ return x.category === c.id && x.img; })[0];
    return p ? p.img : '';
  };

  /* Sub-categories of a category, each WITH an image.
     If the owner has set their own in Admin > Categories (cat.subs) those
     win; otherwise a sensible list is used and each picture comes from the
     first product in that category whose name matches. */
  window.ncSubsFor = function(catId){
    var cat = (DB.categories || []).filter(function(c){ return c.id === catId; })[0];
    if(!cat) return [];
    var prods = (DB.products || []).filter(function(p){ return p.category === catId; });

    function imgFor(name){
      var s = String(name).toLowerCase().replace(/s$/, '');
      var hit = prods.filter(function(p){
        return p.img && String(p.name || '').toLowerCase().indexOf(s) !== -1;
      })[0];
      if(hit) return hit.img;
      var any = prods.filter(function(p){ return p.img; })[0];
      return any ? any.img : (cat.img || '');
    }

    if(Object.prototype.toString.call(cat.subs) === '[object Array]' && cat.subs.length){
      return cat.subs
        .filter(function(s){ return s && String(s.name || '').trim(); })
        .map(function(s){
          var nm = String(s.name).trim();
          return { name: nm, img: s.img || imgFor(nm) };
        });
    }

    var names = null, key = String(cat.name || '').toLowerCase();
    for(var k in NC_SUBS){ if(key.indexOf(k) !== -1){ names = NC_SUBS[k].slice(); break; } }
    if(!names){
      var seen = {};
      names = [];
      prods.forEach(function(p){
        String(p.name || '').split(/\s+/).forEach(function(w){
          w = w.replace(/[^A-Za-z]/g, '');
          var low = w.toLowerCase();
          if(w.length >= 4 && NC_STOP.indexOf(low) === -1 && !seen[low]){
            seen[low] = 1;
            names.push(w.charAt(0).toUpperCase() + low.slice(1));
          }
        });
      });
    }
    /* Only offer a tile this category can actually fill.
       The list above names twelve sub-categories, but a young shop stocks
       two or three of them, so tapping "Jeans" on a category with no jeans
       opened a page saying "No products found" - a dead end that looks
       broken. Tiles the owner created by hand (cat.subs, handled above) are
       never filtered: those were deliberate, even before stock arrives. */
    function hasProducts(n){
      var s = String(n).toLowerCase().replace(/s$/, '');
      return prods.some(function(p){
        /* a product filed under this sub-category counts even when its name
           never says the word - "Slim Fit Denim" is still a Jean */
        if(p.sub && String(p.sub).toLowerCase() === String(n).toLowerCase()) return true;
        return String(p.name || '').toLowerCase().indexOf(s) !== -1;
      });
    }
    names = names.filter(hasProducts);

    return names.slice(0, 14).map(function(n){ return { name: n, img: imgFor(n) }; });
  };

  window.ncMatchSub = function(p, sub){
    if(!sub) return true;
    var s = String(sub).toLowerCase().replace(/s$/, '');
    var hay = ((p.name || '') + ' ' + (p.cat || '') + ' ' + (p.catName || '')).toLowerCase();
    return hay.indexOf(s) !== -1;
  };

  /* The row under the tabs. Every item is a PICTURE tile with its name
     underneath. With "All" selected it lists the main categories; with a
     category selected it lists that category's sub-categories. Tapping
     either one navigates to that listing. */
  window.ncRenderSubs = function(){
    var wrap = document.getElementById('subcatWrap');
    var rail = document.getElementById('subcatRail');
    if(!wrap || !rail) return;

    var items = [];
    if(!ncActiveCat || ncActiveCat === 'all'){
      items = (DB.categories || []).map(function(c){
        return { name: c.name, img: window.ncCatImage(c), emoji: c.emoji || '',
                 catId: c.id, isCat: true };
      });
    } else {
      items = window.ncSubsFor(ncActiveCat).map(function(s){
        return { name: s.name, img: s.img, emoji: '', catId: ncActiveCat, isCat: false };
      });
    }

    ncActiveSub = '';
    if(!items.length){ wrap.classList.remove('open'); rail.innerHTML = ''; return; }

    rail.innerHTML = items.map(function(it){
      // real photo first; then the category's own emoji; then its initial.
      // Never a grey placeholder box.
      var pic;
      if(it.img)        pic = '<img src="' + it.img + '" alt="" loading="lazy">';
      else if(it.emoji) pic = '<span class="subcat-emoji">' + it.emoji + '</span>';
      else              pic = '<span class="subcat-initial">' +
                              String(it.name || '?').charAt(0).toUpperCase() + '</span>';
      var subAttr = it.isCat ? '' : ' data-sub="' + String(it.name).replace(/"/g, '&quot;') + '"';
      return '<button class="subcat" type="button" data-cat="' + it.catId + '"' + subAttr + '>' +
               '<span class="subcat-img">' + pic + '</span>' +
               '<span class="subcat-name">' + it.name + '</span>' +
             '</button>';
    }).join('');

    Array.prototype.forEach.call(rail.querySelectorAll('.subcat'), function(b){
      b.onclick = function(){
        var catId = b.getAttribute('data-cat');
        var sub   = b.getAttribute('data-sub');
        if(sub && sub.length){ openSubCategoryProducts(catId, sub); }
        else if(catId){ openCategoryProducts(catId); }
      };
    });
    wrap.classList.add('open');
  };

  window.ncApplyGrid = function(){
    var grid = document.getElementById('homeProductGrid');
    if(!grid) return;
    var ps = (DB.products || []).slice();
    if(ncActiveCat !== 'all') ps = ps.filter(function(p){ return p.category === ncActiveCat; });
    if(ncActiveSub) ps = ps.filter(function(p){ return ncMatchSub(p, ncActiveSub); });
    if(ncQuery) ps = ps.filter(function(p){ return (p.name || '').toLowerCase().indexOf(ncQuery) >= 0; });
    renderProductGrid(grid, ps, true);
    staggerCards();
    setGridMeta();
  };

  window.ncInitTabs = function(){
    var box = document.getElementById('mtabs');
    if(!box) return;
    var ink = document.getElementById('mtabsInk');
    var scroller = document.getElementById('mtabsScroll');

    function move(anim){
      var act = box.querySelector('.mtab.active');
      if(!act || !ink) return;
      if(!act.offsetWidth) return;           // still hidden behind the splash
      if(anim === false) ink.style.transition = 'none';
      ink.style.width = act.offsetWidth + 'px';
      ink.style.transform = 'translateX(' + act.offsetLeft + 'px)';
      if(anim === false) requestAnimationFrame(function(){ ink.style.transition = ''; });
    }

    Array.prototype.forEach.call(box.querySelectorAll('.mtab'), function(t){
      t.onclick = function(){
        Array.prototype.forEach.call(box.querySelectorAll('.mtab'), function(x){
          x.classList.remove('active');
        });
        t.classList.add('active');
        ncActiveCat = t.dataset.cat || 'all';
        ncRenderSubs();
        move(true);
        // keep the selected tab in view
        if(scroller && t.offsetLeft < scroller.scrollLeft + 16){
          scroller.scrollTo({ left: Math.max(0, t.offsetLeft - 16), behavior: 'smooth' });
        }
        ncApplyGrid();
      };
    });

    // With "All" selected the row shows every main category as a picture,
    // so it is filled in straight away as well as on every tab tap.
    ncRenderSubs();
    move(false);
    // The app renders behind a splash/skeleton, so offsetWidth can still be 0
    // when this first runs. Re-measure a few times and after fonts settle.
    [60, 300, 900, 1800, 3000].forEach(function(t){
      setTimeout(function(){ move(false); }, t);
    });
    if(document.fonts && document.fonts.ready){
      document.fonts.ready.then(function(){ move(true); });
    }
    window.addEventListener('load', function(){ move(true); });
    window.addEventListener('resize', function(){ move(false); });
  };

  /* ---------- header wiring ---------- */
  function initHeader(){
    put('micBtn',  NC_ICON.mic);
    put('camBtn',  NC_ICON.camera);

    // --- voice search (real, via the Web Speech API) ---
    var mic = document.getElementById('micBtn');
    if(mic) mic.onclick = function(){
      var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if(!SR){ ncToast('Voice search needs Chrome. Please type instead.'); return; }
      var r = new SR();
      r.lang = 'en-IN'; r.interimResults = false; r.maxAlternatives = 1;
      r.onstart  = function(){ mic.classList.add('rec'); };
      r.onend    = function(){ mic.classList.remove('rec'); };
      r.onerror  = function(){ mic.classList.remove('rec'); ncToast('Could not hear you. Try again.'); };
      r.onresult = function(e){
        var said = e.results[0][0].transcript || '';
        var si = document.getElementById('searchInput');
        if(si){
          si.value = said;
          ncQuery = said.trim().toLowerCase();
          if(typeof switchTab === 'function' && currentTab !== 'home') switchTab('home');
          else ncApplyGrid();
          ncToast('Searching \u201C' + said + '\u201D');
        }
      };
      try{ r.start(); }catch(err){ ncToast('Microphone is busy. Try again.'); }
    };

    // --- camera ---
    var cam = document.getElementById('camBtn');
    if(cam) cam.onclick = function(){
      var inp = document.createElement('input');
      inp.type = 'file'; inp.accept = 'image/*'; inp.setAttribute('capture', 'environment');
      inp.onchange = function(){
        ncToast('Photo search needs a visual-search service \u2014 coming later.');
      };
      inp.click();
    };

    // --- sticky header shadow on scroll ---
    var tb = document.getElementById('topbar');
    if(tb){
      window.addEventListener('scroll', function(){
        tb.classList.toggle('nc-stuck', window.scrollY > 4);
      }, { passive: true });
    }
  }

  /* ---------- keep the header in sync across tab changes ---------- */
  function wrapSwitchTab(){
    if(typeof switchTab !== 'function' || switchTab.__ncWrapped) return;
    var orig = switchTab;
    var wrapped = function(page){
      orig(page);
      try{ ncWallet(); if(typeof ncPaintBell === 'function') ncPaintBell(); }catch(e){}
    };
    wrapped.__ncWrapped = true;
    window.switchTab = wrapped;
    try{ switchTab = wrapped; }catch(e){}
  }

  function start(){
    initHeader();
    wrapSwitchTab();
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', function(){ setTimeout(start, 60); });
  } else {
    setTimeout(start, 60);
  }

})();

</script>

</style>
<script id="nexcart-search-v17">
/* ============================================================
   NEXCART search v17 — search screen, voice, photo search
   Loaded after the app's own scripts; adds behaviour only.
   ============================================================ */
(function(){
  'use strict';

  var S = function(inner){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" '
         + 'stroke-linecap="round" stroke-linejoin="round">' + inner + '</svg>';
  };
  var IC = {
    mic:    S('<path d="M12 2.75a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0v-6a3 3 0 0 0-3-3Z"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0"/><path d="M12 18v3"/>'),
    camera: S('<path d="M3.5 8.5h2.2l1.3-2h9l1.3 2h2.2a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H3.5a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13.5" r="3.6"/>'),
    gallery:S('<rect x="3" y="4.5" width="18" height="15" rx="2.2"/><circle cx="8.6" cy="10" r="1.7"/><path d="m3.4 17.4 4.7-4.4 3.4 3.1 3.3-3.1 5.8 5.2"/>'),
    search: S('<circle cx="11" cy="11" r="6.6"/><path d="m20 20-4.3-4.3"/>'),
    back:   S('<path d="M15 5.5 8.5 12 15 18.5"/>'),
    x:      S('<path d="M7 7l10 10M17 7 7 17"/>'),
    caret:  S('<path d="M6.5 9.5 12 15l5.5-5.5"/>'),
    sort:   S('<path d="M4 7h13M4 12h9M4 17h5"/><path d="M17 12v7m0 0 2.4-2.4M17 19l-2.4-2.4"/>'),
    grid:   S('<rect x="3.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.6"/>'),
    check:  S('<path d="M5 12.5 10 17.5 19 7"/>'),
    sparkle:S('<path d="M12 3.5 13.9 9l5.6 1.9-5.6 1.9L12 18.4l-1.9-5.6L4.5 10.9 10.1 9 12 3.5Z"/>'),
    rupee:  S('<path d="M7 4.5h10M7 9h10M15.5 4.5c0 4.5-3.2 5.5-6 5.5l6.5 9.5"/>'),
    bag:    S('<path d="M5 7.5h14l-1.1 12.2a1.4 1.4 0 0 1-1.4 1.3H7.5a1.4 1.4 0 0 1-1.4-1.3Z"/><path d="M8.6 10V6.6a3.4 3.4 0 0 1 6.8 0V10"/>')
  };
  function ic(name){ return '<span class="icon">' + (IC[name] || IC.search) + '</span>'; }

  var LIST = [
    { key:'rel',   label:'Relevance' },
    { key:'lo',    label:'Price: low to high' },
    { key:'hi',    label:'Price: high to low' },
    { key:'new',   label:'Newest first' },
    { key:'deal',  label:'Biggest discount' }
  ];
  var RECENT_KEY = 'nexcart_recent';
  var state = { q:'', cat:'all', sort:'rel', cheap:false, photo:'' };

  /* ---------------------------------------------------------- helpers */
  function el(id){ return document.getElementById(id); }
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }
  function toast(m){ if(typeof window.ncToast === 'function') window.ncToast(m); }
  function prods(){ return (typeof DB !== 'undefined' && DB.products) ? DB.products : []; }
  function cats(){  return (typeof DB !== 'undefined' && DB.categories) ? DB.categories : []; }
  function catName(id){
    var c = cats().filter(function(x){ return x.id === id; })[0];
    return c ? c.name : '';
  }

  /* ---------------------------------------------------- recent searches */
  function recentLoad(){
    try{ var v = JSON.parse(localStorage.getItem(RECENT_KEY) || '[]');
         return Object.prototype.toString.call(v) === '[object Array]' ? v : []; }
    catch(e){ return []; }
  }
  function recentSave(list){
    try{ localStorage.setItem(RECENT_KEY, JSON.stringify(list.slice(0, 8))); }catch(e){}
  }
  /* The chip shows a real product photo, so shrink it hard — eight full
     data URLs would blow the localStorage quota. */
  function thumb(src, cb){
    if(!src){ cb(''); return; }
    var im = new Image();
    im.onload = function(){
      try{
        var N = 72, c = document.createElement('canvas');
        c.width = N; c.height = N;
        var g = c.getContext('2d'), m = Math.min(im.width, im.height);
        g.drawImage(im, (im.width - m) / 2, (im.height - m) / 2, m, m, 0, 0, N, N);
        cb(c.toDataURL('image/jpeg', 0.72));
      }catch(e){ cb(''); }
    };
    im.onerror = function(){ cb(''); };
    im.src = src;
  }
  function recentAdd(q){
    q = (q || '').trim();
    if(!q) return;
    var list = recentLoad().filter(function(r){ return r.q.toLowerCase() !== q.toLowerCase(); });
    var hit = state.lastHit || '';
    list.unshift({ q: q, img: hit });
    recentSave(list);
    thumb(hit, function(small){
      var l2 = recentLoad();
      for(var i = 0; i < l2.length; i++){
        if(l2[i].q.toLowerCase() === q.toLowerCase()){ l2[i].img = small; break; }
      }
      recentSave(l2);
    });
  }

  /* ------------------------------------------- colour analysis for photos */
  /* The catalogue has no colour tags, so the photo is matched on the
     dominant colour of each picture. That is a real comparison we can make
     in the browser with no service behind it — and it is labelled as such
     so nobody expects more than it does. */
  function dominant(img){
    try{
      var N = 44, c = document.createElement('canvas');
      c.width = N; c.height = N;
      var g = c.getContext('2d');
      g.drawImage(img, 0, 0, N, N);
      var d = g.getImageData(0, 0, N, N).data;
      var bins = {}, k, i;
      for(i = 0; i < d.length; i += 4){
        var r = d[i], gg = d[i+1], b = d[i+2];
        if(d[i+3] < 200) continue;
        var mx = Math.max(r, gg, b), mn = Math.min(r, gg, b);
        if(mx > 244 && mn > 234) continue;   // near-white background
        if(mx < 28) continue;                // near-black background
        k = (r >> 5) + '_' + (gg >> 5) + '_' + (b >> 5);
        if(!bins[k]) bins[k] = { n:0, r:0, g:0, b:0, s:0 };
        var o = bins[k];
        o.n++; o.r += r; o.g += gg; o.b += b; o.s += (mx - mn);
      }
      var keys = Object.keys(bins);
      if(!keys.length) return null;
      // a saturated colour describes a garment far better than a grey backdrop
      keys.sort(function(a, b){
        var A = bins[a], B = bins[b];
        return (B.n * (1 + (B.s / B.n) / 110)) - (A.n * (1 + (A.s / A.n) / 110));
      });
      var w = bins[keys[0]];
      return { r: w.r / w.n, g: w.g / w.n, b: w.b / w.n };
    }catch(e){ return null; }   // a cross-origin picture taints the canvas
  }
  function dist(a, b){
    var dr = a.r - b.r, dg = a.g - b.g, db = a.b - b.b;
    return Math.sqrt(2 * dr * dr + 4 * dg * dg + 3 * db * db);
  }
  function rgb(c){ return 'rgb(' + Math.round(c.r) + ',' + Math.round(c.g) + ',' + Math.round(c.b) + ')'; }

  /* ------------------------------------------------------------ sorting */
  function sortList(ps){
    if(state.sort === 'lo')   ps.sort(function(a, b){ return a.price - b.price; });
    if(state.sort === 'hi')   ps.sort(function(a, b){ return b.price - a.price; });
    if(state.sort === 'new')  ps.reverse();
    if(state.sort === 'deal') ps.sort(function(a, b){
      return (1 - b.price / b.mrp) - (1 - a.price / a.mrp);
    });
    return ps;
  }
  function filterList(){
    var ps = prods().slice();
    if(state.cat !== 'all') ps = ps.filter(function(p){ return p.category === state.cat; });
    if(state.cheap) ps = ps.filter(function(p){ return p.price < 299; });
    if(state.q){
      ps = ps.filter(function(p){
        return (p.name || '').toLowerCase().indexOf(state.q) >= 0
            || catName(p.category).toLowerCase().indexOf(state.q) >= 0
            || (p.brand || '').toLowerCase().indexOf(state.q) >= 0;
      });
    }
    return sortList(ps);
  }

  /* ============================================================
     the search screen
     ============================================================ */
  function buildPanel(){
    if(el('ncsPanel')) return;
    var d = document.createElement('div');
    d.className = 'ncs';
    d.id = 'ncsPanel';
    d.innerHTML =
      '<div class="ncs-top">' +
        '<button class="ncs-back" id="ncsBack" aria-label="Back" type="button">' + ic('back') + '</button>' +
        '<div class="ncs-field">' +
          '<input id="ncsInput" type="text" inputmode="search" placeholder="Search for products, brands..." ' +
                 'autocomplete="off" autocorrect="off" spellcheck="false">' +
          '<button class="ncs-x" id="ncsClearQ" type="button" style="display:none" aria-label="Clear">' + ic('x') + '</button>' +
          '<button class="ncs-ib" id="ncsMic" type="button" aria-label="Voice search"></button>' +
          '<button class="ncs-ib" id="ncsCam" type="button" aria-label="Search by photo"></button>' +
        '</div>' +
      '</div>' +
      '<div class="ncs-body" id="ncsBody">' +
        '<div id="ncsRecentsBox"></div>' +
        '<div id="ncsFilterBox"></div>' +
        '<div class="ncs-results" id="ncsGrid"></div>' +
      '</div>' +
      '<div class="ncs-actions">' +
        '<button class="ncs-act" id="ncsActImage" type="button">' + ic('gallery') + '<span>Image Search</span></button>' +
        '<button class="ncs-act" id="ncsActCam" type="button">' + ic('camera') + '<span>Camera Search</span></button>' +
      '</div>';
    document.body.appendChild(d);

    el('ncsMic').innerHTML = ic('mic');
    el('ncsCam').innerHTML = ic('camera');
    el('ncsBack').onclick = close;
    el('ncsClearQ').onclick = function(){ el('ncsInput').value = ''; state.q = ''; state.photo = ''; paintThumb(''); paint(); el('ncsInput').focus(); };
    el('ncsInput').addEventListener('input', function(){
      state.q = this.value.trim().toLowerCase();
      state.photo = ''; paintThumb('');
      el('ncsClearQ').style.display = this.value ? 'flex' : 'none';
      paint();
    });
    el('ncsInput').addEventListener('keydown', function(e){
      if(e.key === 'Enter' || e.keyCode === 13){
        this.blur();
        if(state.q){ recentAdd(el('ncsInput').value.trim()); paint(); }
      }
    });
    el('ncsMic').onclick = voiceStart;
    el('ncsCam').onclick = function(){ photoSheet('both'); };
    el('ncsActImage').onclick = function(){ photoSheet('upload'); };
    el('ncsActCam').onclick = function(){ pickPhoto('camera'); };
    // a tap on a result opens the product, so put the search screen away first
    el('ncsGrid').addEventListener('click', function(e){
      if(e.target.closest('.product-card')){
        if(state.q) recentAdd(el('ncsInput').value.trim());
        setTimeout(close, 0);
      }
    });
    el('ncsPanel').addEventListener('click', function(e){
      if(e.target === el('ncsRecentsBox') || e.target === el('ncsBody')) { /* noop */ }
    });
    document.addEventListener('keydown', function(e){
      if(e.key === 'Escape' && el('ncsPanel').classList.contains('open')) close();
    });
  }

  function paintThumb(src){
    var f = document.querySelector('.ncs-field');
    if(!f) return;
    var old = f.querySelector('.ncs-thumb');
    if(old) old.remove();
    if(!src) return;
    var im = document.createElement('img');
    im.className = 'ncs-thumb';
    im.src = src;
    f.insertBefore(im, f.firstChild);
  }

  function open(seed){
    buildPanel();
    if(typeof seed === 'string'){ el('ncsInput').value = seed; state.q = seed.trim().toLowerCase(); }
    el('ncsClearQ').style.display = el('ncsInput').value ? 'flex' : 'none';
    el('ncsPanel').classList.add('open');
    document.documentElement.style.overflow = 'hidden';
    paint();
    setTimeout(function(){ try{ el('ncsInput').focus(); }catch(e){} }, 240);
  }
  function close(){
    var p = el('ncsPanel');
    if(!p) return;
    p.classList.remove('open');
    document.documentElement.style.overflow = '';
    try{ el('ncsInput').blur(); }catch(e){}
  }

  /* ------------------------------------------------------ recent chips */
  function paintRecents(){
    var box = el('ncsRecentsBox');
    var list = recentLoad();
    if(!list.length){ box.innerHTML = ''; return; }
    box.innerHTML =
      '<div class="ncs-sec">' +
        '<div class="ncs-sec-head">' +
          '<h3>Recent searches</h3>' +
          '<button class="ncs-clear" id="ncsClearAll" type="button">Clear All</button>' +
        '</div>' +
        '<div class="ncs-chips">' +
          list.map(function(r){
            return '<button class="ncs-chip" data-q="' + esc(r.q) + '" type="button">' +
                     (r.img ? '<img src="' + r.img + '" alt="">'
                            : '<span class="ncs-chip-ic">' + ic('search') + '</span>') +
                     '<span>' + esc(r.q) + '</span>' +
                   '</button>';
          }).join('') +
        '</div>' +
      '</div>';
    el('ncsClearAll').onclick = function(){
      recentSave([]); paintRecents(); toast('Recent searches cleared');
    };
    Array.prototype.forEach.call(box.querySelectorAll('.ncs-chip'), function(c){
      c.onclick = function(){
        el('ncsInput').value = c.dataset.q;
        state.q = c.dataset.q.toLowerCase();
        el('ncsClearQ').style.display = 'flex';
        el('ncsInput').blur();
        paint();
      };
    });
  }

  /* ----------------------------------------------------- filter chips */
  function paintFilters(){
    var box = el('ncsFilterBox');
    var catLabel  = state.cat === 'all' ? 'Categories' : catName(state.cat);
    var sortLabel = 'Sort';
    LIST.forEach(function(s){ if(s.key === state.sort && s.key !== 'rel') sortLabel = s.label; });
    box.className = 'ncs-filters';
    box.innerHTML =
      '<button class="ncs-f" id="ncsFCat" type="button">'  + ic('grid')  + '<span>' + esc(catLabel)  + '</span>' + ic('caret') + '</button>' +
      '<button class="ncs-f" id="ncsFSort" type="button">' + ic('sort')  + '<span>' + esc(sortLabel) + '</span>' + ic('caret') + '</button>' +
      '<button class="ncs-f' + (state.cheap ? ' on' : '') + '" id="ncsFCheap" type="button">' + ic('rupee') + '<span>Under \u20B9299</span></button>' +
      ((state.cat !== 'all' || state.sort !== 'rel' || state.cheap)
        ? '<button class="ncs-f on" id="ncsFReset" type="button">Clear</button>' : '');
    if(el('ncsFCat'))  el('ncsFCat').onclick  = sheetCategories;
    if(el('ncsFSort')) el('ncsFSort').onclick = sheetSort;
    el('ncsFCheap').onclick = function(){ state.cheap = !state.cheap; paint(); };
    if(el('ncsFReset')) el('ncsFReset').onclick = function(){ state.cat='all'; state.sort='rel'; state.cheap=false; paint(); };
  }

  /* ------------------------------------------------- generic bottom sheet */
  function openSheet(title, inner, after){
    var d = document.createElement('div');
    d.className = 'ncp';
    d.innerHTML = '<div class="ncp-card"><h3>' + esc(title) + '</h3>' +
                  (inner || '') + '</div>';
    document.body.appendChild(d);
    d.onclick = function(e){ if(e.target === d) shut(); };
    function shut(){ d.classList.remove('open'); setTimeout(function(){ d.remove(); }, 200); }
    if(after) after(d, shut);
    requestAnimationFrame(function(){ d.classList.add('open'); });
  }
  function sheetCategories(){
    var rows = '<div class="ncs-list">' +
      '<div class="ncs-opt' + (state.cat === 'all' ? '' : '') + '" data-cat="all"><span>All categories</span>' +
        (state.cat === 'all' ? ic('check') : '') + '</div>' +
      cats().map(function(c){
        return '<div class="ncs-opt" data-cat="' + c.id + '"><span>' + esc(c.name) + '</span>' +
               (state.cat === c.id ? ic('check') : '') + '</div>';
      }).join('') + '</div>';
    openSheet('Shop by category', rows, function(d, shut){
      Array.prototype.forEach.call(d.querySelectorAll('.ncs-opt'), function(o){
        o.onclick = function(){ state.cat = o.dataset.cat; shut(); paint(); };
      });
    });
  }
  function sheetSort(){
    var rows = '<div class="ncs-list">' + LIST.map(function(s){
      return '<div class="ncs-opt" data-sort="' + s.key + '"><span>' + esc(s.label) + '</span>' +
             (state.sort === s.key ? ic('check') : '') + '</div>';
    }).join('') + '</div>';
    openSheet('Sort by', rows, function(d, shut){
      Array.prototype.forEach.call(d.querySelectorAll('.ncs-opt'), function(o){
        o.onclick = function(){ state.sort = o.dataset.sort; shut(); paint(); };
      });
    });
  }

  /* --------------------------------------------------------- the results */
  function paint(){
    paintRecents();
    paintFilters();
    var grid = el('ncsGrid');
    var q = el('ncsInput') ? el('ncsInput').value.trim() : '';

    if(state.photo) return;   // the photo search owns the grid right now

    var ps = filterList();
    state.lastHit = ps.length ? ps[0].img : '';
    var head = '';
    if(q){
      head = ps.length
        ? '<p class="ncs-note">' + ic('search') + ps.length + ' result' + (ps.length === 1 ? '' : 's') + ' for \u201C' + esc(q) + '\u201D</p>'
        : '';
    } else {
      head = '<p class="ncs-note">' + ic('sparkle') + 'Popular right now</p>';
    }
    render(grid, ps, head, q);
  }
  function render(grid, ps, head, q){
    if(head) grid.innerHTML = head + '<div class="product-grid" id="ncsGridInner"></div>';
    var inner = el('ncsGridInner');
    if(!inner) return;
    if(ps && ps.length){
      inner.innerHTML = ps.map(function(p){ return productCardHTML(p); }).join('');
      bindProductCardEvents(inner);
      staggerCards();
    } else if(ps){
      grid.innerHTML = head +
        '<div class="ncs-hint">' + ic('search') +
          '<h4>' + (q ? 'Nothing matched \u201C' + esc(q) + '\u201D' : 'No products here yet') + '</h4>' +
          '<p>' + (q ? 'Try a shorter word, or clear the filters below.' : 'Add products in the admin panel and they will show up here.') + '</p>' +
        '</div>';
    }
  }

  /* ============================================================
     voice search
     ============================================================ */
  var voiceRec = null, voiceUI = null;

  function voiceSheet(){
    if(voiceUI) return voiceUI;
    var d = document.createElement('div');
    d.className = 'ncv';
    d.innerHTML =
      '<div class="ncv-card">' +
        '<div class="ncv-mic" id="ncvMic">' + ic('mic') + '</div>' +
        '<div class="ncv-heard" id="ncvHeard">Listening\u2026</div>' +
        '<p id="ncvHint">Say what you are looking for</p>' +
        '<div class="ncv-acts" style="margin-top:18px;">' +
          '<button class="nc-btn ghost" id="ncvCancel" type="button">Cancel</button>' +
          '<button class="nc-btn solid" id="ncvDone" type="button">Search</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(d);
    d.onclick = function(e){ if(e.target === d) stopVoice(); };
    el('ncvCancel').onclick = stopVoice;
    el('ncvDone').onclick = function(){
      var t = (el('ncvHeard').textContent || '').trim();
      stopVoice();
      if(t && t !== 'Listening\u2026') acceptVoice(t); else toast('Nothing was heard yet.');
    };
    voiceUI = d;
    return d;
  }
  function stopVoice(){
    if(voiceRec){ try{ voiceRec.abort(); }catch(e){} voiceRec = null; }
    var m = el('ncsMic'); if(m) m.classList.remove('rec');
    if(voiceUI){ voiceUI.classList.remove('open'); }
  }
  function acceptVoice(txt){
    buildPanel();
    if(!el('ncsPanel').classList.contains('open')) open('');
    el('ncsInput').value = txt;
    state.q = txt.trim().toLowerCase();
    state.photo = ''; paintThumb('');
    el('ncsClearQ').style.display = 'flex';
    recentAdd(txt.trim());
    paint();
    toast('Searching \u201C' + txt + '\u201D');
  }

  function voiceStart(){
    if(!window.isSecureContext){
      toast('Voice search needs a secure (https) connection.');
      return;
    }
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR){
      toast('This browser has no voice search. Please type instead.');
      return;
    }
    if(voiceRec){ try{ voiceRec.abort(); }catch(e){} voiceRec = null; }

    var d = voiceSheet();
    d.classList.add('open');
    el('ncvHeard').textContent = 'Listening\u2026';
    el('ncvHint').textContent = 'Say what you are looking for';

    var r = new SR();
    voiceRec = r;
    r.lang = 'en-IN';
    r.interimResults = true;
    r.maxAlternatives = 1;
    r.continuous = false;

    r.onstart = function(){
      d.classList.add('on');
      var m = el('ncsMic'); if(m) m.classList.add('rec');
    };
    r.onresult = function(e){
      var txt = '';
      for(var i = e.resultIndex; i < e.results.length; i++){
        txt += e.results[i][0].transcript;
      }
      txt = txt.trim();
      if(txt) el('ncvHeard').textContent = txt;
      if(e.results[e.results.length - 1].isFinal && txt){
        stopVoice();
        acceptVoice(txt);
      }
    };
    r.onerror = function(e){
      var code = (e && e.error) || '';
      stopVoice();
      if(code === 'no-speech')        toast('I did not catch that. Please try again.');
      else if(code === 'not-allowed' || code === 'service-not-allowed')
                                      toast('Microphone is blocked. Allow mic access for this site, then try again.');
      else if(code === 'audio-capture') toast('No microphone was found on this device.');
      else if(code === 'network')     toast('Voice search needs an internet connection.');
      else if(code === 'aborted')     { /* the owner closed it */ }
      else                            toast('Voice search failed. Please type instead.');
    };
    r.onend = function(){
      var m = el('ncsMic'); if(m) m.classList.remove('rec');
      d.classList.remove('on');
    };
    try{ r.start(); }
    catch(err){
      stopVoice();
      toast('The microphone is busy. Please try again.');
    }
  }

  /* ============================================================
     photo search — camera or an uploaded picture
     ============================================================ */
  function pickPhoto(mode){
    var inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = 'image/*';
    if(mode === 'camera') inp.setAttribute('capture', 'environment');
    inp.style.display = 'none';
    document.body.appendChild(inp);
    inp.addEventListener('change', function(){
      var f = inp.files && inp.files[0];
      document.body.removeChild(inp);
      if(!f) return;
      if(!/^image\//.test(f.type)){ toast('Please choose a picture file'); return; }
      var fr = new FileReader();
      fr.onload  = function(){ visualSearch(fr.result); };
      fr.onerror = function(){ toast('That picture could not be read.'); };
      fr.readAsDataURL(f);
    });
    inp.click();
  }
  function photoSheet(){
    openSheet('Search by photo',
      '<p style="margin-bottom:4px;">Find things that look like your picture.</p>' +
      '<button class="ncp-opt" id="ncpCam" type="button">' +
        '<span class="ncp-ic">' + ic('camera') + '</span>' +
        '<span><b>Take a photo</b><span>Use the camera right now</span></span></button>' +
      '<button class="ncp-opt" id="ncpUp" type="button">' +
        '<span class="ncp-ic">' + ic('gallery') + '</span>' +
        '<span><b>Upload a photo</b><span>Pick one from your gallery</span></span></button>',
      function(d){
        el('ncpCam').onclick = function(){ d.classList.remove('open');
          setTimeout(function(){ d.remove(); pickPhoto('camera'); }, 180); };
        el('ncpUp').onclick  = function(){ d.classList.remove('open');
          setTimeout(function(){ d.remove(); pickPhoto('upload'); }, 180); };
      });
  }

  function visualSearch(dataUrl){
    buildPanel();
    if(!el('ncsPanel').classList.contains('open')) open('');
    state.photo = dataUrl;
    state.q = '';
    el('ncsInput').value = '';
    el('ncsClearQ').style.display = 'none';
    paintThumb(dataUrl);
    el('ncsRecentsBox').innerHTML = '';
    paintFilters();
    el('ncsGrid').innerHTML =
      '<div class="ncs-hint">' + ic('camera') +
        '<h4>Matching your photo\u2026</h4>' +
        '<p>Comparing it with the pictures in your catalogue.</p>' +
      '</div>';
    var im = new Image();
    im.onload = function(){
      var qc = dominant(im);
      if(!qc){ showVisual(null, [], dataUrl, 'I could not read the colours in that picture.'); return; }
      scoreAll(qc, dataUrl);
    };
    im.onerror = function(){ showVisual(null, [], dataUrl, 'That picture could not be opened.'); };
    im.src = dataUrl;
  }

  function scoreAll(qc, dataUrl){
    var ps = prods().slice();
    if(!ps.length){ showVisual(qc, [], dataUrl, 'There are no products in the catalogue yet.'); return; }
    var found = [], pending = ps.length;
    function step(){
      if(--pending > 0) return;
      found.sort(function(a, b){ return a.d - b.d; });
      var near = found.filter(function(x){ return x.d < 118; });
      if(near.length < 4) near = found.slice(0, Math.min(8, found.length));
      showVisual(qc, near, dataUrl, '');
    }
    ps.forEach(function(p){
      if(!p.img){ step(); return; }
      var im = new Image();
      im.onload  = function(){ var c = dominant(im); if(c) found.push({ p:p, d:dist(qc, c) }); step(); };
      im.onerror = step;
      im.src = p.img;
    });
  }

  function showVisual(qc, list, dataUrl, note){
    var grid = el('ncsGrid');
    var head =
      '<div class="ncs-qphoto">' +
        '<img src="' + dataUrl + '" alt="">' +
        '<div><b>Selected photo</b><span>' +
          (note ? esc(note) : 'Closest colours we have') +
        '</span></div>' +
      '</div>' +
      (qc ? '<p class="ncs-note"><span class="ncs-swatch" style="background:' + rgb(qc) + '"></span>' +
            'Matched on the main colour of your photo</p>' : '');
    if(!list.length){
      grid.innerHTML = head +
        '<div class="ncs-hint">' + ic('search') +
          '<h4>No close matches</h4>' +
          '<p>Nothing in the catalogue has a similar colour. Try another photo, or clear it and type a search.</p>' +
        '</div>';
      return;
    }
    grid.innerHTML = head + '<div class="product-grid" id="ncsGridInner"></div>';
    var inner = el('ncsGridInner');
    inner.innerHTML = list.map(function(x){ return productCardHTML(x.p); }).join('');
    bindProductCardEvents(inner);
    staggerCards();
  }

  /* ============================================================
     wire the storefront search bar to the new screen
     ============================================================ */
  function claimHome(){
    var mb = el('micBtn'), cb = el('camBtn');
    // replaced, not added, so the older handler cannot also fire
    if(mb) mb.onclick = function(){ open(''); setTimeout(voiceStart, 300); };
    if(cb) cb.onclick = function(){ photoSheet(); };

    var si = el('searchInput');
    if(si && !si.dataset.ncsWired){
      si.dataset.ncsWired = '1';
      si.setAttribute('readonly', 'readonly');
      si.addEventListener('focus', function(){ try{ this.blur(); }catch(e){} open(''); });
      si.addEventListener('click', function(e){ e.preventDefault(); open(''); });
    }
    var bar = el('searchBar');
    if(bar && !bar.dataset.ncsWired){
      bar.dataset.ncsWired = '1';
      bar.addEventListener('click', function(e){
        if(e.target.closest('button')) return;   // mic and camera have their own jobs
        open('');
      });
    }
  }
  [0, 320, 1200, 2600].forEach(function(t){ setTimeout(claimHome, t); });
  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', function(){ setTimeout(claimHome, 60); });
  } else {
    setTimeout(claimHome, 60);
  }

  window.ncSearchOpen = open;    // so other screens can jump straight in
  window.ncSearchClose = close;
})();
</script>

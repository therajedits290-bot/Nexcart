<script id="nexcart-marquee-v18">
/* ============================================================
   NEXCART marquee sections  (v18)

   The content is built from the shop's own products and
   categories - nothing is hard-coded copy about a discount that
   does not exist. Every "X% off" on screen is worked out from
   that product's real price and MRP.
   ============================================================ */
(function(){
  'use strict';

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }
  function money(n){
    try{ if(typeof formatMoney === 'function') return formatMoney(n); }catch(e){}
    return '\u20B9' + n;
  }
  var NOTE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
    'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<rect x="2" y="6" width="20" height="12" rx="2.4"/>' +
    '<circle cx="12" cy="12" r="2.6"/><path d="M6 10v4M18 10v4"/></svg>';

  var BAG = '<span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
    '<path d="M5 7.5h14l-1.1 12.2a1.4 1.4 0 0 1-1.4 1.3H7.5a1.4 1.4 0 0 1-1.4-1.3Z"/>' +
    '<path d="M8.6 10V6.6a3.4 3.4 0 0 1 6.8 0V10"/></svg></span>';

  /* a local chevron, so this block does not lean on the core icon helper */
  var CHEV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" ' +
             'stroke-linecap="round" stroke-linejoin="round" ' +
             'style="width:13px;height:13px;vertical-align:-2px">' +
             '<path d="m9 6 6 6-6 6"/></svg>';
  function prods(){ return (typeof DB !== 'undefined' && DB.products) ? DB.products : []; }
  function cats(){  return (typeof DB !== 'undefined' && DB.categories) ? DB.categories : []; }
  function catName(id){
    var c = cats().filter(function(x){ return x.id === id; })[0];
    return c ? c.name : '';
  }
  function off(p){
    if(!p || !p.mrp || p.mrp <= p.price) return 0;
    return Math.max(1, Math.round((1 - p.price / p.mrp) * 100));
  }
  /* The strip on a card shows a brand when the product has one, otherwise the
     category - never an invented brand name. */
  function brandOf(p){
    return (p.brand || '').trim() || catName(p.category) || 'Nexcart';
  }
  function top(list, n){
    return list.slice().sort(function(a, b){ return off(b) - off(a); }).slice(0, n);
  }
  function cheapest(list, n){
    return list.slice().sort(function(a, b){ return a.price - b.price; }).slice(0, n);
  }

  /* ---------------------------------------------- gold vocabulary */
  var CURL =
    '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">' +
      '<path d="M1 23V11.5C1 5.7 5.7 1 11.5 1H23" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>' +
      '<path d="M5 23V13.2C5 8.6 8.6 5 13.2 5H23" stroke="#A97610" stroke-width="1.05"/>' +
    '</svg>';

  function corners(){
    return ['tl','tr','bl','br'].map(function(k){
      return '<i class="orn-corner ' + k + '">' + CURL + '</i>';
    }).join('');
  }
  function ornCard(inner, extra){
    return '<div class="orn-card ' + (extra || '') + '">' + corners() +
             '<div class="orn-card-in">' + inner + '</div>' +
           '</div>';
  }

  /* The gradient and filter definitions live once, in a hidden svg, and the
     plaques reference them by id. */
  function defs(){
    if(document.getElementById('mqDefs')) return '';
    return '<svg id="mqDefs" width="0" height="0" style="position:absolute" aria-hidden="true">' +
      '<defs>' +
        '<linearGradient id="mqGoldV" x1="0" y1="0" x2="0" y2="1">' +
          '<stop offset="0" stop-color="#FFF8CC"/><stop offset=".2" stop-color="#EFC257"/>' +
          '<stop offset=".44" stop-color="#B07C10"/><stop offset=".58" stop-color="#F7D570"/>' +
          '<stop offset=".78" stop-color="#A96B08"/><stop offset="1" stop-color="#E9C362"/>' +
        '</linearGradient>' +
        '<linearGradient id="mqGoldH" x1="0" y1="0" x2="1" y2="0">' +
          '<stop offset="0" stop-color="#8C5A05"/><stop offset=".2" stop-color="#EFC257"/>' +
          '<stop offset=".5" stop-color="#FFF3B8"/><stop offset=".8" stop-color="#EFC257"/>' +
          '<stop offset="1" stop-color="#8C5A05"/>' +
        '</linearGradient>' +
        '<linearGradient id="mqVelvet" x1="0" y1="0" x2="0" y2="1">' +
          '<stop offset="0" stop-color="#C41E43"/><stop offset=".55" stop-color="#8A0A28"/>' +
          '<stop offset="1" stop-color="#5E0418"/>' +
        '</linearGradient>' +
        '<filter id="mqGlow" x="-30%" y="-30%" width="160%" height="160%">' +
          '<feGaussianBlur stdDeviation="1.9" result="b"/>' +
          '<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>' +
        '</filter>' +
      '</defs></svg>';
  }

  var BOLT =
    '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">' +
      '<path d="M13.6 1.5 4.2 13.1a.7.7 0 0 0 .54 1.15h4.9l-1.75 8.2a.7.7 0 0 0 1.24.58l9.4-11.6a.7.7 0 0 0-.54-1.15h-4.9l1.75-8.2a.7.7 0 0 0-1.24-.58Z"/>' +
    '</svg>';

  /* The headline plate: a clean RECTANGLE - gold frame, bead lights running
     right round the border, velvet centre, gold lettering. */
  function plate(t1, t2, bolt){
    return '<div class="mq-plate' + (bolt ? ' mq-plate--bolt' : '') + '">' +
      (bolt ? '<span class="mq-bolt">' + BOLT + '</span>' : '') +
      '<span class="mq-beads"></span>' +
      '<div class="mq-plate-in">' +
        '<span class="mq-plate-t">' + esc(t1) + (t2 ? '<br>' + esc(t2) : '') + '</span>' +
      '</div>' +
    '</div>';
  }

  /* ---------------------------------------------------------------- VIP board */
  /* Filled from the owner's own active coupons, so every figure on it is a real
     offer that exists in the shop. */
  function vipHTML(){
    var cps = ((typeof DB !== 'undefined' && DB.coupons) || [])
                .filter(function(c){ return c.active; }).slice(0, 3);
    var tiles;
    if(cps.length){
      tiles = cps.map(function(c){
        var b = (c.type === 'percent')
              ? ('Extra ' + c.value + '% Off*')
              : ('Flat ' + money(c.value) + ' Off*');
        var s = c.minOrder ? ('On orders above ' + money(c.minOrder)) : (c.desc || '');
        return '<div class="mq-vip-tile"><b>' + esc(b) + '</b><span>' + esc(s) + '</span></div>';
      }).join('');
    } else {
      tiles = top(prods(), 3).map(function(p){
        return '<div class="mq-vip-tile"><b>' + (off(p) ? ('Min. ' + off(p) + '% Off*') : 'Special Price') + '</b>' +
               '<span>' + esc(brandOf(p)) + '</span></div>';
      }).join('');
    }
    if(!tiles) return '';
    /* The whole board is the link, so a tap anywhere on it goes somewhere -
       before only the fourth panel was live. */
    return '<div class="mq-vip">' +
      '<div class="mq-vip-in" data-mqgo="#mqDeals">' + tiles +
        '<div class="mq-vip-cta">' +
          '<b>Grab The <em>Deals!</em></b><span><u>Shop Now</u></span>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  /* ---------------------------------------------------------------- deals */
  function dealsHTML(){
    var ps = balanced(top(prods(), prods().length), 6);
    if(!ps.length) return '';
    var cards = ps.map(function(p){
      return '<div class="mq-deal" data-mqpid="' + p.id + '">' + ornCard(
        '<div class="mq-deal-media"><img src="' + p.img + '" alt="" loading="lazy"></div>' +
        '<div class="mq-brandrow">' +
          '<span class="mq-brand">' + esc(brandOf(p)) + '</span>' +
          '<span class="mq-more">&amp; More</span>' +
        '</div>' +
        '<div class="mq-caption">' + (off(p) ? ('Min. ' + off(p) + '% Off') : 'Best Price') + '</div>'
      ) + '</div>';
    }).join('');
    return '<section class="mq" id="mqDeals">' +
      '<div class="mq-bulbs"></div>' +
      plate('Sneak Peek', 'Deals') +
      '<div class="mq-sub">Catch sale prices before the sale' + CHEV + '</div>' +
      '<div class="mq-rail">' + cards + '</div>' +
      seeAllRow('deals') +
    '</section>';
  }

  /* ------------------------------------------------------ featured brands */
  function featuredHTML(){
    /* EVERY category is considered, including ones the shop has not filled in
       yet. Skipping empty categories meant a category could never appear here,
       which is why Women's Wear never showed while Men's Ware did. */
    var rows = cats().map(function(c){
      var ps = prods().filter(function(p){ return p.category === c.id; });
      var best = ps.length ? top(ps, 1)[0] : null;
      return { name: c.name, img: c.img || (best ? best.img : ''),
               off: best ? off(best) : 0, pid: best ? best.id : '',
               cid: c.id, n: ps.length };
    }).filter(function(x){ return x.name; })
      .sort(function(a, b){
        /* categories that actually hold something come first, then by discount */
        return ((b.n > 0 ? 1 : 0) - (a.n > 0 ? 1 : 0)) || (b.off - a.off);
      });

    var two = rows.slice(0, 2);
    if(!two.length) return '';

    /* A brand card should open that brand's range, and it must be tappable -
       these were the only cards on the page with no link on them. */
    var cards = two.map(function(x){
      var empty = !x.n;
      /* With nothing to photograph, the card becomes a velvet plate with the
         category name in gold - it still reads as part of the set rather than
         looking like a broken image. */
      var media = x.img
        ? '<img src="' + x.img + '" alt="" loading="lazy">' +
          '<div class="mq-fcard-copy">' +
            '<span>' + (x.off ? 'Upgrade Now' : 'Fresh Picks') + '</span>' +
            '<b>' + (x.off ? ('UP TO ' + x.off + '% OFF') : 'SHOP NOW') + '</b>' +
          '</div>'
        : '<span class="mq-fcard-name">' + esc(x.name) + '</span>';
      return '<div class="mq-fcard" data-mqcat="' + esc(x.cid) + '">' + ornCard(
        '<div class="mq-fcard-media' + (x.img ? '' : ' is-empty') + '">' + media + '</div>' +
        '<div class="mq-fcard-strip' + (empty ? ' muted' : '') + '">' +
          (empty ? 'Coming Soon' : esc(x.name)) +
        '</div>'
      ) + '</div>';
    }).join('');

    /* Skip anything already shown in the cards above, so the shop does not
       look like it only has one product. */
    var used = two.map(function(x){ return x.pid; });
    var wide = top(prods(), 6).filter(function(p){ return used.indexOf(p.id) < 0; })[0];
    var wideHTML = wide ? (
      '<div class="mq-wide" data-mqpid="' + wide.id + '">' +
        '<span class="mq-beads"></span>' +
        '<div class="mq-wide-media"><img src="' + wide.img + '" alt="" loading="lazy"></div>' +
        '<div class="mq-wide-right">' +
          '<span class="mq-wide-brand">' + esc(brandOf(wide)) + '</span>' +
          '<b>' + (off(wide) ? 'UP TO ' + off(wide) + '% OFF' : 'SHOP NOW') + '</b>' +
        '</div>' +

      '</div>' +
      '<div class="mq-dots"><i class="on"></i><i></i><i></i></div>'
    ) : '';

    return '<section class="mq mq-flush" id="mqFeatured">' +
      '<div class="mq-band"><span class="mq-band-t">Featured Brands</span></div>' +
      '<div class="mq-grid2' + (two.length < 2 ? ' one' : '') + '">' + cards + '</div>' +
      wideHTML +
    '</section>';
  }

  /* -------------------------------------------------------- lowest prices */
  function lowestHTML(){
    var ps = balanced(cheapest(prods(), prods().length), 6);
    if(!ps.length) return '';
    var cards = ps.map(function(p){
      return '<div class="mq-low" data-mqpid="' + p.id + '">' + ornCard(
        '<div class="mq-low-media"><img src="' + p.img + '" alt="" loading="lazy"></div>' +
        '<div class="mq-low-name">' + esc(brandOf(p)) + '</div>' +
        '<div class="mq-low-price">' + money(p.price) +
          (p.mrp > p.price ? '<s>' + money(p.mrp) + '</s>' : '') + '</div>'
      ) + '</div>';
    }).join('');
    return '<section class="mq" id="mqLowest">' +
      '<div class="mq-bulbs"></div>' +
      plate('Lowest Prices', 'In Our Store', true) +
      '<div class="mq-rail">' + cards + '</div>' +
      seeAllRow('cheap') +
    '</section>';
  }

  /* ------------------------------------------------------------ fee strip */
  /* Reads the shop's own delivery settings, so the figures are the real ones. */
  function feeHTML(){
    var st = (typeof DB !== 'undefined' && DB.settings) || {};
    var fee = Number(st.shippingFee || 0), thr = Number(st.freeShipThreshold || 0);
    var items = [];
    if(fee <= 0 || thr <= 0){
      /* v55: say what is actually true. "Delivery available across India" buried
         the good news when the shop had made delivery free on everything. */
      items.push('Delivery <b>FREE</b> on every order');
    } else {
      items.push('Delivery Fee <s>' + money(fee) + '</s> <b>FREE</b> above ' + money(thr));
    }
    if(st.codEnabled !== false){
      items.push('Cash on Delivery <b>\u20B90</b> extra');
    }
    if(!items.length) return '';
    return '<div class="mq-fee">' +
      '<div class="mq-fee-row">' +
        items.map(function(t){ return '<span class="mq-fee-i">' + t + '</span>'; })
             .join('<span class="mq-fee-sep">|</span>') +
      '</div>' +
      '<div class="mq-fee-tag">' + NOTE + 'Only For You!</div>' +
    '</div>';
  }

  /* ---------------------------------------------------------------- slot */
  /* Opens a category. If the shop has not filled it yet, the destination says
     that in plain words and offers a way onward, rather than dropping the
     customer on the app's generic "No products found" search message. */
  function mqOpenCategory(cid){
    var name = catName(cid) || 'Products';
    var ps = prods().filter(function(p){ return p.category === cid; });
    if(ps.length){
      if(typeof openCategoryProducts === 'function') openCategoryProducts(cid);
      return;
    }
    if(typeof pushView !== 'function'){
      if(typeof openCategoryProducts === 'function') openCategoryProducts(cid);
      return;
    }
    pushView(name, function(main){
      main.innerHTML =
        '<div class="empty-state" style="padding-top:56px;">' + BAG +
          '<h3>' + esc(name) + ' is coming soon</h3>' +
          '<p>There is nothing in ' + esc(name) + ' yet. Ask the shop to add it, ' +
          'or browse everything that is in stock right now.</p>' +
          '<button class="btn btn-primary" id="mqBrowseAll" type="button">' +
            'Browse all products' +
          '</button>' +
        '</div>';
      var btn = document.getElementById('mqBrowseAll');
      if(btn) btn.onclick = function(){ mqAll('products'); };
    });
  }

  /* "See all" used to jump to the categories screen, which is not what "all
     products" means. This lists the products themselves. */
  function mqAll(kind){
    var list = prods().slice(), title = 'All Products';
    if(kind === 'deals'){
      list = list.filter(function(p){ return p.mrp > p.price; })
                 .sort(function(a, b){ return off(b) - off(a); });
      title = 'All Deals';
    } else if(kind === 'cheap'){
      list = list.sort(function(a, b){ return a.price - b.price; });
      title = 'Lowest Prices';
    }
    if(typeof pushView !== 'function' || typeof renderProductGrid !== 'function'){
      if(typeof openCategoryProducts === 'function') openCategoryProducts('__all__');
      return;
    }
    pushView(title, function(main){
      main.innerHTML = '<div class="section"><span class="section-title">' +
                         list.length + ' product' + (list.length === 1 ? '' : 's') +
                       '</span></div><div class="product-grid" id="mqAllGrid"></div>';
      renderProductGrid(document.getElementById('mqAllGrid'), list, true);
    });
  }

  /* Fill a row across categories first, so a shop with more than one kind of
     product shows more than one kind. Deepest-first would show only the
     biggest-discount category. */
  function balanced(ps, n){
    var groups = {}, order = [];
    ps.forEach(function(p){
      if(!groups[p.category]){ groups[p.category] = []; order.push(p.category); }
      groups[p.category].push(p);
    });
    var out = [], i = 0;
    while(out.length < n){
      var added = false;
      for(var g = 0; g < order.length && out.length < n; g++){
        var item = groups[order[g]][i];
        if(item){ out.push(item); added = true; }
      }
      if(!added) break;
      i++;
    }
    return out.length ? out : ps.slice(0, n);
  }

  function seeAllRow(kind){
    return '<div class="mq-seeall-row">' +
             '<button class="mq-seeall" type="button" data-mqall="' + kind + '">See all' + CHEV + '</button>' +
           '</div>';
  }

  function mqSlot(where){
    try{
      var s = (typeof DB !== 'undefined' && DB.marquee) || {};
      var on = function(k){ return s[k] !== false; };
      if(where === 'vip')  return on('vip') ? vipHTML() : '';
      if(where === 'fee')  return on('fee') ? feeHTML() : '';
      if(where === 'main'){
        var h = '';
        if(on('deals'))    h += dealsHTML();
        if(on('featured')) h += featuredHTML();
        if(on('lowest'))   h += lowestHTML();
        return h;
      }
    }catch(e){}
    return '';
  }
  /* the gradients are defined once for the whole page */
  function ensureDefs(){
    if(document.getElementById('mqDefs')) return;
    var box = document.createElement('div');
    box.innerHTML = defs();
    if(box.firstChild) document.body.appendChild(box.firstChild);
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', ensureDefs);
  else ensureDefs();

  window.mqSlot = mqSlot;      // the home template calls this

  /* -------------------------------------------------------------- binding */
  document.addEventListener('click', function(e){
    var card = e.target.closest('[data-mqpid]');
    if(card && typeof openProductDetail === 'function'){
      openProductDetail(card.dataset.mqpid);
      return;
    }
    var all = e.target.closest('[data-mqall]');
    if(all){ mqAll(all.dataset.mqall); return; }
    var cat = e.target.closest('[data-mqcat]');
    if(cat){ mqOpenCategory(cat.dataset.mqcat); return; }
    var go = e.target.closest('[data-mqgo]');
    if(go){
      /* The named section may not exist on a small catalogue, which used to
         make this button do nothing at all. Fall back to something real. */
      var t = document.querySelector(go.dataset.mqgo)
           || document.querySelector('#mqFeatured')
           || document.querySelector('#homeProductGrid');
      if(t && t.scrollIntoView) t.scrollIntoView({ behavior:'smooth', block:'start' });
    }
  });
})();
</script>

<script id="nexcart-import-v26">
/* ============================================================
   NEXCART bulk import  (v26)

   Loads a whole catalogue from a spreadsheet. Written for 1000+
   products, which cannot be typed in one at a time.

   The one hard rule: pictures must be LINKS. The app keeps its whole
   catalogue in a box that holds about 4.9 MB, so 1000 uploaded photos
   (about 130 KB each) would be roughly 130 MB. Links keep the
   catalogue at a few hundred KB.
   ============================================================ */
(function(){
  'use strict';

  var LIMIT = 4.9 * 1024 * 1024;      // the app's own storage ceiling
  /* The same options the product form offers, plus anything numeric. */
  var state = { parsed: null, mode: 'skip' };

  /* Two names that differ only in punctuation ARE the same name.
     "Men's Wear" and "Mens Wear" used to count as different, so a spreadsheet
     that spelled it slightly differently quietly created a SECOND category of
     the same name, and the stock vanished into the copy. Compare on letters
     and digits alone. */
  function ncKey(s){
    return String(s == null ? '' : s).toLowerCase().replace(/[^a-z0-9]/g, '');
  }

  /* Fold categories whose names differ only in punctuation into the first one
     and drop the leftovers. Products move, sub-categories are kept, so nothing
     is lost - the shop just stops showing the same category twice. */
  function ncMergeDupCats(){
    var groups = {}, report = { groups: 0, merged: 0, moved: 0, subs: 0 };
    DB.categories.forEach(function(c){
      var k = ncKey(c.name);
      if(!k) return;
      (groups[k] = groups[k] || []).push(c);
    });
    Object.keys(groups).forEach(function(k){
      var g = groups[k];
      if(g.length < 2) return;
      report.groups++;
      var keep = g[0];
      if(!Array.isArray(keep.subs)) keep.subs = [];
      g.slice(1).forEach(function(dup){
        DB.products.forEach(function(p){
          if(p.category === dup.id){ p.category = keep.id; report.moved++; }
        });
        (dup.subs || []).forEach(function(sb){
          var hit = keep.subs.filter(function(y){ return ncKey(y.name) === ncKey(sb.name); })[0];
          if(hit){ if(!hit.img && sb.img) hit.img = sb.img; }
          else { keep.subs.push(sb); report.subs++; }
        });
        DB.categories = DB.categories.filter(function(c){ return c.id !== dup.id; });
        report.merged++;
      });
    });
    if(report.merged) saveDB(DB);
    return report;
  }
  window.ncMergeDupCats = ncMergeDupCats;      // used by the admin button

  var LETTER_SIZES = ['XS','S','M','L','XL','XXL','XXXL','FREE','FREE SIZE','ONESIZE','ONE SIZE'];
  var NUM_SIZES = ['26','28','30','32','34','36','38','40','42','44','46','48','50'];

  /* "S, M, L" or "S|M|L" or "32,34,36" all work. */
  function parseSizes(v){
    if(!v) return [];
    var out = [];
    String(v).split(/[|,;/]+/).forEach(function(x){
      x = x.trim();
      if(!x) return;
      /* "S" and "XL" read best in capitals, but "FREE SIZE" shouted from a
         button looks wrong - keep multi-word sizes in normal case. */
      x = /^\d+$/.test(x) ? x
        : (x.indexOf(' ') >= 0
           ? x.replace(/\b[a-z]/g, function(c){ return c.toUpperCase(); })
           : x.toUpperCase());
      if(out.indexOf(x) < 0) out.push(x);
    });
    return out;
  }

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }
  function toast(m, i){
    try{ if(typeof showToast === 'function') showToast(m, i); }catch(e){}
  }
  function num(v){
    var n = parseFloat(String(v == null ? '' : v).replace(/[^0-9.\-]/g, ''));
    return isNaN(n) ? null : n;
  }
  function newId(p){
    return (p || 'p') + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  }

  /* ---------------------------------------------------------- CSV reader */
  /* Handles the things a spreadsheet actually produces: quoted fields,
     commas inside quotes, doubled quotes, CRLF, and a byte-order mark. */
  function parseCSV(text){
    var rows = [], row = [], cur = '', q = false, i = 0;
    text = String(text || '').replace(/^\uFEFF/, '');
    while(i < text.length){
      var c = text[i];
      if(q){
        if(c === '"'){
          if(text[i + 1] === '"'){ cur += '"'; i += 2; continue; }
          q = false; i++; continue;
        }
        cur += c; i++; continue;
      }
      if(c === '"'){ q = true; i++; continue; }
      if(c === ','){ row.push(cur); cur = ''; i++; continue; }
      if(c === ';'){ row.push(cur); cur = ''; i++; continue; }   // some locales
      if(c === '\r'){ i++; continue; }
      if(c === '\n'){ row.push(cur); rows.push(row); row = []; cur = ''; i++; continue; }
      cur += c; i++;
    }
    if(cur !== '' || row.length){ row.push(cur); rows.push(row); }
    return rows.filter(function(r){
      return r.some(function(x){ return String(x).trim() !== ''; });
    });
  }

  /* ------------------------------------------------------ column names */
  var ALIAS = {
    name:     ['name','product','product name','productname','title','item','item name'],
    category: ['category','category name','categories','cat','type','group'],
    sub:      ['subcategory','sub category','sub-category','subcat','sub','sub group','subgroup'],
    sizes:    ['sizes','size','available sizes','size options','size range','variants','variant'],
    price:    ['price','selling price','sale price','our price','sp','offer price'],
    mrp:      ['mrp','list price','original price','max price','strike','compare price'],
    stock:    ['stock','qty','quantity','inventory','stock quantity','available'],
    img:      ['image','image url','imageurl','img','picture','photo','image link','image_url','pic',
               'image 1','picture 1','photo 1'],
    /* Extra photos for the same product. The first one ('image') is the one
       shown on cards and in the cart; these fill the gallery on the product
       page. Up to four in total. */
    img2:     ['image 2','image2','image 2 url','image url2','image url 2','imageurl2','img2','picture 2','photo 2','second image'],
    img3:     ['image 3','image3','image 3 url','image url3','image url 3','imageurl3','img3','picture 3','photo 3','third image'],
    img4:     ['image 4','image4','image 4 url','image url4','image url 4','imageurl4','img4','picture 4','photo 4','fourth image'],
    desc:     ['description','desc','details','about','product description'],
    brand:    ['brand','brand name','company','label'],
    rating:   ['rating','stars','star'],
    ratingCount: ['rating count','ratingcount','reviews','review count','no of reviews']
  };
  function mapHeaders(head){
    var map = {};
    head.forEach(function(h, idx){
      var k = String(h || '').trim().toLowerCase().replace(/[_\-]+/g, ' ').replace(/\s+/g, ' ');
      for(var key in ALIAS){
        if(ALIAS[key].indexOf(k) >= 0 && !(key in map)){ map[key] = idx; return; }
      }
    });
    return map;
  }

  /* ------------------------------------------------------ build the rows */
  function build(text, base){
    var rows = parseCSV(text);
    if(rows.length < 2){
      return { fatal: 'I could not find any rows. A file needs a first row of column names, then one row per product.' };
    }
    var map = mapHeaders(rows[0]);
    if(!('name' in map) || !('price' in map)){
      return { fatal: 'The first row must have at least a "name" column and a "price" column. ' +
                      'Found: ' + rows[0].map(function(h){ return String(h).trim(); }).filter(Boolean).join(', ') };
    }

    var existing = {};
    (DB.products || []).forEach(function(p){
      existing[String(p.name || '').trim().toLowerCase()] = p;
    });
    /* Names are compared with ncKey, defined at the top of this module. */
    var catByName = {};
    (DB.categories || []).forEach(function(c){
      var k = ncKey(c.name);
      if(k && !(k in catByName)) catByName[k] = c;
    });

    var out = [], errors = [], newCats = [], newSubs = [], dups = [], dataImgs = 0, badSizes = [];
    var namedImgs = 0;

    rows.slice(1).forEach(function(r, n){
      var at = n + 2;                                   // the spreadsheet's own row number
      var get = function(k){ return (k in map) ? String(r[map[k]] == null ? '' : r[map[k]]).trim() : ''; };
      var name = get('name');
      if(!name){ errors.push({ at: at, msg: 'no product name' }); return; }
      var price = num(get('price'));
      if(price === null || price <= 0){ errors.push({ at: at, msg: 'price is missing or not a number' }); return; }
      var mrp = num(get('mrp'));
      if(mrp === null || mrp < price) mrp = price;      // never invent a fake discount

      var catName = get('category');
      var cat = null;
      if(catName){
        var key = ncKey(catName);
        if(catByName[key]) cat = catByName[key];
        else if(!newCats.some(function(n){ return ncKey(n) === key; })) newCats.push(catName);
      }
      var sub = get('sub');
      var sizes = parseSizes(get('sizes'));
      sizes.forEach(function(z){
        if(/[A-Z]/.test(z) && LETTER_SIZES.indexOf(z) < 0 && badSizes.indexOf(z) < 0) badSizes.push(z);
      });
      var stock = num(get('stock'));
      if(stock === null || stock < 0) stock = 10;
      var rawImg = get('img');
      if(rawImg && !isLink(rawImg)) namedImgs++;        // a bare file name
      var img = resolveImg(rawImg, base);
      if(/^data:/i.test(img)) dataImgs++;
      if(!img) img = (typeof PLACEHOLDER_IMG === 'function') ? PLACEHOLDER_IMG(encodeURIComponent(name).slice(0, 24)) : '';
      /* The rest of the product's photos. Same picture twice is stored once. */
      var imgs = [img];
      ['img2','img3','img4'].forEach(function(k){
        var extra = resolveImg(get(k), base);
        if(/^data:/i.test(extra)) dataImgs++;
        if(extra && imgs.indexOf(extra) < 0) imgs.push(extra);
      });

      var rating = num(get('rating')); if(rating === null) rating = 0;
      var rc = num(get('ratingCount')); if(rc === null) rc = 0;

      /* Count sub-categories the category does not have yet, so the owner is
         told they are being created rather than discovering it later. */
      /* A category that is itself new has no subs yet, so its subs are new too -
         the first version skipped those and under-reported them. */
      if(sub && catName){
        var has = cat ? (cat.subs || []).some(function(y){
          return String(y.name || '').trim().toLowerCase() === sub.toLowerCase();
        }) : false;
        if(!has && newSubs.indexOf(catName + '\u0000' + sub) < 0){
          newSubs.push(catName + '\u0000' + sub);
        }
      }

      var item = {
        name: name,
        category: cat ? cat.id : ('__new__' + catName),
        price: price, mrp: mrp, stock: stock, img: img,
        imgs: imgs.length > 1 ? imgs : [],
        desc: get('desc'), brand: get('brand'), sub: sub,
        sizes: sizes, hasSizes: sizes.length > 0,
        rating: rating, ratingCount: rc,
        _at: at, _catName: catName, _sub: sub
      };
      if(existing[name.toLowerCase()]) dups.push(name);
      out.push(item);
    });

    return {
      list: out, errors: errors, newCats: newCats, newSubs: newSubs, dups: dups,
      badSizes: badSizes, namedImgs: namedImgs, base: base || '',
      dataImgs: dataImgs,
      newBytes: JSON.stringify(out).length,
      curBytes: (function(){ try{ return JSON.stringify(DB).length; }catch(e){ return 0; } })()
    };
  }

  /* ------------------------------------------------- dead picture handling */
  /* A link that does not load used to spill the whole product name across the
     card as alt text. Swap in a clean grey placeholder instead. Catches every
     picture in the app, including ones drawn later, because error events do not
     bubble but they do travel in the capture phase. */
  var FALLBACK_IMG = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440">' +
    '<rect width="400" height="440" fill="#F1F1F3"/>' +
    '<g fill="none" stroke="#C7CAD0" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">' +
    '<rect x="142" y="176" width="116" height="92" rx="11"/>' +
    '<path d="M142 246l32-32 28 28 24-24 32 32"/><circle cx="175" cy="206" r="10"/></g></svg>');

  document.addEventListener('error', function(e){
    var t = e.target;
    if(!t || t.tagName !== 'IMG') return;
    if(t.getAttribute('src') === FALLBACK_IMG) return;
    t.setAttribute('src', FALLBACK_IMG);
    t.setAttribute('alt', '');
    t.style.objectFit = 'cover';
  }, true);

  /* ------------------------------------------------ where the photos live */
  /* A sheet cannot hold a picture - CSV is text only, so a picture pasted into
     Excel is thrown away when it is saved as CSV. The next best thing: put all
     the photos in one folder and write only the file name here. Much less typing
     than a full link, and the folder is remembered. */
  function guessBase(){
    try{
      var saved = localStorage.getItem('nexcart_img_base');
      if(saved) return saved;
    }catch(e){}
    try{
      if(location.protocol === 'http:' || location.protocol === 'https:'){
        return location.origin + location.pathname.replace(/[^/]*$/, '') + 'img/';
      }
    }catch(e){}
    return '';
  }
  function readBase(){
    var el = document.getElementById('nciBase');
    var v = el ? String(el.value || '').trim() : '';
    try{ localStorage.setItem('nexcart_img_base', v); }catch(e){}
    return v;
  }
  function isLink(v){ return /^(https?:|data:|\/\/)/i.test(String(v == null ? '' : v).trim()); }
  function resolveImg(v, base){
    v = String(v == null ? '' : v).trim();
    if(!v) return '';
    if(isLink(v)) return v;
    if(!base) return v;
    return base.replace(/\/+$/, '') + '/' + v.replace(/^\/+/, '');
  }

  /* ---------------------------------------------------- testing the pictures */
  /* Pictures are the usual reason a shop looks wrong, and a wrong link is
     silent until you look at the shop. Load each one here and name the rows
     that fail. Eight at a time so a 1000 row sheet does not swamp the phone. */
  function testLinks(){
    var rows = (state.parsed && state.parsed.list) || [];
    var out = document.getElementById('nciLinkOut');
    if(!out || !rows.length) return;
    var total = rows.length;
    var queue = rows.slice(), inflight = 0, done = 0, broken = [], MAX = 8;

    function paint(html){ out.innerHTML = html; }
    function line(txt){
      paint('<div class="nci-msg"><span class="nci-mic">&#8230;</span><span>' + txt + '</span></div>');
    }
    function finish(){
      /* Links finish in whatever order the network returns them, so list the
         rows in order - random row numbers read like a bug. */
      broken.sort(function(a, b){ return a._at - b._at; });
      if(broken.length){
        paint('<div class="nci-msg bad"><span class="nci-mic">!</span><span>' +
              '<b>' + broken.length + ' of ' + total + ' picture link' +
              (total === 1 ? '' : 's') + ' did not load.</b><br>' +
              'Rows ' + broken.slice(0, 15).map(function(r){ return r._at; }).join(', ') +
              (broken.length > 15 ? ' and more' : '') +
              '<br>Open one of those links in a browser tab. If you see a web page instead of ' +
              'just the photo, the link is not a direct picture link.</span></div>');
      } else {
        paint('<div class="nci-msg ok"><span class="nci-mic">+</span><span>All ' + total +
              ' picture link' + (total === 1 ? '' : 's') + ' loaded.</span></div>');
      }
    }
    function pump(){
      while(inflight < MAX && queue.length){
        one(queue.shift());
      }
    }
    function one(x){
      if(!x.img || /^data:/i.test(x.img)){ done++; return soon(); }
      inflight++;
      var im = new Image(), settled = false;
      function end(good){
        if(settled) return;
        settled = true;
        inflight--; done++;
        if(!good) broken.push(x);
        if(done >= total) return finish();
        line('Checking pictures\u2026 ' + done + ' of ' + total);
        soon();
      }
      im.onload  = function(){ end(true); };
      im.onerror = function(){ end(false); };
      setTimeout(function(){ end(false); }, 15000);
      im.src = x.img;
    }
    function soon(){ setTimeout(pump, 0); }

    line('Checking pictures\u2026 0 of ' + total);
    pump();
  }

      'name,category,subcategory,price,mrp,stock,sizes,image,description,brand',
      '"Women Floral Kurta Set",Women\'s Wear,Kurta Sets,449,999,25,https://picsum.photos/seed/kurta1/400/440,"Cotton blend kurta with palazzo.","Nexcart"',
      '"Men Slim Fit Shirt",Men\'s Wear,Casual Shirts,399,899,30,https://picsum.photos/seed/shirt1/400/440,"100% cotton, wrinkle resistant.","Nexcart"',
      '"Wireless Earbuds",Electronics,Audio,799,2499,12,https://picsum.photos/seed/earbuds1/400/440,"24 hour battery, deep bass.","Nexcart"'
    ].join('\r\n');
    var b = new Blob([rows], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'nexcart-products-template.csv';

  /* ------------------------------------------------------------ the report */
  var rpt = null;
  function check(text){
    var p = build(text, readBase());
    rpt = p;
    var box = document.getElementById('nciReport');
    if(p.fatal){
      box.innerHTML = '<div class="nci-step"><div class="nci-msg bad"><span class="nci-mic">&times;</span>' +
                      '<span><b>Nothing to import.</b> ' + esc(p.fatal) + '</span></div></div>';
      return;
    }
    state.parsed = p;

    var fresh = p.list.length - p.dups.length;
    var bytes = p.curBytes + p.newBytes;
    var willBust = bytes > LIMIT;
    var h = '<div class="nci-step"><h3><i>3</i>Check, then add</h3>';

    h += '<div class="nci-sum">' +
           '<div class="nci-tile"><b>' + p.list.length + '</b><span>products found</span></div>' +
           '<div class="nci-tile good"><b>' + fresh + '</b><span>new to add</span></div>' +
           '<div class="nci-tile' + (p.dups.length ? ' warn' : '') + '"><b>' + p.dups.length + '</b><span>already in your shop</span></div>' +
           '<div class="nci-tile' + (p.newCats.length ? ' warn' : '') + '"><b>' + p.newCats.length + '</b><span>new categories</span></div>' +
         '</div>';

    if(p.newCats.length){
      h += '<div class="nci-msg ok"><span class="nci-mic">+</span><span>These categories will be created for you: <b>' +
           esc(p.newCats.join(', ')) + '</b></span></div>';
    }
    if(p.newSubs.length){
      var subText = p.newSubs.slice(0, 8).map(function(t){
        var bits = String(t).split('\u0000');
        return esc(bits[1]) + ' (in ' + esc(bits[0]) + ')';
      }).join(', ');
      h += '<div class="nci-msg ok"><span class="nci-mic">+</span><span>' +
           '<b>' + p.newSubs.length + ' new sub-categor' + (p.newSubs.length === 1 ? 'y' : 'ies') + '</b> will be added: ' +
           subText + (p.newSubs.length > 8 ? ' and more' : '') + '</span></div>';
    }
    if(p.errors.length){
      h += '<div class="nci-msg warn"><span class="nci-mic">&nbsp;!</span><span><b>' + p.errors.length +
           ' row' + (p.errors.length === 1 ? '' : 's') + ' skipped</b> because something was missing. ' +
           'These rows will not be added.</span></div>';
      h += '<div class="nci-errs">' + p.errors.slice(0, 40).map(function(e){
             return '<div><b>Row ' + e.at + '</b> &mdash; ' + esc(e.msg) + '</div>';
           }).join('') +
           (p.errors.length > 40 ? '<div>&hellip; and ' + (p.errors.length - 40) + ' more</div>' : '') + '</div>';
    }
    if(p.dataImgs > 12){
      h += '<div class="nci-msg bad"><span class="nci-mic">&nbsp;!</span><span>' +
           '<b>' + p.dataImgs + ' of these pictures are pasted into the file itself, not links.</b> ' +
           'That will fill the app&#39;s storage and the save will fail. Use web links ' +
           '(https://&hellip;) in the image column instead.</span></div>';
    }
    h += '<div class="nci-msg ' + (willBust ? 'bad' : 'ok') + '"><span class="nci-mic">' +
         (willBust ? '&nbsp;!' : '&#10003;') + '</span><span>' +
         'Your shop would hold about <b>' + (bytes / 1024 / 1024).toFixed(2) + ' MB</b> of the 4.9 MB available' +
         (willBust ? ' &mdash; that is too much, so some of it will not be saved. Import in smaller batches, or use links for the pictures.' : '.') +
         '</span></div>';

    /* a peek at the first few rows so the owner can see it read them right */
    if(p.list.length){
      var head = ['name', 'category', 'subcategory', 'price', 'mrp', 'stock', 'image'];
      h += '<div class="nci-preview"><table><tr>' + head.map(function(x){ return '<th>' + x + '</th>'; }).join('') + '</tr>' +
           p.list.slice(0, 5).map(function(x){
             return '<tr><td>' + esc(x.name).slice(0, 34) + '</td><td>' + esc(x._catName || '&mdash;') +
                    '</td><td>' + esc(x._sub || '&mdash;') +
                    '</td><td>' + x.price + '</td><td>' + x.mrp + '</td><td>' + x.stock +
                    '</td><td>' + (/^data:/i.test(x.img) ? 'pasted picture' : (x.img ? 'link' : 'none')) + '</td></tr>';
           }).join('') + '</table>' +
           (p.list.length > 5 ? '<p style="font-size:11px;color:var(--ink-faint);margin-top:8px;">&hellip; and ' +
             (p.list.length - 5) + ' more</p>' : '') + '</div>';
    }

    if(p.namedImgs){
      if(p.base){
        h += '<div class="nci-msg ok"><span class="nci-mic">+</span><span>' +
             '<b>' + p.namedImgs + ' photo file name' + (p.namedImgs === 1 ? '' : 's') + '</b> ' +
             'will be looked up in <b>' + esc(p.base) + '</b></span></div>';
      } else {
        h += '<div class="nci-msg bad"><span class="nci-mic">!</span><span>' +
             '<b>' + p.namedImgs + ' row' + (p.namedImgs === 1 ? ' has a file name' : 's have file names') +
             ' but no photo folder is set.</b> Fill in "Where are your photos?" above, or use ' +
             'full https:// links in the sheet.</span></div>';
      }
    }

    if(p.badSizes && p.badSizes.length){
      h += '<div class="nci-msg warn"><span class="nci-mic">!</span><span>Unusual size' +
           (p.badSizes.length === 1 ? '' : 's') + ': <b>' + esc(p.badSizes.join(', ')) +
           '</b>. That works, but check for a typo.</span></div>';
    }

    h += '<p style="font-size:12.5px;color:var(--ink-soft);margin:14px 0 8px;">' +
         'Pictures are the usual reason a shop looks wrong. Test the links before adding:</p>' +
         '<button class="btn btn-secondary btn-block" id="nciTest" type="button">Test the picture links</button>' +
         '<div id="nciLinkOut" style="margin-top:10px;"></div>';

    if(p.dups.length){
      h += '<p style="font-size:12.5px;font-weight:800;color:var(--ink);margin-bottom:8px;">' +
           'A product with the same name is already in your shop. What should happen to those?</p>' +
           '<div class="nci-choice">' +
             '<button class="nci-opt' + (state.mode === 'skip' ? ' on' : '') + '" data-mode="skip" type="button">' +
               '<b>Keep mine</b><span>Skip them, add only the new ones</span></button>' +
             '<button class="nci-opt' + (state.mode === 'update' ? ' on' : '') + '" data-mode="update" type="button">' +
               '<b>Update them</b><span>Replace the price, stock and picture from the file</span></button>' +
           '</div>';
    }

    if(willBust){
      h += '<button class="btn btn-secondary btn-block" type="button" disabled>' +
           'Too much to add in one go</button>';
    } else {
      h += '<button class="btn btn-primary btn-block" id="nciDo" type="button">Add ' +
           p.list.length + ' product' + (p.list.length === 1 ? '' : 's') + '</button>';
    }
    h += '</div>';
    box.innerHTML = h;

    if(p.dups.length){
      Array.prototype.forEach.call(box.querySelectorAll('.nci-opt'), function(o){
        o.onclick = function(){
          state.mode = o.dataset.mode;
          Array.prototype.forEach.call(box.querySelectorAll('.nci-opt'), function(x){ x.classList.remove('on'); });
          o.classList.add('on');
        };
      });
    }
    var tl = document.getElementById('nciTest');
    if(tl) tl.onclick = testLinks;

    var go = document.getElementById('nciDo');
    if(go) go.onclick = runImport;
    box.scrollIntoView({ behavior:'smooth', block:'start' });
  }

  /* ------------------------------------------------------------- import */
  function runImport(){
    var p = state.parsed;
    if(!p || !p.list.length) return;

    /* categories first, so every product has somewhere to go */
    var made = {};
    p.newCats.forEach(function(name){
      var c = { id: newId('c'), name: name, icon:'grid', emoji:'🛍️', img:'', subs:[] };
      DB.categories.push(c);
      made[ncKey(name)] = c.id;
    });
    var byName = {};
    DB.categories.forEach(function(c){
      var k = ncKey(c.name);
      if(k && !(k in byName)) byName[k] = c;          // the original wins
    });

    var have = {};
    DB.products.forEach(function(x){ have[String(x.name || '').trim().toLowerCase()] = x; });

    /* The picture row under the tabs is drawn from category.subs, so a
       sub-category has to exist there or its products would have no tile to
       open. Add any that the sheet introduces, borrowing the product's picture. */
    var subAdded = 0;
    var catById = {};
    DB.categories.forEach(function(c){ catById[c.id] = c; });
    function ensureSub(catId, name, img){
      var c = catById[catId];
      if(!c || !name) return;
      if(!Array.isArray(c.subs)) c.subs = [];
      var hit = c.subs.filter(function(y){
        return ncKey(y.name) === ncKey(name);
      })[0];
      if(hit){ if(!hit.img && img) hit.img = img; return; }
      c.subs.push({ name: name, img: img || '', group: '' });
      subAdded++;
    }

    var added = 0, updated = 0, skipped = 0;
    p.list.forEach(function(x){
      var catId = x.category.indexOf('__new__') === 0
                ? (made[ncKey(x._catName)] || (byName[ncKey(x._catName)] || {}).id || '')
                : x.category;
      if(x._sub) ensureSub(catId, x._sub, x.img);
      var key = x.name.toLowerCase();
      var prev = have[key];
      if(prev){
        if(state.mode === 'update'){
          prev.price = x.price; prev.mrp = x.mrp; prev.stock = x.stock;
          if(x.img) prev.img = x.img;
          if(x.imgs && x.imgs.length > 1) prev.imgs = x.imgs;
          if(x.desc) prev.desc = x.desc;
          if(x.brand) prev.brand = x.brand;
          if(catId) prev.category = catId;
          if(x._sub) prev.sub = x._sub;
          prev.hasSizes = !!x.hasSizes;
          prev.sizes = x.sizes || [];
          updated++;
        } else skipped++;
        return;
      }
      var item = {
        id: newId('p'), name: x.name, category: catId, price: x.price, mrp: x.mrp,
        stock: x.stock, desc: x.desc || '', img: x.img,
        imgs: (x.imgs && x.imgs.length > 1) ? x.imgs : [],
        sub: x._sub || '',
        rating: x.rating || 0, ratingCount: x.ratingCount || 0,
        hasSizes: !!x.hasSizes, sizes: x.sizes || []
      };
      if(x.brand) item.brand = x.brand;
      DB.products.push(item);
      have[key] = item;
      added++;
    });

    var okSave = true;
    try{ okSave = (typeof saveDB === 'function') ? (saveDB(DB) !== false) : true; }catch(e){ okSave = false; }

    if(!okSave){
      toast('Storage is full — the products could not be saved', 'xCircle');
      return;
    }

    toast('Added ' + added + (updated ? ', updated ' + updated : '') +
          (skipped ? ', skipped ' + skipped : '') +
          (subAdded ? ' + ' + subAdded + ' sub-categories' : ''), 'checkCircle');

    var box = document.getElementById('nciReport');
    if(box){
      box.innerHTML = '<div class="nci-step"><div class="nci-msg ok"><span class="nci-mic">&#10003;</span>' +
        '<span><b>Done.</b> ' + added + ' product' + (added === 1 ? '' : 's') + ' added' +
        (updated ? ', ' + updated + ' updated' : '') +
        (skipped ? ', ' + skipped + ' left untouched' : '') +
        (p.newCats.length ? ', ' + p.newCats.length + ' new categor' + (p.newCats.length === 1 ? 'y' : 'ies') + ' created' : '') +
        (subAdded ? ', ' + subAdded + ' new sub-categor' + (subAdded === 1 ? 'y' : 'ies') + ' added' : '') +
        '. Your shop now has <b>' + DB.products.length + ' products</b>.</span></div>' +
        '<button class="btn btn-secondary btn-block" id="nciAgain" type="button">Import another file</button>' +
        '<button class="btn btn-primary btn-block" id="nciDone" type="button" style="margin-top:9px;">Finished</button></div>';
      document.getElementById('nciAgain').onclick = function(){
        document.getElementById('nciPaste').value = '';
        document.getElementById('nciReport').innerHTML = '';
        state.parsed = null;
        panel().querySelector('.nci-body').scrollTop = 0;
      };
      document.getElementById('nciDone').onclick = close;
    }
    try{
      var shell = document.getElementById('adminShell');
      if(shell && typeof renderAdminSettings === 'function') renderAdminSettings(shell);
    }catch(e){}
  }

  /* -------------------------------------------------------- the way in */
  document.addEventListener('click', function(e){
    var b = e.target.closest('#ncBulkBtn');
    if(b){ e.preventDefault(); open(); return; }
    var m = e.target.closest('#ncMergeCatsBtn');
    if(m){
      e.preventDefault();
      var rep = ncMergeDupCats();
      var msg = rep.groups
        ? ('Merged ' + rep.merged + ' duplicate categor' + (rep.merged === 1 ? 'y' : 'ies') +
           ', moved ' + rep.moved + ' product' + (rep.moved === 1 ? '' : 's') + '.')
        : 'No duplicate categories found - nothing to merge.';
      try{ renderAdminSettings(document.getElementById('adminShell')); }catch(err){}
      if(typeof toast === 'function') toast(msg); else alert(msg);
    }
  });

})();
</script>

<script id="nexcart-pink-restore-v52">
/* ============================================================
   v52 - PINK THEME RESTORED
   ------------------------------------------------------------
   This file is the untouched pre-theme build (build v49) with only
   the build stamp changed, so the design is exactly what it was
   before the indigo theme was applied.

   One thing is different outside this file: while the indigo theme
   was being tested, the brand colour and the banner background
   colours that live in the SHOP DATA were changed to indigo, and
   the app reads those at every launch. Until that copy is changed
   back (Admin -> Branding -> pick the pink swatch -> Save), this
   block puts the original pink values back on this device so the
   shop looks exactly as it used to.

   v54: this now STEPS ASIDE the moment you save a colour of your own.
   While the shop data still holds the old indigo (#3B2BD9) the pink values
   are put back, so the shop looks right. Pick any colour in
   Admin -> Branding -> Save and the guard leaves it alone from then on.
   ============================================================ */
(function () {
  var INDIGO = '#3B2BD9';
  var PINK = { brand: '#FF3F6C', dark: '#E02D5B', light: '#FFEAF1' };
  var BANNER_BG = [
    'linear-gradient(135deg,#FF6FA5 0%,#D6114F 100%)',
    'linear-gradient(135deg,#FF9CC2 0%,#E4185B 100%)',
    'linear-gradient(135deg,#FFB3D2 0%,#B8114F 100%)'
  ];
  /* The colour the shop data actually holds right now. */
  function storedBrand() {
    try {
      var b = (typeof DB !== 'undefined' && DB && DB.branding) || null;
      return String((b && b.primaryColor) || '').toUpperCase();
    } catch (e) { return ''; }
  }
  function restore() {
    try {
      /* If the owner has saved a colour that is not the leftover indigo,
         that choice is theirs - do not touch it. */
      var saved = storedBrand();
      if (saved && saved !== INDIGO) return;
      var st = document.documentElement.style;
      st.setProperty('--brand', PINK.brand);
      st.setProperty('--brand-dark', PINK.dark);
      st.setProperty('--brand-light', PINK.light);
      if (typeof DB !== 'undefined' && DB && DB.banners) {
        DB.banners.forEach(function (b, i) {
          if (BANNER_BG[i] && String(b.bg || '').indexOf('#3B2BD9') >= 0) b.bg = BANNER_BG[i];
        });
      }
    } catch (e) {}
  }
  restore();
  window.addEventListener('load', restore);
  document.addEventListener('visibilitychange', restore);
  /* The app re-applies the saved colour after it talks to the backend, which
     used to flip the shop back to indigo a few seconds after launch. Watch the
     <html> style attribute and put the pink values straight back. */
  try {
    new MutationObserver(restore).observe(document.documentElement, {
      attributes: true, attributeFilter: ['style']
    });
  } catch (e) {}
  setInterval(restore, 2000);
})();
</script>

          Promise.resolve(go).then(function (u) {

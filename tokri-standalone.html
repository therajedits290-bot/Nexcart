<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Nexcart — Online Store</title>
<!-- PWA / installable-app meta -->
<meta name="theme-color" content="#FF3F6C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nexcart">
<meta name="description" content="Sasta shopping, full paisa vasool. Cash on Delivery available.">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   NEXCART Store — Design System
   Type: Assistant carries the whole UI (400/500/600 body, 700/800 for prices,
   headings and the wordmark — one family keeps the grid calm). Inter is the
   fallback stack only.
   Depth: hairline rings folded into soft shadows so cards read on pure white.
   ============================================================ */

:root{
   /* Retail design language: crisp pink accent on clean white, warm orange for
      savings. These are our own values (a Myntra-style direction), not a copy
      of anyone's stylesheet. */
   --brand: #FF3F6C;
   --brand-dark: #D81E52;
   --brand-light: #FFF0F4;
   --accent: #FF905A;
   --accent-dark: #F16521;
   --ink: #282C3F;
   --ink-soft: #535766;
   --ink-faint: #94969F;
   --bg: #FFFFFF;
   --surface: #FFFFFF;
   --surface-2: #F5F5F6;
   --line: #E9E9EB;
   --success: #03A685;
   --success-bg: #E9F7F2;
   --warn: #D68910;
   --warn-bg: #FFF6E5;
   --danger: #E23744;
   --danger-bg: #FDECEE;
   --radius-lg: 14px;
   --radius-md: 10px;
   --radius-sm: 8px;
   /* Hairline ring folded into the shadow keeps cards defined on pure white
      without heavy drop shadows. */
   --shadow-1: 0 1px 2px rgba(40,44,63,0.05);
   --shadow-2: 0 1px 3px rgba(40,44,63,0.08), 0 0 0 1px rgba(40,44,63,0.045);
   --shadow-3: 0 8px 24px rgba(40,44,63,0.14);
   --shadow-inset: inset 0 0 0 1px rgba(40,44,63,0.08);
   --font-display: 'Assistant', 'Inter', sans-serif;
   --font-body: 'Assistant', 'Inter', sans-serif;
   --sheet-bg: #FFFFFF;
}

/* ============= Dark Theme ============= */
html[data-theme="dark"]{
  --ink: #F2F1F5;
  --ink-soft: #B4B2BE;
  --ink-faint: #85838F;
   --bg: #101014;
   --surface: #1A1A20;
   --surface-2: #23232B;
   --line: #2A2A33;
   --brand-light: #3A1520;
  --success: #35C177;
  --success-bg: #12301F;
  --warn: #E0B54A;
  --warn-bg: #332A11;
  --danger: #FF6B75;
  --danger-bg: #3A1B1E;
  --sheet-bg: #1A1A20;
  --shadow-1: 0 1px 2px rgba(0,0,0,0.4);
  --shadow-2: 0 4px 14px rgba(0,0,0,0.45);
  --shadow-3: 0 10px 30px rgba(0,0,0,0.6);
  --shadow-inset: inset 0 0 0 1px rgba(255,255,255,0.06);
}
html[data-theme="dark"] body{ background: var(--bg); color: var(--ink); }
html[data-theme="dark"] .bottom-sheet{ background: var(--sheet-bg); }
html[data-theme="dark"] .form-input,
html[data-theme="dark"] .form-select,
html[data-theme="dark"] .form-textarea{ background:#23232B; color:var(--ink); }
html[data-theme="dark"] .app-header{ background: #16161B; }
html[data-theme="dark"] .bottom-nav{ background: #16161B; }
html[data-theme="dark"] .splash{ background: linear-gradient(160deg, var(--brand) 0%, var(--brand-dark) 100%); }
html[data-theme="dark"] .product-card{ background: var(--surface); }
html[data-theme="dark"] img{ filter: brightness(0.92); }

*{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html,body{ margin:0; padding:0; }
body{
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--ink);
  overscroll-behavior-y: contain;
  -webkit-font-smoothing: antialiased;
}
h1,h2,h3{ font-family: var(--font-display); margin:0; }
p{ margin:0; }
button{ font-family: inherit; border:none; background:none; cursor:pointer; }
input,select,textarea{ font-family: inherit; }
img{ max-width:100%; display:block; }
::-webkit-scrollbar{ width:0; height:0; }

/* Base size is a safety net: any icon without an explicit rule renders at 16px
   instead of expanding to fill its container. Specific rules below override it. */
.icon{ display:inline-flex; align-items:center; justify-content:center; line-height:0; width:16px; height:16px; flex-shrink:0; }
.icon svg{ width:100%; height:100%; }
.icon.ic-xs{ width:12px; height:12px; }
.icon.ic-sm{ width:14px; height:14px; }
.icon.ic-lg{ width:26px; height:26px; }

/* ============= SPLASH ============= */
.splash{
  position:fixed; inset:0; z-index:999;
  background: linear-gradient(160deg, var(--brand) 0%, var(--brand-dark) 100%);
  display:flex; align-items:center; justify-content:center;
  animation: fadeIn .3s ease;
}
.splash-inner{ text-align:center; color:#fff; }
.splash-logo-wrap{
  width:88px; height:88px; border-radius:26px; background:rgba(255,255,255,0.15);
  display:flex; align-items:center; justify-content:center; margin:0 auto 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.18);
  animation: popIn .5s cubic-bezier(.34,1.56,.64,1);
}
.splash-logo-img{ width:56px; height:56px; border-radius:16px; object-fit:cover; }
.splash-logo-fallback{ font-family: var(--font-display); font-size:38px; font-weight:700; color:#fff; }
.splash-title{ font-size:32px; font-weight:800; letter-spacing:0.3px; margin-bottom:6px; }
.splash-tagline{ font-size:14px; opacity:0.85; font-weight:500; }
.splash-loader{ margin-top:34px; display:flex; gap:6px; justify-content:center; }
.splash-loader span{
  width:7px; height:7px; border-radius:50%; background:#fff; opacity:0.6;
  animation: bounce 1.1s infinite ease-in-out;
}
.splash-loader span:nth-child(2){ animation-delay:.15s; }
.splash-loader span:nth-child(3){ animation-delay:.3s; }
@keyframes bounce{ 0%,80%,100%{ transform: scale(0.6); opacity:0.4; } 40%{ transform: scale(1); opacity:1; } }
@keyframes popIn{ 0%{ transform: scale(0.5); opacity:0; } 100%{ transform: scale(1); opacity:1; } }
@keyframes fadeIn{ from{opacity:0} to{opacity:1} }
@keyframes fadeOut{ from{opacity:1} to{opacity:0} }

/* ============= APP SHELL ============= */
.app-shell{
  max-width:480px; margin:0 auto; min-height:100vh;
  background: var(--bg); position:relative;
  display:flex; flex-direction:column;
}
.topbar{
  position:sticky; top:0; z-index:50;
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 18px; background: var(--surface);
  box-shadow: var(--shadow-1);
}
.topbar-brand{ display:flex; align-items:center; gap:9px; cursor:pointer; user-select:none; }
.brand-logo-img{ width:32px; height:32px; border-radius:9px; object-fit:cover; }
.brand-logo-fallback{
  width:32px; height:32px; border-radius:10px;
  background: linear-gradient(135deg, var(--brand) 0%, var(--accent) 100%);
  color:#fff; font-weight:800; font-size:16px;
  display:flex; align-items:center; justify-content:center;
  box-shadow: 0 2px 8px rgba(255,63,108,0.28);
}
/* Gradient wordmark — the signature retail-app look. */
.brand-name{
  font-weight:800; font-size:21px; letter-spacing:-0.5px;
  background: linear-gradient(96deg, var(--brand) 0%, var(--accent) 100%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: var(--brand);
}
.topbar-actions{ display:flex; gap:6px; }
.icon-btn{
  width:38px; height:38px; border-radius:12px; display:flex; align-items:center; justify-content:center;
  color: var(--ink-soft); transition: transform .15s ease, background .15s ease;
}
.icon-btn .icon{ width:21px; height:21px; }
.icon-btn:active{ transform: scale(0.88); background: var(--line); }
.icon-btn.filled-heart{ color: var(--brand); }

.subheader{
  position:sticky; top:0; z-index:50; display:flex; align-items:center; gap:10px;
  padding:14px 14px; background: var(--surface); box-shadow: var(--shadow-1);
}
.subheader-title{ font-size:17px; font-weight:700; font-family: var(--font-body); flex:1; text-align:center; margin-right:38px; }
.subheader-spacer{ width:38px; }

.main-content{ flex:1; padding-bottom:84px; min-height:60vh; }

.bottom-nav{
  position:fixed; bottom:0; left:50%; transform:translateX(-50%);
  width:100%; max-width:480px; display:flex; background: var(--surface);
  box-shadow: 0 -2px 16px rgba(20,20,30,0.08); z-index:60;
  padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
}
.nav-item{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:6px 2px; color: var(--ink-faint); position:relative; transition: transform .15s ease;
}
.nav-item:active{ transform: scale(0.9); }
.nav-item .nav-icon{ width:22px; height:22px; display:flex; }
.nav-item .nav-icon svg{ width:100%; height:100%; }
.nav-item .nav-label{ font-size:11px; font-weight:600; }
.nav-item.active{ color: var(--brand); }
.nav-item.active .nav-label{ font-weight:800; }
/* Active tab marker pinned to the top edge of the bar. */
.nav-item.active::before{
  content:''; position:absolute; top:-6px; left:50%; transform:translateX(-50%);
  width:24px; height:2.5px; border-radius:0 0 3px 3px; background: var(--brand);
}
.nav-item:active::before{ opacity:0.5; }
.nav-badge{
  position:absolute; top:0; right:calc(50% - 18px); background: var(--brand); color:#fff;
  font-size:10px; font-weight:700; border-radius:10px; min-width:16px; height:16px;
  display:flex; align-items:center; justify-content:center; padding:0 3px;
}

/* ============= COMMON: sections, cards ============= */
.section{ padding: 18px 16px 4px; }
.section-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.section-title{ font-size:16px; font-weight:700; letter-spacing:.2px; color: var(--ink); }
.section-title .icon{ width:15px; height:15px; color: var(--accent-dark); vertical-align:-2px; }
.section-link{
  font-size:11.5px; font-weight:800; color: var(--brand); text-transform:uppercase;
  letter-spacing:.6px; display:flex; align-items:center; gap:1px;
}
.section-link .icon{ width:13px; height:13px; }

.search-bar{
  display:flex; align-items:center; gap:10px; background: var(--surface-2);
  border-radius: var(--radius-md); padding:11px 14px; margin: 12px 16px 4px;
  box-shadow: var(--shadow-inset);
}
.search-bar .icon{ width:19px; height:19px; color: var(--ink-faint); flex-shrink:0; }
.search-bar input{ border:none; outline:none; flex:1; font-size:14.5px; background:transparent; color:var(--ink); }
.search-bar input::placeholder{ color: var(--ink-faint); }

.hero-banner{
  margin:14px 16px; border-radius: var(--radius-lg); overflow:hidden;
  background: linear-gradient(120deg, var(--brand) 0%, var(--accent) 100%);
  box-shadow: var(--shadow-3); padding:22px 20px; color:#fff; position:relative;
}
.hero-banner h2{ font-size:22px; font-weight:700; margin-bottom:6px; }
.hero-banner p{ font-size:13px; opacity:0.9; font-weight:500; }
.hero-banner .hero-badge{
  display:inline-flex; align-items:center; gap:5px; background:rgba(255,255,255,0.22);
  border-radius:20px; padding:5px 12px; font-size:11.5px; font-weight:700; margin-top:12px;
}

.chip-row{ display:flex; gap:6px; overflow-x:auto; padding: 4px 12px 10px; scrollbar-width:none; }
.chip-row::-webkit-scrollbar{ display:none; }
/* Circular category tiles — the retail-app convention. */
.category-chip{
  flex-shrink:0; display:flex; flex-direction:column; align-items:center; gap:8px; width:74px;
  transition: transform .15s ease;
}
.category-chip:active{ transform: scale(0.92); }
.category-chip-icon{
  width:64px; height:64px; border-radius:50%; background: var(--surface-2);
  display:flex; align-items:center; justify-content:center;
  box-shadow: 0 0 0 1px var(--line), 0 2px 6px rgba(40,44,63,0.06);
  color: var(--brand); font-size:26px; overflow:hidden;
}
.category-chip-icon img{ width:100%; height:100%; object-fit:cover; border-radius:50%; }
.category-chip span{
  font-size:10.5px; font-weight:600; color: var(--ink-soft); text-align:center;
  line-height:1.25; width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.category-chip-icon .icon.cat-svg{ width:27px; height:27px; }
.icon.cat-svg-lg{ width:40px; height:40px; }
.category-chip-icon .cat-emoji{ font-size:28px; line-height:1; }
.cat-emoji{ font-size:32px; line-height:1; }
.cat-thumb-44{ margin-bottom:8px; color:var(--brand); height:44px; display:flex; align-items:center; justify-content:center; }
.cat-thumb-44 img{ width:44px; height:44px; border-radius:50%; object-fit:cover; }

/* ============= USP / trust strip ============= */
.usp-strip{ display:flex; gap:8px; overflow-x:auto; padding: 14px 16px 2px; scrollbar-width:none; }
.usp-strip::-webkit-scrollbar{ display:none; }
.usp-item{
  flex:1 0 auto; min-width:76px; display:flex; flex-direction:column; align-items:center; gap:6px;
  background: var(--surface); border-radius: var(--radius-md); padding:12px 8px;
  box-shadow: var(--shadow-2);
}
.usp-item .icon{ width:19px; height:19px; color: var(--brand); }
.usp-item span{ font-size:10px; font-weight:700; color: var(--ink-soft); text-align:center; line-height:1.3; }
.icon.xs-ic{ width:14px; height:14px; margin-top:1px; flex-shrink:0; }
/* Category icon picker (admin) */
.cat-icon-pick{ display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
.cat-icon-pick button{
  width:42px; height:42px; border-radius:12px; background:var(--bg); color:var(--ink-soft);
  display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow-inset);
  transition: all .12s ease;
}
.cat-icon-pick button .icon{ width:20px; height:20px; }
.cat-icon-pick button.selected{ background:var(--brand); color:#fff; box-shadow:none; }
.cat-icon-pick button:active{ transform:scale(0.9); }

.product-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:11px; padding: 6px 14px 16px; }
.product-card{
  background: var(--surface); border-radius: var(--radius-md); overflow:hidden;
  box-shadow: var(--shadow-2); transition: transform .15s ease, box-shadow .15s ease;
  cursor:pointer; position:relative;
}
.product-card:active{ transform: scale(0.975); box-shadow: var(--shadow-1); }
/* Portrait crop = the standard fashion-retail card proportion. */
.product-img-wrap{ position:relative; width:100%; aspect-ratio: 3/4; background: var(--surface-2); overflow:hidden; }
.product-img-wrap img{ width:100%; height:100%; object-fit:cover; transition: transform .35s ease; }
.product-card:active .product-img-wrap img{ transform: scale(1.04); }
.product-wish-btn{
  position:absolute; top:7px; right:7px; width:28px; height:28px; border-radius:50%;
  background: rgba(255,255,255,0.94); display:flex; align-items:center; justify-content:center;
  box-shadow: 0 1px 4px rgba(40,44,63,0.18); color: var(--ink-soft); transition: transform .15s ease;
}
.product-wish-btn:active{ transform: scale(0.85); }
.product-wish-btn.active{ color: var(--brand); }
.product-wish-btn .icon{ width:15px; height:15px; }
/* Savings flag sits on the image edge — reads as a label, not a button. */
.product-discount-badge{
  position:absolute; bottom:7px; left:0; background: rgba(255,255,255,0.95);
  color: var(--accent-dark); font-size:10px; font-weight:800; letter-spacing:.3px;
  padding:3px 8px; border-radius:0 6px 6px 0; box-shadow: 0 1px 3px rgba(40,44,63,0.12);
}
.product-info{ padding:9px 10px 11px; }
.product-cat{
  font-size:11px; font-weight:800; color: var(--ink); letter-spacing:.3px;
  text-transform:uppercase; margin-bottom:2px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.product-name{
  font-size:12.5px; font-weight:500; color: var(--ink-soft); line-height:1.35; margin-bottom:5px;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; height:34px;
}
.product-rating{ display:flex; align-items:center; gap:4px; margin-bottom:6px; }
.product-rating .icon{ width:10px; height:10px; color:#fff; }
.rating-pill{ background: var(--success); display:flex; align-items:center; gap:2px; padding:2px 5px; border-radius:4px; }
.rating-pill span{ font-size:10px; font-weight:800; color:#fff; }
.rating-count{ font-size:10.5px; color: var(--ink-faint); font-weight:500; }
.product-price-row{ display:flex; align-items:baseline; gap:5px; flex-wrap:wrap; }
.price-now{ font-size:15px; font-weight:800; color: var(--ink); }
.price-was{ font-size:11.5px; color: var(--ink-faint); text-decoration: line-through; }
.price-off{ font-size:11.5px; color: var(--accent-dark); font-weight:800; }
.product-fd{ font-size:10px; font-weight:700; color: var(--ink-faint); margin-top:4px; }

/* ============= Skeleton loading ============= */
.skeleton{
  background: linear-gradient(90deg, #ECECEF 25%, #F6F6F8 37%, #ECECEF 63%);
  background-size: 400% 100%;
  animation: shimmer 1.4s ease infinite;
  border-radius:8px;
}
@keyframes shimmer{ 0%{ background-position: 100% 50%; } 100%{ background-position: 0 50%; } }
.skel-card{ background: var(--surface); border-radius: var(--radius-md); overflow:hidden; box-shadow: var(--shadow-2); }
.skel-img{ width:100%; aspect-ratio:3/4; }
.skel-line{ height:10px; margin:10px 11px; }
.skel-line.w60{ width:60%; }
.skel-line.w40{ width:40%; }
.skel-grid{ display:grid; grid-template-columns:1fr 1fr; gap:11px; padding:6px 14px 16px; }
.skel-chip{ width:64px; height:64px; border-radius:50%; flex-shrink:0; }
.skel-banner{ height:120px; margin:14px 16px; border-radius: var(--radius-lg); }

/* ============= Empty states ============= */
.empty-state{ display:flex; flex-direction:column; align-items:center; text-align:center; padding:60px 30px; }
.empty-state .icon{ width:56px; height:56px; color: var(--ink-faint); margin-bottom:16px; opacity:0.55; }
.empty-state h3{ font-size:16px; font-weight:700; font-family: var(--font-body); color: var(--ink); margin-bottom:6px; }
.empty-state p{ font-size:13px; color: var(--ink-faint); margin-bottom:20px; line-height:1.5; }

/* ============= Buttons ============= */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  padding:12px 20px; border-radius: var(--radius-sm); font-size:14.5px; font-weight:700;
  transition: transform .12s ease, box-shadow .12s ease; text-align:center;
}
.btn:active{ transform: scale(0.96); }
.btn-primary{ background: var(--brand); color:#fff; box-shadow: 0 4px 14px rgba(255,63,108,0.35); }
.btn-primary:disabled{ opacity:0.5; box-shadow:none; }
.btn-secondary{ background: var(--surface); color: var(--ink); box-shadow: var(--shadow-2); }
.btn-outline{ background: transparent; color: var(--brand); box-shadow: var(--shadow-inset); }
.btn-danger-outline{ background: var(--danger-bg); color: var(--danger); }
.btn-block{ width:100%; }
.btn-sm{ padding:8px 14px; font-size:12.5px; border-radius:9px; }
.text-btn{ color: var(--brand); font-weight:600; font-size:13.5px; padding:8px; }

/* ---- Icon sizing inside buttons / tappable controls ----
   Without these, an inline SVG expands to fill its container. */
.btn .icon{ width:17px; height:17px; flex-shrink:0; }
.btn-sm .icon{ width:14px; height:14px; }
.btn-block .icon{ width:17px; height:17px; }
.text-btn .icon{ width:15px; height:15px; }
.coupon-code .icon,
.coupon-applied .icon{ width:14px; height:14px; }
.coupon-apply .icon{ width:13px; height:13px; }
.addr-actions button .icon{ width:13px; height:13px; }
.admin-fab .icon{ width:24px; height:24px; }

/* ============= Product detail ============= */
.pd-gallery{ width:100%; aspect-ratio:1/1; background: var(--line); }
.pd-gallery img{ width:100%; height:100%; object-fit:cover; }
.pd-body{ padding:18px 16px 100px; }
.pd-title{ font-size:16px; font-weight:600; line-height:1.4; margin-bottom:8px; color: var(--ink); }
.pd-price-row{ display:flex; align-items:baseline; gap:10px; margin-bottom:10px; }
.pd-price-now{ font-family: var(--font-display); font-size:26px; font-weight:700; }
.pd-rating-row{ display:flex; align-items:center; gap:8px; margin-bottom:16px; }
.pd-rating-row .rating-pill .icon{ width:12px; height:12px; }
.pd-section{ background: var(--surface); border-radius: var(--radius-md); padding:14px 16px; margin-bottom:14px; box-shadow: var(--shadow-2); }
.pd-section h4{ font-size:13.5px; font-weight:700; margin-bottom:8px; color: var(--ink); font-family: var(--font-body); }
.pd-section p{ font-size:13px; color: var(--ink-soft); line-height:1.6; }
.trust-row{ display:flex; align-items:center; gap:8px; font-size:12px; color: var(--ink-soft); font-weight:500; padding:10px 2px; }
.trust-row .icon{ width:15px; height:15px; color: var(--success); flex-shrink:0; }
.pd-sticky-bar{
  position:fixed; bottom:0; left:50%; transform:translateX(-50%); max-width:480px; width:100%;
  background: var(--surface); box-shadow: 0 -4px 20px rgba(20,20,30,0.1); padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  display:flex; gap:10px; z-index:70;
}

/* ============= Cart ============= */
.cart-item{ display:flex; gap:12px; background: var(--surface); border-radius: var(--radius-md); padding:12px; margin: 0 16px 12px; box-shadow: var(--shadow-2); }
.cart-item-img{ width:70px; height:70px; border-radius:11px; overflow:hidden; background: var(--line); flex-shrink:0; }
.cart-item-img img{ width:100%; height:100%; object-fit:cover; }
.cart-item-info{ flex:1; min-width:0; }
.cart-item-name{ font-size:13px; font-weight:600; margin-bottom:4px; line-height:1.35; }
.cart-item-price{ font-family: var(--font-display); font-weight:700; font-size:14.5px; margin-bottom:8px; }
.qty-stepper{ display:flex; align-items:center; gap:0; background: var(--bg); border-radius:9px; width:fit-content; box-shadow: var(--shadow-inset); }
.qty-stepper button{ width:28px; height:28px; display:flex; align-items:center; justify-content:center; color: var(--brand); }
.qty-stepper button .icon{ width:14px; height:14px; }
.qty-stepper span{ font-size:13px; font-weight:700; min-width:22px; text-align:center; }
.cart-item-remove{ align-self:flex-start; color: var(--ink-faint); }
.cart-item-remove .icon{ width:17px; height:17px; }
.cart-summary{ background: var(--surface); border-radius: var(--radius-lg); margin:8px 16px; padding:16px; box-shadow: var(--shadow-2); }
.summary-row{ display:flex; justify-content:space-between; font-size:13.5px; color: var(--ink-soft); padding:6px 0; }
.summary-row.total{ font-weight:700; color: var(--ink); font-size:15px; border-top:1px solid var(--line); margin-top:6px; padding-top:12px; }
.summary-row .free{ color: var(--success); font-weight:700; }

/* ============= Payment ============= */
.pay-option{ display:flex; align-items:center; gap:12px; background: var(--surface); border-radius: var(--radius-md); padding:14px; margin: 0 16px 10px; box-shadow: var(--shadow-2); position:relative; }
.pay-option-icon{ width:42px; height:42px; border-radius:12px; background: var(--brand-light); color: var(--brand); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.pay-option-icon .icon{ width:22px; height:22px; }
.pay-option-text{ flex:1; }
.pay-option-text b{ font-size:14px; display:block; margin-bottom:2px; }
.pay-option-text span{ font-size:12px; color: var(--ink-faint); }
.pay-radio{ width:20px; height:20px; border-radius:50%; box-shadow: 0 0 0 2px var(--brand) inset; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.pay-radio.checked::after{ content:''; width:11px; height:11px; border-radius:50%; background: var(--brand); }
.pay-option.disabled{ opacity:0.55; }
.pay-option.disabled .pay-radio{ box-shadow: 0 0 0 2px var(--ink-faint) inset; }
.soon-badge{ position:absolute; top:10px; right:14px; background: var(--warn-bg); color: var(--warn); font-size:10px; font-weight:700; padding:3px 8px; border-radius:6px; }

/* ============= Orders ============= */
.order-card{ background: var(--surface); border-radius: var(--radius-md); padding:14px; margin: 0 16px 12px; box-shadow: var(--shadow-2); transition: transform .15s ease; cursor:pointer; }
.order-card:active{ transform: scale(0.98); }
.order-card-top{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; }
.order-id{ font-size:12px; color: var(--ink-faint); font-weight:600; }
.order-status-badge{ font-size:11px; font-weight:700; padding:4px 10px; border-radius:8px; }
.status-placed{ background: var(--warn-bg); color: var(--warn); }
.status-shipped{ background:#E3EEFF; color:#2A63C7; }
.status-outfordelivery{ background:#F0E7FF; color:#7B3FE4; }
.status-delivered{ background: var(--success-bg); color: var(--success); }
.status-cancelled{ background: var(--danger-bg); color: var(--danger); }
.status-returned{ background: var(--danger-bg); color: var(--danger); }
.order-products-row{ display:flex; gap:8px; margin-bottom:10px; }
.order-products-row img{ width:52px; height:52px; border-radius:9px; object-fit:cover; background: var(--line); }
.order-more-badge{ width:52px; height:52px; border-radius:9px; background: var(--bg); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color: var(--ink-faint); }
.order-bottom-row{ display:flex; justify-content:space-between; align-items:center; }
.order-total{ font-family: var(--font-display); font-weight:700; font-size:14.5px; }
.order-track-hint{ display:flex; align-items:center; gap:5px; font-size:12px; color: var(--brand); font-weight:600; }
.order-track-hint .icon{ width:14px; height:14px; }

/* ============= Order Tracking Detail ============= */
.track-current-card{
  background: linear-gradient(120deg, var(--brand) 0%, var(--accent) 100%); color:#fff;
  margin:16px; border-radius: var(--radius-lg); padding:20px; box-shadow: var(--shadow-3);
}
.track-current-top{ display:flex; align-items:center; gap:10px; margin-bottom:4px; }
.track-current-top .icon{ width:20px; height:20px; }
.track-current-city{ font-size:19px; font-weight:700; font-family: var(--font-display); }
.track-current-sub{ font-size:12.5px; opacity:0.88; margin-top:4px; }
.track-eta{ display:inline-flex; align-items:center; gap:6px; background: rgba(255,255,255,0.2); padding:6px 12px; border-radius:20px; font-size:12px; font-weight:700; margin-top:14px; }

.timeline{ padding: 4px 16px 16px; }
.timeline-item{ display:flex; gap:14px; position:relative; }
.timeline-item .tl-marker-col{ display:flex; flex-direction:column; align-items:center; }
.tl-dot{ width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; z-index:1; background: var(--line); color: var(--ink-faint); }
.tl-dot.done{ background: var(--success); color:#fff; }
.tl-dot.current{ background: var(--brand); color:#fff; box-shadow: 0 0 0 4px var(--brand-light); }
.tl-dot .icon{ width:14px; height:14px; }
.tl-line{ width:2px; flex:1; background: var(--line); min-height:34px; }
.tl-line.done{ background: var(--success); }
.timeline-item .tl-content{ padding-bottom:26px; flex:1; }
.tl-title{ font-size:13.5px; font-weight:700; color: var(--ink); margin-bottom:2px; }
.tl-title.pending{ color: var(--ink-faint); font-weight:600; }
.tl-meta{ font-size:12px; color: var(--ink-faint); }

.track-actions{ display:flex; gap:10px; padding: 6px 16px 20px; }

/* ============= Order detail sections ============= */
.od-section{ background: var(--surface); border-radius: var(--radius-md); margin:0 16px 12px; padding:14px 16px; box-shadow: var(--shadow-2); }
.od-section h4{ font-size:13px; font-weight:700; margin-bottom:10px; }
.od-product-row{ display:flex; gap:10px; align-items:center; padding:6px 0; }
.od-product-row img{ width:52px; height:52px; border-radius:9px; object-fit:cover; background: var(--line); }
.od-product-name{ font-size:13px; font-weight:600; flex:1; }
.od-product-price{ font-size:13px; font-weight:700; font-family: var(--font-display); }
.policy-note{ display:flex; gap:8px; align-items:flex-start; font-size:12px; color: var(--ink-soft); background: var(--bg); border-radius:10px; padding:10px; margin-top:8px; }
.policy-note .icon{ width:15px; height:15px; color: var(--warn); flex-shrink:0; margin-top:1px; }

/* ============= Profile ============= */
.profile-header{ background: linear-gradient(120deg, var(--brand) 0%, var(--accent) 100%); padding:26px 20px 30px; color:#fff; border-radius: 0 0 26px 26px; margin-bottom:-16px; }
.profile-header-row{ display:flex; align-items:center; gap:14px; }
.profile-avatar{ width:60px; height:60px; border-radius:50%; background: rgba(255,255,255,0.22); display:flex; align-items:center; justify-content:center; font-family: var(--font-display); font-size:24px; font-weight:700; }
.profile-name{ font-size:18px; font-weight:700; font-family: var(--font-body); }
.profile-phone{ font-size:12.5px; opacity:0.85; margin-top:2px; }
.profile-menu-card{ background: var(--surface); border-radius: var(--radius-lg); margin:26px 16px 14px; box-shadow: var(--shadow-2); overflow:hidden; }
.profile-menu-item{ display:flex; align-items:center; gap:13px; padding:15px 16px; cursor:pointer; transition: background .12s ease; }
.profile-menu-item:active{ background: var(--bg); }
.profile-menu-item:not(:last-child){ border-bottom:1px solid var(--line); }
.profile-menu-icon{ width:36px; height:36px; border-radius:10px; background: var(--brand-light); color: var(--brand); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.profile-menu-icon .icon{ width:18px; height:18px; }
.profile-menu-text{ flex:1; font-size:14px; font-weight:600; }
.profile-menu-text span{ display:block; font-size:11.5px; color: var(--ink-faint); font-weight:500; margin-top:1px; }
.profile-menu-item .chev{ width:16px; height:16px; color: var(--ink-faint); }


/* ============= Policy pages ============= */
.policy-page{ padding:18px 18px 40px; }
.policy-flag{ display:flex; gap:10px; background: var(--warn-bg); border-radius: var(--radius-md); padding:12px 14px; margin-bottom:18px; }
.policy-flag .icon{ width:18px; height:18px; color: var(--warn); flex-shrink:0; }
.policy-flag p{ font-size:12px; color:#7a5a08; line-height:1.5; font-weight:500; }
.policy-page h3{ font-size:15px; font-weight:700; margin: 20px 0 8px; font-family: var(--font-body); }
.policy-page p, .policy-page li{ font-size:13.5px; color: var(--ink-soft); line-height:1.7; }
.policy-page ul{ padding-left:18px; margin:6px 0; }
.policy-highlight{ background: var(--brand-light); border-radius: var(--radius-md); padding:14px; margin:14px 0; }
.policy-highlight b{ color: var(--brand-dark); }

/* ============= Modal / bottom sheet ============= */
.modal-overlay{ position:fixed; inset:0; background: rgba(15,15,20,0.5); z-index:200; display:flex; align-items:center; justify-content:center; animation: fadeIn .2s ease; }
.modal-card{ background: var(--surface); border-radius: 22px; padding:26px 22px; width:88%; max-width:340px; box-shadow: var(--shadow-3); text-align:center; animation: popIn .25s cubic-bezier(.34,1.56,.64,1); }
.modal-card h3{ font-size:17px; font-weight:700; margin: 10px 0 4px; font-family: var(--font-body); }
.muted{ color: var(--ink-faint); font-size:13px; }

.pin-icon{ width:52px; height:52px; border-radius:50%; background: var(--brand-light); color: var(--brand); display:flex; align-items:center; justify-content:center; margin:0 auto; }
.pin-icon .icon{ width:26px; height:26px; }
.pin-dots{ display:flex; gap:14px; justify-content:center; margin:18px 0 6px; }
.pin-dots span{ width:14px; height:14px; border-radius:50%; box-shadow: 0 0 0 1.5px var(--ink-faint) inset; transition: all .15s ease; }
.pin-dots span.filled{ background: var(--brand); box-shadow:none; }
.pin-error{ color: var(--danger); font-size:12.5px; font-weight:600; margin-bottom:8px; animation: shake .3s ease; }
@keyframes shake{ 0%,100%{ transform: translateX(0); } 25%{ transform: translateX(-6px); } 75%{ transform: translateX(6px); } }
.pin-keypad{ display:grid; grid-template-columns: repeat(3,1fr); gap:10px; margin: 14px 0 8px; }
.pin-key{ aspect-ratio:1; border-radius:14px; background: var(--bg); font-size:19px; font-weight:700; color: var(--ink); display:flex; align-items:center; justify-content:center; box-shadow: var(--shadow-1); transition: transform .1s ease; }
.pin-key:active{ transform: scale(0.9); background: var(--line); }
.pin-key.empty{ visibility:hidden; }

/* Layering scale (keep in sync — see also .modal-overlay 200, .admin-shell 400,
   confirmAction 500, .toast 600, login screen 998, splash 999).
   Sheets must sit ABOVE the admin shell, otherwise every admin create/edit form
   (product, category, coupon, banner) opens behind the panel and cannot be used. */
.bottom-sheet-overlay{ position:fixed; inset:0; background: rgba(15,15,20,0.5); z-index:450; display:flex; align-items:flex-end; justify-content:center; animation: fadeIn .15s ease; }
.bottom-sheet{ background: var(--surface); border-radius: 24px 24px 0 0; width:100%; max-width:480px; padding:10px 20px calc(24px + env(safe-area-inset-bottom)); box-shadow: var(--shadow-3); max-height:85vh; overflow-y:auto; animation: slideUp .2s cubic-bezier(.22,1,.36,1); contain: layout style paint; will-change: transform; }
@keyframes slideUp{ from{ transform: translateY(100%); } to{ transform: translateY(0); } }
.sheet-handle{ width:38px; height:4px; background: var(--line); border-radius:4px; margin: 8px auto 16px; }
.sheet-title{ font-size:16px; font-weight:700; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center; }

/* ============= Toast ============= */
/* Above sheets (450) and confirmations (500) so feedback is never hidden. */
.toast{ position:fixed; bottom:100px; left:50%; transform: translateX(-50%) translateY(20px); background: var(--ink); color:#fff; padding:12px 20px; border-radius:12px; font-size:13.5px; font-weight:600; box-shadow: var(--shadow-3); opacity:0; pointer-events:none; transition: all .25s cubic-bezier(.22,1,.36,1); z-index:600; max-width:82%; text-align:center; display:flex; align-items:center; gap:8px; }
.toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }
.toast .icon{ width:16px; height:16px; flex-shrink:0; }

/* ============= Forms (admin + checkout) ============= */
.form-group{ margin-bottom:16px; }
.form-label{ display:block; font-size:12.5px; font-weight:700; color: var(--ink-soft); margin-bottom:7px; }
.form-input, .form-select, .form-textarea{ width:100%; border:none; background: var(--surface); border-radius: var(--radius-sm); padding:12px 14px; font-size:14px; color: var(--ink); box-shadow: var(--shadow-inset); outline:none; transition: box-shadow .15s ease; }
.form-input:focus, .form-select:focus, .form-textarea:focus{ box-shadow: 0 0 0 2px var(--brand) inset; }
.form-textarea{ resize:vertical; min-height:80px; font-family: inherit; }
.form-hint{ font-size:11.5px; color: var(--ink-faint); margin-top:5px; }
.file-drop{ border: 1.5px dashed var(--ink-faint); border-radius: var(--radius-md); padding:24px; text-align:center; cursor:pointer; transition: all .15s ease; background: var(--bg); }
.file-drop:active{ transform: scale(0.98); }
.file-drop.has-file{ border-color: var(--success); background: var(--success-bg); }
.file-drop .icon{ width:30px; height:30px; color: var(--ink-faint); margin-bottom:8px; }
.file-drop.has-file .icon{ color: var(--success); }
.file-drop p{ font-size:13px; font-weight:600; color: var(--ink-soft); }
.file-drop span{ font-size:11.5px; color: var(--ink-faint); }
.file-preview-grid{ display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
.file-preview{ width:64px; height:64px; border-radius:10px; overflow:hidden; position:relative; box-shadow: var(--shadow-2); }
.file-preview img{ width:100%; height:100%; object-fit:cover; }
.file-preview .fp-remove{ position:absolute; top:2px; right:2px; width:18px; height:18px; border-radius:50%; background:rgba(0,0,0,0.6); color:#fff; display:flex; align-items:center; justify-content:center; }
.file-preview .fp-remove .icon{ width:10px; height:10px; }

/* ============= Storefront footer (also the hidden admin entry point) ============= */
.store-footer{ text-align:center; padding:26px 18px calc(24px + env(safe-area-inset-bottom)); margin-top:10px; border-top:1px solid var(--line); user-select:none; -webkit-user-select:none; }
.store-footer .sf-brand{ font-family: var(--font-display); font-size:15px; font-weight:800; letter-spacing:3px; color: var(--ink-soft); }
.store-footer .sf-line{ font-size:11px; color: var(--ink-soft); opacity:.75; margin-top:5px; }
.store-footer .sf-ver{ font-size:10.5px; color: var(--ink-soft); opacity:.55; margin-top:3px; }

/* ============= Admin ============= */
.admin-shell{ position:fixed; inset:0; z-index:400; background: var(--bg); overflow-y:auto; display:none; }
.admin-topbar{ position:sticky; top:0; z-index:10; background: var(--ink); color:#fff; padding:16px 18px; display:flex; align-items:center; gap:12px; box-shadow: var(--shadow-2); }
.admin-topbar h2{ font-size:16px; font-weight:700; font-family: var(--font-body); flex:1; }
.admin-topbar .icon-btn{ color:#fff; }
.admin-body{ padding-bottom:90px; }
.admin-stats-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:12px; padding:16px; }
.admin-stat-card{ background: var(--surface); border-radius: var(--radius-md); padding:16px; box-shadow: var(--shadow-2); }
.admin-stat-card .icon{ width:22px; height:22px; color: var(--brand); margin-bottom:10px; }
.admin-stat-value{ font-family: var(--font-display); font-size:22px; font-weight:700; }
.admin-stat-label{ font-size:11.5px; color: var(--ink-faint); font-weight:600; margin-top:2px; }
.admin-menu-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:12px; padding: 4px 16px 16px; }
.admin-menu-card{ background: var(--surface); border-radius: var(--radius-md); padding:18px 14px; box-shadow: var(--shadow-2); text-align:center; transition: transform .15s ease; cursor:pointer; }
.admin-menu-card:active{ transform: scale(0.95); }
.admin-menu-card .icon{ width:26px; height:26px; color: var(--brand); margin-bottom:10px; }
.admin-menu-card span{ display:block; font-size:12.5px; font-weight:700; color: var(--ink); }
.admin-bottom-nav{ position:fixed; bottom:0; left:0; right:0; background: var(--surface); box-shadow: 0 -2px 16px rgba(20,20,30,0.1); display:flex; padding:6px 4px calc(6px + env(safe-area-inset-bottom)); z-index:10; overflow-x:auto; overflow-y:hidden; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
.admin-bottom-nav::-webkit-scrollbar{ display:none; }
.admin-bottom-nav .nav-item{ min-width:64px; flex:0 0 auto; }
.admin-bottom-nav .nav-label{ font-size:10px; }
.admin-list-item.warn-stock{ box-shadow: var(--shadow-2), inset 3px 0 0 var(--warn); }
.stock-pill{ display:inline-block; font-size:10px; font-weight:700; padding:2px 7px; border-radius:8px; }
.stock-pill.low{ background: var(--warn-bg); color: var(--warn); }
.stock-pill.out{ background: var(--danger-bg); color: var(--danger); }
.stock-pill.ok{ background: var(--success-bg); color: var(--success); }
.cat-emoji-grid{ display:grid; grid-template-columns: repeat(6, 1fr); gap:8px; margin-top:8px; }
.cat-emoji-btn{ height:42px; border-radius:10px; background: var(--bg); font-size:20px; display:flex; align-items:center; justify-content:center; transition: transform .12s ease; }
.cat-emoji-btn:active{ transform: scale(0.9); }
.cat-emoji-btn.selected{ box-shadow: 0 0 0 2px var(--brand); background: var(--brand-light); }
.cust-avatar{ width:44px; height:44px; border-radius:50%; background: var(--brand-light); color: var(--brand-dark); font-family: var(--font-display); font-weight:700; font-size:16px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.cat-admin-thumb{ width:54px; height:54px; border-radius:10px; background:var(--brand-light); color:var(--brand-dark); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.admin-section{ padding:16px; }
.admin-list-item{ display:flex; align-items:center; gap:12px; background: var(--surface); border-radius: var(--radius-md); padding:12px; margin-bottom:10px; box-shadow: var(--shadow-2); }
.admin-list-item img{ width:54px; height:54px; border-radius:10px; object-fit:cover; background: var(--line); }
.admin-list-item .ali-info{ flex:1; min-width:0; }
.admin-list-item .ali-title{ font-size:13.5px; font-weight:600; margin-bottom:3px; }
.admin-list-item .ali-sub{ font-size:11.5px; color: var(--ink-faint); }
.admin-list-actions{ display:flex; gap:6px; }
/* 44x44 = comfortable minimum touch target on a phone */
.admin-icon-action{ width:44px; height:44px; border-radius:12px; background: var(--bg); display:flex; align-items:center; justify-content:center; color: var(--ink-soft); flex-shrink:0; transition: transform .12s ease; }
.admin-icon-action:active{ transform: scale(0.88); }
.admin-icon-action .icon{ width:18px; height:18px; }
.admin-icon-action.danger{ color: var(--danger); background: var(--danger-bg); }
.toggle-switch{ width:44px; height:26px; border-radius:14px; background: var(--line); position:relative; transition: background .2s ease; flex-shrink:0; }
.toggle-switch.on{ background: var(--success); }
.toggle-switch::after{ content:''; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; box-shadow: var(--shadow-1); transition: transform .2s ease; }
.toggle-switch.on::after{ transform: translateX(18px); }
.admin-fab{ position:fixed; bottom:78px; right:calc(50% - 240px + 18px); width:54px; height:54px; border-radius:50%; background: var(--brand); color:#fff; display:flex; align-items:center; justify-content:center; box-shadow: 0 8px 22px rgba(255,63,108,0.4); z-index:15; }
@media (max-width:480px){ .admin-fab{ right:18px; } }
.admin-fab .icon{ width:24px; height:24px; }
.color-swatch-row{ display:flex; gap:10px; margin-top:8px; }
.color-swatch{ width:34px; height:34px; border-radius:50%; box-shadow: var(--shadow-2); cursor:pointer; position:relative; }
.color-swatch.selected::after{ content:''; position:absolute; inset:-4px; border-radius:50%; box-shadow: 0 0 0 2px var(--ink); }

/* Size chips */
.size-chip{
  padding:7px 13px; border-radius:9px; font-size:13px; font-weight:700;
  background:var(--surface); color:var(--ink-soft); box-shadow:var(--shadow-inset);
  transition: all .12s ease; cursor:pointer;
}
.size-chip.selected{ background:var(--brand); color:#fff; box-shadow:none; }
.size-chip:active{ transform:scale(0.92); }
.logo-preview-box{ display:flex; align-items:center; gap:14px; background: var(--surface); border-radius: var(--radius-md); padding:14px; box-shadow: var(--shadow-2); margin-bottom:16px; }
.logo-preview-img{ width:56px; height:56px; border-radius:14px; object-fit:cover; background: var(--line); }

  /* --- type scale: nothing on screen below 12px --- */
  --t-micro: 12px;
  --t-small: 12.5px;
  --t-body:  13.5px;

  /* --- one accent + one semantic green. Orange is retired from
         browsing surfaces so the palette stops competing.        */
  --hairline: #E7E7EA;

  /* --- elevation: crisp hairlines instead of heavy drop shadows --- */
  --shadow-1: 0 1px 2px rgba(40,44,63,.04);
  --shadow-2: 0 1px 2px rgba(40,44,63,.04), 0 0 0 1px rgba(40,44,63,.05);
  --shadow-3: 0 6px 18px rgba(40,44,63,.10);
  --shadow-inset: inset 0 0 0 1px var(--hairline);

  --radius-lg: 16px;
  --radius-md: 14px;
  --radius-sm: 10px;
}

/* ============================================================
   1. HEADER  — hairline instead of shadow, real logo mark
   ============================================================ */
.topbar{
  padding: 12px 16px;
  box-shadow: none;
  border-bottom: 1px solid var(--hairline);
}
.brand-name{
  font-size: 19px;
  font-weight: 800;
  letter-spacing: -.45px;
  color: var(--ink);
}

/* The brand mark, baked in. Replaces the pink->orange gradient tile
   and its pink glow. The SVG carries its own rounded corners, so no
   border-radius is needed — the transparent corners show through. */
.brand-logo-fallback{
  width: 32px;
  height: 32px;
  border-radius: 0;
  background: var(--nex-mark) center/contain no-repeat;
  box-shadow: none;
  color: transparent;
  font-size: 0;
}
.brand-logo-img{ border-radius: 8px; }

.topbar-actions{ gap: 2px; }
.icon-btn{
  width: 44px;
  height: 44px;
  border-radius: 14px;
}
.icon-btn .icon{ width: 21px; height: 21px; }

function icon(name, cls) {
  const svg = ICONS[name] || ICONS.info;
  return `<span class="icon ${cls || ''}">${svg}</span>`;
}

/* Category icon resolution — emoji + SVG line icons.
   Falls back to a name-based guess so legacy saved data still renders. */
const CATEGORY_ICON_OPTIONS = ['shirt','phone','home','sparkle','star','apple','cart','headset','tag','camera','box','package','wallet','heart','grid','document'];
const CATEGORY_EMOJI_MAP = {
   fashion:'👕', clothing:'👕', apparel:'👕', men:'👔', women:'👗', kurta:'👗', shoe:'👠',
   electronic:'📱', mobile:'📱', gadget:'📱', laptop:'💻', tech:'⌚',
   home:'🏠', kitchen:'🍳', furniture:'🪑', decor:'🖼️', furnishing:'🛋️',
   beauty:'💄', cosmetic:'💅', skin:'✨', perfume:'🌸', personal:'🧴',
   kid:'🧸', toy:'🎮', baby:'🍼', sport:'⚽', game:'🎯',
   grocery:'🛒', food:'🍎', fruit:'🍌', vegetable:'🥬', snack:'🍿',
   book:'📚', stationery:'✏️', office:'📋'
};
const CATEGORY_ICON_GUESS = {
   fashion:'shirt', clothing:'shirt', apparel:'shirt', men:'shirt', women:'shirt', kurta:'shirt', shoe:'shirt',
   electronic:'phone', mobile:'phone', gadget:'phone', laptop:'phone', tech:'phone',
   home:'home', kitchen:'home', furniture:'home', decor:'home', furnishing:'home',
   beauty:'sparkle', cosmetic:'sparkle', skin:'sparkle', perfume:'sparkle', personal:'sparkle',
   kid:'star', toy:'star', baby:'star', sport:'star', game:'star',
   grocery:'apple', food:'apple', fruit:'apple', vegetable:'apple', snack:'apple',
   book:'document', stationery:'document', office:'document'
};
/* Returns an ICON NAME (never an emoji) so callers can do icon(categoryIcon(c)). */
 function categoryIcon(c){
   if(c && c.icon && ICONS[c.icon]) return c.icon;
   const key = ((c && c.name) || '').toLowerCase();
   for(const k in CATEGORY_ICON_GUESS){ if(key.includes(k)) return CATEGORY_ICON_GUESS[k]; }
   return 'grid';
 }
/* Returns an emoji for a category, or '' when none applies.
    Priority: admin-chosen emoji → name-based guess. */
 function categoryEmojiGuess(c){
   if(c && c.emoji) return c.emoji;
   const key = ((c && c.name) || '').toLowerCase();
   for(const k in CATEGORY_EMOJI_MAP){ if(key.includes(k)) return CATEGORY_EMOJI_MAP[k]; }
   return '';
 }
/* Single source of truth for how a category thumbnail renders everywhere.
    Priority: custom image → emoji → line icon. */
 function categoryThumbHTML(c, cls){
   if(c && c.img) return `<img src="${c.img}" alt="" loading="lazy" decoding="async">`;
   // Explicit admin choices outrank name-based guessing, otherwise picking a
   // line icon would be silently overridden by the guessed emoji.
   if(c && c.emoji) return `<span class="cat-emoji ${cls||''}">${c.emoji}</span>`;
   if(c && c.icon && ICONS[c.icon]) return icon(c.icon, cls || 'cat-svg');
   const guessed = categoryEmojiGuess(c);
   if(guessed) return `<span class="cat-emoji ${cls||''}">${guessed}</span>`;
   return icon('grid', cls || 'cat-svg');
 }

function loadDB(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(!raw) { const d = defaultDB(); saveDB(d); return d; }
    return migrateDB(JSON.parse(raw));
  }catch(e){
    const d = defaultDB(); try{ saveDB(d); }catch(e2){} return d;
  }
}
/* Backfill keys added in later versions so existing saved data keeps working.
   Never discards the user's own products, orders or branding. */
function migrateDB(db){
  const d = defaultDB();
  ['announcements','banners','coupons','wishlist','cart','orders'].forEach(k=>{
    if(db[k] === undefined) db[k] = d[k];
  });
  db.settings = Object.assign({}, d.settings, db.settings || {});
  db.branding = Object.assign({}, d.branding, db.branding || {});
  db.user     = Object.assign({}, d.user,     db.user     || {});
  if(!Array.isArray(db.user.addresses) || !db.user.addresses.length) db.user.addresses = d.user.addresses;
  (db.categories||[]).forEach(c=>{ if(c.icon === undefined) c.icon = ''; });
  (db.products||[]).forEach(p=>{
    if(p.sizes === undefined) p.sizes = [];
    if(p.hasSizes === undefined) p.hasSizes = false;
    if(p.reviews === undefined) p.reviews = [];
  });
  (db.orders||[]).forEach(o=>{
    if(o.reviewed === undefined) o.reviewed = false;
  });
  saveDB(db);
  return db;
}
/* ---------- How we stop a stale copy on the server wiping this phone ----------
   Every device downloads the shop from the server when it opens. That is right
   for customers, but it used to be fatal for the owner: if an upload had
   failed, the server still held an old copy, and simply opening the app
   replaced the owner's work with it. Images vanished, products vanished, and
   shrinking the image never helped because the file size was never the cause.
   So we now stamp the moment the CATALOGUE last changed here, and only accept
   the server's copy when the server is genuinely newer. */
let lastCatalogSig = null;
function catalogSignature(db){
  try{
    const p = (db.products || []).map(x=>
      [x.id, x.name, x.price, x.stock, String(x.img || '').length, x.category].join('|')).join(';');
    const c = (db.categories || []).map(x=>
      [x.id, x.name, String(x.img || '').length, (x.subs||[]).length,
       (x.subs||[]).map(y=>String(y.img||'').length).join(',')].join('|')).join(';');
    const b = db.branding ? [
      db.branding.appName, db.branding.tagline, db.branding.primaryColor,
      String(db.branding.logoDataUrl || '').length,
      db.branding.splash ? [db.branding.splash.type, db.branding.splash.url,
        String(db.branding.splash.dataUrl || '').length, db.branding.splash.seconds].join('|') : ''
    ].join('~') : '';
    return p + '#' + c + '#' + b;
  }catch(e){ return ''; }
}
/* ============================================================
   CATALOGUE BACKUPS
   The shop's products and categories used to be losable: a stale copy on the
   server could replace them when the app started, or a save could fail when
   the phone's storage was full. A copy of the catalogue is therefore kept in
   IndexedDB - which has far more room than the ~5 MB the app itself lives in -
   so anything that goes missing can be brought back with one tap in
   admin > Settings > Backups.
   ============================================================ */
const SNAP_DB = 'nexcart_backups', SNAP_STORE = 'shop', SNAP_KEEP = 12;

function snapSupported(){ try{ return !!(window.indexedDB); }catch(e){ return false; } }
function snapOpen(){
  return new Promise(function(res, rej){
    if(!snapSupported()) return rej(new Error('no indexeddb'));
    const r = indexedDB.open(SNAP_DB, 1);
    r.onupgradeneeded = function(){
      const d = r.result;
      if(!d.objectStoreNames.contains(SNAP_STORE)) d.createObjectStore(SNAP_STORE, { keyPath:'at' });
    };
    r.onsuccess = function(){ res(r.result); };
    r.onerror     = function(){ rej(r.error || new Error('could not open backups')); };
  });
}
/* Keep a copy of the catalogue as it is now. An identical copy is not repeated. */
function snapSave(source){
  if(!snapSupported()) return Promise.resolve(false);
  const src = source || DB;
  if(!src) return Promise.resolve(false);
  const sig = catalogSignature(src);
  return snapOpen().then(function(d){
    return new Promise(function(res){
      const tx = d.transaction(SNAP_STORE, 'readwrite');
      const st = tx.objectStore(SNAP_STORE);
      let skip = false;
      const last = st.openCursor(null, 'prev');
      last.onsuccess = function(e){
        const c = e.target.result;
        if(c && c.value && c.value.sig === sig){ skip = true; return; }
        st.put({ at: Date.now(), sig: sig,
                 products:   (src.products   || []).slice(),
                 categories: (src.categories || []).slice(),
                 np: (src.products   || []).length,
                 nc: (src.categories || []).length });
      };
      tx.oncomplete = function(){ res(!skip); };
      tx.onerror    = function(){ res(false); };
    });
  }).then(function(added){
    return added ? snapTrim().then(function(){ return true; }) : false;
  }).catch(function(){ return false; });
}
function snapTrim(){
  return snapOpen().then(function(d){
    return new Promise(function(res){
      const keys = [];
      const tx = d.transaction(SNAP_STORE, 'readonly');
      tx.objectStore(SNAP_STORE).openCursor(null, 'prev').onsuccess = function(e){
        const c = e.target.result;
        if(c){ keys.push(c.key); c.continue(); }
      };
      tx.oncomplete = function(){
        const dead = keys.slice(SNAP_KEEP);
        if(!dead.length) return res(true);
        const t2 = d.transaction(SNAP_STORE, 'readwrite');
        dead.forEach(function(k){ t2.objectStore(SNAP_STORE).delete(k); });
        t2.oncomplete = function(){ res(true); };
        t2.onerror    = function(){ res(false); };
      };
      tx.onerror = function(){ res(false); };
    });
  }).catch(function(){ return false; });
}
/* Newest first: { at, np, nc } */
function snapList(){
  if(!snapSupported()) return Promise.resolve([]);
  return snapOpen().then(function(d){
    return new Promise(function(res){
      const out = [];
      const tx = d.transaction(SNAP_STORE, 'readonly');
      tx.objectStore(SNAP_STORE).openCursor(null, 'prev').onsuccess = function(e){
        const c = e.target.result;
        if(c){ out.push({ at:c.value.at, np:c.value.np||0, nc:c.value.nc||0 }); c.continue(); }
      };
      tx.oncomplete = function(){ res(out); };
      tx.onerror    = function(){ res(out); };
    });
  }).catch(function(){ return []; });
}
function snapGet(at){
  if(!snapSupported()) return Promise.resolve(null);
  return snapOpen().then(function(d){
    return new Promise(function(res){
      const tx = d.transaction(SNAP_STORE, 'readonly');
      const g = tx.objectStore(SNAP_STORE).get(Number(at));
      g.onsuccess = function(){ res(g.result || null); };
      g.onerror   = function(){ res(null); };
    });
  }).catch(function(){ return null; });
}
/* Put the shop back to a saved copy. This phone then owns the newer catalogue,
   so the next sync uploads it instead of being overwritten by the server. */
function snapRestore(at){
  return snapGet(at).then(function(snp){
    if(!snp) return false;
    DB.products   = snp.products   || [];
    DB.categories = snp.categories || [];
    DB.catalogUpdatedAt = Date.now();
    if(!persistOrStop()) return false;
    lastCatalogSig = catalogSignature(DB);
    scheduleSnapshot(DB);
    return true;
  });
}
/* Back up shortly after the catalogue changes, however many changes arrive. */
let snapTimer = null, snapPending = null;
function scheduleSnapshot(src){
  snapPending = src || DB;
  try{ clearTimeout(snapTimer); }catch(e){}
  snapTimer = setTimeout(function(){ try{ snapSave(snapPending); }catch(e){} }, 2500);
}

/* Names the biggest picture we hold, so a storage warning can say WHAT to remove. */
/* How full is the app's storage box? Pictures are what fill it, so the
   owner needs to see the number BEFORE a save silently fails. */
function storageReport(){
  let used = 0;
  try{ used = (localStorage.getItem(DB_KEY) || '').length; }catch(e){}
  const LIMIT = 4.9 * 1024 * 1024;              // measured ceiling of this box
  const pct = Math.min(100, Math.round(used / LIMIT * 100));
  const big = biggestStoredImage(DB);
  return { mb: (used / 1024 / 1024).toFixed(2), limitMB: '4.9', pct: pct,
           biggestKB: Math.round(big.bytes / 1024), biggestWho: big.who };
}
function biggestStoredImage(db){
  let big = 0, who = '';
  const look = (v, label)=>{ const n = String(v || '').length; if(n > big){ big = n; who = label; } };
  try{
    (db.products || []).forEach(p=> look(p.img, 'product "' + (p.name || p.id) + '"'));
    (db.categories || []).forEach(c=>{
      look(c.img, 'category "' + (c.name || c.id) + '"');
      (c.subs || []).forEach(sb=> look(sb.img, 'sub-category "' + (sb.name || '') + '"'));
    });
    (db.banners || []).forEach((b,i)=> look(b.img, 'banner ' + (i+1)));
    const br = db.branding || {};
    look(br.logoDataUrl, 'your logo');
    if(br.splash) look(br.splash.dataUrl, 'the splash screen');
  }catch(e){}
  return { bytes: big, who: who };
}
function saveDB(db){
  try{
    const sig = catalogSignature(db);
    if(lastCatalogSig === null)                  lastCatalogSig = sig;
    else if(sig !== lastCatalogSig){
      lastCatalogSig = sig;
      db.catalogUpdatedAt = Date.now();
      scheduleSnapshot(db);          // keep a copy that a bad sync cannot erase
    }
    localStorage.setItem(DB_KEY, JSON.stringify(db));
    return true;
  }catch(e){
    /* This used to throw into the void: the Save button did nothing, said
       nothing, and the change was gone on the next reload. */
    const b = biggestStoredImage(db);
    let msg = 'Not enough storage — that change was NOT saved.';
    if(b.who) msg += ' Biggest picture: ' + b.who + ', ' + Math.round(b.bytes/1024) + ' KB.';
    msg += ' Delete or replace a picture and try again.';
    try{ showToast(msg, 'xCircle', 8000); }catch(e2){}
    try{ console.error('[Nexcart] save failed:', e && e.name, e && e.message, b); }catch(e3){}
    return false;
  }
}

   explained the failure to the owner with a toast, so a caller that gets

function persistOrStop(){ return saveDB(DB) === true; }

/* ============================================================
   PICTURE SHRINKING
   A photo from a phone camera is 3-5 MB. The app's storage holds
   about 5 MB in TOTAL and the server accepts far less than that
   per upload, so a raw photo can neither be saved nor sent. Every
   picture the owner picks is therefore resized and re-encoded to
   a sensible web size first: 5 MB in, roughly 100 KB out.
   ============================================================ */
function ncShrinkImage(file, maxPx, targetKB, asPng){
  maxPx = maxPx || 1000;
  targetKB = targetKB || 120;
  return new Promise(function(resolve, reject){
    if(!file) return reject(new Error('no file chosen'));
    let url;
    try{ url = URL.createObjectURL(file); }catch(e){ return reject(e); }
    const img = new Image();
    const done = (fn, arg)=>{ try{ URL.revokeObjectURL(url); }catch(e){} fn(arg); };
    img.onerror = ()=> done(reject, new Error('That file could not be read as a picture.'));
    img.onload = function(){
      try{
        const iw = img.naturalWidth || img.width;
        const ih = img.naturalHeight || img.height;
        if(!iw || !ih) return done(reject, new Error('That picture appears to be empty.'));
        const fit = Math.min(1, maxPx / Math.max(iw, ih));
        let cw = Math.max(1, Math.round(iw * fit));
        let ch = Math.max(1, Math.round(ih * fit));
        const draw = (w, h)=>{
          const cv = document.createElement('canvas');
          cv.width = w; cv.height = h;
          const cx = cv.getContext('2d');
          if(!asPng){ cx.fillStyle = '#FFFFFF'; cx.fillRect(0, 0, w, h); }
          cx.drawImage(img, 0, 0, w, h);
          return cv;
        };
        const encode = (cv, q)=> asPng ? cv.toDataURL('image/png') : cv.toDataURL('image/jpeg', q);
        let out = encode(draw(cw, ch), 0.86);
        /* JPEG: drop quality first, it costs the least visible detail. */
        if(!asPng){
          let q = 0.86;
          while(out.length / 1024 > targetKB && q > 0.42){ q -= 0.08; out = encode(draw(cw, ch), q); }
        }
        /* Still too big: step the pixels down. PNG has no quality dial, so
           this is the only lever — which is why the logo is capped small. */
        let guard = 0;
        while(out.length / 1024 > targetKB && Math.max(cw, ch) > 150 && guard < 8){
          cw = Math.max(1, Math.round(cw * 0.82));
          ch = Math.max(1, Math.round(ch * 0.82));
          out = encode(draw(cw, ch), 0.8);
          guard++;
        }
        return done(resolve, { dataUrl: out, kb: Math.max(1, Math.round(out.length / 1024)), w: cw, h: ch });
      }catch(e){ return done(reject, e); }
    };
    img.src = url;
  });
}
/* One consistent, honest sentence about what happened to the picture. */
function ncPictureReady(what, res){
  showToast(what + ' ready — ' + res.kb + ' KB (' + res.w + '\u00d7' + res.h + '). Now tap Save.', 'checkCircle', 4000);
}

}

/* ============================================================
   EXPECTED DELIVERY DATE
   The shop quotes a window (default 7-8 days). Customers want the
   ACTUAL date, so every quoted window is converted to real
   calendar dates, e.g. "8 Oct - 9 Oct".
   ============================================================ */
function deliveryWindow(){
  const st = DB.settings || {};
  let min = parseInt(st.deliveryMinDays, 10);
  let max = parseInt(st.deliveryMaxDays, 10);
  if(!min || min < 1) min = 7;
  if(!max || max < 1) max = 8;
  if(max < min) max = min;
  return { min: min, max: max };
}
/* Noon avoids any timezone drift flipping the date by a day. */
function addDaysTs(ts, n){
  const d = new Date(ts);
  d.setHours(12, 0, 0, 0);
  d.setDate(d.getDate() + n);
  return d.getTime();
}
function orderPlacedTs(order){
  return (order && (order.placedAt || order.createdAt)) ||
         (order && order.timeline && order.timeline[0] && order.timeline[0].at) ||
         Date.now();
}
function shortDay(d){
  const isDate = Object.prototype.toString.call(d) === '[object Date]';
  const dt = isDate ? d : new Date(d);
  const sameYear = dt.getFullYear() === new Date().getFullYear();
  return dt.toLocaleDateString('en-IN', sameYear
    ? { day: 'numeric', month: 'short' }
    : { day: 'numeric', month: 'short', year: 'numeric' });
}
/* Orders remember the window they were quoted. Changing the estimate in
   Settings must never rewrite the promise already made on an old order. */
function orderWindow(order){
  const w = deliveryWindow();
  let min = parseInt(order && order.etaMin, 10) || w.min;
  let max = parseInt(order && order.etaMax, 10) || w.max;
  if(max < min) max = min;
  return { min: min, max: max };
}
/* Everything the UI needs to talk about one order's delivery. */
function orderEta(order){
  if(!order) return { kind: 'none' };
  if(order.status === 'Cancelled' || order.status === 'Returned' || order.status === 'Refunded')
    return { kind: 'none' };
  if(order.status === 'Delivered'){
    const hits = (order.timeline || []).filter(t => t.stage === 'Delivered');
    const at = hits.length ? hits[hits.length - 1].at : addDaysTs(orderPlacedTs(order), orderWindow(order).max);
    return { kind: 'delivered', from: shortDay(at), to: shortDay(at) };
  }
  const placed = orderPlacedTs(order);
  const w = orderWindow(order);
  const from = shortDay(addDaysTs(placed, w.min));
  const to   = shortDay(addDaysTs(placed, w.max));
  return { kind: 'expected', from: from, to: to, min: w.min, max: w.max };
}
function etaDaysText(min, max){ return min === max ? (min + (min === 1 ? ' day' : ' days')) : (min + '\u2013' + max + ' days'); }
function etaRangeLabel(order){
  const e = orderEta(order);
  if(e.kind === 'none') return '';
  if(e.kind === 'delivered') return e.from;
  return e.from === e.to ? e.from : (e.from + ' \u2013 ' + e.to);
}
/* Estimate for a basket that has not been ordered yet. */
function cartEta(){
  const w = deliveryWindow();
  const now = Date.now();
  const from = shortDay(addDaysTs(now, w.min));
  const to   = shortDay(addDaysTs(now, w.max));
  return { from: from, to: to, min: w.min, max: w.max,
           label: from === to ? from : (from + ' \u2013 ' + to) };
}

function cartCount(){ return DB.cart.reduce((s,i)=>s+i.qty,0); }
function cartTotal(){
  return DB.cart.reduce((s,i)=>{
    const p = getProduct(i.productId);
    return s + (p ? p.price*i.qty : 0);
  },0);
}
function mrpTotal(){
  return DB.cart.reduce((s,i)=>{
    const p = getProduct(i.productId);
    return s + (p ? p.mrp*i.qty : 0);
  },0);
}

// ============================================================
// SHIPPING + COUPONS
// ============================================================
function freeShipThreshold(){ return (DB.settings && DB.settings.freeShipThreshold) || 499; }
function shippingFeeSetting(){ return (DB.settings && DB.settings.shippingFee) || 40; }
function deliveryFee(subtotal){
  if(!DB.settings || DB.settings.freeShipThreshold === undefined) return subtotal >= 499 ? 0 : 40;
  return subtotal >= freeShipThreshold() ? 0 : shippingFeeSetting();
}

/* Currently applied coupon code (session only — not persisted) */
let appliedCouponCode = null;

function findCoupon(code){
  const c = (DB.coupons||[]).find(x=> x.code.toUpperCase() === String(code||'').trim().toUpperCase());
  return (c && c.active) ? c : null;
}
/* Returns {ok, amount, reason} for a coupon against a subtotal */
function couponValue(coupon, subtotal){
  if(!coupon) return { ok:false, amount:0, reason:'Invalid coupon code' };
  if(subtotal < coupon.minOrder) return { ok:false, amount:0, reason:`Minimum order ${formatMoney(coupon.minOrder)} required` };
  let amount = coupon.type === 'percent'
    ? Math.round(subtotal * coupon.value / 100)
    : coupon.value;
  if(coupon.maxDiscount) amount = Math.min(amount, coupon.maxDiscount);
  if(amount > subtotal) amount = subtotal;
  return { ok:true, amount, reason:'' };
}
/* Discount from the currently applied coupon, 0 if none/invalid */
function appliedDiscount(subtotal){
  if(!appliedCouponCode) return 0;
  const c = findCoupon(appliedCouponCode);
  const v = couponValue(c, subtotal);
  return v.ok ? v.amount : 0;
}
function appliedCoupon(){
  if(!appliedCouponCode) return null;
  const c = findCoupon(appliedCouponCode);
  return (c && couponValue(c, cartTotal()).ok) ? c : null;
}
/* Full order maths in one place so cart, checkout and order all agree */
function orderTotals(){
  const subtotal = cartTotal();
  const discount = appliedDiscount(subtotal);
  const delivery = deliveryFee(subtotal - discount);
  return { subtotal, discount, delivery, grand: subtotal - discount + delivery };
}

function productReviews(p){ return Array.isArray(p.reviews) ? p.reviews : []; }

/* Live rating once real reviews exist, otherwise the seeded rating */
function productRating(p){
  const rs = productReviews(p);
  if(!rs.length) return { avg: p.rating, count: p.ratingCount, own:false };
  const avg = rs.reduce((s,r)=> s + r.rating, 0) / rs.length;
  return { avg: Math.round(avg*10)/10, count: rs.length, own:true };
}
function starRow(rating, cls){
  let h = `<span class="star-row ${cls||''}">`;
  for(let i=1;i<=5;i++){
    const on = i <= Math.round(rating);
    h += `<span class="star ${on?'on':''}">${on?ICONS.star:ICONS.starOutline}</span>`;
  }
  return h + '</span>';
}
function ratingBreakdown(p){
  const rs = productReviews(p);
  const counts = [5,4,3,2,1].map(n=>({ n, c: rs.filter(r=>r.rating===n).length }));
  return { counts, total: rs.length || 1 };
}

/* ---- Write / edit a review for a delivered order ---- */
function reviewSheet(order, onDone){
  const p = getProduct(order.items[0].productId);
  if(!p) return;
  const existing = productReviews(p).find(r=> r.orderId === order.id);
  let stars = existing ? existing.rating : 0;

  const overlay = document.createElement('div');
  overlay.className = 'bottom-sheet-overlay';
  overlay.innerHTML = `
    <div class="bottom-sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title"><span>${existing?'Your Review':'Rate & Review'}</span><button class="icon-btn" id="rvClose">${icon('close')}</button></div>
      <div style="display:flex;gap:12px;align-items:center;margin-bottom:6px;">
        <img src="${p.img}" style="width:52px;height:52px;border-radius:11px;object-fit:cover;">
        <div style="font-size:13.5px;font-weight:700;line-height:1.4;">${p.name}</div>
      </div>
      <p style="font-size:12.5px;color:var(--ink-faint);text-align:center;margin-top:10px;">How would you rate this product?</p>
      <div class="star-pick" id="rvStars">
        ${[1,2,3,4,5].map(n=>`<button data-star="${n}" class="${n<=stars?'on':''}">${ICONS.star}</button>`).join('')}
      </div>
      <p id="rvLabel" style="font-size:12px;font-weight:700;text-align:center;color:var(--ink-soft);margin-bottom:16px;">${['Tap to rate','Poor','Not great','Okay','Good','Excellent'][stars]||'Tap to rate'}</p>
      <div class="form-group">
        <label class="form-label">Your review (optional)</label>
        <textarea class="form-input" id="rvText" rows="3" placeholder="Tell others what you liked or didn't like…" style="resize:none;height:88px;padding-top:11px;">${existing?(existing.text||''):''}</textarea>
      </div>
      <button class="btn btn-primary btn-block" id="rvSubmit" style="margin-top:6px;">${existing?'Update Review':'Submit Review'}</button>
    </div>`;
  document.body.appendChild(overlay);

  const labels = ['Tap to rate','Poor','Not great','Okay','Good','Excellent'];
  overlay.querySelectorAll('#rvStars button').forEach(b=>{
    b.addEventListener('click', ()=>{
      stars = parseInt(b.dataset.star, 10);
      overlay.querySelectorAll('#rvStars button').forEach(x=>{
        x.classList.toggle('on', parseInt(x.dataset.star,10) <= stars);
      });
      overlay.querySelector('#rvLabel').textContent = labels[stars];
    });
  });

  const close = ()=> overlay.remove();
  overlay.querySelector('#rvClose').addEventListener('click', close);
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) close(); });

  overlay.querySelector('#rvSubmit').addEventListener('click', ()=>{
    if(!stars){ showToast('Please pick a star rating', 'xCircle'); return; }
    const text = overlay.querySelector('#rvText').value.trim();

    if(!Array.isArray(p.reviews)) p.reviews = [];
    if(existing){
      existing.rating = stars;
      existing.text = text;
      existing.at = Date.now();
    } else {
      p.reviews.unshift({
        id: 'r' + Date.now(),
        orderId: order.id,
        rating: stars,
        text,
        userName: DB.user.name || 'Nexcart Customer',
        at: Date.now()
      });
    }
    order.reviewed = true;
    order.reviewRating = stars;
    persist();
    close();
    if(onDone) onDone();
    showToast('Thanks for your review!', 'checkCircle');
  });
}

function canCancelOrder(order){ return order.status === 'Placed'; }
function canReturnOrder(order){
  if(order.status !== 'Delivered' || !order.deliveredAt) return false;
  const days = daysBetween(order.deliveredAt, Date.now());
  return days <= DB.settings.returnWindowDays;
}
function returnDaysLeft(order){
  if(!order.deliveredAt) return 0;
  const used = daysBetween(order.deliveredAt, Date.now());
  return Math.max(0, DB.settings.returnWindowDays - used);
}

function shadeColor(hex, percent){
  hex = hex.replace('#','');
  if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  const num = parseInt(hex,16);
  let r = (num>>16), g = (num>>8 & 0x00FF), b = (num & 0x0000FF);
  const amt = Math.round(2.55*percent);
  r = Math.max(0,Math.min(255, r+amt));
  g = Math.max(0,Math.min(255, g+amt));
  b = Math.max(0,Math.min(255, b+amt));
  return '#' + (0x1000000 + r*0x10000 + g*0x100 + b).toString(16).slice(1);
}

/* Small dot that flies from the tapped button to the cart tab */
function flyToCart(fromEl){
  const cartNav = $('.nav-item[data-page="cart"]');
  const badge = $('#cartBadge');
  const target = cartNav || badge;
  if(!fromEl || !target) return;

  const from = fromEl.getBoundingClientRect();
  const to = target.getBoundingClientRect();

  const dot = document.createElement('div');
  dot.className = 'fly-dot';
  dot.style.left = (from.left + from.width/2 - 8) + 'px';
  dot.style.top  = (from.top  + from.height/2 - 8) + 'px';
  document.body.appendChild(dot);

  const dx = (to.left + to.width/2) - (from.left + from.width/2);
  const dy = (to.top  + to.height/2) - (from.top  + from.height/2);

  dot.animate([
    { transform:'translate(0,0) scale(1)', opacity:1 },
    { transform:`translate(${dx*0.5}px, ${dy*0.5 - 60}px) scale(1.35)`, opacity:1, offset:0.55 },
    { transform:`translate(${dx}px, ${dy}px) scale(0.35)`, opacity:0.25 }
  ], { duration: 620, easing:'cubic-bezier(.4,0,.6,1)' }).onfinish = ()=>{
    dot.remove();
    if(cartNav){
      cartNav.classList.remove('bounce');
      void cartNav.offsetWidth;   // restart the animation
      cartNav.classList.add('bounce');
      setTimeout(()=> cartNav.classList.remove('bounce'), 600);
    }
  };
}

// ---------- Sub-view (pages with back button) ----------
function pushView(title, renderFn){
  ++renderToken;
  viewStack.push({title, renderFn});
  $('#topbar').style.display = 'none';
  $('#bottomNav').style.display = 'none';
  $('#subheader').style.display = 'flex';
  $('#subheaderTitle').textContent = title;
  const main = $('#mainContent');
  main.innerHTML = '';
  renderFn(main);
  window.scrollTo(0,0);
}
function popView(){
  viewStack.pop();
  if(viewStack.length === 0){
    $('#subheader').style.display = 'none';
    $('#topbar').style.display = 'flex';
    $('#bottomNav').style.display = 'flex';
    renderTab(currentTab);
  } else {
    const top = viewStack[viewStack.length-1];
    $('#subheaderTitle').textContent = top.title;
    const main = $('#mainContent');
    main.innerHTML = '';
    top.renderFn(main);
  }
  window.scrollTo(0,0);
}

/* ---- Horizontal product rails ---- */
function railProducts(kind){
  const ps = DB.products;
  if(kind === 'new')   return ps.slice().reverse().slice(0,8);

  if(kind === 'deal')  return ps.map(p=>({p, off: Math.round((1-p.price/p.mrp)*100)}))

  return ps.slice(0,8);
}

/* ---- Banner carousel ---- */
let bannerTimer = null;
function initBannerCarousel(banners){
  const car = $('#bannerCarousel');
  if(!car || !banners.length) return;
  const dots = $$('#bannerDots i');
  const slides = $$('.banner-slide', car);

  /* Measure the slides themselves. The carousel has side padding and a gap,
     so scrollLeft / clientWidth drifted about 20px per slide and the dots
     lost track after the first one. */
  const baseOffset = ()=> slides.length ? slides[0].offsetLeft : 0;
  const nearestIndex = ()=>{
    let best = 0, bd = Infinity;
    slides.forEach((s,i)=>{
      const d = Math.abs((s.offsetLeft - baseOffset()) - car.scrollLeft);
      if(d < bd){ bd = d; best = i; }
    });
    return best;
  };

  const syncDots = ()=>{
    const idx = nearestIndex();
    dots.forEach((d,i)=> d.classList.toggle('on', i===idx));
  };
  car.addEventListener('scroll', ()=>{ window.clearTimeout(car._t); car._t = window.setTimeout(syncDots, 60); }, {passive:true});

  $$('.banner-slide', car).forEach(el=>{
    el.addEventListener('click', ()=>{
      const bn = banners.find(b=>b.id === el.dataset.banner);
      if(!bn) return;
      if(bn.linkCategory) openCategoryProducts(bn.linkCategory);
      else switchTab('categories');
    });
  });

  // Autoplay
  if(bannerTimer) window.clearInterval(bannerTimer);
  if(banners.length > 1){
    bannerTimer = window.setInterval(()=>{
      if(!document.body.contains(car)){ window.clearInterval(bannerTimer); bannerTimer = null; return; }
      const next = (nearestIndex() + 1) % slides.length;
      car.scrollTo({ left: slides[next].offsetLeft - baseOffset(), behavior:'smooth' });
    }, 4200);
  }
}

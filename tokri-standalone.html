    chosenEmoji = '';
    overlay.querySelectorAll('#catEmojiGrid [data-emoji]').forEach(x=> x.classList.remove('selected'));
  });
  overlay.querySelectorAll('#catIconGrid [data-icon]').forEach(b=>{
    b.addEventListener('click', ()=>{
      chosenIcon = b.dataset.icon;
      overlay.querySelectorAll('#catIconGrid [data-icon]').forEach(x=> x.classList.remove('selected'));
      b.classList.add('selected');
    });
  });

  overlay.querySelector('#catClose').addEventListener('click', ()=> overlay.remove());
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) overlay.remove(); });

  /* --- sub-category editor --- */
  const subList = overlay.querySelector('#subEditList');
  const subImgInput = overlay.querySelector('#subImgInput');
  let subImgRow = -1;

  function paintSubs(){
    if(!subsState.length){
      subList.innerHTML = '<p class="admin-hint" style="margin:0 0 8px;">None yet. Tap "Add sub-category" to make your own, e.g. Shirts or Trousers.</p>';
      return;
    }
    /* the groups already used here, offered back as suggestions */
    const groupNames = [...new Set(subsState.map(x=> String(x.group || '').trim()).filter(Boolean))];
    subList.innerHTML = `<datalist id="subGroupList">${groupNames.map(g=>`<option value="${g.replace(/"/g,'&quot;')}"></option>`).join('')}</datalist>` +
      subsState.map((s,i)=>`
      <div class="sub-edit-row">
        <div class="sub-edit-thumb" data-pick="${i}">${s.img ? `<img src="${s.img}" alt="">` : '<span>+</span>'}</div>
        <div class="sub-edit-fields">
          <input class="form-input" data-name="${i}" value="${String(s.name).replace(/"/g,'&quot;')}" placeholder="e.g. T-Shirts">
          <input class="form-input" data-group="${i}" list="subGroupList" value="${String(s.group || '').replace(/"/g,'&quot;')}" placeholder="Group (optional) e.g. Casual Wear">
        </div>
        <button class="sub-edit-del" data-del="${i}" title="Remove">&times;</button>
      </div>`).join('');
    subList.querySelectorAll('.sub-edit-thumb').forEach(el=> el.addEventListener('click', ()=>{
      subImgRow = Number(el.dataset.pick);
      subImgInput.click();
    }));
    subList.querySelectorAll('input[data-name]').forEach(el=> el.addEventListener('input', ()=>{
      subsState[Number(el.dataset.name)].name = el.value;
    }));
    subList.querySelectorAll('input[data-group]').forEach(el=> el.addEventListener('input', ()=>{
      subsState[Number(el.dataset.group)].group = el.value;
    }));
    subList.querySelectorAll('.sub-edit-del').forEach(el=> el.addEventListener('click', ()=>{
      subsState.splice(Number(el.dataset.del), 1);
      paintSubs();
    }));
  }
  paintSubs();

  overlay.querySelector('#subAddBtn').addEventListener('click', ()=>{
    subsState.push({ name:'', img:'', group:'' });
    paintSubs();
    const rows = subList.querySelectorAll('input[data-name]');
    if(rows.length) rows[rows.length-1].focus();
  });

  subImgInput.addEventListener('change', (e)=>{
    const f = e.target.files[0];
    if(!f || subImgRow < 0) return;
    if(!/^image\//.test(f.type)){ showToast('Please choose a picture file', 'xCircle'); return; }
    const row = subImgRow;
    ncShrinkImage(f, 800, 110).then((res)=>{
      if(subsState[row]) subsState[row].img = res.dataUrl;
      paintSubs();
      ncPictureReady('Sub-category picture', res);
    }).catch(ncPictureFailed);
    e.target.value = '';
  });

  overlay.querySelector('#catSave').addEventListener('click', ()=>{
    const name = overlay.querySelector('#catName').value.trim();
    if(!name){ showToast('Enter a category name'); return; }
    const dup = DB.categories.find(x=> x.name.toLowerCase()===name.toLowerCase() && (!editing || x.id!==cid));
    if(dup){ showToast('That category already exists', 'xCircle'); return; }
    const data = { name, emoji: chosenEmoji, icon: chosenIcon, img: chosenImg,
      subs: subsState.filter(s=> String(s.name || '').trim())
                     .map(s=>({ name: String(s.name).trim(), img: s.img || '',
                                group: String(s.group || '').trim() })) };
    if(editing) Object.assign(c, data);
    else DB.categories.push(Object.assign({ id:'c'+Date.now() }, data));
    if(!persistOrStop()) return;      // storage full: the toast already said so
    overlay.remove();
    onSaved && onSaved();
    showToast(editing?'Category updated':'Category added', 'checkCircle');
  });
}

// Phone numbers are stored in mixed formats across the app
// ("+91 98765 43210", "+919876543210", "9876543210"), so key customers on the
// last 10 digits — otherwise one person becomes several customer records.
function normalizePhone(p){
  const d = String(p||'').replace(/\D/g,'');
  return d.length > 10 ? d.slice(-10) : d;
}
function buildCustomerIndex(){
  const map = new Map();
  DB.orders.forEach(o=>{
    const key = normalizePhone(o.customerPhone) || (o.customerName||'Guest').toLowerCase();
    if(!map.has(key)) map.set(key, { key, name:o.customerName||'Guest', phone:'', orders:[], spend:0, last:0 });
    const c = map.get(key);
    c.orders.push(o);
    if(o.status!=='Cancelled') c.spend += o.total;
    c.last = Math.max(c.last, o.placedAt||0);
    if(o.customerName) c.name = o.customerName;
    // Keep the most readable variant of the number (e.g. "+91 98765 43210").
    if(o.customerPhone && o.customerPhone.length > (c.phone||'').length) c.phone = o.customerPhone;
  });
  return [...map.values()].sort((a,b)=> b.last - a.last);
}
function customerInitials(name){
  const parts = String(name||'G').trim().split(/\s+/);
  return ((parts[0][0]||'G') + (parts[1] ? parts[1][0] : '')).toUpperCase();
}
function renderAdminCustomers(shell){

      <div class="admin-stat-card">${icon('package')}<div class="admin-stat-value">${DB.orders.length}</div><div class="admin-stat-label">Orders Placed</div></div>
    </div>
    <div class="section"><span class="section-title">All Customers</span></div>

function renderAdminOrders(shell){
  const body = `
    <div class="section"><span class="section-title">All Orders (${DB.orders.length})</span></div>
    <div id="adminOrdersList" style="margin-top:4px;padding-bottom:80px;"></div>
  `;

  if(DB.orders.length===0){
    list.innerHTML = `<div class="empty-state">${icon('package')}<h3>No orders yet</h3><p>Orders placed by customers will appear here.</p></div>`;
    return;
  }

  list.innerHTML = DB.orders.map(o=>{
    const lastUpdate = o.timeline && o.timeline.length ? o.timeline[o.timeline.length-1] : null;
    const custLine = [o.customerName, o.customerPhone].filter(Boolean).join(' · ') || 'Customer details not recorded';
    return `
    <div style="background:var(--surface);border-radius:var(--radius-md);margin:0 14px 12px;padding:14px;box-shadow:var(--shadow-2);">
      <!-- Row 1: Order ID + status badge -->
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
        <span style="font-size:14px;font-weight:800;color:var(--brand);">#${o.id}</span>
        <span class="order-status-badge ${statusClass(o.status)}">${o.status}</span>
      </div>
      <!-- Row 2: Customer -->
      <div style="font-size:13px;font-weight:600;color:var(--ink);margin-bottom:2px;">${custLine}</div>
      <!-- Row 3: Address -->
      <div style="font-size:12px;color:var(--ink-soft);margin-bottom:4px;">${(o.address||o.currentCity||'').replace(/\n/g,' · ')}</div>
      <!-- Row 4: Items text only -->
      <div style="font-size:12px;color:var(--ink-soft);margin-bottom:4px;">${o.items.map(i=>{ const p=getProduct(i.productId); return p?`${p.name} ×${i.qty}`:''; }).join(' · ')}</div>
      <!-- Row 5: Total + date -->
      <div style="font-size:13px;font-weight:700;color:var(--ink);margin-bottom:8px;">${formatMoney(o.total)} · COD · ${new Date(o.placedAt).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}</div>

      ${o.returnType ? `<div style="display:flex;align-items:flex-start;gap:7px;font-size:12px;color:var(--danger);background:var(--danger-bg);border-radius:8px;padding:7px 10px;margin-bottom:8px;">${icon('refresh','xs-ic')}<span><b>${o.returnType}:</b> ${o.returnReason||''}</span></div>` : ''}
      ${o.refundDetails ? `<div style="display:flex;align-items:flex-start;gap:7px;font-size:12px;color:var(--success);background:var(--success-bg);border-radius:8px;padding:7px 10px;margin-bottom:8px;">${icon('wallet','xs-ic')}<span><b>Refund (${o.refundDetails.method}):</b> ${o.refundDetails.method==='UPI'?o.refundDetails.upiId:`${o.refundDetails.accountName} · ${o.refundDetails.accountNo} · ${o.refundDetails.ifsc}`}</span></div>` : ''}

      <!-- Controls: status + city + tracking + push -->
      <div style="display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:10px;margin-top:4px;">
        <div style="display:flex;gap:8px;">
          <select class="form-select ao-status" data-oid="${o.id}" style="flex:1;padding:9px 10px;font-size:13px;">
            ${ALL_STATUSES.map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}
          </select>
          <input class="form-input ao-city" data-oid="${o.id}" placeholder="City, State" value="${o.currentCity||''}" style="flex:1;padding:9px 10px;font-size:12.5px;">
        </div>
        <div style="display:flex;gap:8px;">
          <input class="form-input ao-tid" data-oid="${o.id}" placeholder="Tracking ID" value="${o.trackingId||''}" style="flex:1;padding:9px 10px;font-size:12.5px;">
          <input class="form-input ao-courier" data-oid="${o.id}" placeholder="Courier name" value="${o.trackingDetail||''}" style="flex:1;padding:9px 10px;font-size:12.5px;">
        </div>
        <button class="btn btn-primary btn-block ao-push" data-oid="${o.id}" style="padding:11px;">Push Update</button>
        ${lastUpdate ? `<div style="font-size:11px;color:var(--ink-faint);text-align:center;">Last: ${lastUpdate.stage} — ${lastUpdate.city} · ${new Date(lastUpdate.at).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</div>` : ''}
      </div>
    </div>`;
  }).join('');

  // Single "Push Update" handler — updates status + city + tracking + timeline all at once
  $$('.ao-push', list).forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const oid = btn.dataset.oid;
      const order = DB.orders.find(o=>o.id===oid);
      const newStatus = list.querySelector(`.ao-status[data-oid="${oid}"]`).value;
      const newCity   = list.querySelector(`.ao-city[data-oid="${oid}"]`).value.trim() || order.currentCity;
      const newTid    = list.querySelector(`.ao-tid[data-oid="${oid}"]`).value.trim();
      const newCourier= list.querySelector(`.ao-courier[data-oid="${oid}"]`).value.trim();

      order.status = newStatus;
      order.currentCity = newCity;
      if(newTid) order.trackingId = newTid;
      if(newCourier) order.trackingDetail = newCourier;
      if(newStatus==='Delivered') order.deliveredAt = order.deliveredAt || Date.now();
      order.timeline.push({ stage: newStatus, at: Date.now(), city: newCity });
      persist();
      showToast(`#${oid} updated → ${newStatus}`, 'checkCircle');
      // Refresh the last-update line
      renderAdminOrders(shell);
    });
  });
}

  $$('[data-ctoggle]').forEach(b=> b.addEventListener('click', ()=>{
    const c = DB.coupons.find(x=>x.id===b.dataset.ctoggle);
    c.active = !c.active; persist(); renderAdminOffers(shell);
  }));
  $$('[data-cdel]').forEach(b=> b.addEventListener('click', ()=>{
    const c = DB.coupons.find(x=>x.id===b.dataset.cdel);
    confirmAction('Delete coupon?', `Code ${c.code} will stop working.`, ()=>{
      DB.coupons = DB.coupons.filter(x=>x.id!==b.dataset.cdel);
      persist(); renderAdminOffers(shell); showToast('Coupon deleted', 'checkCircle');
    });
  }));
}

          <div id="bfDrop" style="border-radius:12px;background:var(--bg);box-shadow:var(--shadow-inset);padding:16px;text-align:center;color:var(--ink-faint);font-size:12.5px;cursor:pointer;">

            <div style="margin-top:6px;">Tap to choose a photo</div>
          </div>
          <button class="text-btn" id="bfClearImg" style="display:none;margin-top:6px;color:var(--danger);">Remove photo</button>
        </div>
        <div class="form-group"><label class="form-label">Background colour (if no photo)</label>
          <div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:4px;">
            ${BANNER_PRESETS.map((g,i)=>`<button type="button" class="bf-preset" data-bg="${g}" style="width:44px;height:34px;border-radius:9px;background:${g};${(b&&b.bg===g)||(!b&&i===0)?'box-shadow:0 0 0 2.5px var(--ink);':''}"></button>`).join('')}
          </div>
        </div>
      </div>
      <button class="btn btn-primary btn-block" id="bfSave" style="margin-top:10px;">${b?'Save Changes':'Add Banner'}</button>
    </div>`;
  document.body.appendChild(overlay);

  let chosenBg = b ? (b.bg || BANNER_PRESETS[0]) : BANNER_PRESETS[0];
  let chosenImg = b ? (b.img || '') : '';

  const drop = overlay.querySelector('#bfDrop');
  const file = overlay.querySelector('#bfFile');
  const clearBtn = overlay.querySelector('#bfClearImg');
  if(chosenImg){ drop.innerHTML = `<img src="${chosenImg}" style="max-height:110px;border-radius:9px;margin:0 auto;">`; clearBtn.style.display='block'; }

  drop.addEventListener('click', ()=> file.click());
  file.addEventListener('change', (e)=>{
    const f = e.target.files[0]; if(!f) return;
    if(!/^image\//.test(f.type)){ showToast('Please choose a picture file', 'xCircle'); return; }
    /* Banners are wide, so they keep more pixels than a product photo. */
    ncShrinkImage(f, 1400, 170).then((res)=>{
      chosenImg = res.dataUrl;
      drop.innerHTML = `<img src="${chosenImg}" style="max-height:110px;border-radius:9px;margin:0 auto;">`;
      clearBtn.style.display='block';
      ncPictureReady('Banner picture', res);
    }).catch(ncPictureFailed);
    e.target.value = '';
  });
  clearBtn.addEventListener('click', ()=>{
    chosenImg = '';
    drop.innerHTML = `${icon('image')}<div style="margin-top:6px;">Tap to choose a photo</div>`;
    clearBtn.style.display='none';
  });
  overlay.querySelectorAll('.bf-preset').forEach(p=>{
    p.addEventListener('click', ()=>{
      chosenBg = p.dataset.bg;
      overlay.querySelectorAll('.bf-preset').forEach(x=> x.style.boxShadow='none');
      p.style.boxShadow = '0 0 0 2.5px var(--ink)';
    });
  });

  const close = ()=> overlay.remove();
  overlay.querySelector('#bfClose').addEventListener('click', close);
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });

  overlay.querySelector('#bfSave').addEventListener('click', ()=>{
    const title = overlay.querySelector('#bfTitle').value.trim();
    if(!title){ showToast('Enter a banner title'); return; }
    const data = {
      badge: overlay.querySelector('#bfBadge').value.trim(),
      title,
      sub:   overlay.querySelector('#bfSub').value.trim(),
      cta:   overlay.querySelector('#bfCta').value.trim() || 'Shop Now',
      brand: overlay.querySelector('#bfBrand').value.trim(),
      brandSub: overlay.querySelector('#bfBrandSub').value.trim(),
      ad:    overlay.querySelector('#bfAd').checked,
      bg:    chosenBg,
      img:   chosenImg
    };
    if(b) Object.assign(b, data);
    else DB.banners.push(Object.assign({ id:'b'+Date.now(), active:true }, data));
    if(!persistOrStop()) return;      // storage full: the toast already said so
    close();
    onSaved && onSaved();
    showToast(b?'Banner updated':'Banner added', 'checkCircle');
  });
}

/* ---- Coupon add / edit ---- */
function couponForm(cid, onSaved){
  const c = cid ? DB.coupons.find(x=>x.id===cid) : null;
  const overlay = document.createElement('div');
  overlay.className = 'bottom-sheet-overlay';
  overlay.innerHTML = `
    <div class="bottom-sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title"><span>${c?'Edit Coupon':'Add Coupon'}</span><button class="icon-btn" id="cfClose">${icon('close')}</button></div>
      <div style="max-height:60vh;overflow-y:auto;">
        <div class="form-group"><label class="form-label">Coupon code</label>
          <input class="form-input" id="cfCode" placeholder="e.g. SAVE10" style="text-transform:uppercase;" value="${c?c.code:''}"></div>
        <div class="form-group"><label class="form-label">Discount type</label>
          <div style="display:flex;gap:8px;">
            <button type="button" class="size-chip cf-type ${(c?c.type:'percent')==='percent'?'selected':''}" data-type="percent">Percentage %</button>
            <button type="button" class="size-chip cf-type ${(c&&c.type==='flat')?'selected':''}" data-type="flat">Flat ₹</button>
          </div>
        </div>
        <div style="display:flex;gap:10px;">
          <div class="form-group" style="flex:1;"><label class="form-label">Value</label>
            <input class="form-input" id="cfValue" inputmode="numeric" placeholder="10" value="${c?c.value:''}"></div>
          <div class="form-group" style="flex:1;"><label class="form-label">Min order ₹</label>
            <input class="form-input" id="cfMin" inputmode="numeric" placeholder="499" value="${c?c.minOrder:''}"></div>
        </div>
        <div class="form-group"><label class="form-label">Max discount ₹ (for % coupons)</label>
          <input class="form-input" id="cfMax" inputmode="numeric" placeholder="200" value="${c?(c.maxDiscount||''):''}"></div>
        <div class="form-group"><label class="form-label">Description shown to customers</label>
          <input class="form-input" id="cfDesc" placeholder="e.g. 10% off on orders above ₹499" value="${c?(c.desc||''):''}"></div>
      </div>
      <button class="btn btn-primary btn-block" id="cfSave" style="margin-top:10px;">${c?'Save Changes':'Add Coupon'}</button>
    </div>`;
  document.body.appendChild(overlay);

  let chosenType = c ? c.type : 'percent';
  overlay.querySelectorAll('.cf-type').forEach(b=>{
    b.addEventListener('click', ()=>{
      chosenType = b.dataset.type;
      overlay.querySelectorAll('.cf-type').forEach(x=>x.classList.remove('selected'));
      b.classList.add('selected');
    });
  });

  const close = ()=> overlay.remove();
  overlay.querySelector('#cfClose').addEventListener('click', close);
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });

  overlay.querySelector('#cfSave').addEventListener('click', ()=>{
    const code = overlay.querySelector('#cfCode').value.trim().toUpperCase();
    const value = parseInt(overlay.querySelector('#cfValue').value, 10);
    const minOrder = parseInt(overlay.querySelector('#cfMin').value, 10) || 0;
    const maxDiscount = parseInt(overlay.querySelector('#cfMax').value, 10) || (chosenType==='flat'?value:0);
    const desc = overlay.querySelector('#cfDesc').value.trim();

    if(!code){ showToast('Enter a coupon code'); return; }
    if(!/^[A-Z0-9]{3,15}$/.test(code)){ showToast('Code: 3-15 letters/numbers only'); return; }
    if(!value || value <= 0){ showToast('Enter a discount value'); return; }
    if(chosenType === 'percent' && value > 90){ showToast('Percentage cannot exceed 90%'); return; }
    const dup = DB.coupons.find(x=> x.code === code && (!c || x.id !== c.id));
    if(dup){ showToast('That code already exists', 'xCircle'); return; }

    const data = { code, type:chosenType, value, minOrder, maxDiscount,
                   desc: desc || (chosenType==='percent'
                     ? `${value}% off on orders above ₹${minOrder}`
                     : `₹${value} off on orders above ₹${minOrder}`) };
    if(c) Object.assign(c, data);
    else DB.coupons.push(Object.assign({ id:'cp'+Date.now(), active:true }, data));
    persist(); close(); onSaved && onSaved();
    showToast(c?'Coupon updated':'Coupon added', 'checkCircle');
  });
}

function renderAdminBranding(shell){
   const b = DB.branding;
   const sp = b.splash || { type: 'default', url: '', dataUrl: '', seconds: 4 };
   const colors = ['#FF3F6C','#FF905A','#03A685','#3B5BDB','#7B4DFF','#282C3F'];
   const body = `
    <div class="admin-section">
      <div class="logo-preview-box">
        <img class="logo-preview-img" id="brLogoPreview" src="${b.logoDataUrl || ''}" style="${b.logoDataUrl?'':'display:none;'}">
        <div id="brLogoFallback" class="brand-logo-fallback" style="width:56px;height:56px;font-size:22px;border-radius:14px;${b.logoDataUrl?'display:none;':''}">${b.appName.charAt(0)}</div>
        <div style="flex:1;">
          <button class="btn btn-secondary btn-sm" id="brChangeLogoBtn">${icon('upload')} Choose file</button>
          <input type="file" id="brLogoInput" accept="image/*" style="display:none;">
        </div>
      </div>
      <div class="form-group"><label class="form-label">App Name</label><input class="form-input" id="brAppName" value="${b.appName}"></div>
      <div class="form-group"><label class="form-label">Tagline (shown on splash screen)</label><input class="form-input" id="brTagline" value="${b.tagline}"></div>
      <div class="form-group">
        <label class="form-label">Brand Color</label>
        <div class="color-swatch-row" id="brColorRow">
          ${colors.map(c=>`<div class="color-swatch ${c.toLowerCase()===b.primaryColor.toLowerCase()?'selected':''}" style="background:${c};" data-color="${c}"></div>`).join('')}
        </div>
      </div>

      <!-- Opening screen: photo / video splash -->
      <div class="admin-section" style="margin-top:16px;">
        <div class="form-group">
          <label class="form-label">Opening screen (splash)</label>
          <select class="form-input" id="spType">
            <option value="default" ${sp.type==='default'?'selected':''}>Logo (default)</option>
            <option value="image" ${sp.type==='image'?'selected':''}>Photo</option>
            <option value="video" ${sp.type==='video'?'selected':''}>Video</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Photo or video link</label>
          <input class="form-input" id="spUrl" placeholder="https://... (mp4 for video)" value="${sp.url||''}">
          <p class="form-hint">For a video this is the way to do it &mdash; a video file from the phone is too large to store inside the app.</p>
        </div>
        <div class="form-group">
          <label class="form-label">...or choose a file from this phone</label>
          <input type="file" id="spFile" class="form-input" accept="image/*,video/*">
        </div>
        <div class="form-group">
          <label class="form-label">Show it for <b id="spSecsLbl">${sp.seconds||4}</b> seconds</label>
          <input type="range" id="spSecs" min="1" max="10" step="1" value="${sp.seconds||4}">
        </div>
        <p class="admin-hint">A link keeps the app small (a long video file can slow it down). This splash is saved on this phone — to show it to every customer, tell us and we will put it inside the app.</p>
      </div>

      <button class="btn btn-primary btn-block" id="brSaveBtn">Save Branding</button>
    </div>
    <div class="policy-note" style="margin:0 16px;">${icon('info')}<span>Changes apply instantly across splash screen, header logo, and buttons.</span></div>
  `;
  shell.innerHTML = adminShellHTML('branding','Branding', body, false);
  bindAdminNav();

  let newLogo = b.logoDataUrl;
  let newColor = b.primaryColor;
  let newSplashData = sp.dataUrl || '';

  const fileInput = $('#brLogoInput');
  $('#brChangeLogoBtn').addEventListener('click', ()=> fileInput.click());
  fileInput.addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    if(!/^image\//.test(file.type)){ showToast('Please choose a picture file', 'xCircle'); return; }
    /* A logo is small on screen and often transparent, so it stays PNG and
       is capped tight - see ncShrinkImage's PNG branch. */
    const asPng = /png|svg|webp|gif/i.test(file.type);
    ncShrinkImage(file, 512, 70, asPng).then((res)=>{
      newLogo = res.dataUrl;
      $('#brLogoPreview').src = newLogo;
      $('#brLogoPreview').style.display = 'block';
      $('#brLogoFallback').style.display = 'none';
      ncPictureReady('Logo', res);
    }).catch(ncPictureFailed);
    e.target.value = '';
  });
  $$('.color-swatch', $('#brColorRow')).forEach(sw=>{
    sw.addEventListener('click', ()=>{
      newColor = sw.dataset.color;
      $$('.color-swatch', $('#brColorRow')).forEach(s=>s.classList.remove('selected'));
      sw.classList.add('selected');
    });
  });
  // --- opening screen (splash) controls ---
  const spFile = $('#spFile');
  if(spFile) spFile.addEventListener('change', (e)=>{
    const f = e.target.files[0];
    if(!f) return;
    if(/^video\//.test(f.type)){
      /* A video cannot be shrunk in the browser, and a single clip would eat
         the whole storage budget - so a link is the only workable route for
         video. Anything small enough to store is still accepted. */
      if(f.size > 1.5 * 1024 * 1024){
        showToast('A video file this big (' + (Math.round(f.size / 1024 / 1024 * 10) / 10) +
                  ' MB) is too large to store in the app. Paste a link to the video in the box above instead.', 'xCircle', 8000);
        e.target.value = '';
        return;
      }
      const rv = new FileReader();
      rv.onload = (ev)=>{ newSplashData = ev.target.result;
        showToast('Splash video ready - now tap Save', 'checkCircle'); };
      rv.readAsDataURL(f);
      e.target.value = '';
      return;
    }
    if(!/^image\//.test(f.type)){ showToast('Please choose a picture or video file', 'xCircle'); return; }
    ncShrinkImage(f, 1400, 220).then((res)=>{
      newSplashData = res.dataUrl;
      ncPictureReady('Opening screen picture', res);
    }).catch(ncPictureFailed);
    e.target.value = '';
  });
  const spSecs = $('#spSecs');
  if(spSecs) spSecs.addEventListener('input', ()=>{
    const lbl = $('#spSecsLbl');
    if(lbl) lbl.textContent = spSecs.value;
  });

  $('#brSaveBtn').addEventListener('click', ()=>{
    DB.branding.appName = $('#brAppName').value.trim() || b.appName;
    DB.branding.tagline = $('#brTagline').value.trim() || b.tagline;
    DB.branding.logoDataUrl = newLogo;
    DB.branding.primaryColor = newColor;
    DB.branding.splash = {
      type: ($('#spType') && $('#spType').value) || 'default',
      url: ($('#spUrl') && $('#spUrl').value.trim()) || '',
      dataUrl: newSplashData,
      seconds: Number($('#spSecs') && $('#spSecs').value) || 4
    };
    if(!persistOrStop()) return;      // storage full: the toast already said so
    applyBranding();
    showToast('Branding updated', 'checkCircle');
  });
}

        <p class="form-hint">Got a spreadsheet? Bring the whole catalogue in one go. Pictures must be <b>links</b> (https://&hellip;), not files &mdash; the app has about 4.9 MB of storage, which is roughly 35 uploaded photos.</p>
        <button class="btn btn-primary btn-block" id="ncBulkBtn">${icon('upload')} Import products from a spreadsheet</button>
        <button class="btn btn-secondary btn-block" id="ncMergeCatsBtn" style="margin-top:10px;">${icon('grid')} Merge duplicate categories</button>
        <p class="form-hint" style="margin-top:8px;">Two categories whose names differ only in punctuation &mdash; <b>Men's Wear</b> and <b>Mens Wear</b> &mdash; should be one. This moves their products into the first one and removes the extra.</p>
      </div>
      <div class="od-section">
        <h4>Data</h4>
        <button class="btn btn-danger-outline btn-block" id="resetDataBtn">${icon('refresh')} Reset Demo Data</button>
      </div>
    </div>
  `;
  shell.innerHTML = adminShellHTML('settings','Settings', body, false);
  bindAdminNav();

  $('#savePinBtn').addEventListener('click', ()=>{
     const val = $('#newPinInput').value.trim();
     if(!/^\d{4,10}$/.test(val)){ showToast('PIN must be 4-10 digits'); return; }
     DB.settings.adminPin = val;
     persist();
     showToast('Admin PIN updated ('+val.length+' digits)', 'checkCircle');
     $('#newPinInput').value = '';
   });
  $('#onlineToggle').addEventListener('click', ()=>{
    DB.settings.onlinePaymentEnabled = !DB.settings.onlinePaymentEnabled;
    persist();
    renderAdminSettings(shell);
    showToast(DB.settings.onlinePaymentEnabled ? 'Online Payment marked ready (still hidden as Coming soon until you wire a gateway)' : 'Online Payment off');
  });
  $('#saveRulesBtn').addEventListener('click', ()=>{
    const days = Number($('#returnDaysInput').value) || 3;
    DB.settings.returnWindowDays = days;
    persist();
    showToast('Policy rules updated', 'checkCircle');
  });
  $('#saveDeliveryBtn').addEventListener('click', ()=>{
    let min = parseInt($('#delMinInput').value, 10);
    let max = parseInt($('#delMaxInput').value, 10);
    if(!min || min < 1 || min > 60){ showToast('Minimum must be 1-60 days'); return; }
    if(!max || max < 1 || max > 60){ showToast('Maximum must be 1-60 days'); return; }
    if(max < min){ showToast('Maximum cannot be less than minimum'); return; }
    DB.settings.deliveryMinDays = min;
    DB.settings.deliveryMaxDays = max;
    persist();
    renderAdminSettings(shell);
    showToast('Delivery estimate: ' + etaDaysText(min, max), 'checkCircle');
  });
  /* ---- backups: list, restore, back up now ---- */
  const paintSnaps = ()=>{
    const box = $('#snapList');
    if(!box) return;
    snapList().then(list=>{
      if(!$('#snapList')) return;                  // page moved on
      if(!list.length){
        box.innerHTML = '<p class="form-hint">No backups yet &mdash; one is saved automatically as soon as you change something.</p>';
        return;
      }
      box.innerHTML = list.map(x=>`
        <div class="snap-row">
          <div style="min-width:0;">
            <div class="snap-when">${new Date(x.at).toLocaleString('en-IN', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' })}</div>
            <div class="snap-counts">${x.np} products &middot; ${x.nc} categories</div>
          </div>
          <button class="btn btn-secondary btn-sm" data-restore="${x.at}">Restore</button>
        </div>`).join('');
      $$('[data-restore]', box).forEach(b=> b.addEventListener('click', ()=>{
        const at = Number(b.dataset.restore);
        const when = new Date(at).toLocaleString('en-IN', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
        if(!confirm('Put the shop back to how it was on ' + when + '?\n\nThe products and categories you have now will be replaced by that copy.')) return;
        b.disabled = true; b.textContent = 'Restoring\u2026';
        snapRestore(at).then(ok=>{
          if(ok){
            showToast('Shop restored from backup', 'checkCircle');
            setTimeout(()=> location.reload(), 1000);
          } else {
            b.disabled = false; b.textContent = 'Restore';
            showToast('That backup could not be restored', 'xCircle');
          }
        });
      }));
    });
  };
  paintSnaps();
  const snapBtn = $('#snapNowBtn');
  if(snapBtn) snapBtn.addEventListener('click', ()=>{
    snapBtn.disabled = true;
    snapSave(DB).then(()=>{
      snapBtn.disabled = false;
      paintSnaps();
      showToast('Backup saved', 'checkCircle');
    });
  });

  $('#resetDataBtn').addEventListener('click', ()=>{
    confirmAction('Reset all demo data?', 'This restores default products, orders and branding.', ()=>{
      resetDB();
      applyBranding();
      renderAdminSettings(shell);
      showToast('Demo data reset', 'checkCircle');
    });
  });
}
</script>

<!-- ============================================================
     SERVER SYNC  —  THIS APP IS CONNECTED TO YOUR BACKEND
     Backend: https://nexcart-p9ms.onrender.com
     Products, accounts and orders all go through it, so every phone
     sees the same shop. To point somewhere else, edit the line below.
     ============================================================ -->
<script>window.NC_API_BASE = 'https://nexcart-p9ms.onrender.com';</script>
<script>
/* ============================================================
   NEXCART — server sync adapter

   HOW TO TURN IT ON  —  edit ONE line, no other file needed
   Scroll down slightly to API_BASE_DEFAULT and paste your backend
   link inside the quotes. Save it (Commit changes on GitHub) and
   the shop goes online. You can do this straight from your phone.

   While that line is empty the shop still works exactly as it does
   today — nothing breaks.

   Every network call is wrapped in try/catch: a dead server or a
   patchy connection must never break the shop.
   ============================================================ */
(function () {
  'use strict';

  /* ============================================================
     ✏️  EDIT THIS ONE LINE  —  paste your backend link here
     ============================================================
     Example:  var API_BASE_DEFAULT = 'https://nexcart-api.onrender.com';
     Leave it empty ('') and the app stays offline-only.        */

  var API_BASE_DEFAULT = '';

  /* ============================================================ */

  var BASE = '';
  try {
    BASE = (API_BASE_DEFAULT || window.NC_API_BASE || localStorage.getItem('nc_api_base') || '').replace(/\/+$/, '');
  } catch (e) { BASE = API_BASE_DEFAULT || window.NC_API_BASE || ''; }

  var KEY_STORE   = 'nc_admin_key';
  var TOKEN_STORE = 'nc_token';
  var POLL_MS   = 15000;
  var lastOrderSeen = 0;
  var lastCatalogHash = '';
  var busy = false;

  function getKey()   { try { return localStorage.getItem(KEY_STORE) || ''; } catch (e) { return ''; } }
  function setKey(k)  { try { localStorage.setItem(KEY_STORE, k); } catch (e) {} }

  /* The customer's sign-in token. Deliberately separate from the owner's
     ADMIN_KEY — one identifies a shopper, the other unlocks the shop. */
  function getToken() { try { return localStorage.getItem(TOKEN_STORE) || ''; } catch (e) { return ''; } }
  function setToken(t) {
    try { t ? localStorage.setItem(TOKEN_STORE, t) : localStorage.removeItem(TOKEN_STORE); } catch (e) {}
  }
  function applyUser(u) {
    var D = db(); if (!D || !u) return;
    if (u.name)  D.user.name  = u.name;
    if (u.phone) D.user.phone = '+91 ' + u.phone;
    D.user.email = u.email || '';
    D.user.accountId = u.id || '';
    D.user.provider = u.provider || '';
    if (typeof persist === 'function') persist();
  }
  function clearUserAccount() {
    var D = db(); if (!D) return;
    D.user.accountId = ''; D.user.provider = ''; D.user.email = '';
    if (typeof persist === 'function') persist();
  }

  function api(path, opts) {
    opts = opts || {};
    var headers = { 'Content-Type': 'application/json' };
    if (opts.admin) headers['x-admin-key'] = getKey();
    // Attach the shopper's token whenever we have one, so orders are linked
    // to their account and /api/myorders works.
    var tk = getToken();
    if (tk) headers['Authorization'] = 'Bearer ' + tk;
    return fetch(BASE + path, {
      method: opts.method || 'GET',
      headers: headers,
      body: opts.body ? JSON.stringify(opts.body) : undefined
    }).then(function (r) {
      return r.text().then(function (t) {
        var data;
        try { data = t ? JSON.parse(t) : {}; } catch (e) { data = {}; }
        if (!r.ok) { var err = new Error(data.error || ('HTTP ' + r.status)); err.status = r.status; throw err; }
        return data;
      });
    });
  }

  /* ---------- local helpers ---------- */

  function db() { return (typeof DB !== 'undefined') ? DB : null; }

  function toast(msg, iconName) {
    try { if (typeof showToast === 'function') showToast(msg, iconName || 'checkCircle'); } catch (e) {}
  }

  function refreshVisibleCatalog() {
    try {
      // Use the real grid renderer, which also honours the selected category
      // and the search box, instead of dumping every product in.
      if (typeof window.ncApplyGrid === 'function') {
        try { window.ncApplyGrid(); } catch (e) {}
      } else {
        var grid = document.getElementById('homeProductGrid');
        if (grid && typeof renderProductGrid === 'function') renderProductGrid(grid, DB.products);
      }
      var chips = document.getElementById('catChipRow');
      if (chips && typeof renderCategoryChips === 'function') renderCategoryChips(chips);
      // The category row and the "N products" label are drawn when Home first
      // renders. A catalogue that arrives from the server afterwards must
      // redraw them too, or the shop shows old categories next to new
      // products and a product count that does not match what is on screen.
      if (typeof window.ncRenderSubs === 'function') { try { window.ncRenderSubs(); } catch (e) {} }
      if (typeof window.setGridMeta === 'function') { try { window.setGridMeta(); } catch (e) {} }
    } catch (e) {}
  }

  function catalogHash() {
    try { return JSON.stringify([DB.products, DB.categories]).length + ':' +
                 (DB.products || []).map(function (p) { return p.id + p.price + p.stock; }).join(',') +
                 ':s' + [DB.settings && DB.settings.adminPin,
                         DB.settings && DB.settings.deliveryMinDays,
                         DB.settings && DB.settings.deliveryMaxDays,
                         DB.settings && DB.settings.returnWindowDays].join('|'); }
    catch (e) { return ''; }
  }

  /* ---------- 1. pull the catalogue down ---------- */

  function pullCatalog() {
    return api('/api/bootstrap').then(function (d) {
      var D = db(); if (!D) return;
      // Only adopt the server's catalogue once it actually holds something.
      // Before the owner's first push it is empty, and overwriting would wipe
      // the products they already created in the app.
      // Adopt the shop-wide admin PIN whenever the server has one, so a PIN
      // change reaches every device (this runs even when the catalogue is empty).
      if (d.settings && /^[0-9]{4,10}$/.test(String(d.settings.adminPin || ''))) {
        D.settings = D.settings || {};
        D.settings.adminPin = String(d.settings.adminPin);
      }
      /* Delivery estimate + return window are shop-wide promises, so the
         value the owner saved is what every phone should show. Only adopt
         numbers that are actually sane. */
      if (d.settings) {
        D.settings = D.settings || {};
        var numRule = function (v, lo, hi) {
          var n = parseInt(v, 10);
          return (isFinite(n) && n >= lo && n <= hi) ? n : null;
        };
        var fromServer = {
          deliveryMinDays: numRule(d.settings.deliveryMinDays, 1, 60),
          deliveryMaxDays: numRule(d.settings.deliveryMaxDays, 1, 60),
          returnWindowDays: numRule(d.settings.returnWindowDays, 1, 30)
        };
        Object.keys(fromServer).forEach(function (k) {
          if (fromServer[k] !== null) D.settings[k] = fromServer[k];
        });
        if (D.settings.deliveryMinDays && D.settings.deliveryMaxDays &&
            D.settings.deliveryMaxDays < D.settings.deliveryMinDays) {
          D.settings.deliveryMaxDays = D.settings.deliveryMinDays;
        }
        if (typeof persist === 'function') persist();
      }
      if (Array.isArray(d.products) && d.products.length) {
        /* Never let an older copy on the server wipe what this phone has.
           The owner's own edits win unless the server is genuinely newer.
           Both stamps at 0 means neither side is versioned yet (an older
           server), and then the server still wins — the previous behaviour. */
        var localStamp  = Number(D.catalogUpdatedAt) || 0;
        var serverStamp = Number(d.catalogUpdatedAt) || 0;
        var localCount  = ((D.products   || []).length + (D.categories || []).length);
        var serverCount = (d.products.length +
                           ((d.categories || []).length));
        var hasLocal    = (D.products || []).length > 0;
        /* Take the server's copy only when it cannot be a step backwards.
           Being "not smaller" is the extra safety net here: a device that
           holds less than this phone is never allowed to replace it, even if
           neither side carries a version stamp yet. Losing work is far worse
           than briefly missing someone else's change - the next sync uploads
           this phone's copy, so the server heals by itself. */
        var notSmaller   = serverCount >= localCount;
        var clearlyNewer = serverStamp > localStamp;
        var takeServer   = !hasLocal || clearlyNewer || (serverStamp >= localStamp && notSmaller);
        if (takeServer) {
          D.products   = d.products;
          D.categories = Array.isArray(d.categories) && d.categories.length ? d.categories : D.categories;
          if (serverStamp) D.catalogUpdatedAt = serverStamp;
          if (typeof persist === 'function') persist();
          refreshVisibleCatalog();
          // The server is now the source of truth — remember its state so we do
          // not immediately push the same catalogue straight back at it.
          lastCatalogHash = catalogHash();
        } else {
          // This phone is ahead of the server. Keep it, and let the next poll
          // upload it (an empty baseline forces the comparison to differ).
          lastCatalogHash = '';
        }
      } else {
        // Server is empty: the owner has never uploaded. Leave the baseline
        // unset so the very first poll uploads what they have made in the app.
        lastCatalogHash = '';
      }
    }).catch(function () { /* offline — keep local data */ });
  }

  /* ---------- 2. push the catalogue up (admin) ---------- */

  function pushCatalog(silent) {
    var D = db(); if (!D || !getKey()) return Promise.resolve();
    /* An empty shop is never uploaded over a real one. A device that has lost
       its catalogue must not be able to erase what is on the server. */
    if (!(D.products || []).length && !(D.categories || []).length) {
      if (!silent) toast('Nothing to upload - this device has no products or categories.');
      return Promise.resolve();
    }
    return api('/api/admin/push', {
      method: 'POST', admin: true,
      body: {
        products: D.products || [],
        categories: D.categories || [],
        /* When this catalogue last changed here. The server hands it back to
           every other device so an out-of-date copy can never overwrite a
           newer one — which is how the owner's pictures used to disappear. */
        catalogUpdatedAt: Number(D.catalogUpdatedAt) || 0,
        /* The admin PIN and the shop rules travel with the catalogue so one
           change applies to every device, not only the phone that made it.
           That includes the delivery estimate, so a customer always sees the
           dates the owner actually promised. */
        settings: {
          adminPin: (D.settings && D.settings.adminPin) || '',
          deliveryMinDays: D.settings && D.settings.deliveryMinDays,
          deliveryMaxDays: D.settings && D.settings.deliveryMaxDays,
          returnWindowDays: D.settings && D.settings.returnWindowDays,
          freeShipThreshold: D.settings && D.settings.freeShipThreshold,
          shippingFee: D.settings && D.settings.shippingFee
        }
      }
    }).then(function (r) {
      lastCatalogHash = catalogHash();
      if (!silent) toast('Catalogue uploaded (' + r.products + ' products)');
    }).catch(function (e) {
      if (!silent) toast('Upload failed: ' + e.message);
    });
  }

  /* ---------- 3. send an order to the server ---------- */

  function submitOrder(order) {
    var D = db(); if (!D || !order) return;
    var items = (order.items || []).filter(function (i) { return i && i.productId; })
      .map(function (i) { return { productId: i.productId, qty: i.qty }; });
    if (!items.length) return;

    api('/api/orders', {
      method: 'POST',
      body: {
        customerName:  order.customerName || (D.user && D.user.name) || '',
        customerPhone: order.customerPhone || (D.user && D.user.phone) || '',
        address:       String(order.address || '').replace(/\n/g, ', '),
        items:         items,
        delivery:      Number(order.deliveryFee) || 0,
        claimedTotal:  Number(order.total) || 0,
        couponCode:    order.couponCode || null
      }
    }).catch(function (e) {
      // Queue for retry instead of losing the order.
      try {
        var q = JSON.parse(localStorage.getItem('nc_order_queue') || '[]');
        q.push({ order: order, at: Date.now() });
        localStorage.setItem('nc_order_queue', JSON.stringify(q.slice(-50)));
      } catch (e2) {}
      toast('Order saved on this phone. It will upload when online.', 'warn');
    });
  }

  function flushQueue() {
    var q;
    try { q = JSON.parse(localStorage.getItem('nc_order_queue') || '[]'); } catch (e) { return; }
    if (!q.length) return;
    // Empty the queue first; submitOrder re-queues anything that fails, so a
    // dropped connection can never silently lose a customer's order.
    try { localStorage.setItem('nc_order_queue', '[]'); } catch (e) {}
    q.forEach(function (entry) { submitOrder(entry.order); });
  }

  /* ---------- 4. admin: poll for new orders ---------- */

  function pollOrders() {
    if (!getKey() || busy) return;
    busy = true;
    api('/api/orders?since=' + lastOrderSeen, { admin: true }).then(function (d) {
      var D = db(); if (!D) return;
      var existing = {};
      (D.orders || []).forEach(function (o) { existing[o.id] = true; });
      var fresh = (d.orders || []).filter(function (o) { return !existing[o.id]; });
      if (fresh.length) {
        D.orders = fresh.concat(D.orders || []);
        if (typeof persist === 'function') persist();
        toast(fresh.length === 1 ? 'New order received!' : fresh.length + ' new orders!', 'package');
      }
      if (d.serverTime) lastOrderSeen = d.serverTime;
      // Auto-push the catalogue whenever the local one differs from what the
      // server last received. lastCatalogHash is only advanced after a
      // successful push (inside pushCatalog), so a failed push retries.
      // Not silent: the owner should see confirmation, not wonder.
      var h = catalogHash();
      if (h !== lastCatalogHash) pushCatalog();
    }).catch(function (e) {
      if (e && e.status === 401) askForKey(true);
    }).then(function () { busy = false; });
  }

  function askForKey(isRetry) {
    if (!BASE) return;
    var msg = (isRetry ? 'Saved sync key was rejected.\n\n' : '') +
              'Enter your ADMIN_KEY to sync orders with the server:';
    var k = window.prompt(msg, getKey());
    if (k) {
      setKey(k.trim());
      lastOrderSeen = 0;
      toast('Sync key saved');
      // Upload the catalogue straight away so the owner sees it working
      // instead of waiting for the next poll tick.
      pushCatalog();
    }
  }

  /* ---------- 5. install hooks ---------- */

  function wrapPlaceOrder() {
    if (typeof window.placeOrder !== 'function' || window.placeOrder.__ncWrapped) return;
    var original = window.placeOrder;
    var wrapped = function () {
      var before = {};
      try { (db() && db().orders || []).forEach(function (o) { before[o.id] = true; }); } catch (e) {}
      var result = original.apply(this, arguments);
      try {
        ((db() && db().orders) || []).forEach(function (o) {
          if (!before[o.id]) submitOrder(o);
        });
      } catch (e) {}
      return result;
    };
    wrapped.__ncWrapped = true;
    window.placeOrder = wrapped;
  }

  var keyAsked = false;

  /* The backend key is only needed to READ orders and PUSH the catalogue —
     in other words, only inside the admin panel. Asking for it on a normal
     page load would throw a popup in front of every shopper, so we never
     do that. It is requested the moment the owner opens the admin panel. */
  /* A visible button, shown only inside the admin panel. Without it the
     upload is completely invisible — the owner cannot tell whether their
     catalogue actually reached the server. */
  function makeSyncButton() {
    if (document.getElementById('ncSyncBtn')) return;
    var b = document.createElement('button');
    b.id = 'ncSyncBtn';
    b.type = 'button';
    b.textContent = '\u21bb Sync shop online';
    b.style.cssText = 'position:fixed;right:14px;bottom:78px;z-index:650;padding:11px 16px;' +
      'border:0;border-radius:999px;font-size:12.5px;font-weight:700;color:#fff;' +
      'background:#FF3F6C;box-shadow:0 6px 18px rgba(0,0,0,.28);cursor:pointer;';
    b.addEventListener('click', function () {
      if (!getKey()) { askForKey(false); return; }
      var label = b.textContent;
      b.disabled = true;
      b.textContent = 'Syncing\u2026';
      // Call the internals directly rather than going through window.NC —
      // one less thing that has to exist for the button to work.
      Promise.resolve()
        .then(function () { return pullCatalog(); })
        .then(function () { return pushCatalog(); })
        .then(function () { b.disabled = false; b.textContent = label; })
        .catch(function (e) {
          b.disabled = false;
          b.textContent = label;
          toast('Sync failed: ' + ((e && e.message) || 'unknown'));
        });
    });
    document.body.appendChild(b);
  }
  function removeSyncButton() {
    var b = document.getElementById('ncSyncBtn');
    if (b && b.parentNode) b.parentNode.removeChild(b);
  }

  function wrapAdminOpen() {
    if (typeof window.openAdminPanel === 'function' && !window.openAdminPanel.__ncWrapped) {
      var origOpen = window.openAdminPanel;
      var wrappedOpen = function () {
        var result = origOpen.apply(this, arguments);
        // Separate try/catch: a problem with the cosmetic button must never
        // stop the admin-key prompt, which is what actually makes sync work.
        try { makeSyncButton(); } catch (e) {}
        try {
          if (!getKey() && !keyAsked) {
            keyAsked = true;
            window.setTimeout(function () { askForKey(false); }, 600);
          }
        } catch (e) {}
        return result;
      };
      wrappedOpen.__ncWrapped = true;
      window.openAdminPanel = wrappedOpen;
    }
    if (typeof window.closeAdminPanel === 'function' && !window.closeAdminPanel.__ncWrapped) {
      var origClose = window.closeAdminPanel;
      var wrappedClose = function () {
        try { removeSyncButton(); } catch (e) {}
        return origClose.apply(this, arguments);
      };
      wrappedClose.__ncWrapped = true;
      window.closeAdminPanel = wrappedClose;
    }
  }

  function startPolling() {
    window.setInterval(function () {
      if (typeof adminUnlocked === 'undefined' || !adminUnlocked) return;
      // Backup path, in case the admin panel was opened some other way.
      if (!getKey() && !keyAsked) { keyAsked = true; askForKey(false); return; }
      pollOrders();
    }, POLL_MS);
  }

  function boot() {
    if (!BASE) return;               // switched off — do nothing at all
    wrapPlaceOrder();
    wrapAdminOpen();
    pullCatalog();
    flushQueue();
    startPolling();
  }

  // Public surface, handy for debugging or a custom admin button.
  /* ---------- customer accounts ----------
     Every call stores the returned token and mirrors the account onto
     DB.user, so the app's existing "logged in" screens just work. */
  function authCall(path, body) {
    return api(path, { method: 'POST', body: body || {} }).then(function (d) {
      if (d && d.token) setToken(d.token);
      if (d && d.user)  applyUser(d.user);
      return d;
    });
  }

  window.NC = {
    base: BASE,
    sync: function () { return pullCatalog().then(function () { return pushCatalog(); }); },
    pushCatalog: pushCatalog,
    pollOrders: pollOrders,
    setKey: setKey,
    getKey: getKey,

    signedIn: function () { return !!getToken(); },
    logout: function () {
      return api('/api/auth/logout', { method: 'POST' })
        .catch(function () {})
        .then(function () { setToken(''); clearUserAccount(); });
    },
    auth: {
      signup:   function (name, phone, password) { return authCall('/api/auth/signup', { name: name, phone: phone, password: password }); },
      login:    function (phone, password)       { return authCall('/api/auth/login',  { phone: phone, password: password }); },
      google:   function (credential)            { return authCall('/api/auth/google', { credential: credential }); },
      setPhone: function (phone)                 { return authCall('/api/auth/phone',  { phone: phone }); },
      me:       function ()                      { return api('/api/auth/me'); }
    }
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { window.setTimeout(boot, 800); });
  } else {
    window.setTimeout(boot, 800);
  }
})();

</script>

<!-- NEXCART home v6 behaviour: header, tabs, voice search, wallet -->
<script id="nexcart-home-v6-js">
/* ============================================================
   NEXCART home v6 — header, tabs, voice search, wallet
   Runs after the app's own scripts. Adds behaviour only.
   ============================================================ */
(function(){

  /* ---------- line icons, matching the app's 2px stroke style ---------- */
  var S = function(inner){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" '
         + 'stroke-linecap="round" stroke-linejoin="round">' + inner + '</svg>';
  };
  var NC_ICON = {
    mic:    S('<path d="M12 2.75a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0v-6a3 3 0 0 0-3-3Z"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0"/><path d="M12 18v3"/>'),
    camera: S('<path d="M3.5 8.5h2.2l1.3-2h9l1.3 2h2.2a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H3.5a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13.5" r="3.6"/>'),
    bell:   S('<path d="M18 9a6 6 0 1 0-12 0c0 5-2 6.5-2 6.5h16S18 14 18 9Z"/><path d="M10.3 19.5a2 2 0 0 0 3.4 0"/>'),
    pin:    S('<path d="M12 21s6.5-5.7 6.5-10.5a6.5 6.5 0 1 0-13 0C5.5 15.3 12 21 12 21Z"/><circle cx="12" cy="10.5" r="2.4"/>'),
    caret:  S('<path d="M6 9.5 12 15l6-5.5"/>')
  };

  function put(id, svg){
    var el = document.getElementById(id);
    if(el) el.innerHTML = '<span class="icon">' + svg + '</span>';
  }

  /* ---------- toast ---------- */
  window.ncToast = function(msg){
    var t = document.getElementById('ncToast');
    if(!t){ t = document.createElement('div'); t.id = 'ncToast'; t.className = 'nc-toast';
            document.body.appendChild(t); }
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._tm);
    t._tm = setTimeout(function(){ t.classList.remove('show'); }, 2600);
  };

  /* ---------- wallet = cart value ---------- */
  window.ncWallet = function(){
    var el = document.getElementById('locWallet');
    if(!el) return;
    try{
      var total = ((typeof DB !== 'undefined' && DB.cart) || []).reduce(function(s,line){
        var p = (DB.products || []).filter(function(x){ return x.id === line.productId; })[0];
        return s + (p ? p.price * line.qty : 0);
      }, 0);
      el.textContent = '\u20B9' + total;
    }catch(e){ el.textContent = '\u20B90'; }
  };

  /* ---------- pincode ---------- */
  function getPin(){
    try{ return localStorage.getItem('nexcart_pin') || '530048'; }catch(e){ return '530048'; }
  }
  function paintPin(){
    var el = document.getElementById('locPin');
    if(el) el.textContent = getPin();
  }
  function openPinModal(){
    var m = document.createElement('div');
    m.className = 'nc-modal';
    m.innerHTML =
      '<div class="nc-modal-card">' +
        '<h3>Delivery pincode</h3>' +
        '<p>We use this to show delivery estimates for your area.</p>' +
        '<input id="ncPinInput" inputmode="numeric" maxlength="6" placeholder="6-digit pincode" value="' + getPin() + '">' +
        '<div class="nc-modal-actions">' +
          '<button class="nc-btn-ghost" id="ncPinCancel">Cancel</button>' +
          '<button class="nc-btn-solid" id="ncPinSave">Save</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(m);
    requestAnimationFrame(function(){ m.classList.add('show'); });
    var input = m.querySelector('#ncPinInput');
    setTimeout(function(){ input.focus(); input.select(); }, 220);

    function close(){
      m.classList.remove('show');
      setTimeout(function(){ m.remove(); }, 260);
    }
    m.querySelector('#ncPinCancel').onclick = close;
    m.onclick = function(ev){ if(ev.target === m) close(); };
    m.querySelector('#ncPinSave').onclick = function(){
      var v = (input.value || '').trim();
      if(!/^\d{6}$/.test(v)){ ncToast('Enter a 6-digit pincode'); return; }
      try{ localStorage.setItem('nexcart_pin', v); }catch(e){}
      paintPin(); close(); ncToast('Delivering to ' + v);
    };
  }

  /* ---------- grid + tabs ---------- */
  window.ncQuery = '';
  window.ncActiveCat = 'all';

  window.setGridMeta = function(){
    var el = document.getElementById('gridMeta');
    if(!el) return;
    var n = document.querySelectorAll('#homeProductGrid .product-card').length;
    el.textContent = n + (n === 1 ? ' product' : ' products');
  };

  /* ---------- brand name shown in the UI ----------
     The stored branding may be all-caps ("NEXCART"); the owner wants it
     displayed as "Nexcart", so all-caps names are converted once here. */
  window.ncBrandName = function(){
    var n = (typeof DB !== 'undefined' && DB.branding && DB.branding.appName) || 'Nexcart';
    if(n.length > 1 && n === n.toUpperCase() && /[A-Z]/.test(n)){
      n = n.charAt(0).toUpperCase() + n.slice(1).toLowerCase();
    }
    return n;
  };

  /* ---------- sub-categories, shown under the main tabs ----------
     Tapping a main tab reveals its sub-categories (like Myntra): Shirts,
     Trousers, Jeans and so on. Known category names use the list below;
     anything else is derived from that category's real product names. */
  var NC_SUBS = {
    fashion:     ['T-Shirts','Shirts','Jeans','Trousers','Track Pants','Kurtas','Dresses','Tops','Sarees','Jackets','Sweatshirts','Shorts'],
    electronics: ['Mobiles','Laptops','Headphones','Earbuds','Smart Watches','Cameras','Speakers','Power Banks','Tablets','Cables'],
    home:        ['Bedsheets','Cushions','Curtains','Cookware','Storage','Lighting','Bath','Decor','Mats'],
    beauty:      ['Lipstick','Kajal','Perfume','Face Wash','Hair Oil','Creams','Nail Polish','Serum','Sunscreen'],
    kids:        ['Kids T-Shirts','Kids Jeans','Frocks','Toys','School Bags','Baby Care','Kids Shoes','Kidswear']
  };
  var NC_STOP = ['the','and','with','for','pack','set','new','best','buy','free','size','inch','pcs','piece','combo','offer','style','premium','cotton','men','women','kids','shipping','delivery'];

  window.ncActiveSub = '';

  /* Picture for a category: its own image, else the first product photo
     in it. Used by both the sub-category row and the categories page. */
  window.ncCatImage = function(c){
    if(!c) return '';
    if(c.img) return c.img;
    var p = (DB.products || []).filter(function(x){ return x.category === c.id && x.img; })[0];
    return p ? p.img : '';
  };

  /* Sub-categories of a category, each WITH an image.
     If the owner has set their own in Admin > Categories (cat.subs) those
     win; otherwise a sensible list is used and each picture comes from the
     first product in that category whose name matches. */
  window.ncSubsFor = function(catId){
    var cat = (DB.categories || []).filter(function(c){ return c.id === catId; })[0];
    if(!cat) return [];
    var prods = (DB.products || []).filter(function(p){ return p.category === catId; });

    function imgFor(name){
      var s = String(name).toLowerCase().replace(/s$/, '');
      var hit = prods.filter(function(p){
        return p.img && String(p.name || '').toLowerCase().indexOf(s) !== -1;
      })[0];
      if(hit) return hit.img;
      var any = prods.filter(function(p){ return p.img; })[0];
      return any ? any.img : (cat.img || '');
    }

    if(Object.prototype.toString.call(cat.subs) === '[object Array]' && cat.subs.length){
      return cat.subs
        .filter(function(s){ return s && String(s.name || '').trim(); })
        .map(function(s){
          var nm = String(s.name).trim();
          return { name: nm, img: s.img || imgFor(nm) };
        });
    }

    var names = null, key = String(cat.name || '').toLowerCase();
    for(var k in NC_SUBS){ if(key.indexOf(k) !== -1){ names = NC_SUBS[k].slice(); break; } }
    if(!names){
      var seen = {};
      names = [];
      prods.forEach(function(p){
        String(p.name || '').split(/\s+/).forEach(function(w){
          w = w.replace(/[^A-Za-z]/g, '');
          var low = w.toLowerCase();
          if(w.length >= 4 && NC_STOP.indexOf(low) === -1 && !seen[low]){
            seen[low] = 1;
            names.push(w.charAt(0).toUpperCase() + low.slice(1));
          }
        });
      });
    }
    /* Only offer a tile this category can actually fill.
       The list above names twelve sub-categories, but a young shop stocks
       two or three of them, so tapping "Jeans" on a category with no jeans
       opened a page saying "No products found" - a dead end that looks
       broken. Tiles the owner created by hand (cat.subs, handled above) are
       never filtered: those were deliberate, even before stock arrives. */
    function hasProducts(n){
      var s = String(n).toLowerCase().replace(/s$/, '');
      return prods.some(function(p){
        /* a product filed under this sub-category counts even when its name
           never says the word - "Slim Fit Denim" is still a Jean */
        if(p.sub && String(p.sub).toLowerCase() === String(n).toLowerCase()) return true;
        return String(p.name || '').toLowerCase().indexOf(s) !== -1;
      });
    }
    names = names.filter(hasProducts);

    return names.slice(0, 14).map(function(n){ return { name: n, img: imgFor(n) }; });
  };

  window.ncMatchSub = function(p, sub){
    if(!sub) return true;
    var s = String(sub).toLowerCase().replace(/s$/, '');
    var hay = ((p.name || '') + ' ' + (p.cat || '') + ' ' + (p.catName || '')).toLowerCase();
    return hay.indexOf(s) !== -1;
  };

  /* The row under the tabs. Every item is a PICTURE tile with its name
     underneath. With "All" selected it lists the main categories; with a
     category selected it lists that category's sub-categories. Tapping
     either one navigates to that listing. */
  window.ncRenderSubs = function(){
    var wrap = document.getElementById('subcatWrap');
    var rail = document.getElementById('subcatRail');
    if(!wrap || !rail) return;

    var items = [];
    if(!ncActiveCat || ncActiveCat === 'all'){
      items = (DB.categories || []).map(function(c){
        return { name: c.name, img: window.ncCatImage(c), emoji: c.emoji || '',
                 catId: c.id, isCat: true };
      });
    } else {
      items = window.ncSubsFor(ncActiveCat).map(function(s){
        return { name: s.name, img: s.img, emoji: '', catId: ncActiveCat, isCat: false };
      });
    }

    ncActiveSub = '';
    if(!items.length){ wrap.classList.remove('open'); rail.innerHTML = ''; return; }

    rail.innerHTML = items.map(function(it){
      // real photo first; then the category's own emoji; then its initial.
      // Never a grey placeholder box.
      var pic;
      if(it.img)        pic = '<img src="' + it.img + '" alt="" loading="lazy">';
      else if(it.emoji) pic = '<span class="subcat-emoji">' + it.emoji + '</span>';
      else              pic = '<span class="subcat-initial">' +
                              String(it.name || '?').charAt(0).toUpperCase() + '</span>';
      var subAttr = it.isCat ? '' : ' data-sub="' + String(it.name).replace(/"/g, '&quot;') + '"';
      return '<button class="subcat" type="button" data-cat="' + it.catId + '"' + subAttr + '>' +
               '<span class="subcat-img">' + pic + '</span>' +
               '<span class="subcat-name">' + it.name + '</span>' +
             '</button>';
    }).join('');

    Array.prototype.forEach.call(rail.querySelectorAll('.subcat'), function(b){
      b.onclick = function(){
        var catId = b.getAttribute('data-cat');
        var sub   = b.getAttribute('data-sub');
        if(sub && sub.length){ openSubCategoryProducts(catId, sub); }
        else if(catId){ openCategoryProducts(catId); }
      };
    });
    wrap.classList.add('open');
  };

  window.ncApplyGrid = function(){
    var grid = document.getElementById('homeProductGrid');
    if(!grid) return;
    var ps = (DB.products || []).slice();
    if(ncActiveCat !== 'all') ps = ps.filter(function(p){ return p.category === ncActiveCat; });
    if(ncActiveSub) ps = ps.filter(function(p){ return ncMatchSub(p, ncActiveSub); });
    if(ncQuery) ps = ps.filter(function(p){ return (p.name || '').toLowerCase().indexOf(ncQuery) >= 0; });
    renderProductGrid(grid, ps, true);
    staggerCards();
    setGridMeta();
  };

  window.ncInitTabs = function(){
    var box = document.getElementById('mtabs');
    if(!box) return;
    var ink = document.getElementById('mtabsInk');
    var scroller = document.getElementById('mtabsScroll');

    function move(anim){
      var act = box.querySelector('.mtab.active');
      if(!act || !ink) return;
      if(!act.offsetWidth) return;           // still hidden behind the splash
      if(anim === false) ink.style.transition = 'none';
      ink.style.width = act.offsetWidth + 'px';
      ink.style.transform = 'translateX(' + act.offsetLeft + 'px)';
      if(anim === false) requestAnimationFrame(function(){ ink.style.transition = ''; });
    }

    Array.prototype.forEach.call(box.querySelectorAll('.mtab'), function(t){
      t.onclick = function(){
        Array.prototype.forEach.call(box.querySelectorAll('.mtab'), function(x){
          x.classList.remove('active');
        });
        t.classList.add('active');
        ncActiveCat = t.dataset.cat || 'all';
        ncRenderSubs();
        move(true);
        // keep the selected tab in view
        if(scroller && t.offsetLeft < scroller.scrollLeft + 16){
          scroller.scrollTo({ left: Math.max(0, t.offsetLeft - 16), behavior: 'smooth' });
        }
        ncApplyGrid();
      };
    });

    // With "All" selected the row shows every main category as a picture,
    // so it is filled in straight away as well as on every tab tap.
    ncRenderSubs();
    move(false);
    // The app renders behind a splash/skeleton, so offsetWidth can still be 0
    // when this first runs. Re-measure a few times and after fonts settle.
    [60, 300, 900, 1800, 3000].forEach(function(t){
      setTimeout(function(){ move(false); }, t);
    });
    if(document.fonts && document.fonts.ready){
      document.fonts.ready.then(function(){ move(true); });
    }
    window.addEventListener('load', function(){ move(true); });
    window.addEventListener('resize', function(){ move(false); });
  };

  /* ---------- header wiring ---------- */
  function initHeader(){
    put('micBtn',  NC_ICON.mic);
    put('camBtn',  NC_ICON.camera);

    // --- voice search (real, via the Web Speech API) ---
    var mic = document.getElementById('micBtn');
    if(mic) mic.onclick = function(){
      var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if(!SR){ ncToast('Voice search needs Chrome. Please type instead.'); return; }
      var r = new SR();
      r.lang = 'en-IN'; r.interimResults = false; r.maxAlternatives = 1;
      r.onstart  = function(){ mic.classList.add('rec'); };
      r.onend    = function(){ mic.classList.remove('rec'); };
      r.onerror  = function(){ mic.classList.remove('rec'); ncToast('Could not hear you. Try again.'); };
      r.onresult = function(e){
        var said = e.results[0][0].transcript || '';
        var si = document.getElementById('searchInput');
        if(si){
          si.value = said;
          ncQuery = said.trim().toLowerCase();
          if(typeof switchTab === 'function' && currentTab !== 'home') switchTab('home');
          else ncApplyGrid();
          ncToast('Searching \u201C' + said + '\u201D');
        }
      };
      try{ r.start(); }catch(err){ ncToast('Microphone is busy. Try again.'); }
    };

    // --- camera ---
    var cam = document.getElementById('camBtn');
    if(cam) cam.onclick = function(){
      var inp = document.createElement('input');
      inp.type = 'file'; inp.accept = 'image/*'; inp.setAttribute('capture', 'environment');
      inp.onchange = function(){
        ncToast('Photo search needs a visual-search service \u2014 coming later.');
      };
      inp.click();
    };

    // --- sticky header shadow on scroll ---
    var tb = document.getElementById('topbar');
    if(tb){
      window.addEventListener('scroll', function(){
        tb.classList.toggle('nc-stuck', window.scrollY > 4);
      }, { passive: true });
    }
  }

  /* ---------- keep the header in sync across tab changes ---------- */
  function wrapSwitchTab(){
    if(typeof switchTab !== 'function' || switchTab.__ncWrapped) return;
    var orig = switchTab;
    var wrapped = function(page){
      orig(page);
      try{ ncWallet(); if(typeof ncPaintBell === 'function') ncPaintBell(); }catch(e){}
    };
    wrapped.__ncWrapped = true;
    window.switchTab = wrapped;
    try{ switchTab = wrapped; }catch(e){}
  }

  function start(){
    initHeader();
    wrapSwitchTab();
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', function(){ setTimeout(start, 60); });
  } else {
    setTimeout(start, 60);
  }

})();

</script>

.ncs-results{ padding:14px 14px 0; }

  width:16px; height:16px; border-radius:50%; display:inline-block; flex-shrink:0;

.ncs-actions{
  position:absolute; left:0; right:0; bottom:0; z-index:5;
  display:flex; gap:10px; padding:10px 14px calc(10px + env(safe-area-inset-bottom));

  box-shadow: 0 -2px 16px rgba(20,20,30,.09);
}

  flex:1; display:flex; align-items:center; justify-content:center; gap:8px;

}

.ncs-act:active{ background: var(--surface-2); }

/* ---------------- voice + photo sheets ---------------- */
.ncv, .ncp{
  position:fixed; inset:0; z-index:560; background: rgba(15,15,20,.5);
  display:flex; align-items:flex-end; justify-content:center;
  opacity:0; visibility:hidden; transition: opacity .18s ease, visibility .18s;
}
.ncv.open, .ncp.open{ opacity:1; visibility:visible; }
.ncv-card, .ncp-card{
  width:100%; max-width:480px; background: var(--surface);
  border-radius:24px 24px 0 0; padding:24px 22px calc(24px + env(safe-area-inset-bottom));

.ncv-card h3, .ncp-card h3{ font-size:16px; font-weight:800; color: var(--ink); margin-bottom:6px; }
.ncv-card p, .ncp-card p{ font-size:12.5px; color: var(--ink-faint); line-height:1.5; }
.ncv-mic{
  width:74px; height:74px; border-radius:50%; margin:14px auto 16px;
  background: var(--brand); color:#fff; display:flex; align-items:center; justify-content:center;
  box-shadow: 0 8px 24px rgba(255,63,108,.34);
}
.ncv-mic .icon{ width:34px; height:34px; }
.ncv.on .ncv-mic{ animation: ncvRing 1.4s ease-out infinite; }
@keyframes ncvRing{
  0%{ box-shadow: 0 0 0 0 rgba(255,63,108,.45), 0 8px 24px rgba(255,63,108,.34); }
  70%{ box-shadow: 0 0 0 22px rgba(255,63,108,0), 0 8px 24px rgba(255,63,108,.34); }
  100%{ box-shadow: 0 0 0 0 rgba(255,63,108,0), 0 8px 24px rgba(255,63,108,.34); }

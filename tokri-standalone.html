// ============================================================
function renderAdminOffers(shell){
  const banners = DB.banners || [];
  const anns = DB.announcements || [];
  const coupons = DB.coupons || [];

  const body = `
    <div class="section"><span class="section-title">Hero Banners (${banners.length})</span></div>
    <p style="font-size:12px;color:var(--ink-faint);margin:-6px 0 12px;">Shown as the sliding offer carousel on the home page.</p>
    ${banners.length ? banners.map(b=>`
      <div class="banner-row ${b.active?'':'banner-off'}">
        <div class="banner-thumb" style="${b.img?'':`background:${b.bg||'#FF3F6C'}`}">
          ${b.img?`<img src="${ncDirectMediaUrl(b.img)}" onerror="this.style.display='none'">`:(b.title||'B').charAt(0)}
        </div>
        <div class="banner-row-info">
          <div class="banner-row-title">${b.title||'(no title)'}</div>
          <div class="banner-row-sub">${b.badge?b.badge+' · ':''}${b.sub||''}</div>
        </div>
        <button class="mini-switch ${b.active?'on':''}" data-btoggle="${b.id}" title="Show / hide"></button>
        <button class="icon-btn" data-bedit="${b.id}">${icon('edit')}</button>
        <button class="icon-btn" data-bdel="${b.id}">${icon('trash')}</button>
      </div>`).join('') : `<div class="empty-state">${icon('image')}<h3>No banners yet</h3><p>Add an offer banner to show on the home page.</p></div>`}
    <button class="btn btn-primary btn-block" id="addBannerBtn" style="margin:6px 0 26px;">${icon('plus')} Add Banner</button>

    <div class="section"><span class="section-title">Announcements (${anns.length})</span></div>
    <p style="font-size:12px;color:var(--ink-faint);margin:-6px 0 12px;">The scrolling strip at the very top of the app.</p>
    ${anns.length ? anns.map(a=>`
      <div class="banner-row ${a.active?'':'banner-off'}">
        <div class="banner-thumb" style="background:var(--accent);width:42px;height:42px;font-size:15px;">${icon('bell')}</div>
        <div class="banner-row-info">
          <div class="banner-row-sub" style="font-size:12.5px;color:var(--ink);">${a.text}</div>
        </div>
        <button class="mini-switch ${a.active?'on':''}" data-atoggle="${a.id}"></button>
        <button class="icon-btn" data-aedit="${a.id}">${icon('edit')}</button>
        <button class="icon-btn" data-adel="${a.id}">${icon('trash')}</button>
      </div>`).join('') : `<div class="empty-state">${icon('bell')}<h3>No announcements</h3><p>Add a line to run along the top bar.</p></div>`}
    <button class="btn btn-outline btn-block" id="addAnnBtn" style="margin:6px 0 26px;">${icon('plus')} Add Announcement</button>

    <div class="section"><span class="section-title">Coupons (${coupons.length})</span></div>
    <p style="font-size:12px;color:var(--ink-faint);margin:-6px 0 12px;">Customers can apply these codes at checkout.</p>
    ${coupons.length ? coupons.map(c=>`
      <div class="banner-row ${c.active?'':'banner-off'}">
        <div class="banner-thumb" style="background:var(--success);width:52px;height:52px;font-size:14px;">
          ${c.type==='percent'? c.value+'%' : '₹'+c.value}
        </div>
        <div class="banner-row-info">
          <div class="banner-row-title" style="letter-spacing:.5px;">${c.code}</div>
          <div class="banner-row-sub">${c.desc||''}</div>
        </div>
        <button class="mini-switch ${c.active?'on':''}" data-ctoggle="${c.id}"></button>
        <button class="icon-btn" data-cedit="${c.id}">${icon('edit')}</button>
        <button class="icon-btn" data-cdel="${c.id}">${icon('trash')}</button>
      </div>`).join('') : `<div class="empty-state">${icon('tag')}<h3>No coupons</h3><p>Create a promo code for your customers.</p></div>`}
    <button class="btn btn-outline btn-block" id="addCouponBtn" style="margin:6px 0 90px;">${icon('plus')} Add Coupon</button>
  `;

  shell.innerHTML = adminShellHTML('offers','Offers & Banners', body, false);
  bindAdminNav();

  // Banners
  $('#addBannerBtn').addEventListener('click', ()=> bannerForm(null, ()=> renderAdminOffers(shell)));
  $$('[data-bedit]').forEach(b=> b.addEventListener('click', ()=> bannerForm(b.dataset.bedit, ()=> renderAdminOffers(shell))));
  $$('[data-btoggle]').forEach(b=> b.addEventListener('click', ()=>{
    const bn = DB.banners.find(x=>x.id===b.dataset.btoggle);
    bn.active = !bn.active; persist(); renderAdminOffers(shell);
  }));
  $$('[data-bdel]').forEach(b=> b.addEventListener('click', ()=>{
    const bn = DB.banners.find(x=>x.id===b.dataset.bdel);
    confirmAction('Delete banner?', `"${bn.title}" will be removed from the home page.`, ()=>{
      DB.banners = DB.banners.filter(x=>x.id!==b.dataset.bdel);
      persist(); renderAdminOffers(shell); showToast('Banner deleted', 'checkCircle');
    });
  }));

  // Announcements
  $('#addAnnBtn').addEventListener('click', ()=> announcementForm(null, ()=> renderAdminOffers(shell)));
  $$('[data-aedit]').forEach(b=> b.addEventListener('click', ()=> announcementForm(b.dataset.aedit, ()=> renderAdminOffers(shell))));
  $$('[data-atoggle]').forEach(b=> b.addEventListener('click', ()=>{
    const a = DB.announcements.find(x=>x.id===b.dataset.atoggle);
    a.active = !a.active; persist(); renderAdminOffers(shell);
  }));
  $$('[data-adel]').forEach(b=> b.addEventListener('click', ()=>{
    DB.announcements = DB.announcements.filter(x=>x.id!==b.dataset.adel);
    persist(); renderAdminOffers(shell); showToast('Announcement deleted', 'checkCircle');
  }));

  // Coupons
  $('#addCouponBtn').addEventListener('click', ()=> couponForm(null, ()=> renderAdminOffers(shell)));
  $$('[data-cedit]').forEach(b=> b.addEventListener('click', ()=> couponForm(b.dataset.cedit, ()=> renderAdminOffers(shell))));
  $$('[data-ctoggle]').forEach(b=> b.addEventListener('click', ()=>{
    const c = DB.coupons.find(x=>x.id===b.dataset.ctoggle);
    c.active = !c.active; persist(); renderAdminOffers(shell);
  }));
  $$('[data-cdel]').forEach(b=> b.addEventListener('click', ()=>{
    const c = DB.coupons.find(x=>x.id===b.dataset.cdel);
    confirmAction('Delete coupon?', `Code ${c.code} will stop working.`, ()=>{
      DB.coupons = DB.coupons.filter(x=>x.id!==b.dataset.cdel);
      persist(); renderAdminOffers(shell); showToast('Coupon deleted', 'checkCircle');
    });
  }));
}

/* ---- Banner add / edit ---- */
const BANNER_PRESETS = [
  'linear-gradient(135deg,#FF3F6C 0%,#FF8FAE 100%)',
  'linear-gradient(135deg,#F7971E 0%,#FF4E50 100%)',
  'linear-gradient(135deg,#11998E 0%,#0F7B72 100%)',
  'linear-gradient(135deg,#4A00E0 0%,#2196F3 100%)',
  'linear-gradient(135deg,#E02D5B 0%,#FF3F6C 100%)'
];
function bannerForm(bid, onSaved){
  const b = bid ? DB.banners.find(x=>x.id===bid) : null;
  const overlay = document.createElement('div');
  overlay.className = 'bottom-sheet-overlay';
  overlay.innerHTML = `
    <div class="bottom-sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title"><span>${b?'Edit Banner':'Add Banner'}</span><button class="icon-btn" id="bfClose">${icon('close')}</button></div>
      <div style="max-height:62vh;overflow-y:auto;">
        <div class="form-group"><label class="form-label">Badge (small pill)</label>
          <input class="form-input" id="bfBadge" placeholder="e.g. Big Billion Days" value="${b?(b.badge||''):''}"></div>
        <div class="form-group"><label class="form-label">Title (big text)</label>
          <input class="form-input" id="bfTitle" placeholder="e.g. Big Savings Days" value="${b?(b.title||''):''}"></div>
        <div class="form-group"><label class="form-label">Subtitle</label>
          <input class="form-input" id="bfSub" placeholder="e.g. Up to 70% off on Fashion" value="${b?(b.sub||''):''}"></div>
        <div class="form-group"><label class="form-label">Button text</label>
          <input class="form-input" id="bfCta" placeholder="e.g. Shop Now" value="${b?(b.cta||'Shop Now'):'Shop Now'}"></div>
        <div class="form-group"><label class="form-label">Brand name (on the white strip)</label>
          <input class="form-input" id="bfBrand" placeholder="Leave empty to use the shop name" value="${b?(b.brand||''):''}"></div>
        <div class="form-group"><label class="form-label">Brand line (optional, small text)</label>
          <input class="form-input" id="bfBrandSub" placeholder="e.g. Sportswear" value="${b?(b.brandSub||''):''}"></div>
        <label style="display:flex;align-items:center;gap:10px;margin:0 0 16px;font-size:13px;font-weight:700;color:var(--ink-soft);cursor:pointer;">
          <input type="checkbox" id="bfAd" ${b&&b.ad?'checked':''} style="width:18px;height:18px;accent-color:var(--brand);">
          Show the small "AD" tag on the photo
        </label>
        <div class="form-group"><label class="form-label">Background photo (optional)</label>
          <input type="file" id="bfFile" accept="image/*" style="display:none;">
          <div id="bfDrop" style="border-radius:12px;background:var(--bg);box-shadow:var(--shadow-inset);padding:16px;text-align:center;color:var(--ink-faint);font-size:12.5px;cursor:pointer;">
            <span style="display:inline-flex;color:var(--ink-faint);">${icon('image','ic-lg')}</span>
            <div style="margin-top:6px;">Tap to choose a photo</div>
          </div>
          <button class="text-btn" id="bfClearImg" style="display:none;margin-top:6px;color:var(--danger);">Remove photo</button>
        </div>
        <div class="form-group"><label class="form-label">Background colour (if no photo)</label>
          <div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:4px;">
            ${BANNER_PRESETS.map((g,i)=>`<button type="button" class="bf-preset" data-bg="${g}" style="width:44px;height:34px;border-radius:9px;background:${g};${(b&&b.bg===g)||(!b&&i===0)?'box-shadow:0 0 0 2.5px var(--ink);':''}"></button>`).join('')}
          </div>
        </div>
      </div>
      <button class="btn btn-primary btn-block" id="bfSave" style="margin-top:10px;">${b?'Save Changes':'Add Banner'}</button>
    </div>`;
  document.body.appendChild(overlay);

  let chosenBg = b ? (b.bg || BANNER_PRESETS[0]) : BANNER_PRESETS[0];
  let chosenImg = b ? (b.img || '') : '';

  const drop = overlay.querySelector('#bfDrop');
  const file = overlay.querySelector('#bfFile');
  const clearBtn = overlay.querySelector('#bfClearImg');
  if(chosenImg){ drop.innerHTML = `<img src="${chosenImg}" style="max-height:110px;border-radius:9px;margin:0 auto;">`; clearBtn.style.display='block'; }

  drop.addEventListener('click', ()=> file.click());
  file.addEventListener('change', (e)=>{
    const f = e.target.files[0]; if(!f) return;
    if(!/^image\//.test(f.type)){ showToast('Please choose a picture file', 'xCircle'); return; }
    /* Banners are wide, so they keep more pixels than a product photo. */
    ncShrinkImage(f, 1400, 170).then((res)=>{
      chosenImg = res.dataUrl;
      drop.innerHTML = `<img src="${chosenImg}" style="max-height:110px;border-radius:9px;margin:0 auto;">`;
      clearBtn.style.display='block';
      ncPictureReady('Banner picture', res);
    }).catch(ncPictureFailed);
    e.target.value = '';
  });
  clearBtn.addEventListener('click', ()=>{
    chosenImg = '';
    drop.innerHTML = `${icon('image')}<div style="margin-top:6px;">Tap to choose a photo</div>`;
    clearBtn.style.display='none';
  });
  overlay.querySelectorAll('.bf-preset').forEach(p=>{
    p.addEventListener('click', ()=>{
      chosenBg = p.dataset.bg;
      overlay.querySelectorAll('.bf-preset').forEach(x=> x.style.boxShadow='none');
      p.style.boxShadow = '0 0 0 2.5px var(--ink)';
    });
  });

  const close = ()=> overlay.remove();
  overlay.querySelector('#bfClose').addEventListener('click', close);
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });

  overlay.querySelector('#bfSave').addEventListener('click', ()=>{
    const title = overlay.querySelector('#bfTitle').value.trim();
    if(!title){ showToast('Enter a banner title'); return; }
    const data = {
      badge: overlay.querySelector('#bfBadge').value.trim(),
      title,
      sub:   overlay.querySelector('#bfSub').value.trim(),
      cta:   overlay.querySelector('#bfCta').value.trim() || 'Shop Now',
      brand: overlay.querySelector('#bfBrand').value.trim(),
      brandSub: overlay.querySelector('#bfBrandSub').value.trim(),
      ad:    overlay.querySelector('#bfAd').checked,
      bg:    chosenBg,
      img:   chosenImg
    };
    if(b) Object.assign(b, data);
    else DB.banners.push(Object.assign({ id:'b'+Date.now(), active:true }, data));
    if(!persistOrStop()) return;      // storage full: the toast already said so
    close();
    onSaved && onSaved();
    showToast(b?'Banner updated':'Banner added', 'checkCircle');
  });
}

/* ---- Coupon add / edit ---- */
function couponForm(cid, onSaved){
  const c = cid ? DB.coupons.find(x=>x.id===cid) : null;
  const overlay = document.createElement('div');
  overlay.className = 'bottom-sheet-overlay';
  overlay.innerHTML = `
    <div class="bottom-sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title"><span>${c?'Edit Coupon':'Add Coupon'}</span><button class="icon-btn" id="cfClose">${icon('close')}</button></div>
      <div style="max-height:60vh;overflow-y:auto;">
        <div class="form-group"><label class="form-label">Coupon code</label>
          <input class="form-input" id="cfCode" placeholder="e.g. SAVE10" style="text-transform:uppercase;" value="${c?c.code:''}"></div>
        <div class="form-group"><label class="form-label">Discount type</label>
          <div style="display:flex;gap:8px;">
            <button type="button" class="size-chip cf-type ${(c?c.type:'percent')==='percent'?'selected':''}" data-type="percent">Percentage %</button>
            <button type="button" class="size-chip cf-type ${(c&&c.type==='flat')?'selected':''}" data-type="flat">Flat ₹</button>
          </div>
        </div>
        <div style="display:flex;gap:10px;">
          <div class="form-group" style="flex:1;"><label class="form-label">Value</label>
            <input class="form-input" id="cfValue" inputmode="numeric" placeholder="10" value="${c?c.value:''}"></div>
          <div class="form-group" style="flex:1;"><label class="form-label">Min order ₹</label>
            <input class="form-input" id="cfMin" inputmode="numeric" placeholder="499" value="${c?c.minOrder:''}"></div>
        </div>
        <div class="form-group"><label class="form-label">Max discount ₹ (for % coupons)</label>
          <input class="form-input" id="cfMax" inputmode="numeric" placeholder="200" value="${c?(c.maxDiscount||''):''}"></div>
        <div class="form-group"><label class="form-label">Description shown to customers</label>
          <input class="form-input" id="cfDesc" placeholder="e.g. 10% off on orders above ₹499" value="${c?(c.desc||''):''}"></div>
      </div>
      <button class="btn btn-primary btn-block" id="cfSave" style="margin-top:10px;">${c?'Save Changes':'Add Coupon'}</button>
    </div>`;
  document.body.appendChild(overlay);

  let chosenType = c ? c.type : 'percent';
  overlay.querySelectorAll('.cf-type').forEach(b=>{
    b.addEventListener('click', ()=>{
      chosenType = b.dataset.type;
      overlay.querySelectorAll('.cf-type').forEach(x=>x.classList.remove('selected'));
      b.classList.add('selected');
    });
  });

  const close = ()=> overlay.remove();
  overlay.querySelector('#cfClose').addEventListener('click', close);
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });

  overlay.querySelector('#cfSave').addEventListener('click', ()=>{
    const code = overlay.querySelector('#cfCode').value.trim().toUpperCase();
    const value = parseInt(overlay.querySelector('#cfValue').value, 10);
    const minOrder = parseInt(overlay.querySelector('#cfMin').value, 10) || 0;
    const maxDiscount = parseInt(overlay.querySelector('#cfMax').value, 10) || (chosenType==='flat'?value:0);
    const desc = overlay.querySelector('#cfDesc').value.trim();

    if(!code){ showToast('Enter a coupon code'); return; }
    if(!/^[A-Z0-9]{3,15}$/.test(code)){ showToast('Code: 3-15 letters/numbers only'); return; }
    if(!value || value <= 0){ showToast('Enter a discount value'); return; }
    if(chosenType === 'percent' && value > 90){ showToast('Percentage cannot exceed 90%'); return; }
    const dup = DB.coupons.find(x=> x.code === code && (!c || x.id !== c.id));
    if(dup){ showToast('That code already exists', 'xCircle'); return; }

    const data = { code, type:chosenType, value, minOrder, maxDiscount,
                   desc: desc || (chosenType==='percent'
                     ? `${value}% off on orders above ₹${minOrder}`
                     : `₹${value} off on orders above ₹${minOrder}`) };
    if(c) Object.assign(c, data);
    else DB.coupons.push(Object.assign({ id:'cp'+Date.now(), active:true }, data));
    persist(); close(); onSaved && onSaved();
    showToast(c?'Coupon updated':'Coupon added', 'checkCircle');
  });
}

function renderAdminBranding(shell){
   const b = DB.branding;
   const sp = b.splash || { type: 'default', url: '', dataUrl: '', seconds: 4 };
   const colors = ['#FF3F6C','#FF905A','#03A685','#3B5BDB','#7B4DFF','#282C3F'];
   const body = `
    <div class="admin-section">
      <div class="logo-preview-box">
        <img class="logo-preview-img" id="brLogoPreview" src="${b.logoDataUrl || ''}" style="${b.logoDataUrl?'':'display:none;'}">
        <div id="brLogoFallback" class="brand-logo-fallback" style="width:56px;height:56px;font-size:22px;border-radius:14px;${b.logoDataUrl?'display:none;':''}">${b.appName.charAt(0)}</div>
        <div style="flex:1;">
          <button class="btn btn-secondary btn-sm" id="brChangeLogoBtn">${icon('upload')} Choose file</button>
          <input type="file" id="brLogoInput" accept="image/*" style="display:none;">
        </div>
      </div>
      <div class="form-group"><label class="form-label">App Name</label><input class="form-input" id="brAppName" value="${b.appName}"></div>
      <div class="form-group"><label class="form-label">Tagline (shown on splash screen)</label><input class="form-input" id="brTagline" value="${b.tagline}"></div>
      <div class="form-group">
        <label class="form-label">Brand Color</label>
        <div class="color-swatch-row" id="brColorRow">
          ${colors.map(c=>`<div class="color-swatch ${c.toLowerCase()===b.primaryColor.toLowerCase()?'selected':''}" style="background:${c};" data-color="${c}"></div>`).join('')}
        </div>
      </div>

      <!-- Opening screen: photo / video splash -->
      <div class="admin-section" style="margin-top:16px;">
        <div class="form-group">
          <label class="form-label">Opening screen (splash)</label>
          <select class="form-input" id="spType">
            <option value="default" ${sp.type==='default'?'selected':''}>Logo (default)</option>
            <option value="image" ${sp.type==='image'?'selected':''}>Photo</option>
            <option value="video" ${sp.type==='video'?'selected':''}>Video</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Photo or video link</label>
          <input class="form-input" id="spUrl" placeholder="https://... (mp4 for video)" value="${sp.url||''}">
          <p class="form-hint">For a video this is the way to do it &mdash; a video file from the phone is too large to store inside the app.</p>
        </div>
        <div class="form-group">
          <label class="form-label">...or choose a file from this phone</label>
          <input type="file" id="spFile" class="form-input" accept="image/*,video/*">
        </div>
        <div class="form-group">
          <label class="form-label">Show it for <b id="spSecsLbl">${sp.seconds||4}</b> seconds</label>
          <input type="range" id="spSecs" min="1" max="10" step="1" value="${sp.seconds||4}">
        </div>
        <p class="admin-hint">A link keeps the app small (a long video file can slow it down). This splash is saved on this phone — to show it to every customer, tell us and we will put it inside the app.</p>
      </div>

      <button class="btn btn-primary btn-block" id="brSaveBtn">Save Branding</button>
    </div>
    <div class="policy-note" style="margin:0 16px;">${icon('info')}<span>Changes apply instantly across splash screen, header logo, and buttons.</span></div>
  `;
  shell.innerHTML = adminShellHTML('branding','Branding', body, false);
  bindAdminNav();

  let newLogo = b.logoDataUrl;
  let newColor = b.primaryColor;
  let newSplashData = sp.dataUrl || '';

  const fileInput = $('#brLogoInput');
  $('#brChangeLogoBtn').addEventListener('click', ()=> fileInput.click());
  fileInput.addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    if(!/^image\//.test(file.type)){ showToast('Please choose a picture file', 'xCircle'); return; }
    /* A logo is small on screen and often transparent, so it stays PNG and
       is capped tight - see ncShrinkImage's PNG branch. */
    const asPng = /png|svg|webp|gif/i.test(file.type);
    ncShrinkImage(file, 512, 70, asPng).then((res)=>{
      newLogo = res.dataUrl;
      $('#brLogoPreview').src = newLogo;
      $('#brLogoPreview').style.display = 'block';
      $('#brLogoFallback').style.display = 'none';
      ncPictureReady('Logo', res);
    }).catch(ncPictureFailed);
    e.target.value = '';
  });
  $$('.color-swatch', $('#brColorRow')).forEach(sw=>{
    sw.addEventListener('click', ()=>{
      newColor = sw.dataset.color;
      $$('.color-swatch', $('#brColorRow')).forEach(s=>s.classList.remove('selected'));
      sw.classList.add('selected');
    });
  });
  // --- opening screen (splash) controls ---
  const spFile = $('#spFile');
  if(spFile) spFile.addEventListener('change', (e)=>{
    const f = e.target.files[0];
    if(!f) return;
    if(/^video\//.test(f.type)){
      /* A video cannot be shrunk in the browser, and a single clip would eat
         the whole storage budget - so a link is the only workable route for
         video. Anything small enough to store is still accepted. */
      if(f.size > 1.5 * 1024 * 1024){
        showToast('A video file this big (' + (Math.round(f.size / 1024 / 1024 * 10) / 10) +
                  ' MB) is too large to store in the app. Paste a link to the video in the box above instead.', 'xCircle', 8000);
        e.target.value = '';
        return;
      }
      const rv = new FileReader();
      rv.onload = (ev)=>{ newSplashData = ev.target.result;
        showToast('Splash video ready - now tap Save', 'checkCircle'); };
      rv.readAsDataURL(f);
      e.target.value = '';
      return;
    }
    if(!/^image\//.test(f.type)){ showToast('Please choose a picture or video file', 'xCircle'); return; }
    ncShrinkImage(f, 1400, 220).then((res)=>{
      newSplashData = res.dataUrl;
      ncPictureReady('Opening screen picture', res);
    }).catch(ncPictureFailed);
    e.target.value = '';
  });
  const spSecs = $('#spSecs');
  if(spSecs) spSecs.addEventListener('input', ()=>{
    const lbl = $('#spSecsLbl');
    if(lbl) lbl.textContent = spSecs.value;
  });

  $('#brSaveBtn').addEventListener('click', ()=>{
    DB.branding.appName = $('#brAppName').value.trim() || b.appName;
    DB.branding.tagline = $('#brTagline').value.trim() || b.tagline;
    DB.branding.logoDataUrl = newLogo;
    DB.branding.primaryColor = newColor;
    DB.branding.splash = {
      type: ($('#spType') && $('#spType').value) || 'default',
      url: ($('#spUrl') && $('#spUrl').value.trim()) || '',
      dataUrl: newSplashData,
      seconds: Number($('#spSecs') && $('#spSecs').value) || 4
    };
    if(!persistOrStop()) return;      // storage full: the toast already said so
    applyBranding();
    showToast('Branding updated', 'checkCircle');
  });
}

    setSyncState('Key saved. Now use &ldquo;Upload this shop to the server&rdquo; to publish this device&rsquo;s catalogue.');
  });
  $('#ncPushBtn').addEventListener('click', async ()=>{
    if(typeof window.ncPush !== 'function'){ showToast('Sync is not available in this build'); return; }
    if(typeof window.ncGetKey !== 'function' || !window.ncGetKey()){ showToast('Save your ADMIN_KEY first'); return; }
    try{ await window.ncPush(); }catch(e){ showToast('Upload failed: ' + ((e && e.message) || e)); }
  });
  $('#ncPullBtn').addEventListener('click', async ()=>{
    if(typeof window.ncPull !== 'function'){ showToast('Sync is not available in this build'); return; }
    try{ await window.ncPull(); showToast('Pulled from the server', 'checkCircle'); renderAdminSettings(shell); }
    catch(e){ showToast('Pull failed: ' + ((e && e.message) || e)); }
  });

    persist();
    showToast('Policy rules updated', 'checkCircle');
  });
  $('#saveDeliveryBtn').addEventListener('click', ()=>{

    let max = parseInt($('#delMaxInput').value, 10);
    if(!min || min < 1 || min > 60){ showToast('Minimum must be 1-60 days'); return; }
    if(!max || max < 1 || max > 60){ showToast('Maximum must be 1-60 days'); return; }
    if(max < min){ showToast('Maximum cannot be less than minimum'); return; }
    /* v55: the delivery charge and the free-delivery threshold are editable here
       for the first time. Both accept 0, which is why they are parsed with an
       explicit NaN check: `!fee` would have rejected 0 as if it were empty. */
    const feeRaw = String($('#delFeeInput').value).trim();
    const freeRaw = String($('#delFreeInput').value).trim();
    const fee = feeRaw === '' ? 0 : parseInt(feeRaw, 10);
    const freeAbove = freeRaw === '' ? 0 : parseInt(freeRaw, 10);
    if(!isFinite(fee) || fee < 0 || fee > 10000){ showToast('Delivery charge must be 0-10000'); return; }
    if(!isFinite(freeAbove) || freeAbove < 0 || freeAbove > 100000){ showToast('Free delivery amount must be 0-100000'); return; }
    DB.settings.deliveryMinDays = min;
    DB.settings.deliveryMaxDays = max;
    DB.settings.shippingFee = fee;
    DB.settings.freeShipThreshold = freeAbove;
    persist();
    renderAdminSettings(shell);
    showToast(fee <= 0 || freeAbove <= 0
      ? 'Delivery is now FREE on every order'
      : 'Delivery ' + formatMoney(fee) + ', free above ' + formatMoney(freeAbove), 'checkCircle');
  });
  /* ---- backups: list, restore, back up now ---- */
  const paintSnaps = ()=>{
    const box = $('#snapList');
    if(!box) return;
    snapList().then(list=>{
      if(!$('#snapList')) return;                  // page moved on
      if(!list.length){
        box.innerHTML = '<p class="form-hint">No backups yet &mdash; one is saved automatically as soon as you change something.</p>';
        return;
      }
      box.innerHTML = list.map(x=>`
        <div class="snap-row">
          <div style="min-width:0;">
            <div class="snap-when">${new Date(x.at).toLocaleString('en-IN', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' })}</div>
            <div class="snap-counts">${x.np} products &middot; ${x.nc} categories</div>
          </div>
          <button class="btn btn-secondary btn-sm" data-restore="${x.at}">Restore</button>
        </div>`).join('');
      $$('[data-restore]', box).forEach(b=> b.addEventListener('click', ()=>{
        const at = Number(b.dataset.restore);
        const when = new Date(at).toLocaleString('en-IN', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
        if(!confirm('Put the shop back to how it was on ' + when + '?\n\nThe products and categories you have now will be replaced by that copy.')) return;
        b.disabled = true; b.textContent = 'Restoring\u2026';
        snapRestore(at).then(ok=>{
          if(ok){
            showToast('Shop restored from backup', 'checkCircle');
            setTimeout(()=> location.reload(), 1000);
          } else {
            b.disabled = false; b.textContent = 'Restore';
            showToast('That backup could not be restored', 'xCircle');
          }
        });
      }));
    });
  };
  paintSnaps();
  const snapBtn = $('#snapNowBtn');
  if(snapBtn) snapBtn.addEventListener('click', ()=>{
    snapBtn.disabled = true;
    snapSave(DB).then(()=>{
      snapBtn.disabled = false;
      paintSnaps();
      showToast('Backup saved', 'checkCircle');
    });
  });

  $('#resetDataBtn').addEventListener('click', ()=>{
    confirmAction('Reset all demo data?', 'This restores default products, orders and branding.', ()=>{
      resetDB();
      applyBranding();
      renderAdminSettings(shell);
      showToast('Demo data reset', 'checkCircle');
    });
  });
}

<!-- ============================================================
     SERVER SYNC  —  THIS APP IS CONNECTED TO YOUR BACKEND
     Backend: https://nexcart-p9ms.onrender.com
     Products, accounts and orders all go through it, so every phone
     sees the same shop. To point somewhere else, edit the line below.
     ============================================================ -->
<script>window.NC_API_BASE = 'https://nexcart-p9ms.onrender.com';</script>
<script id="nexcart-sync2">
/* ==========================================================================
   NEXCART live sync v2  (pairs with server.js v1.3.0)
   --------------------------------------------------------------------------
   WHY THIS EXISTS
   The old sync copied the whole catalogue (photos included) on a 15 s / 60 s
   timer and used "which copy is bigger / newer" guesses, so:
     - a product added in admin could take a minute to appear, or never
     - a deleted product never disappeared on customer phones
     - every check downloaded megabytes of base64 photos
   NOW
     - the server numbers every publish (rev)
     - the admin phone publishes ~1 s after any change (debounced)
     - customer phones listen on a live stream (SSE) + a tiny /api/version
       check every 10 s + on app-resume / back-online, and adopt the server copy
     - photos / videos are uploaded once to /media and only URLs travel
   Orders, accounts and customer lists still use the original adapter above.
   ========================================================================== */
(function () {
  'use strict';

  var REV_KEY = 'nc_rev', SIG_KEY = 'nc_pubsig';
  var serverRev = 0, lastSig = '';
  try { serverRev = Number(localStorage.getItem(REV_KEY)) || 0; lastSig = localStorage.getItem(SIG_KEY) || ''; } catch (e) {}

  function base() { try { return (window.ncBases && window.ncBases()) || window.NC_API_BASE || ''; } catch (e) { return ''; } }
  function key() { try { return (window.ncGetKey && window.ncGetKey()) || ''; } catch (e) { return ''; } }
  function db() { return (typeof DB !== 'undefined') ? DB : null; }
  function toast(m, i) { try { if (typeof showToast === 'function') showToast(m, i || 'checkCircle'); } catch (e) {} }
  function isAdminOpen() { try { return typeof adminUnlocked !== 'undefined' && !!adminUnlocked; } catch (e) { return false; } }

  function req(path, opt) {
    opt = opt || {};
    var h = { 'Content-Type': 'application/json' };
    if (opt.admin) h['x-admin-key'] = key();
    return fetch(base() + path, {
      method: opt.method || 'GET', headers: h, cache: 'no-store',
      body: opt.body ? JSON.stringify(opt.body) : undefined
    }).then(function (r) {
      return r.text().then(function (t) {
        var d; try { d = t ? JSON.parse(t) : {}; } catch (e) { d = {}; }
        if (!r.ok) { var er = new Error(d.error || ('HTTP ' + r.status)); er.status = r.status; throw er; }
        return d;
      });
    });
  }

  /* ---------------------------------------------------------------- hashing */
  function hash(s) {
    var h = 2166136261 >>> 0;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
    return h.toString(36) + ':' + s.length;
  }
  function settingsSubset(s) {
    s = s || {};
    return {
      adminPin: s.adminPin || '', deliveryMinDays: s.deliveryMinDays, deliveryMaxDays: s.deliveryMaxDays,
      returnWindowDays: s.returnWindowDays, freeShipThreshold: s.freeShipThreshold, shippingFee: s.shippingFee,
      theme: s.theme || 'light', onlinePaymentEnabled: !!s.onlinePaymentEnabled
    };
  }
  function payload(D) {
    return {
      products: D.products || [], categories: D.categories || [], branding: D.branding || null,
      banners: D.banners || [], announcements: D.announcements || [], coupons: D.coupons || [],
      home: D.home || {}, settings: settingsSubset(D.settings)
    };
  }
  function sig(D) { try { return hash(JSON.stringify(payload(D))); } catch (e) { return ''; } }
  function store() { try { localStorage.setItem(REV_KEY, String(serverRev)); localStorage.setItem(SIG_KEY, lastSig); } catch (e) {} }

  /* ------------------------------------------------------------ live status */
  var state = 'idle', stateMsg = '';
  function setState(s, msg) { state = s; stateMsg = msg || ''; paintPill(); }

  function pill() { return document.getElementById('ncLivePill'); }
  function paintPill() {
    var p = pill(); if (!p) return;
    var map = {
      idle:       ['#E8F5E9', '#1B5E20', 'Live — tap to publish now'],
      live:       ['#E8F5E9', '#1B5E20', 'Live — customers are up to date'],
      publishing: ['#FFF3E0', '#B45309', 'Publishing… ' + stateMsg],
      error:      ['#FDECEA', '#B71C1C', 'Not published — tap to retry']
    };
    var m = map[state] || map.idle;
    p.style.background = m[0]; p.style.color = m[1];
    p.innerHTML = '<i style="width:9px;height:9px;border-radius:50%;background:' + m[1] + ';display:inline-block;' +
      (state === 'publishing' ? 'animation:fkPulseDot .9s infinite;' : '') + '"></i><span>' + m[2] + (state === 'error' && stateMsg ? ' (' + stateMsg + ')' : '') + '</span>';
  }
  function showPill() {
    if (pill() || !base()) return;
    var p = document.createElement('button');
    p.id = 'ncLivePill'; p.type = 'button';
    p.style.cssText = 'position:fixed;right:12px;bottom:78px;z-index:650;display:flex;align-items:center;gap:8px;' +
      'padding:9px 14px;border:0;border-radius:999px;font:700 12px/1 Roboto,Inter,sans-serif;' +
      'box-shadow:0 4px 14px rgba(0,0,0,.22);cursor:pointer;max-width:86vw;';
    p.addEventListener('click', function () {
      if (!key()) { try { window.NC && NC.getKey; } catch (e) {} toast('Open Settings and enter your admin key first', 'info'); return; }
      pull(true).then(function () { return push(false, true); });
    });
    document.body.appendChild(p);
    paintPill();
  }
  function hidePill() { var p = pill(); if (p && p.parentNode) p.parentNode.removeChild(p); }

  /* ------------------------------------------------------------------ media */
  function isData(v) { return typeof v === 'string' && v.length > 200 && /^data:(image|video)\//.test(v); }

  function postMedia(dataUrl) {
    return req('/api/admin/media', { method: 'POST', admin: true, body: { dataUrl: dataUrl } }).then(function (r) {
      var u = r && r.url ? r.url : '';
      return /^https?:/.test(u) ? u : base() + u;
    });
  }

  /* Upload one picked file straight to the server and hand back its URL. */
  function uploadFile(file) {
    return new Promise(function (resolve, reject) {
      if (!base() || !key()) { reject(new Error('Enter your admin key in Settings first')); return; }
      var isVideo = /^video\//.test(file.type);
      if (isVideo && file.size > 28 * 1024 * 1024) { reject(new Error('Video is over 28 MB. Compress it, or paste a link instead.')); return; }
      if (!isVideo && file.size > 7 * 1024 * 1024) { reject(new Error('Picture is over 7 MB. Choose a smaller one.')); return; }
      var fr = new FileReader();
      fr.onerror = function () { reject(new Error('Could not read that file')); };
      fr.onload = function () { postMedia(fr.result).then(resolve, reject); };
      fr.readAsDataURL(file);
    });
  }

  /* Replace every embedded data: picture/video in the shop with an uploaded URL. */
  function uploadAllMedia(D) {
    var cache = {}, jobs = [];
    function walk(o, parent, k) {
      if (!o || typeof o !== 'object') return;
      Object.keys(o).forEach(function (kk) {
        var v = o[kk];
        if (isData(v)) jobs.push({ o: o, k: kk, v: v });
        else if (v && typeof v === 'object') walk(v);
      });
    }
    ['products', 'categories', 'banners', 'branding', 'home'].forEach(function (n) { walk(D[n]); });
    if (!jobs.length) return Promise.resolve(0);
    var done = 0, i = 0;
    setState('publishing', 'photos 0/' + jobs.length);
    function worker() {
      if (i >= jobs.length) return Promise.resolve();
      var j = jobs[i++];
      var p = cache[j.v] ? Promise.resolve(cache[j.v]) : postMedia(j.v).then(function (u) { cache[j.v] = u; return u; });
      return p.then(function (u) { j.o[j.k] = u; }, function (e) {
        if (e && e.status === 401) throw e;
        /* a photo the server refused stays embedded; publishing carries on */
      }).then(function () { done++; setState('publishing', 'photos ' + done + '/' + jobs.length); return worker(); });
    }
    return Promise.all([worker(), worker(), worker()]).then(function () {
      try { if (typeof persist === 'function') persist(); } catch (e) {}
      return jobs.length;
    });
  }

  /* -------------------------------------------------------------------- push */
  var pushing = null, pushAgain = false, retryTimer = null, retries = 0, schedTimer = null;

  function push(silent, force) {
    if (!base() || !key()) return Promise.resolve(false);
    var D = db(); if (!D) return Promise.resolve(false);
    var empty = !(D.products || []).length && !(D.categories || []).length;
    if (empty && !lastSig) { if (!silent) toast('Nothing to publish — add a product first', 'info'); return Promise.resolve(false); }
    if (!force && lastSig && sig(D) === lastSig) { if (!silent) toast('Already published — customers have the latest'); setState('live'); return Promise.resolve(true); }
    if (pushing) { pushAgain = true; return pushing; }
    setState('publishing');
    pushing = uploadAllMedia(D).then(function () {
      var body = payload(D);
      body.catalogUpdatedAt = Date.now();
      return req('/api/admin/push', { method: 'POST', admin: true, body: body });
    }).then(function (r) {
      serverRev = Number(r.rev) || serverRev; lastSig = sig(D); store(); retries = 0;
      D.catalogUpdatedAt = Date.now();
      setState('live');
      if (!silent) toast('Published — customers see it now');
      return true;
    }).catch(function (e) {
      setState('error', (e && e.message) || '');
      if (e && e.status === 401) toast('Admin key rejected — re-enter it in Settings', 'xCircle');
      else if (!silent || retries === 0) toast('Could not publish: ' + ((e && e.message) || 'offline') + '. Retrying…', 'xCircle');
      scheduleRetry();
      return false;
    }).then(function (ok) {
      pushing = null;
      if (pushAgain) { pushAgain = false; schedule(400); }
      return ok;
    });
    return pushing;
  }
  function scheduleRetry() {
    clearTimeout(retryTimer);
    if (retries >= 8) return;
    retries++;
    retryTimer = setTimeout(function () { schedule(50); }, Math.min(30000, 2000 * retries * retries));
  }
  function schedule(ms) {
    clearTimeout(schedTimer);
    schedTimer = setTimeout(function () {
      var D = db(); if (!D || !key() || !base()) return;
      if (!lastSig || sig(D) !== lastSig) push(true);
    }, ms == null ? 900 : ms);
  }

  /* Any save made while the admin panel is open is published a moment later. */
  (function hookSave() {
    if (typeof saveDB !== 'function' || saveDB.__nc2) return;
    var orig = saveDB;
    var wrapped = function () {
      var r = orig.apply(this, arguments);
      try { if (base() && key() && isAdminOpen()) schedule(900); } catch (e) {}
      return r;
    };
    wrapped.__nc2 = true;
    try { saveDB = wrapped; } catch (e) { window.saveDB = wrapped; }
  })();

  /* -------------------------------------------------------------------- pull */
  var pulling = null;
  function pull(force) {
    if (!base()) return Promise.resolve(false);
    if (pulling) return pulling;
    var q = (!force && serverRev > 0) ? ('?rev=' + serverRev) : '';
    pulling = req('/api/bootstrap' + q).then(function (d) {
      if (d && d.unchanged) { if (state === 'idle') setState('live'); return false; }
      return apply(d);
    }).catch(function () { return false; }).then(function (r) { pulling = null; return r; });
    return pulling;
  }

  function num(v, lo, hi) { var n = parseInt(v, 10); return (isFinite(n) && n >= lo && n <= hi) ? n : null; }

  function apply(d) {
    var D = db(); if (!D || !d) return false;
    var published = (Number(d.rev) || 0) > 0 || (d.products && d.products.length > 0) || (d.categories && d.categories.length > 0);
    var admin = !!key();

    if (admin) {
      var dirty = lastSig && sig(D) !== lastSig;
      var firstRun = !lastSig;
      var localNewer = (Number(D.catalogUpdatedAt) || 0) > (Number(d.catalogUpdatedAt) || 0);
      /* the owner's own unpublished edits always win and are sent up */
      if (dirty || (firstRun && (D.products || []).length && (!published || localNewer))) {
        return push(true, true).then(function () { return true; });
      }
    }
    if (!published) { serverRev = Number(d.rev) || 0; store(); return false; }

    var before = sig(D);
    var prods = Array.isArray(d.products) ? d.products : (D.products || []);
    if (!admin) prods = prods.filter(function (p) { return !(p && p.hidden); });   // drafts stay private
    D.products = prods;
    if (Array.isArray(d.categories)) D.categories = d.categories;
    if (Array.isArray(d.banners)) D.banners = d.banners;
    if (Array.isArray(d.announcements)) D.announcements = d.announcements;
    if (Array.isArray(d.coupons)) D.coupons = d.coupons;
    if (d.branding && typeof d.branding === 'object') D.branding = Object.assign({}, D.branding || {}, d.branding);
    if (d.home && typeof d.home === 'object') D.home = d.home;
    if (d.settings) {
      D.settings = D.settings || {};
      var s = d.settings;
      [['deliveryMinDays', 1, 60], ['deliveryMaxDays', 1, 60], ['returnWindowDays', 1, 30],
       ['freeShipThreshold', 0, 100000], ['shippingFee', 0, 10000]].forEach(function (r) {
        var n = num(s[r[0]], r[1], r[2]); if (n !== null) D.settings[r[0]] = n;
      });
      if (s.theme === 'light' || s.theme === 'dark') D.settings.theme = s.theme;
      if (typeof s.onlinePaymentEnabled === 'boolean') D.settings.onlinePaymentEnabled = s.onlinePaymentEnabled;
    }
    /* a product removed by the owner must also leave carts and wishlists */
    try {
      var ids = {}; D.products.forEach(function (p) { ids[p.id] = 1; });
      D.cart = (D.cart || []).filter(function (l) { return ids[l.productId]; });
      D.wishlist = (D.wishlist || []).filter(function (id) { return ids[id]; });
    } catch (e) {}

    D.catalogUpdatedAt = Number(d.catalogUpdatedAt) || Date.now();
    serverRev = Number(d.rev) || 0;
    lastSig = sig(D);
    store();
    try { if (typeof persist === 'function') persist(); } catch (e) {}
    if (lastSig !== before) refreshUI();
    return true;
  }

  function refreshUI() {
    try { if (typeof applyBranding === 'function') applyBranding(); } catch (e) {}
    if (isAdminOpen()) return;                       // never repaint under the owner's hands
    try {
      if (typeof window.fkRefresh === 'function') window.fkRefresh();
      else if (typeof renderTab === 'function' && (typeof viewStack === 'undefined' || !viewStack.length)) renderTab(currentTab);
    } catch (e) {}
  }

  /* ------------------------------------------------------------- live stream */
  var es = null, pollT = null;
  function startLive() {
    if (!base() || window.__nc2Live) return;
    window.__nc2Live = true;
    try {
      if (window.EventSource) {
        es = new EventSource(base() + '/api/stream');
        es.addEventListener('rev', function (e) {
          try { var r = Number(JSON.parse(e.data).rev) || 0; if (r !== serverRev) pull(); } catch (x) {}
        });
      }
    } catch (e) {}
    /* a tiny safety net in case the stream is blocked by a network or proxy */
    pollT = setInterval(function () {
      if (document.visibilityState !== 'visible') return;
      req('/api/version').then(function (v) { if ((Number(v.rev) || 0) !== serverRev) pull(); }).catch(function () {});
    }, 10000);
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') pull(); });
    window.addEventListener('focus', function () { pull(); });
    window.addEventListener('online', function () { pull(); schedule(200); });
  }

  window.NC2 = {
    pull: pull, push: push, schedule: schedule, uploadFile: uploadFile,
    showPill: showPill, hidePill: hidePill, rev: function () { return serverRev; },
    state: function () { return state; }
  };

  function boot() { if (!base()) return; startLive(); pull(); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { setTimeout(boot, 900); });
  else setTimeout(boot, 900);
})();

/* Categories page, rebuilt on the owner's request: a side list of
   categories on the left and BIG IMAGE tiles on the right (real product
   photos where we have them), instead of small emoji tiles. */
function renderCategoriesPage(main){
  main.innerHTML = `<div class="section"><div class="skel-grid">${Array(6).fill('<div class="skel-chip skeleton" style="width:100%;height:90px;border-radius:14px;"></div>').join('')}</div></div>`;
  const tok = ++renderToken;
  setTimeout(()=>{
    if(tok !== renderToken) return;

    const cats = DB.categories || [];
    if(!cats.length){
      main.innerHTML = `<div class="section"><div class="section-head"><span class="section-title">All Categories</span></div>
        <p class="catpage-note">No categories yet. Add some from the admin panel.</p></div>`;
      return;
    }

    main.innerHTML = `<div class="catpage">
        <div class="catpage-side" id="catSide"></div>
        <div class="catpage-panel" id="catPanel"></div>
      </div>`;

    const side  = $('#catSide');
    const panel = $('#catPanel');
    let active  = cats[0].id;

    /* A category's own image if it has one; otherwise the first product
       photo in that category. That way tiles show REAL images rather than
       emoji, which is what the owner asked for. */
    function catImg(c){
      if(c && c.img) return c.img;
      const p = (DB.products || []).filter(x=> x.category === c.id && x.img)[0];
      return p ? p.img : '';
    }

    const sideThumb = (c) => catImg(c)
      ? `<img src="${catImg(c)}" alt="" loading="lazy">`
      : (c.emoji ? `<span style="font-size:22px;line-height:1;">${c.emoji}</span>`
                 : `<span class="icon" style="width:20px;height:20px;opacity:.45;">${ICONS[c.icon] || ICONS.grid}</span>`);

    /* one tile: real image if we have one, else emoji, else line icon */
    function tile(label, img, emoji, iconName, onTap, round){
      const el = document.createElement('button');
      el.type = 'button';
      el.className = 'cat-tile-lg card-fade-in' + (round ? ' cat-tile-round' : '');
      if(img){
        const im = document.createElement('img');
        im.src = img; im.alt = ''; im.loading = 'lazy';
        el.appendChild(im);
      } else {
        const d = document.createElement('div');
        if(emoji){ d.className = 'ctl-emoji'; d.textContent = emoji; }
        else { d.className = 'ctl-icon icon'; d.innerHTML = ICONS[iconName] || ICONS.grid; }
        el.appendChild(d);
      }
      const cap = document.createElement('span');
      cap.textContent = label;
      el.appendChild(cap);
      el.addEventListener('click', onTap);
      return el;
    }

    function paintSide(){
      side.innerHTML = cats.map(c=>`
        <div class="catpage-item ${c.id === active ? 'on' : ''}" data-cat="${c.id}">
          <div class="cpi-img">${sideThumb(c)}</div>
          <span>${c.name}</span>
        </div>`).join('');
      $$('.catpage-item', side).forEach(el=> el.addEventListener('click', ()=>{
        active = el.dataset.cat;
        paintSide();
        paintPanel();
      }));
    }

    function paintPanel(){
      panel.innerHTML = '';
      const cat   = getCategory(active);
      const prods = (DB.products || []).filter(p=> p.category === active);

      /* The sub-categories come first and keep the order the owner arranged
         them in, gathered under whatever Group each one was given
         (e.g. Casual Wear / Work Wear). Ones with no group are shown plain,
         before the first heading, so nothing is ever hidden. */
      const subs = (cat && Array.isArray(cat.subs) ? cat.subs : [])
        .filter(s=> s && String(s.name || '').trim());

      if(subs.length){
        const buckets = [];
        subs.forEach(s=>{
          const g = String(s.group || '').trim();
          let b = buckets.find(x=> x.name === g);
          if(!b){ b = { name: g, items: [] }; buckets.push(b); }
          b.items.push(s);
        });
        buckets.forEach(b=>{
          if(b.name){
            const gh = document.createElement('div');
            gh.className = 'sub-group-h';
            gh.textContent = b.name;
            panel.appendChild(gh);
          }
          const g = document.createElement('div');
          g.className = 'catpage-grid sub-grid';
          b.items.forEach(s=>{
            g.appendChild(tile(s.name, s.img || '', '', 'grid',
              ()=> openSubCategoryProducts(active, s.name), true));
          });
          panel.appendChild(g);
        });
      }

      if(prods.length){
        const h = document.createElement('div');
        h.className = 'catpage-h';
        h.textContent = (cat ? cat.name : 'Products') + ' \u00B7 ' + prods.length + (prods.length === 1 ? ' item' : ' items');
        panel.appendChild(h);

        const g = document.createElement('div');
        g.className = 'catpage-grid';
        prods.slice(0, 30).forEach(p=>{
          g.appendChild(tile(p.name, p.img, '', 'box', ()=> openProductDetail(p.id)));
        });
        panel.appendChild(g);
      } else if(!subs.length){
        /* A category with nothing in it and no sub-categories still needs to
           say so, or the panel would look broken. But when there ARE
           sub-categories to browse, the "nothing here yet" line is just noise
           sitting under them, so it is not shown (owner's request). */
        const h = document.createElement('div');
        h.className = 'catpage-h';
        h.textContent = cat ? cat.name : 'Products';
        panel.appendChild(h);
        const n = document.createElement('p');
        n.className = 'catpage-note';
        n.textContent = 'Nothing in this category yet.';
        panel.appendChild(n);
      }

      const others = cats.filter(c=> c.id !== active);
      if(others.length){
        const h2 = document.createElement('div');
        h2.className = 'catpage-h';
        h2.textContent = 'More categories';
        panel.appendChild(h2);

        const g2 = document.createElement('div');
        g2.className = 'catpage-grid';
        others.forEach(c=>{
          g2.appendChild(tile(c.name, catImg(c), c.emoji, c.icon, ()=>{
            active = c.id;
            side.scrollTop = 0;
            paintSide();
            paintPanel();
          }));
        });
        panel.appendChild(g2);
      }
    }

    paintSide();
    paintPanel();
  }, 350);
}
function openCategoryProducts(catId){
  const cat = getCategory(catId);
  pushView(cat ? cat.name : 'Category', (main)=>{
    main.innerHTML = `<div class="skel-grid">${Array(6).fill(0).map(()=>`<div class="skel-card"><div class="skel-img skeleton"></div><div class="skel-line skeleton"></div><div class="skel-line skeleton w60"></div></div>`).join('')}</div>`;

/* Sub-category listing. Same page as a category, but only the products in
   that category whose name matches the sub-category (e.g. "T-Shirts"). */
function openSubCategoryProducts(catId, subName){
  const title = String(subName || 'Products').slice(0, 20);
  pushView(title, (main)=>{
    main.innerHTML = `<div class="skel-grid">${Array(6).fill(0).map(()=>`<div class="skel-card"><div class="skel-img skeleton"></div><div class="skel-line skeleton"></div><div class="skel-line skeleton w60"></div></div>`).join('')}</div>`;
    const tok = renderToken;
    setTimeout(()=>{
      if(tok !== renderToken) return;
      const wanted = String(subName || '');
      /* Match generously, and treat the sub-category and the product name as
         ALTERNATIVES rather than either/or.
         The old rule was `if(p.sub) return p.sub === wanted`, so a product
         whose sub-category was not character-for-character identical -
         different capitals, a stray space, or a different label such as
         "Men Jeans" - was hidden, with no fallback to its name. Stock looked
         missing: the jeans were in the shop, just not under Jeans. */
       const key   = wanted.trim().toLowerCase();
       const loose = key.replace(/s$/, '');
       /* Also compare on letters+digits alone, so "T-shirt", "T shirt" and
          "Tshirt" are one sub-category. The name is checked both as written
          and flattened, or a hyphen would hide the match. */
       const flat  = (t)=> String(t == null ? '' : t).toLowerCase().replace(/[^a-z0-9]/g, '');
       const keyF  = flat(key);
       const looseF = keyF.replace(/s$/, '');
        /* Everything that belongs here, wherever it was filed.
           A shop easily ends up with two tiles for the same thing - one made by
           hand, one created by an import - and then the stock looks missing
           because it is filed under the other one. The owner reported exactly
           that: 19 t-shirts added, and a T-shirt page still showing one old
           item. So match across the whole shop, and simply show this
           category's own products first. */
        const matches = (p)=>{
          const sub  = String(p.sub || '').trim().toLowerCase();
          const subF = flat(sub);
          if(sub && (sub === key || subF === keyF || sub.replace(/s$/, '') === loose || subF.replace(/s$/, '') === looseF)) return true;
          const hay  = ((p.name || '') + ' ' + (p.cat || '') + ' ' + (p.sub || '')).toLowerCase();
          if(hay.indexOf(loose) !== -1) return true;
          return flat(hay).indexOf(looseF) !== -1;
        };
        const products = DB.products
          .map((p, i)=>({ p: p, own: (p.category === catId) ? 0 : 1, i: i }))
          .filter(x=> matches(x.p))
          .sort((a, b)=> (a.own - b.own) || (a.i - b.i))
          .map(x=> x.p);
        if(products.length){
          main.innerHTML = `<div class="product-grid" id="subProductGrid"></div>`;
          renderProductGrid($('#subProductGrid'), products);
        } else {
          /* An empty page used to say only "No products found", which tells the
             owner nothing at all - is the shop empty, is the category empty, or
             is it just this sub-category? Say which, and offer a way out. */
          const inCat = DB.products.filter(q=>q.category === catId).length;
          const total = DB.products.length;
          const catRec = (DB.categories || []).filter(c=>c.id === catId)[0];
          const catNm  = (catRec && catRec.name) || 'this category';
          main.innerHTML =
            '<div class="empty-state">' + icon('search') +
              '<h3>Nothing in &ldquo;' + wanted + '&rdquo; yet</h3>' +
              '<p>' + (inCat
                ? ('&ldquo;' + catNm + '&rdquo; holds ' + inCat + (inCat === 1 ? ' product' : ' products') +
                   ', but none of them are in this sub-category.')
                : ('&ldquo;' + catNm + '&rdquo; has no products in it at all.')) +
                ' Your whole shop holds ' + total + (total === 1 ? ' product' : ' products') + '.</p>' +
              (inCat ? '<button class="btn btn-primary" id="subShowAll">Show all ' + inCat + ' in ' + catNm + '</button>' : '') +
            '</div>';
          const sa = document.getElementById('subShowAll');
          if(sa) sa.onclick = ()=> openCategoryProducts(catId);
        }
    }, 350);
  });
}

    showToast('Added to cart', 'checkCircle');
  });
  $('#buyNowBtn').addEventListener('click', ()=>{
    addToCart(p.id);
    viewStack=[]; switchTab('cart');
  });
}
function addToCart(pid, qty=1){
  const existing = DB.cart.find(i=>i.productId===pid);
  if(existing) existing.qty += qty;
  else DB.cart.push({productId:pid, qty});
  persist();
  updateCartBadge();
}

function changeQty(pid, delta){
  const item = DB.cart.find(i=>i.productId===pid);
  if(!item) return;
  item.qty += delta;
  if(item.qty<=0){ removeFromCart(pid); return; }
  persist();
  renderCartItems();
}
function removeFromCart(pid){
  DB.cart = DB.cart.filter(i=>i.productId!==pid);

  if(DB.cart.length===0) renderCartPage($('#mainContent'));
  else renderCartItems();
  showToast('Removed from cart');

/* Placing an order creates ONE ORDER PER PRODUCT, like Flipkart —
   each item gets its own order id, status and tracking timeline. */
function placeOrder(grand, addr){
  addr = addr || DB.user.addresses[0];
  const t = orderTotals();
  const coupon = appliedCoupon();
  const now = Date.now();
  const cityStr = addr ? `${addr.city}, ${addr.state}` : SAMPLE_CITY_ROUTE[0];
  const addrStr = addr ? `${DB.user.name} · ${DB.user.phone}\n${addr.line}, ${addr.city}, ${addr.state} - ${addr.pincode}` : 'Unknown';

  const lines = DB.cart.map(i=>({
    productId: i.productId,
    qty: i.qty,
    price: getProduct(i.productId).price
  }));

  let remainingDiscount = t.discount;
  let remainingDelivery = t.delivery;
  const created = [];

  lines.forEach((line, idx)=>{
    const lineValue = line.price * line.qty;
    const last = idx === lines.length - 1;

    // Split the coupon discount proportionally; last order absorbs rounding.
    const disc = last
      ? remainingDiscount
      : Math.min(remainingDiscount, Math.round(t.discount * (lineValue / t.subtotal)));
    // Delivery is charged once — it lands on the first order.
    const del = last
      ? remainingDelivery
      : Math.min(remainingDelivery, idx === 0 ? t.delivery : 0);

    remainingDiscount -= disc;
    remainingDelivery -= del;

    const order = {
      id: 'TKR' + (DB.nextOrderNum++),
      placedAt: now,
      status: 'Placed',
      customerName: DB.user.name,
      customerPhone: DB.user.phone,
      currentCity: cityStr,
      address: addrStr,
      addressObj: addr,
      items: [line],
      subtotal: lineValue,
      total: lineValue - disc + del,
      payment: 'COD',
      couponCode: coupon ? coupon.code : null,
      couponDiscount: disc,
      deliveryFee: del,
      /* The window quoted at checkout, stored on the order so a later
         settings change cannot rewrite what this customer was promised. */
      etaMin: deliveryWindow().min,
      etaMax: deliveryWindow().max,
      reviewed: false,
      timeline: [ { stage:'Placed', at: now, city: cityStr, note:'Order placed successfully' } ],
    };
    DB.orders.unshift(order);
    created.push(order);
  });

  DB.cart = [];
  appliedCouponCode = null;
  persist();
  updateCartBadge();

  const grandTotal = created.reduce((s,o)=> s + o.total, 0);

  // Animated success screen (full-screen overlay, then the normal confirmation)
  showOrderSuccess(created, ()=>{
    pushView('Order Confirmed', (main)=>{
      main.innerHTML = `
        ${checkoutStepBar(2)}
        <div class="empty-state" style="padding-top:24px;">
          <div style="color:var(--success);width:64px;height:64px;">${icon('checkCircle')}</div>
          <h3>${created.length>1 ? created.length+' Orders Placed!' : 'Order Placed!'}</h3>
          <p>${created.length>1
              ? `${created.length} separate orders created — each item ships and tracks on its own.`
              : `Order <b>#${created[0].id}</b> confirmed.`}<br>Pay <b>${formatMoney(grandTotal)}</b> on delivery.</p>
          <div class="od-section" style="text-align:left;margin:16px 0;width:100%;">
            ${created.map(o=>{
              const p = getProduct(o.items[0].productId);
              return `<div class="trust-row">${icon('package')}<span><b>#${o.id}</b> · ${p?p.name:''} ×${o.items[0].qty}</span></div>`;
            }).join('')}
            <div class="trust-row">${icon('mapPin')}<span>${addr?.city}, ${addr?.state} - ${addr?.pincode}</span></div>
            <div class="trust-row">${icon('cash')}<span>Cash on Delivery</span></div>
          </div>
          <button class="btn btn-primary" id="trackNowBtn">${created.length>1?'View My Orders':'Track Order'}</button>
          <button class="text-btn" id="continueShopBtn">Continue Shopping</button>
        </div>`;
      $('#trackNowBtn').addEventListener('click', ()=>{
        viewStack=[];
        if(created.length > 1) switchTab('orders');
        else openOrderDetail(created[0].id, true);
      });
      $('#continueShopBtn').addEventListener('click', ()=>{ viewStack=[]; switchTab('home'); });
    });
  });
}

      Pay <b>${formatMoney(total)}</b> in cash when it arrives.
    </div>
    <button class="btn btn-primary" id="sucDone" style="min-width:200px;">Continue</button>
    <p style="font-size:12px;color:var(--ink-faint);margin-top:14px;">${icon('calendar')} Expected delivery <b>${etaRangeLabel(list[0])}</b></p>
  `;
  document.body.appendChild(el);

  // Confetti burst
  const colors = ['#FF3F6C','#FF7A45','#1E9E5A','#F7C948','#8E2DE2'];
  for(let i=0;i<34;i++){
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random()*100 + 'vw';
    c.style.background = colors[i % colors.length];
    c.style.animationDuration = (1.6 + Math.random()*1.2) + 's';
    c.style.animationDelay = (Math.random()*0.4) + 's';
    c.style.transform = `rotate(${Math.random()*360}deg)`;
    document.body.appendChild(c);
    setTimeout(()=> c.remove(), 3400);
  }
  if(navigator.vibrate) { try{ navigator.vibrate([40,60,40]); }catch(e){} }

  const close = ()=>{
    el.style.transition = 'opacity .25s ease';
    el.style.opacity = '0';
    setTimeout(()=>{ el.remove(); onDone && onDone(); }, 240);
  };
  $('#sucDone', el).addEventListener('click', close);
  setTimeout(()=>{ if(document.body.contains(el)) close(); }, 4200);
}

function openOrderDetail(oid, replaceStack){
  const order = DB.orders.find(o=>o.id===oid);
  if(!order) return;
  if(replaceStack) viewStack = [];
  pushView('Order #' + oid, (main)=> buildOrderDetail(main, order));
}
function buildOrderDetail(main, order){
  const stageIdx = ORDER_STAGES.indexOf(order.status);
  const isCancelled = order.status === 'Cancelled';
  const isReturned = order.status === 'Returned';

  const timelineHTML = isCancelled || isReturned
    ? `
      <div class="timeline-item">
        <div class="tl-marker-col"><div class="tl-dot done" style="background:var(--danger);">${icon('xCircle')}</div></div>
        <div class="tl-content">
          <div class="tl-title">${order.status}</div>
          <div class="tl-meta">${formatDate(order.timeline[order.timeline.length-1].at)} · ${order.timeline[order.timeline.length-1].city}</div>
        </div>
      </div>`
    : ORDER_STAGES.map((stage, i)=>{
        const tEntry = order.timeline.find(t=>t.stage===stage);
        const done = i <= stageIdx;
        const isCurrent = i === stageIdx;
        return `
          <div class="timeline-item">
            <div class="tl-marker-col">
              <div class="tl-dot ${done?'done':''} ${isCurrent?'current':''}">${done ? icon('checkCircle') : ''}</div>
              ${i < ORDER_STAGES.length-1 ? `<div class="tl-line ${i<stageIdx?'done':''}"></div>` : ''}
            </div>
            <div class="tl-content">
              <div class="tl-title ${done?'':'pending'}">${stage}</div>
              <div class="tl-meta">${tEntry ? formatDate(tEntry.at) + ' · ' + tEntry.city : 'Pending'}</div>
            </div>
          </div>`;
      }).join('');

  const currentCityBlock = !isCancelled && !isReturned ? `
    <div class="track-current-card card-fade-in">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div>
          <div style="font-size:11px;opacity:0.75;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:4px;">Current Location</div>
          <div class="track-current-city">${order.currentCity}</div>
          <div class="track-current-sub">Your order is on the way</div>
        </div>
        <div style="text-align:right;">
          <div style="background:rgba(255,255,255,0.2);border-radius:20px;padding:6px 14px;font-size:12px;font-weight:700;">${order.status==='Delivered' ? 'Delivered' : ('By ' + orderEta(order).to)}</div>
          ${order.trackingId?`<div style="font-size:10.5px;opacity:0.8;margin-top:6px;">ID: ${order.trackingId}</div>`:''}
        </div>
      </div>
      ${order.trackingDetail?`<div style="margin-top:10px;font-size:11.5px;opacity:0.85;">${icon('truck')} ${order.trackingDetail}</div>`:''}
    </div>` : `
    <div class="track-current-card card-fade-in" style="background:linear-gradient(120deg,#8b8a93,#6b6a72);">
      <div class="track-current-top">${icon(isCancelled?'xCircle':'refresh')}<span class="track-current-city">Order ${order.status}</span></div>
      <div class="track-current-sub">${order.address}</div>
    </div>`;

  const canCancel = canCancelOrder(order);
  const canReturn = canReturnOrder(order);
  const daysLeft = returnDaysLeft(order);

  let actionsHTML = '';
  if(canCancel){
    actionsHTML = `<button class="btn btn-danger-outline btn-block" id="cancelOrderBtn">Cancel Order</button>`;
  } else if(order.status === 'Delivered'){
    // Rate & review unlocks once the product has actually been delivered
    const alreadyReviewed = !!order.reviewed;
    actionsHTML = `
      <button class="btn btn-primary btn-block" id="rateOrderBtn">
        ${icon('star')} ${alreadyReviewed ? 'Edit Your Review' : 'Rate & Review Product'}
      </button>`;
    if(canReturn){
      actionsHTML += `<button class="btn btn-outline btn-block" id="returnOrderBtn">Return Order (${daysLeft} day${daysLeft!==1?'s':''} left)</button>`;
    } else {
      actionsHTML += `<div class="policy-note">${icon('info')}<span>Return window has expired. Returns are only accepted within ${DB.settings.returnWindowDays} days of delivery.</span></div>`;
    }
  }

  const etaCardHTML = (()=>{
    const e = orderEta(order);
    if(e.kind === 'none') return '';
    if(e.kind === 'delivered'){
      return `<div class="eta-card is-delivered">
        <div class="eta-ico">${icon('checkCircle')}</div>
        <div>
          <div class="eta-k">Delivered On</div>
          <div class="eta-v">${e.from}</div>
          <div class="eta-n">Received in full. A return can still be raised inside the return window.</div>
        </div>
      </div>`;
    }
    const w = orderWindow(order);
    return `<div class="eta-card">
      <div class="eta-ico">${icon('truck')}</div>
      <div>
        <div class="eta-k">Expected Delivery</div>
        <div class="eta-v">${etaRangeLabel(order)}</div>
        <div class="eta-n">${etaDaysText(w.min, w.max)} from your order on ${shortDay(new Date(orderPlacedTs(order)))}</div>
      </div>
    </div>`;
  })();

  main.innerHTML = `
    ${currentCityBlock}
    ${etaCardHTML}
    <div class="section"><span class="section-title">Order Timeline</span></div>
    <div class="timeline">${timelineHTML}</div>
    ${actionsHTML ? `<div class="track-actions" style="flex-direction:column;">${actionsHTML}</div>` : ''}
    <div class="od-section">
      <h4>Items in this order</h4>
      ${order.items.map(i=>{
        const p = getProduct(i.productId);
        if(!p) return '';
        return `<div class="od-product-row"><img src="${p.img}"><span class="od-product-name">${p.name} × ${i.qty}</span><span class="od-product-price">${formatMoney(i.price*i.qty)}</span></div>`;
      }).join('')}
    </div>
    <div class="od-section">
      <h4>Delivery Address</h4>
      <div class="trust-row">${icon('user')}<span><b>${order.customerName||DB.user.name}</b> · ${order.customerPhone||DB.user.phone}</span></div>
      <p style="font-size:13px;color:var(--ink-soft);margin-top:6px;line-height:1.6;">${(order.address||'').replace(/\n/g,'<br>')}</p>
    </div>
    <div class="od-section">
      <h4>Payment</h4>
      <div class="trust-row">${icon('cash')}<span>Cash on Delivery · ${formatMoney(order.total)}</span></div>
    </div>
    ${order.trackingId ? `
    <div class="od-section">
      <h4>${icon('truck')} Tracking Info</h4>
      <div class="trust-row">${icon('copy')}<span><b>Tracking ID:</b> ${order.trackingId}</span></div>
      ${order.trackingDetail ? `<div class="trust-row">${icon('box')}<span><b>Courier:</b> ${order.trackingDetail}</span></div>` : ''}
    </div>` : ''}
    <div class="policy-note">
      ${icon('info')}
      <span>Cancel is available only before your order ships. Returns are accepted within ${DB.settings.returnWindowDays} days after delivery.</span>
    </div>
  `;

  if(canCancel){
    $('#cancelOrderBtn').addEventListener('click', ()=> confirmAction(
      'Cancel this order?', 'This action cannot be undone. Your order will be cancelled.',
      ()=>{
        order.status = 'Cancelled';
        order.timeline.push({ stage:'Cancelled', at: Date.now(), city: order.currentCity });
        persist();
        showToast('Order cancelled', 'checkCircle');
        buildOrderDetail(main, order);
      }
    ));
  }
  const rateBtn = $('#rateOrderBtn');
  if(rateBtn) rateBtn.addEventListener('click', ()=>{
    reviewSheet(order, ()=> buildOrderDetail(main, order));
  });
  if(canReturn){
    $('#returnOrderBtn').addEventListener('click', ()=> openReturnSheet(order, ()=> buildOrderDetail(main, order)));
  }
}

// ---- Return / Exchange sheet ----
function openReturnSheet(order, onDone){
  const overlay = document.createElement('div');
  overlay.className = 'bottom-sheet-overlay';
  overlay.innerHTML = `
    <div class="bottom-sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title"><span>Return / Exchange</span><button class="icon-btn" id="rsClose">${icon('close')}</button></div>
      <p style="font-size:13px;color:var(--ink-soft);margin-bottom:16px;">What would you like to do with this order?</p>
      <div style="display:flex;gap:10px;margin-bottom:18px;">
        <button class="btn btn-secondary btn-block rs-type-btn" data-type="Refund" style="flex:1;flex-direction:column;gap:4px;padding:14px 10px;">
          ${icon('wallet')}<span style="font-size:13px;">Refund</span><span style="font-size:11px;color:var(--ink-faint);font-weight:500;">Money back to you</span>
        </button>
        <button class="btn btn-secondary btn-block rs-type-btn" data-type="Exchange" style="flex:1;flex-direction:column;gap:4px;padding:14px 10px;">
          ${icon('refresh')}<span style="font-size:13px;">Exchange</span><span style="font-size:11px;color:var(--ink-faint);font-weight:500;">Get a different item</span>
        </button>
      </div>
      <div class="form-group">
        <label class="form-label">Reason</label>
        <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:10px;">
          ${['Wrong size / doesn\'t fit','Wrong item delivered','Damaged / defective product','Different from description','Changed my mind','Other'].map(r=>`
            <label style="display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:500;cursor:pointer;">
              <input type="radio" name="rsReason" value="${r}" style="accent-color:var(--brand);width:16px;height:16px;"> ${r}
            </label>`).join('')}
        </div>
        <textarea class="form-textarea" id="rsNote" placeholder="Add more details (optional)…" style="min-height:60px;"></textarea>
      </div>

      <!-- Refund payment details — shown only when Refund is selected -->
      <div id="rsRefundSection" style="display:none;">
        <div style="background:var(--warn-bg);border-radius:var(--radius-md);padding:12px 14px;margin-bottom:14px;">
          <p style="font-size:12.5px;font-weight:600;color:var(--warn);">Enter your refund account details. Refund will be processed within 5–7 business days after pickup.</p>
        </div>
        <div class="form-group">
          <label class="form-label">Refund Method</label>
          <div style="display:flex;gap:10px;margin-bottom:12px;">
            <button class="btn btn-secondary rs-pay-btn" data-pay="UPI" style="flex:1;">UPI</button>
            <button class="btn btn-secondary rs-pay-btn" data-pay="Bank" style="flex:1;">Bank Transfer</button>
          </div>
        </div>
        <div id="rsUpiFields" style="display:none;">
          <div class="form-group"><label class="form-label">UPI ID</label><input class="form-input" id="rsUpiId" placeholder="e.g. name@upi or 9999999999@paytm"></div>
        </div>
        <div id="rsBankFields" style="display:none;">
          <div class="form-group"><label class="form-label">Account Holder Name</label><input class="form-input" id="rsBankName" placeholder="Full name as per bank"></div>
          <div class="form-group"><label class="form-label">Account Number</label><input class="form-input" id="rsBankAccNo" type="tel" placeholder="Bank account number"></div>
          <div class="form-group"><label class="form-label">IFSC Code</label><input class="form-input" id="rsBankIfsc" placeholder="e.g. HDFC0001234"></div>
          <div class="form-group"><label class="form-label">Bank Name</label><input class="form-input" id="rsBankBankName" placeholder="e.g. HDFC Bank"></div>
        </div>
      </div>

      <div id="rsTypeError" style="color:var(--danger);font-size:12px;display:none;margin-bottom:8px;">Please choose Refund or Exchange.</div>
      <div id="rsReasonError" style="color:var(--danger);font-size:12px;display:none;margin-bottom:8px;">Please select a reason.</div>
      <div id="rsPayError" style="color:var(--danger);font-size:12px;display:none;margin-bottom:8px;">Please enter your refund account details.</div>
      <button class="btn btn-primary btn-block" id="rsSubmit">Submit Request</button>
    </div>`;
  document.body.appendChild(overlay);

  let selectedType = '';
  let selectedPayMethod = '';

  // Type selection
  overlay.querySelectorAll('.rs-type-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      selectedType = btn.dataset.type;
      overlay.querySelectorAll('.rs-type-btn').forEach(b=>{ b.style.boxShadow=''; b.style.background=''; });
      btn.style.boxShadow = '0 0 0 2px var(--brand)';
      overlay.querySelector('#rsRefundSection').style.display = selectedType==='Refund' ? 'block' : 'none';
    });
  });

  // Pay method selection
  overlay.querySelectorAll('.rs-pay-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      selectedPayMethod = btn.dataset.pay;
      overlay.querySelectorAll('.rs-pay-btn').forEach(b=>{ b.style.boxShadow=''; });
      btn.style.boxShadow = '0 0 0 2px var(--brand)';
      overlay.querySelector('#rsUpiFields').style.display = selectedPayMethod==='UPI' ? 'block' : 'none';
      overlay.querySelector('#rsBankFields').style.display = selectedPayMethod==='Bank' ? 'block' : 'none';
    });
  });

  overlay.querySelector('#rsClose').addEventListener('click', ()=> overlay.remove());
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });

  overlay.querySelector('#rsSubmit').addEventListener('click', ()=>{
    const typeErr = overlay.querySelector('#rsTypeError');
    const reasonErr = overlay.querySelector('#rsReasonError');
    const payErr = overlay.querySelector('#rsPayError');
    const selectedReason = overlay.querySelector('input[name="rsReason"]:checked');
    typeErr.style.display = selectedType ? 'none' : 'block';
    reasonErr.style.display = selectedReason ? 'none' : 'block';

    // Validate refund details
    let refundDetails = null;
    if(selectedType === 'Refund'){
      if(!selectedPayMethod){ payErr.style.display='block'; return; }
      payErr.style.display='none';
      if(selectedPayMethod==='UPI'){
        const upi = overlay.querySelector('#rsUpiId').value.trim();
        if(!upi){ showToast('Please enter your UPI ID'); return; }
        refundDetails = { method:'UPI', upiId: upi };
      } else {
        const bankName = overlay.querySelector('#rsBankName').value.trim();
        const accNo = overlay.querySelector('#rsBankAccNo').value.trim();
        const ifsc = overlay.querySelector('#rsBankIfsc').value.trim();
        const bankBankName = overlay.querySelector('#rsBankBankName').value.trim();
        if(!bankName||!accNo||!ifsc){ showToast('Please fill all bank details'); return; }
        refundDetails = { method:'Bank', accountName:bankName, accountNo:accNo, ifsc, bankName:bankBankName };
      }
    }

    if(!selectedType || !selectedReason) return;
    const note = overlay.querySelector('#rsNote').value.trim();
    order.status = selectedType==='Refund' ? 'Return Requested' : 'Return Requested';
    order.returnType = selectedType;
    order.returnReason = selectedReason.value + (note ? ' — ' + note : '');
    if(refundDetails) order.refundDetails = refundDetails;
    order.timeline.push({ stage:`${selectedType} Requested`, at: Date.now(), city: order.currentCity });
    persist();
    overlay.remove();
    showToast(`${selectedType} request submitted`, 'checkCircle');
    onDone();
  });
}

// Generic confirm modal (bottom sheet style)
function confirmAction(title, desc, onConfirm){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  // Must sit above the admin shell (z-index 400) and the PIN modal (200),
  // otherwise confirmations triggered from those screens render underneath
  // them and cannot be tapped.
  overlay.style.zIndex = '500';
  overlay.innerHTML = `
    <div class="modal-card">
      <h3>${title}</h3>
      <p class="muted" style="margin-top:6px;">${desc}</p>
      <div style="display:flex;gap:10px;margin-top:20px;">
        <button class="btn btn-secondary btn-block" id="cfCancel">No, Keep it</button>
        <button class="btn btn-primary btn-block" id="cfOk">Yes, Confirm</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#cfCancel').addEventListener('click', ()=> overlay.remove());
  overlay.querySelector('#cfOk').addEventListener('click', ()=>{ overlay.remove(); onConfirm(); });
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) overlay.remove(); });
}

  });
}

function openAddresses(){
  pushView('Saved Addresses', (main)=>{
    const render = ()=>{
      const list = DB.user.addresses;
      main.innerHTML = `
        <div style="padding:14px 16px 100px;">
          ${list.length ? list.map(a=>`
            <div class="addr-card ${a.isDefault?'is-default':''}">
              <div class="addr-top">
                <span class="addr-label">${a.label||'Home'}</span>
                ${a.isDefault?`<span style="font-size:10.5px;font-weight:700;color:var(--success);display:inline-flex;align-items:center;gap:3px;">${icon('checkCircle','ic-xs')} Default</span>`:''}
              </div>
              <div class="addr-name">${DB.user.name} · ${DB.user.phone||''}</div>
              <div class="addr-line">${a.line}, ${a.city},<br>${a.state} - ${a.pincode}</div>
              <div class="addr-actions">
                ${a.isDefault?'':`<button data-def="${a.id}">Set as Default</button>`}
                <button data-edit="${a.id}">Edit</button>
                ${list.length>1?`<button class="danger" data-del="${a.id}">Delete</button>`:''}
              </div>
            </div>`).join('')
          : `<div class="empty-state">${icon('mapPin')}<h3>No saved addresses</h3><p>Add an address to speed up checkout.</p></div>`}
          <button class="btn btn-outline btn-block" id="addAddrBtn" style="margin-top:6px;">${icon('plus')} Add New Address</button>
        </div>`;

      $('#addAddrBtn').addEventListener('click', ()=> addressForm(null, render));
      $$('[data-edit]', main).forEach(b=> b.addEventListener('click', ()=>{
        addressForm(b.dataset.edit, render);
      }));
      $$('[data-def]', main).forEach(b=> b.addEventListener('click', ()=>{
        DB.user.addresses.forEach(a=> a.isDefault = (a.id === b.dataset.def));
        persist();
        render();
        showToast('Default address updated', 'checkCircle');
      }));
      $$('[data-del]', main).forEach(b=> b.addEventListener('click', ()=>{
        const a = DB.user.addresses.find(x=>x.id===b.dataset.del);
        confirmAction('Delete address?', `${a.label} — ${a.line}, ${a.city}`, ()=>{
          DB.user.addresses = DB.user.addresses.filter(x=>x.id!==b.dataset.del);
          if(!DB.user.addresses.some(x=>x.isDefault) && DB.user.addresses.length)
            DB.user.addresses[0].isDefault = true;
          persist();
          render();
          showToast('Address deleted', 'checkCircle');
        });
      }));
    };
    render();
  });
}

/* ---- Add / edit an address (bottom sheet) ---- */
function addressForm(addrId, onSaved){
  const a = addrId ? DB.user.addresses.find(x=>x.id===addrId) : null;
  const overlay = document.createElement('div');
  overlay.className = 'bottom-sheet-overlay';
  overlay.innerHTML = `
    <div class="bottom-sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title"><span>${a?'Edit Address':'Add New Address'}</span><button class="icon-btn" id="afClose">${icon('close')}</button></div>
      <div style="max-height:64vh;overflow-y:auto;padding-bottom:4px;">
        <div class="form-group"><label class="form-label">Full Name</label>
          <input class="form-input" id="afName" placeholder="e.g. Priya Sharma" value="${DB.user.name||''}"></div>
        <div class="form-group"><label class="form-label">Phone number</label>
          <input class="form-input" id="afPhone" inputmode="numeric" placeholder="10-digit mobile number" value="${(DB.user.phone||'').replace(/\D/g,'').slice(-10)}"></div>
        <div class="form-group"><label class="form-label">Address</label>
          <input class="form-input" id="afLine" placeholder="House no., street, area" value="${a?a.line:''}"></div>
        <div style="display:flex;gap:10px;">
          <div class="form-group" style="flex:1;"><label class="form-label">City</label>
            <input class="form-input" id="afCity" placeholder="City" value="${a?a.city:''}"></div>
          <div class="form-group" style="flex:1;"><label class="form-label">Pincode</label>
            <input class="form-input" id="afPin" inputmode="numeric" placeholder="6-digit pincode" value="${a?a.pincode:''}"></div>
        </div>
        <div class="form-group"><label class="form-label">State</label>
          <input class="form-input" id="afState" placeholder="State" value="${a?a.state:''}"></div>
        <div class="form-group"><label class="form-label">Save as</label>
          <div style="display:flex;gap:8px;">
            ${['Home','Work','Other'].map(l=>`<button type="button" class="size-chip af-label ${(a?a.label:'Home')===l?'selected':''}" data-label="${l}">${l}</button>`).join('')}
          </div>
        </div>
      </div>
      <button class="btn btn-primary btn-block" id="afSave" style="margin-top:8px;">${a?'Save Changes':'Add Address'}</button>
    </div>`;
  document.body.appendChild(overlay);

  let chosenLabel = a ? (a.label||'Home') : 'Home';
  overlay.querySelectorAll('.af-label').forEach(b=>{
    b.addEventListener('click', ()=>{
      chosenLabel = b.dataset.label;
      overlay.querySelectorAll('.af-label').forEach(x=>x.classList.remove('selected'));
      b.classList.add('selected');
    });
  });

  const close = ()=> overlay.remove();
  overlay.querySelector('#afClose').addEventListener('click', close);
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) close(); });

  overlay.querySelector('#afSave').addEventListener('click', ()=>{
    const name  = overlay.querySelector('#afName').value.trim();
    const phone = overlay.querySelector('#afPhone').value.trim();
    const line  = overlay.querySelector('#afLine').value.trim();
    const city  = overlay.querySelector('#afCity').value.trim();
    const pin   = overlay.querySelector('#afPin').value.trim();
    const state = overlay.querySelector('#afState').value.trim();

    if(!name){ showToast('Enter your name'); return; }
    if(!/^\d{10}$/.test(phone)){ showToast('Enter a valid 10-digit phone'); return; }
    if(!line){ showToast('Enter your address'); return; }
    if(!city){ showToast('Enter your city'); return; }
    if(!/^\d{6}$/.test(pin)){ showToast('Enter a valid 6-digit pincode'); return; }
    if(!state){ showToast('Enter your state'); return; }

    DB.user.name = name;
    DB.user.phone = '+91 ' + phone;
    if(a){
      Object.assign(a, { label:chosenLabel, line, city, state, pincode:pin });
    } else {
      const isFirst = DB.user.addresses.length === 0;
      DB.user.addresses.push({
        id:'a'+Date.now(), label:chosenLabel, line, city, state, pincode:pin, isDefault:isFirst
      });
    }
    persist();
    close();
    if(onSaved) onSaved();
    showToast(a?'Address updated':'Address added', 'checkCircle');
  });
}

// ============================================================
// ADMIN TRIGGER
// The entry point sits far away from anything a customer would press: it is the
// small copyright line at the very bottom of the storefront page. Nobody taps a
// "v4.0" label 25 times by accident, and the window resets 3s after the last tap.
// Three ways in, because a hidden gesture that silently fails is worse
// than no gesture at all:
//   1. tap the footer version line 25x (window resets 3s after the last tap)
//   2. press and hold the same footer line for 2.5s
//   3. open the file with #admin on the end of the URL
// ============================================================
const ADMIN_TAPS_NEEDED   = 25;
const ADMIN_TAP_WINDOW_MS = 3000;
const ADMIN_HOLD_MS       = 2500;
const ADMIN_TAP_SELECTOR  = '#adminTapZone';
const ADMIN_PIN_DEFAULT   = '1234';

function initAdminTrigger(){
  // Delegated on document so the trigger keeps working even if the storefront
  // page is re-rendered and the original footer element is replaced.
  document.addEventListener('click', (e)=>{
    if(!(e.target instanceof Element) || !e.target.closest(ADMIN_TAP_SELECTOR)) return;
    registerAdminTap();
  });

  let holdTimer = null;
  const cancelHold = ()=>{ if(holdTimer){ clearTimeout(holdTimer); holdTimer = null; } };
  document.addEventListener('pointerdown', (e)=>{
    if(!(e.target instanceof Element) || !e.target.closest(ADMIN_TAP_SELECTOR)) return;
    cancelHold();
    holdTimer = window.setTimeout(()=>{ holdTimer = null; openAdminPin(); }, ADMIN_HOLD_MS);
  }, true);
  document.addEventListener('pointerup', cancelHold, true);
  document.addEventListener('pointercancel', cancelHold, true);

  if(String(location.hash).replace('#','').toLowerCase() === 'admin'){
    try{ history.replaceState(null, '', location.pathname + location.search); }catch(_){}
    window.setTimeout(openAdminPin, 500);
  }
}

/* No OTP / no login screen. A customer becomes "known" simply by giving
   their mobile number at checkout — which is all a Cash-on-Delivery shop
   needs to deliver an order and to show them their own order history. */
/* Signed in = we hold a real account token from the server. If the backend
   is switched off, fall back to the old local check so the app still works. */
function isLoggedIn(){
  const online = !!(window.NC && NC.base);
  if(online) return !!(window.NC.signedIn() || (DB.user && DB.user.accountId));
  const digits = String((DB.user && DB.user.phone) || '').replace(/\D/g,'');
  return digits.length >= 10 && !!(DB.user && (DB.user.addresses || []).length);
}
/* Sign-in itself happens on the server (see showLoginScreen). This mirrors
   the returned account onto the local profile so the app shows it. */
function applyAccountToProfile(u){
  if(!u) return;
  if(u.name)  DB.user.name  = u.name;
  if(u.phone) DB.user.phone = '+91 ' + u.phone;
  DB.user.email     = u.email || '';
  DB.user.accountId = u.id || '';
  DB.user.provider  = u.provider || '';
  persist();
}
function doLogin(user){ applyAccountToProfile(user); persist(); }
function doLogout(){
  const finish = ()=>{
    DB.user.accountId = ''; DB.user.provider = ''; DB.user.email = '';
    persist();
    location.reload();
  };
  if(window.NC && NC.logout) NC.logout().then(finish).catch(finish);
  else finish();
}

let googleClientId = '';
function loadGoogleClientId(){
  if(googleClientId) return Promise.resolve(googleClientId);
  if(!(window.NC && NC.base)) return Promise.resolve('');
  return fetch(NC.base + '/api/config')
    .then(r=> r.json())
    .then(c=>{ googleClientId = (c && c.googleClientId) || ''; return googleClientId; })
    .catch(()=> '');
}
function loadGsiScript(cb){
  if(window.google && window.google.accounts) return cb();
  if(document.getElementById('gsiClient')){ setTimeout(()=> loadGsiScript(cb), 250); return; }
  const sc = document.createElement('script');
  sc.id = 'gsiClient';
  sc.src = 'https://accounts.google.com/gsi/client';
  sc.async = true; sc.defer = true; sc.onload = cb;
  document.head.appendChild(sc);
}

function showLoginScreen(onSuccess, reason){
  const loginEl = $('#loginScreen');
  loginEl.classList.add('active');
  let mode = 'login';        // 'login' | 'signup'
  let working = false;

  const closeBtn = $('#loginCloseBtn');
  if(closeBtn){
    closeBtn.innerHTML = icon('close');
    closeBtn.onclick = ()=> loginEl.classList.remove('active');
  }

  function showErr(msg){
    const el = loginEl.querySelector('#lfError');
    if(!el) return;
    if(!msg){ el.style.display = 'none'; return; }
    el.textContent = msg; el.style.display = 'block';
  }
  function setWorking(on, btn){
    working = on;
    if(btn){ btn.disabled = on; btn.textContent = on ? 'Please wait…' : btn.dataset.label; }
  }

  function renderStep(){
    const body = loginEl.querySelector('#loginBody');
    const appName = DB.branding.appName || 'Nexcart';
    const signup = mode === 'signup';
    body.innerHTML = `
      <h2 class="lf-brand">${appName}</h2>
      <p class="lf-tagline">${DB.branding.tagline || ''}</p>
      <div class="login-card card-fade-in">
        ${reason ? `<p class="lf-reason">Login to ${reason}</p>` : ''}
        <h3 class="lf-title">${signup ? 'Create your account' : 'Login'}</h3>
        <p class="lf-sub">${signup ? 'No OTP needed — just pick a password.' : 'Welcome back to ' + appName}</p>
        <div class="lf-error" id="lfError" style="display:none;"></div>
        ${signup ? `<label class="lf-label" for="lfName">Your name</label>
          <input class="form-input" id="lfName" type="text" placeholder="e.g. Priya Sharma" autocomplete="name">` : ''}
        <label class="lf-label" for="lfPhone">Mobile number</label>
        <div class="lf-phone-row">
          <span class="lf-cc">+91</span>
          <input class="form-input" id="lfPhone" type="tel" inputmode="numeric" maxlength="10"
                 placeholder="10-digit number" autocomplete="tel" style="flex:1;">
        </div>
        <label class="lf-label" for="lfPass">Password</label>
        <div class="lf-pass-row">
          <input class="form-input" id="lfPass" type="password"
                 autocomplete="${signup ? 'new-password' : 'current-password'}"
                 placeholder="${signup ? 'At least 6 characters' : 'Your password'}">
          <button class="lf-eye" id="lfEye" type="button" aria-label="Show password">${icon('eye')}</button>
        </div>
        <button class="btn btn-primary btn-block" id="lfGo"
                data-label="${signup ? 'Create account' : 'Login'}" style="margin-top:18px;">${signup ? 'Create account' : 'Login'}</button>
        <div class="lf-or" id="lfOr" style="display:none;"><span></span><em>OR</em><span></span></div>
        <div class="gsi-wrap" id="gsiWrap" style="display:none;"><div id="gsiButton"></div></div>
        <p class="lf-note">By continuing you agree to our Terms &amp; Privacy Policy.</p>
        <p class="lf-switch">
          ${signup ? 'Already have an account?' : 'New to ' + appName + '?'}
          <button class="lf-link" id="lfSwitch" type="button">${signup ? 'Login' : 'Create account'}</button>
        </p>
      </div>
      <button class="lf-guest" id="lfGuest" type="button">Continue browsing without an account</button>`;

    loginEl.querySelector('#lfEye').addEventListener('click', ()=>{
      const f = loginEl.querySelector('#lfPass');
      f.type = f.type === 'password' ? 'text' : 'password';
    });
    loginEl.querySelector('#lfSwitch').addEventListener('click', ()=>{
      mode = signup ? 'login' : 'signup';
      renderStep();
    });
    loginEl.querySelector('#lfGuest').addEventListener('click', ()=> loginEl.classList.remove('active'));
    loginEl.querySelector('#lfGo').addEventListener('click', submit);
    loginEl.querySelector('#lfPass').addEventListener('keydown', (e)=>{ if(e.key === 'Enter') submit(); });
    mountGoogle();
  }

  function submit(){
    if(working) return;
    const btn    = loginEl.querySelector('#lfGo');
    const phone  = (loginEl.querySelector('#lfPhone').value || '').trim();
    const pass   = loginEl.querySelector('#lfPass').value || '';
    const nameEl = loginEl.querySelector('#lfName');
    showErr('');
    if(!/^\d{10}$/.test(phone)){ showErr('Enter a valid 10-digit mobile number'); return; }
    if(mode === 'signup'){
      if(!nameEl || nameEl.value.trim().length < 2){ showErr('Please enter your name'); return; }
      if(pass.length < 6){ showErr('Password must be at least 6 characters'); return; }
    } else if(!pass){ showErr('Please enter your password'); return; }
    if(!(window.NC && NC.auth)){ showErr('Accounts are unavailable at the moment.'); return; }
    setWorking(true, btn);
    const call = mode === 'signup'
      ? NC.auth.signup(nameEl.value.trim(), phone, pass)
      : NC.auth.login(phone, pass);
    call.then(d=>{
      loginEl.classList.remove('active');
      showToast(mode === 'signup' ? 'Account created' : ('Welcome back, ' + ((d.user && d.user.name) || '')), 'checkCircle');
      onSuccess && onSuccess();
    }).catch(e=>{
      setWorking(false, btn);
      showErr((e && e.message) || 'Could not sign you in');
    });
  }

  function mountGoogle(){
    loadGoogleClientId().then(id=>{
      if(!id) return;                        // not configured yet — stay hidden
      const wrap = loginEl.querySelector('#gsiWrap');
      const or   = loginEl.querySelector('#lfOr');
      if(!wrap) return;
      wrap.style.display = 'flex';
      if(or) or.style.display = 'flex';
      loadGsiScript(()=>{
        try{
          google.accounts.id.initialize({
            client_id: id,
            callback: (gResp)=>{
              if(!gResp || !gResp.credential || !(window.NC && NC.auth)) return;
              showErr('');
              NC.auth.google(gResp.credential).then(d=>{
                loginEl.classList.remove('active');
                if(d.needsPhone) askMobileForGoogle(()=> onSuccess && onSuccess());
                else { showToast('Welcome, ' + ((d.user && d.user.name) || ''), 'checkCircle'); onSuccess && onSuccess(); }
              }).catch(e=> showErr((e && e.message) || 'Google sign-in failed'));
            }
          });
          const box = loginEl.querySelector('#gsiButton');
          box.innerHTML = '';
          google.accounts.id.renderButton(box, {
            theme:'outline', size:'large', text:'continue_with', shape:'rectangular',
            width: Math.min(320, Math.max(200, box.clientWidth || 300))
          });
        }catch(e){}
      });
    });
  }

  renderStep();
}

      const isVideo = sp.type === 'video';
      const media = document.createElement(isVideo ? 'video' : 'img');
      media.className = 'splash-media';
      media.src = src;
      if(isVideo){
        media.autoplay = true; media.muted = true; media.loop = true;
        media.setAttribute('playsinline', ''); media.setAttribute('muted', '');
        const pr = media.play();
        if(pr && pr.catch) pr.catch(()=>{});
      } else {
        media.alt = '';
      }
      splash.classList.add('has-media');
      splash.insertBefore(media, splash.firstChild);
      hold = Math.max(1, Math.min(15, Number(sp.seconds) || 4)) * 1000;
    }
  }catch(e){}

  setTimeout(()=>{
    splash.style.animation = 'fadeOut .4s ease forwards';
    setTimeout(()=>{
      splash.style.display = 'none';
      $('#app').style.display = 'flex';
      const m = splash.querySelector('.splash-media');
      if(m && m.tagName === 'VIDEO'){ try{ m.pause(); }catch(e){} }
    }, 380);
  }, hold);
}

/* ============================================================
   PWA — installable app + offline
   ============================================================ */
let deferredInstallPrompt = null;

function registerServiceWorker(){
  if(!('serviceWorker' in navigator)) return;
  // Service workers need https:// or http://localhost — silently skip on file://
  if(location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') return;
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{ /* offline/install just unavailable */ });
  });
}

window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  updateInstallRow();
});

/* Show the "Install App" row only when installing is actually possible */
function updateInstallRow(){
  const row = $('#installAppRow');
  if(!row) return;
  const standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
                     || window.navigator.standalone === true;
  if(standalone){ row.style.display = 'none'; return; }
  row.style.display = (isIOS() || deferredInstallPrompt) ? 'flex' : 'none';
}

function promptInstallApp(){
  if(deferredInstallPrompt){
    deferredInstallPrompt.prompt();
    deferredInstallPrompt.userChoice.then((res)=>{
      if(res.outcome === 'accepted') showToast('Installing Nexcart…', 'checkCircle');
      deferredInstallPrompt = null;
    });
    return;
  }
  // iOS Safari + browsers without the prompt event — show manual steps
  confirmAction(
    'Install Nexcart on your phone',
    isIOS()
      ? 'Tap the Share button in Safari, then choose "Add to Home Screen".'
      : 'Open the browser menu (⋮) and choose "Install app" or "Add to Home screen".'
  );
}
function isIOS(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
}

/* Gate an action behind login. Browsing is always open — this only fires when
   the customer tries to do something that genuinely needs an account. */
/* Option A — no login gate. Checkout, wishlist, reviews, orders and profile
   all simply proceed. The delivery address form inside checkout is what
   collects the name and mobile number, so nothing is lost by skipping it. */
/* Gated actions (checkout, wishlist, orders, profile, reviews) ask the
   customer to sign in first. Browsing the shop never needs an account. */
function requireLogin(what, onOk){
  if(isLoggedIn()){ onOk && onOk(); return true; }
  const reasons = {
    checkout: 'place your order',
    wishlist: 'save items to your wishlist',
    profile:  'view your profile',
    review:   'write a review',
    orders:   'see your orders'
  };
  showLoginScreen(()=> onOk && onOk(), reasons[what] || 'continue');
  return false;
}
function isGuest(){ return !isLoggedIn(); }

function boot(){
  applyBranding();
  registerServiceWorker();
  // Guests can browse the whole store. Login is only asked for at the point
  // of checkout / wishlist / profile / reviews.
  launchApp();
}

document.addEventListener('DOMContentLoaded', boot);

let pinInput = '';
let adminUnlocked = false;
let adminStack = [];

function initPinKeypad(){
  const keys = ['1','2','3','4','5','6','7','8','9','','0','back'];
  const pad = $('#pinKeypad');
  pad.innerHTML = keys.map(k=>{
    if(k==='') return `<div class="pin-key empty"></div>`;
    if(k==='back') return `<button class="pin-key" data-key="back">${icon('back')}</button>`;
    return `<button class="pin-key" data-key="${k}">${k}</button>`;
  }).join('');
  $$('.pin-key[data-key]', pad).forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const key = btn.dataset.key;
      if(key==='back'){ pinInput = pinInput.slice(0,-1); }
      else if(pinInput.length < 10){ pinInput += key; }   // PIN can be 4–10 digits
      $('#pinError').style.display = 'none';
      updatePinDots();
    });
  });
  $('#pinUnlockBtn').addEventListener('click', checkPin);
  $('#pinCancelBtn').addEventListener('click', closePinModal);
  const resetBtn = $('#pinResetBtn');
  if(resetBtn) resetBtn.addEventListener('click', resetAdminPin);
}
/* The stored PIN is only trusted when it is actually a 4–10 digit code.
   Anything else (missing key, legacy value from an older build, corrupt
   storage) falls back to the documented default instead of locking the owner
   out of their own shop. */
function adminPinValue(){
  const p = String((DB.settings && DB.settings.adminPin) || '');
  return /^\d{4,10}$/.test(p) ? p : ADMIN_PIN_DEFAULT;
}
function resetAdminPin(){
  confirmAction(
    'Reset admin access?',
    'The admin PIN goes back to ' + ADMIN_PIN_DEFAULT + '. Your products, orders, categories and branding are kept.',
    ()=>{
      DB.settings.adminPin = ADMIN_PIN_DEFAULT;
      persist();
      pinInput = '';
      updatePinDots();
      $('#pinError').style.display = 'none';
      showToast('Admin PIN reset to ' + ADMIN_PIN_DEFAULT, 'checkCircle');
    }
  );
}
function updatePinDots(){
  // One dot per entered digit (grows as you type, up to 10)
  const wrap = $('#pinDots');
  const n = Math.max(pinInput.length, 4);   // show at least 4 placeholders
  let h = '';
  for(let i=0;i<n;i++) h += `<span class="${i < pinInput.length ? 'filled' : ''}"></span>`;
  wrap.innerHTML = h;
}
function openAdminPin(){
  pinInput = '';
  updatePinDots();
  $('#pinError').style.display = 'none';
  $('#pinModal').style.display = 'flex';
}
function closePinModal(){
  $('#pinModal').style.display = 'none';
  pinInput = '';
}
function checkPin(){
  if(pinInput.length < 4){
    $('#pinError').textContent = 'PIN must be at least 4 digits.';
    $('#pinError').style.display = 'block';
    return;
  }
  if(pinInput === adminPinValue()){
    closePinModal();
    openAdminPanel();
  } else {
    $('#pinError').textContent = 'Incorrect PIN. Try again.';
    $('#pinError').style.display = 'block';
    pinInput = '';
    updatePinDots();
  }
}

       ${adminNavItem('settings','settings','Settings',activeTab)}
     </div>
  `;
}
function adminNavItem(page, iconName, label, active){
  return `<button class="nav-item ${active===page?'active':''}" data-admin-page="${page}"><span class="nav-icon">${ICONS[iconName]}</span><span class="nav-label">${label}</span></button>`;
}
function bindAdminNav(){
  $$('#adminShell [data-admin-page]').forEach(btn=>{
    btn.addEventListener('click', ()=> renderAdminTab(btn.dataset.adminPage));
  });
  const exitBtn = $('#adminExitBtn');
  if(exitBtn) exitBtn.addEventListener('click', closeAdminPanel);
  const fab = $('#adminFab');
  if(fab) fab.addEventListener('click', ()=>{
    const tab = fab.dataset.tab;
    if(tab==='products') openProductForm();
    else if(tab==='categories') categoryForm(null, ()=> renderAdminCategories($('#adminShell')));
  });
}

function renderAdminTab(tab){
  const shell = $('#adminShell');
  if(tab==='dashboard') renderAdminDashboard(shell);
  else if(tab==='products') renderAdminProducts(shell);
  else if(tab==='categories') renderAdminCategories(shell);
  else if(tab==='orders') renderAdminOrders(shell);
  else if(tab==='customers') renderAdminCustomers(shell);
  else if(tab==='offers') renderAdminOffers(shell);
  else if(tab==='branding') renderAdminBranding(shell);
  else if(tab==='settings') renderAdminSettings(shell);
  window.scrollTo(0,0);
}

function renderAdminDashboard(shell){

  const revenue = DB.orders.filter(o=>o.status!=='Cancelled').reduce((s,o)=>s+o.total,0);

  const customers = buildCustomerIndex();
  const lowStock = DB.products.filter(p=> Number(p.stock) <= 5).sort((a,b)=> Number(a.stock) - Number(b.stock));
  const outOfStock = DB.products.filter(p=> Number(p.stock) === 0).length;

  const lowStockBlock = lowStock.length===0

  const body = `

      <div class="admin-stat-card">${icon('package')}<div class="admin-stat-value">${totalOrders}</div><div class="admin-stat-label">Total Orders</div></div>
      <div class="admin-stat-card">${icon('cash')}<div class="admin-stat-value">${formatMoney(revenue)}</div><div class="admin-stat-label">Revenue (COD)</div></div>
      <div class="admin-stat-card">${icon('clock')}<div class="admin-stat-value">${pending}</div><div class="admin-stat-label">In Progress</div></div>
      <div class="admin-stat-card">${icon('layers')}<div class="admin-stat-value">${products}</div><div class="admin-stat-label">Products Live</div></div>
      <div class="admin-stat-card">${icon('user')}<div class="admin-stat-value">${customers.length}</div><div class="admin-stat-label">Customers</div></div>
      <div class="admin-stat-card">${icon('bell')}<div class="admin-stat-value">${lowStock.length}</div><div class="admin-stat-label">Low Stock${outOfStock?` · ${outOfStock} out`:''}</div></div>
    </div>

    ${lowStockBlock}

    <div class="section"><span class="section-title">Quick Actions</span></div>
    <div class="admin-menu-grid">
      <div class="admin-menu-card" data-goto="products">${icon('plus')}<span>Add Product</span></div>
      <div class="admin-menu-card" data-goto="categories">${icon('grid')}<span>Categories</span></div>
      <div class="admin-menu-card" data-goto="orders">${icon('truck')}<span>Manage Orders</span></div>
      <div class="admin-menu-card" data-goto="customers">${icon('user')}<span>Customers</span></div>
      <div class="admin-menu-card" data-goto="offers">${icon('tag')}<span>Offers</span></div>
      <div class="admin-menu-card" data-goto="branding">${icon('paint')}<span>Edit Branding</span></div>
    </div>
    <div class="policy-note" style="margin:16px;">${icon('info')}<span>Payment mode: Cash on Delivery only. Online Payment is flagged "Coming soon" for customers.</span></div>
  `;

  bindAdminNav();
  $$('[data-goto]', shell).forEach(el=> el.addEventListener('click', ()=> renderAdminTab(el.dataset.goto)));

function renderAdminProducts(shell){

    <div class="section"><span class="section-title">Products (${DB.products.length})</span></div>

  }

function openProductForm(pid){
  const editing = !!pid;
  const p = editing ? getProduct(pid) : { name:'', price:'', mrp:'', category: DB.categories[0]?.id, stock:'', desc:'', img:'', sizes:[], hasSizes: false };
  const ALL_SIZES = ['XS','S','M','L','XL','XXL','XXXL','Free Size'];
  const NUM_SIZES = ['28','30','32','34','36','38','40','42','44','46'];
  const overlay = document.createElement('div');
  overlay.className = 'bottom-sheet-overlay';
  overlay.innerHTML = `
    <div class="bottom-sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title"><span>${editing?'Edit Product':'Add Product'}</span><button class="icon-btn" id="pfClose">${icon('close')}</button></div>
      <div class="form-group">
        <label class="form-label">Product Photo</label>
        <div class="file-drop ${p.img?'has-file':''}" id="pfFileDrop">
          ${p.img ? `<div class="file-preview-grid"><div class="file-preview"><img src="${p.img}"></div></div>` : `${icon('upload')}<p>Choose file</p><span>Any photo size &mdash; it is shrunk automatically</span>`}
        </div>
        <input type="file" id="pfFileInput" accept="image/*" style="display:none;">
      </div>
      <div class="form-group"><label class="form-label">Product Name</label><input class="form-input" id="pfName" value="${p.name}" placeholder="e.g. Women Floral Kurta"></div>
      <div class="form-group">
        <label class="form-label">Category</label>
        <div style="display:flex;gap:8px;">
          <select class="form-select" id="pfCategory" style="flex:1;">${DB.categories.map(c=>`<option value="${c.id}" ${c.id===p.category?'selected':''}>${c.name}</option>`).join('')}</select>
          <button class="btn btn-secondary btn-sm" id="pfAddCatBtn" style="white-space:nowrap;">${icon('plus')} New</button>
        </div>
        <div id="pfNewCatWrap" style="display:none;margin-top:8px;">
          <div style="display:flex;gap:8px;">
            <input class="form-input" id="pfNewCatName" placeholder="Category name (e.g. Toys)" style="flex:1;">
            <button class="btn btn-primary btn-sm" id="pfSaveCatBtn">Add</button>
          </div>
          <p style="font-size:11.5px;color:var(--ink-faint);margin-top:10px;">Pick an icon</p>
          <div class="cat-icon-pick" id="pfNewCatIcons">
            ${CATEGORY_ICON_OPTIONS.map((n,i)=>`<button type="button" data-icon="${n}" class="${i===0?'selected':''}">${icon(n)}</button>`).join('')}
          </div>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Sub-category (optional)</label>
        <select class="form-select" id="pfSub"><option value="">None</option></select>
        <p class="form-hint" style="margin:6px 0 0;">Choose a category first - its sub-categories appear here. Without one, the product shows under the category itself.</p>
      </div>
      <div style="display:flex;gap:10px;">
        <div class="form-group" style="flex:1;"><label class="form-label">Selling Price (₹)</label><input class="form-input" id="pfPrice" type="number" value="${p.price}" placeholder="499"></div>
        <div class="form-group" style="flex:1;"><label class="form-label">MRP (₹)</label><input class="form-input" id="pfMrp" type="number" value="${p.mrp}" placeholder="999"></div>
      </div>
      <div class="form-group"><label class="form-label">Stock Quantity</label><input class="form-input" id="pfStock" type="number" value="${p.stock}" placeholder="50"></div>

      <!-- Sizes -->
      <div class="form-group">
        <label class="form-label" style="display:flex;align-items:center;justify-content:space-between;">
          <span>Sizes Available</span>
          <label style="display:flex;align-items:center;gap:6px;font-weight:500;font-size:12px;cursor:pointer;">
            <input type="checkbox" id="pfHasSizes" ${p.hasSizes?'checked':''} style="accent-color:var(--brand);"> Enable sizes
          </label>
        </label>
        <div id="pfSizesWrap" style="${p.hasSizes?'':'display:none;'}">
          <p style="font-size:11.5px;color:var(--ink-faint);margin-bottom:8px;">Clothing sizes</p>
          <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;">
            ${ALL_SIZES.map(s=>`<button class="size-chip ${(p.sizes||[]).includes(s)?'selected':''}" data-size="${s}">${s}</button>`).join('')}
          </div>
          <p style="font-size:11.5px;color:var(--ink-faint);margin-bottom:8px;">Number sizes (jeans/trousers)</p>
          <div style="display:flex;flex-wrap:wrap;gap:8px;">
            ${NUM_SIZES.map(s=>`<button class="size-chip ${(p.sizes||[]).includes(s)?'selected':''}" data-size="${s}">${s}</button>`).join('')}
          </div>
        </div>
      </div>

      <div class="form-group"><label class="form-label">Description</label><textarea class="form-textarea" id="pfDesc" placeholder="Product details...">${p.desc||''}</textarea></div>
      <button class="btn btn-primary btn-block" id="pfSave">${editing?'Save Changes':'Add Product'}</button>
    </div>`;
  document.body.appendChild(overlay);
  let chosenImg = p.img;
  let selectedSizes = [...(p.sizes||[])];

  // File upload
  const fileInput = overlay.querySelector('#pfFileInput');
  overlay.querySelector('#pfFileDrop').addEventListener('click', ()=> fileInput.click());
  fileInput.addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    if(!/^image\//.test(file.type)){ showToast('Please choose a picture file', 'xCircle'); return; }
    /* Shrink before storing: a 5 MB camera photo becomes roughly 120 KB. */
    ncShrinkImage(file, 1000, 130).then((res)=>{
      chosenImg = res.dataUrl;
      overlay.querySelector('#pfFileDrop').classList.add('has-file');
      overlay.querySelector('#pfFileDrop').innerHTML = `<div class="file-preview-grid"><div class="file-preview"><img src="${chosenImg}"></div></div>`;
      ncPictureReady('Product picture', res);
    }).catch(ncPictureFailed);
    e.target.value = '';
  });

  /* Sub-category choices always match the category currently selected. */
  const pfSubSel = overlay.querySelector('#pfSub');
  const pfPaintSubs = (keep)=>{
    const cid = overlay.querySelector('#pfCategory').value;
    const cc  = DB.categories.find(x=> x.id === cid);
    const list = (cc && Array.isArray(cc.subs) ? cc.subs : [])
      .filter(x=> x && String(x.name || '').trim());
    const was = keep ? pfSubSel.value : '';
    pfSubSel.innerHTML = '<option value="">None</option>' +
      list.map(x=>`<option value="${String(x.name).replace(/"/g,'&quot;')}">${x.name}</option>`).join('');
    if(was && list.some(x=> String(x.name) === was)) pfSubSel.value = was;
  };
  pfPaintSubs(true);
  overlay.querySelector('#pfCategory').addEventListener('change', ()=> pfPaintSubs(false));

  // Add new category
  const addCatBtn = overlay.querySelector('#pfAddCatBtn');
  const newCatWrap = overlay.querySelector('#pfNewCatWrap');
  addCatBtn.addEventListener('click', ()=>{
    newCatWrap.style.display = newCatWrap.style.display==='none'||!newCatWrap.style.display ? 'block' : 'none';
  });
  // Category icon picker (line icons only)
  let newCatIcon = CATEGORY_ICON_OPTIONS[0];
  overlay.querySelectorAll('#pfNewCatIcons button').forEach(b=>{
    b.addEventListener('click', ()=>{
      newCatIcon = b.dataset.icon;
      overlay.querySelectorAll('#pfNewCatIcons button').forEach(x=> x.classList.remove('selected'));
      b.classList.add('selected');
    });
  });
  overlay.querySelector('#pfSaveCatBtn').addEventListener('click', ()=>{
    const catName = overlay.querySelector('#pfNewCatName').value.trim();
    if(!catName){ showToast('Enter category name'); return; }
    const newCat = { id:'c'+Date.now(), name:catName, icon:newCatIcon, img:'' };
    DB.categories.push(newCat);
    persist();
    const sel = overlay.querySelector('#pfCategory');
    const opt = document.createElement('option');
    opt.value = newCat.id; opt.textContent = catName; opt.selected = true;
    sel.appendChild(opt);
    newCatWrap.style.display='none';
    overlay.querySelector('#pfNewCatName').value='';
    pfPaintSubs(false);      // the new category may bring its own sub-categories
    showToast('Category added', 'checkCircle');
  });

  // Sizes toggle
  overlay.querySelector('#pfHasSizes').addEventListener('change', (e)=>{
    overlay.querySelector('#pfSizesWrap').style.display = e.target.checked ? 'block' : 'none';
  });
  overlay.querySelectorAll('.size-chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      const sz = chip.dataset.size;
      if(selectedSizes.includes(sz)){ selectedSizes=selectedSizes.filter(s=>s!==sz); chip.classList.remove('selected'); }
      else { selectedSizes.push(sz); chip.classList.add('selected'); }
    });
  });

  overlay.querySelector('#pfClose').addEventListener('click', ()=> overlay.remove());
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) overlay.remove(); });

  overlay.querySelector('#pfSave').addEventListener('click', ()=>{
    const name = overlay.querySelector('#pfName').value.trim();
    const price = Number(overlay.querySelector('#pfPrice').value);
    const mrp = Number(overlay.querySelector('#pfMrp').value) || price;
    const category = overlay.querySelector('#pfCategory').value;
    const sub = overlay.querySelector('#pfSub').value;
    const stock = Number(overlay.querySelector('#pfStock').value) || 0;
    const desc = overlay.querySelector('#pfDesc').value.trim();
    const hasSizes = overlay.querySelector('#pfHasSizes').checked;
    if(!name || !price){ showToast('Please fill product name and price'); return; }
    const finalImg = chosenImg || PLACEHOLDER_IMG('newproduct'+Date.now());
    const sizes = hasSizes ? selectedSizes : [];
    if(editing){
      Object.assign(p, { name, price, mrp, category, sub, stock, desc, img: finalImg, hasSizes, sizes });
    } else {
      DB.products.push({ id:'p'+Date.now(), name, price, mrp, category, sub, stock, desc, img: finalImg, hasSizes, sizes, rating:0, ratingCount:0 });
    }
    if(!persistOrStop()) return;      // storage full: the toast already said so
    overlay.remove();
    showToast(editing?'Product updated':'Product added', 'checkCircle');
    const shell = $('#adminShell');
    if(shell) renderAdminProducts(shell);      // absent if opened outside the admin list
  });
}

const CATEGORY_EMOJI_CHOICES = ['👕','👔','👗','👠','👜','📱','💻','⌚','🎧','📷','🏠','🍳','🪑','🛋️','🖼️','💄','💅','✨','🧴','🌸','🧸','🎮','⚽','🍼','🛒','🍎','🥬','🍿','📚','✏️','📋','🎁','🐾','🚗','🔧','📦','⭐','🎯','🧺'];

function productCountForCategory(catId){
  return DB.products.filter(p=>p.category===catId).length;
}
function renderAdminCategories(shell){
  const body = `
    <div class="section"><span class="section-title">Categories (${DB.categories.length})</span></div>
    <div class="admin-section" id="adminCatList" style="padding-top:0;"></div>
  `;
  shell.innerHTML = adminShellHTML('categories','Manage Categories', body, true);
  bindAdminNav();
  const fab = $('#adminFab'); if(fab) fab.dataset.tab='categories';
  const list = $('#adminCatList');

  if(DB.categories.length===0){
    list.innerHTML = `<div class="empty-state">${icon('grid')}<h3>No categories yet</h3><p>Tap the + button to create your first category.</p></div>`;
    return;
  }

  list.innerHTML = DB.categories.map(c=>{
    const n = productCountForCategory(c.id);
    const thumb = c.img
      ? `<img src="${c.img}" loading="lazy" decoding="async" width="54" height="54" alt="">`
      : `<div class="cat-admin-thumb">${categoryThumbHTML(c)}</div>`;
    return `
    <div class="admin-list-item">
      ${thumb}
      <div class="ali-info">
        <div class="ali-title">${c.name}</div>
        <div class="ali-sub">${n} product${n===1?'':'s'}</div>
      </div>
      <div class="admin-list-actions">
        <button class="admin-icon-action" data-catedit="${c.id}">${icon('edit')}</button>
        <button class="admin-icon-action danger" data-catdel="${c.id}">${icon('trash')}</button>
      </div>
    </div>`;
  }).join('');

  $$('[data-catedit]', list).forEach(b=> b.addEventListener('click', ()=> categoryForm(b.dataset.catedit, ()=> renderAdminCategories(shell))));
  $$('[data-catdel]', list).forEach(b=> b.addEventListener('click', ()=>{
    const c = DB.categories.find(x=>x.id===b.dataset.catdel);
    if(!c) return;
    const n = productCountForCategory(c.id);
    const others = DB.categories.filter(x=>x.id!==c.id);
    if(n>0 && others.length===0){
      showToast('Add another category before deleting this one', 'xCircle');
      return;
    }
    const msg = n>0
      ? `${n} product${n===1?'':'s'} in "${c.name}" will be moved to "${others[0].name}".`
      : 'Products in this category are not affected.';
    confirmAction('Delete category?', msg, ()=>{
      if(n>0) DB.products.forEach(p=>{ if(p.category===c.id) p.category = others[0].id; });
      DB.categories = DB.categories.filter(x=>x.id!==c.id);
      persist();
      renderAdminCategories(shell);
      showToast('Category deleted', 'checkCircle');
    });
  }));
}

  document.body.appendChild(overlay);

    /* Any size is fine now - it is resized before it is stored. */

      chosenImg = res.dataUrl;

      overlay.querySelector('#catFileDrop').innerHTML = `<div class="file-preview-grid"><div class="file-preview"><img src="${chosenImg}"></div></div>`;

    }).catch(ncPictureFailed);

  });
  const rmImg = overlay.querySelector('#catRemoveImg');
  if(rmImg) rmImg.addEventListener('click', ()=>{
    chosenImg = '';
    const drop = overlay.querySelector('#catFileDrop');
    drop.classList.remove('has-file');
    drop.innerHTML = `${icon('upload')}<p>Choose file</p><span>Any photo size &mdash; it is shrunk automatically</span>`;
    rmImg.remove();
  });

  overlay.querySelectorAll('#catEmojiGrid [data-emoji]').forEach(b=>{
    b.addEventListener('click', ()=>{
      chosenEmoji = (chosenEmoji === b.dataset.emoji) ? '' : b.dataset.emoji;
      overlay.querySelectorAll('#catEmojiGrid [data-emoji]').forEach(x=> x.classList.toggle('selected', !!chosenEmoji && x.dataset.emoji===chosenEmoji));
    });
  });

/* ---- Coupons (available + applied) ---- */
function renderCouponBox(){
  const slot = $('#couponSlot');
  if(!slot) return;
  const subtotal = cartTotal();
  const active = (DB.coupons||[]).filter(c=>c.active);
  const applied = appliedCoupon();

  slot.innerHTML = `
    ${applied ? `
      <div class="coupon-applied">
        <div style="display:flex;align-items:center;gap:8px;">
          ${icon('checkCircle')}
          <div><b>${applied.code} applied</b><br>
            <span style="font-size:11px;color:var(--ink-soft);">You save ${formatMoney(couponValue(applied, subtotal).amount)}</span>
          </div>
        </div>
        <button id="removeCouponBtn" style="font-size:12px;font-weight:800;color:var(--danger);">Remove</button>
      </div>` : ''}
    ${active.length ? `
      <div class="section" style="margin-top:14px;"><span class="section-title">Available Coupons</span></div>
      <div style="padding:0 16px 4px;">
        ${active.map(c=>{
          const v = couponValue(c, subtotal);
          const isOn = applied && applied.code === c.code;
          return `<div class="coupon-card" ${isOn?'style="box-shadow:var(--shadow-2), inset 0 0 0 1.5px var(--success);"':''}>
            <div class="coupon-left">
              <div class="coupon-pct">${c.type==='percent'? c.value+'%' : '₹'+c.value}</div>
              <div class="coupon-off">${c.type==='percent'?'OFF':'FLAT'}</div>
            </div>
            <div class="coupon-body">
              <div class="coupon-code" data-copy="${c.code}">${icon('tag')} ${c.code}</div>
              <div class="coupon-desc">${c.desc||''}</div>
            </div>
            ${applied && applied.code === c.code
              ? `<span class="coupon-apply" style="color:var(--success);display:inline-flex;align-items:center;gap:4px;">${icon('checkCircle','ic-sm')} APPLIED</span>`
              : `<button class="coupon-apply" data-apply="${c.code}" ${v.ok?'':'style="opacity:.45"'}>${v.ok?'APPLY':'—'}</button>`}
          </div>`;
        }).join('')}
      </div>` : ''}
  `;

  $$('[data-apply]', slot).forEach(btn=>{
    btn.addEventListener('click', ()=> applyCouponCode(btn.dataset.apply));
  });
  $$('[data-copy]', slot).forEach(el=>{
    el.addEventListener('click', ()=>{
      if(navigator.clipboard) navigator.clipboard.writeText(el.dataset.copy).catch(()=>{});
      showToast(`Code ${el.dataset.copy} copied`, 'copy');
    });
  });
  const rm = $('#removeCouponBtn');
  if(rm) rm.addEventListener('click', ()=>{
    appliedCouponCode = null;
    renderCartPage($('#mainContent'));
    showToast('Coupon removed');
  });

function applyCouponCode(code){
  const c = findCoupon(code);
  const subtotal = cartTotal();
  const v = couponValue(c, subtotal);
  if(!v.ok){
    showToast(v.reason, 'xCircle');
    return;
  }
  appliedCouponCode = c.code;
  renderCartPage($('#mainContent'));
  showToast(`Coupon applied · you save ${formatMoney(v.amount)}`, 'checkCircle');
}

          <div class="cart-item-price">${formatMoney(p.price)}</div>
          <div class="qty-stepper">
            <button data-act="dec">${icon('minus')}</button>
            <span>${item.qty}</span>
            <button data-act="inc">${icon('plus')}</button>
          </div>
        </div>
        <button class="cart-item-remove" data-act="remove">${icon('trash')}</button>
      </div>`;
  }).join('');
  $$('.cart-item', list).forEach(el=>{
    const pid = el.dataset.pid;
    el.querySelector('[data-act="inc"]').addEventListener('click', ()=> changeQty(pid, 1));
    el.querySelector('[data-act="dec"]').addEventListener('click', ()=> changeQty(pid, -1));
    el.querySelector('[data-act="remove"]').addEventListener('click', ()=> removeFromCart(pid));
  });
  renderCartSummary();
  updateCartBadge();
}
function changeQty(pid, delta){
  const item = DB.cart.find(i=>i.productId===pid);
  if(!item) return;
  item.qty += delta;
  if(item.qty<=0){ removeFromCart(pid); return; }
  persist();
  renderCartItems();
}
function removeFromCart(pid){
  DB.cart = DB.cart.filter(i=>i.productId!==pid);
  persist();
  if(DB.cart.length===0) renderCartPage($('#mainContent'));
  else renderCartItems();
  showToast('Removed from cart');
}
function renderCartSummary(){
  const summary = $('#cartSummary');
  if(!summary) return;
  const total = cartTotal();
  const mrp = mrpTotal();
  const discount = mrp - total;
  const t = orderTotals();
  const coupon = appliedCoupon();
  summary.innerHTML = `
    <div class="summary-row"><span>MRP Total</span><span>${formatMoney(mrp)}</span></div>
    <div class="summary-row"><span>Discount</span><span style="color:var(--success)">-${formatMoney(discount)}</span></div>
    ${t.discount > 0 ? `<div class="summary-row"><span>Coupon ${coupon?`(${coupon.code})`:''}</span><span style="color:var(--success)">-${formatMoney(t.discount)}</span></div>` : ''}
    <div class="summary-row"><span>Delivery</span><span>${t.delivery===0?'<span class="free">FREE</span>':formatMoney(t.delivery)}</span></div>
    <div class="summary-row total"><span>Total Amount</span><span>${formatMoney(t.grand)}</span></div>
  `;
}

/* Placing an order creates ONE ORDER PER PRODUCT, like Flipkart —
   each item gets its own order id, status and tracking timeline. */
function placeOrder(grand, addr){
  addr = addr || DB.user.addresses[0];
  const t = orderTotals();
  const coupon = appliedCoupon();
  const now = Date.now();
  const cityStr = addr ? `${addr.city}, ${addr.state}` : SAMPLE_CITY_ROUTE[0];
  const addrStr = addr ? `${DB.user.name} · ${DB.user.phone}\n${addr.line}, ${addr.city}, ${addr.state} - ${addr.pincode}` : 'Unknown';

  const lines = DB.cart.map(i=>({
    productId: i.productId,
    qty: i.qty,
    price: getProduct(i.productId).price
  }));

  let remainingDiscount = t.discount;
  let remainingDelivery = t.delivery;
  const created = [];

  lines.forEach((line, idx)=>{
    const lineValue = line.price * line.qty;
    const last = idx === lines.length - 1;

    // Split the coupon discount proportionally; last order absorbs rounding.
    const disc = last
      ? remainingDiscount
      : Math.min(remainingDiscount, Math.round(t.discount * (lineValue / t.subtotal)));
    // Delivery is charged once — it lands on the first order.
    const del = last
      ? remainingDelivery
      : Math.min(remainingDelivery, idx === 0 ? t.delivery : 0);

    remainingDiscount -= disc;
    remainingDelivery -= del;

    const order = {
      id: 'TKR' + (DB.nextOrderNum++),
      placedAt: now,
      status: 'Placed',
      customerName: DB.user.name,
      customerPhone: DB.user.phone,
      currentCity: cityStr,
      address: addrStr,
      addressObj: addr,
      items: [line],
      subtotal: lineValue,
      total: lineValue - disc + del,
      payment: 'COD',
      couponCode: coupon ? coupon.code : null,
      couponDiscount: disc,
      deliveryFee: del,
      reviewed: false,
      timeline: [ { stage:'Placed', at: now, city: cityStr, note:'Order placed successfully' } ],
    };
    DB.orders.unshift(order);
    created.push(order);
  });

  DB.cart = [];
  appliedCouponCode = null;
  persist();
  updateCartBadge();

  const grandTotal = created.reduce((s,o)=> s + o.total, 0);

  // Animated success screen (full-screen overlay, then the normal confirmation)
  showOrderSuccess(created, ()=>{
    pushView('Order Confirmed', (main)=>{
      main.innerHTML = `
        ${checkoutStepBar(2)}
        <div class="empty-state" style="padding-top:24px;">
          <div style="color:var(--success);width:64px;height:64px;">${icon('checkCircle')}</div>
          <h3>${created.length>1 ? created.length+' Orders Placed!' : 'Order Placed!'}</h3>
          <p>${created.length>1
              ? `${created.length} separate orders created — each item ships and tracks on its own.`
              : `Order <b>#${created[0].id}</b> confirmed.`}<br>Pay <b>${formatMoney(grandTotal)}</b> on delivery.</p>
          <div class="od-section" style="text-align:left;margin:16px 0;width:100%;">
            ${created.map(o=>{
              const p = getProduct(o.items[0].productId);
              return `<div class="trust-row">${icon('package')}<span><b>#${o.id}</b> · ${p?p.name:''} ×${o.items[0].qty}</span></div>`;
            }).join('')}
            <div class="trust-row">${icon('mapPin')}<span>${addr?.city}, ${addr?.state} - ${addr?.pincode}</span></div>
            <div class="trust-row">${icon('cash')}<span>Cash on Delivery</span></div>
          </div>
          <button class="btn btn-primary" id="trackNowBtn">${created.length>1?'View My Orders':'Track Order'}</button>
          <button class="text-btn" id="continueShopBtn">Continue Shopping</button>
        </div>`;
      $('#trackNowBtn').addEventListener('click', ()=>{
        viewStack=[];
        if(created.length > 1) switchTab('orders');
        else openOrderDetail(created[0].id, true);
      });
      $('#continueShopBtn').addEventListener('click', ()=>{ viewStack=[]; switchTab('home'); });
    });
  });
}

/* ---- Full-screen success animation with confetti ---- */
function showOrderSuccess(orders, onDone){
  const list = Array.isArray(orders) ? orders : [orders];
  const total = list.reduce((s,o)=> s + o.total, 0);
  const multi = list.length > 1;

  const el = document.createElement('div');
  el.className = 'success-screen';
  el.innerHTML = `
    <div class="success-ring">${icon('checkCircle')}</div>
    <div class="success-title">${multi ? list.length + ' Orders Placed!' : 'Order Placed!'}</div>
    <div class="success-sub">
      ${multi
        ? `${list.length} orders created — each item ships and tracks separately.<br>`
        : `Order <b>#${list[0].id}</b> is confirmed.<br>`}
      Pay <b>${formatMoney(total)}</b> in cash when it arrives.
    </div>
    <button class="btn btn-primary" id="sucDone" style="min-width:200px;">Continue</button>
    <p style="font-size:11px;color:var(--ink-faint);margin-top:14px;">${icon('truck')} Arriving in 3–5 days</p>
  `;
  document.body.appendChild(el);

  // Confetti burst
  const colors = ['#FF3F6C','#FF7A45','#1E9E5A','#F7C948','#8E2DE2'];
  for(let i=0;i<34;i++){
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random()*100 + 'vw';
    c.style.background = colors[i % colors.length];
    c.style.animationDuration = (1.6 + Math.random()*1.2) + 's';
    c.style.animationDelay = (Math.random()*0.4) + 's';
    c.style.transform = `rotate(${Math.random()*360}deg)`;
    document.body.appendChild(c);
    setTimeout(()=> c.remove(), 3400);
  }
  if(navigator.vibrate) { try{ navigator.vibrate([40,60,40]); }catch(e){} }

  const close = ()=>{
    el.style.transition = 'opacity .25s ease';
    el.style.opacity = '0';
    setTimeout(()=>{ el.remove(); onDone && onDone(); }, 240);
  };
  $('#sucDone', el).addEventListener('click', close);
  setTimeout(()=>{ if(document.body.contains(el)) close(); }, 4200);
}

function openOrderDetail(oid, replaceStack){

  if(replaceStack) viewStack = [];
  pushView('Order #' + oid, (main)=> buildOrderDetail(main, order));
}
function buildOrderDetail(main, order){
  const stageIdx = ORDER_STAGES.indexOf(order.status);
  const isCancelled = order.status === 'Cancelled';
  const isReturned = order.status === 'Returned';

  const timelineHTML = isCancelled || isReturned
    ? `
      <div class="timeline-item">
        <div class="tl-marker-col"><div class="tl-dot done" style="background:var(--danger);">${icon('xCircle')}</div></div>
        <div class="tl-content">
          <div class="tl-title">${order.status}</div>
          <div class="tl-meta">${formatDate(order.timeline[order.timeline.length-1].at)} · ${order.timeline[order.timeline.length-1].city}</div>
        </div>
      </div>`
    : ORDER_STAGES.map((stage, i)=>{
        const tEntry = order.timeline.find(t=>t.stage===stage);
        const done = i <= stageIdx;
        const isCurrent = i === stageIdx;
        return `
          <div class="timeline-item">
            <div class="tl-marker-col">
              <div class="tl-dot ${done?'done':''} ${isCurrent?'current':''}">${done ? icon('checkCircle') : ''}</div>
              ${i < ORDER_STAGES.length-1 ? `<div class="tl-line ${i<stageIdx?'done':''}"></div>` : ''}
            </div>
            <div class="tl-content">
              <div class="tl-title ${done?'':'pending'}">${stage}</div>
              <div class="tl-meta">${tEntry ? formatDate(tEntry.at) + ' · ' + tEntry.city : 'Pending'}</div>
            </div>
          </div>`;
      }).join('');

  const currentCityBlock = !isCancelled && !isReturned ? `
    <div class="track-current-card card-fade-in">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div>
          <div style="font-size:11px;opacity:0.75;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:4px;">Current Location</div>
          <div class="track-current-city">${order.currentCity}</div>
          <div class="track-current-sub">Your order is on the way</div>
        </div>
        <div style="text-align:right;">
          <div style="background:rgba(255,255,255,0.2);border-radius:20px;padding:6px 14px;font-size:12px;font-weight:700;">${order.status==='Delivered'?'Delivered':'Arriving soon'}</div>
          ${order.trackingId?`<div style="font-size:10.5px;opacity:0.8;margin-top:6px;">ID: ${order.trackingId}</div>`:''}
        </div>
      </div>
      ${order.trackingDetail?`<div style="margin-top:10px;font-size:11.5px;opacity:0.85;">${icon('truck')} ${order.trackingDetail}</div>`:''}
    </div>` : `
    <div class="track-current-card card-fade-in" style="background:linear-gradient(120deg,#8b8a93,#6b6a72);">
      <div class="track-current-top">${icon(isCancelled?'xCircle':'refresh')}<span class="track-current-city">Order ${order.status}</span></div>
      <div class="track-current-sub">${order.address}</div>
    </div>`;

  const canCancel = canCancelOrder(order);
  const canReturn = canReturnOrder(order);
  const daysLeft = returnDaysLeft(order);

  let actionsHTML = '';
  if(canCancel){
    actionsHTML = `<button class="btn btn-danger-outline btn-block" id="cancelOrderBtn">Cancel Order</button>`;
  } else if(order.status === 'Delivered'){
    // Rate & review unlocks once the product has actually been delivered
    const alreadyReviewed = !!order.reviewed;
    actionsHTML = `
      <button class="btn btn-primary btn-block" id="rateOrderBtn">
        ${icon('star')} ${alreadyReviewed ? 'Edit Your Review' : 'Rate & Review Product'}
      </button>`;
    if(canReturn){
      actionsHTML += `<button class="btn btn-outline btn-block" id="returnOrderBtn">Return Order (${daysLeft} day${daysLeft!==1?'s':''} left)</button>`;
    } else {
      actionsHTML += `<div class="policy-note">${icon('info')}<span>Return window has expired. Returns are only accepted within ${DB.settings.returnWindowDays} days of delivery.</span></div>`;
    }
  }

  main.innerHTML = `
    ${currentCityBlock}
    <div class="section"><span class="section-title">Order Timeline</span></div>
    <div class="timeline">${timelineHTML}</div>
    ${actionsHTML ? `<div class="track-actions" style="flex-direction:column;">${actionsHTML}</div>` : ''}
    <div class="od-section">
      <h4>Items in this order</h4>
      ${order.items.map(i=>{
        const p = getProduct(i.productId);
        if(!p) return '';
        return `<div class="od-product-row"><img src="${p.img}"><span class="od-product-name">${p.name} × ${i.qty}</span><span class="od-product-price">${formatMoney(i.price*i.qty)}</span></div>`;
      }).join('')}
    </div>
    <div class="od-section">
      <h4>Delivery Address</h4>
      <div class="trust-row">${icon('user')}<span><b>${order.customerName||DB.user.name}</b> · ${order.customerPhone||DB.user.phone}</span></div>
      <p style="font-size:13px;color:var(--ink-soft);margin-top:6px;line-height:1.6;">${(order.address||'').replace(/\n/g,'<br>')}</p>
    </div>
    <div class="od-section">
      <h4>Payment</h4>
      <div class="trust-row">${icon('cash')}<span>Cash on Delivery · ${formatMoney(order.total)}</span></div>
    </div>
    ${order.trackingId ? `
    <div class="od-section">
      <h4>${icon('truck')} Tracking Info</h4>
      <div class="trust-row">${icon('copy')}<span><b>Tracking ID:</b> ${order.trackingId}</span></div>
      ${order.trackingDetail ? `<div class="trust-row">${icon('box')}<span><b>Courier:</b> ${order.trackingDetail}</span></div>` : ''}
    </div>` : ''}
    <div class="policy-note">
      ${icon('info')}
      <span>Cancel is available only before your order ships. Returns are accepted within ${DB.settings.returnWindowDays} days after delivery.</span>
    </div>
  `;

  if(canCancel){
    $('#cancelOrderBtn').addEventListener('click', ()=> confirmAction(
      'Cancel this order?', 'This action cannot be undone. Your order will be cancelled.',
      ()=>{
        order.status = 'Cancelled';
        order.timeline.push({ stage:'Cancelled', at: Date.now(), city: order.currentCity });
        persist();
        showToast('Order cancelled', 'checkCircle');
        buildOrderDetail(main, order);
      }
    ));
  }
  const rateBtn = $('#rateOrderBtn');
  if(rateBtn) rateBtn.addEventListener('click', ()=>{
    reviewSheet(order, ()=> buildOrderDetail(main, order));
  });
  if(canReturn){
    $('#returnOrderBtn').addEventListener('click', ()=> openReturnSheet(order, ()=> buildOrderDetail(main, order)));
  }
}

// ---- Return / Exchange sheet ----
function openReturnSheet(order, onDone){
  const overlay = document.createElement('div');
  overlay.className = 'bottom-sheet-overlay';
  overlay.innerHTML = `
    <div class="bottom-sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title"><span>Return / Exchange</span><button class="icon-btn" id="rsClose">${icon('close')}</button></div>
      <p style="font-size:13px;color:var(--ink-soft);margin-bottom:16px;">What would you like to do with this order?</p>
      <div style="display:flex;gap:10px;margin-bottom:18px;">
        <button class="btn btn-secondary btn-block rs-type-btn" data-type="Refund" style="flex:1;flex-direction:column;gap:4px;padding:14px 10px;">
          ${icon('wallet')}<span style="font-size:13px;">Refund</span><span style="font-size:11px;color:var(--ink-faint);font-weight:500;">Money back to you</span>
        </button>
        <button class="btn btn-secondary btn-block rs-type-btn" data-type="Exchange" style="flex:1;flex-direction:column;gap:4px;padding:14px 10px;">
          ${icon('refresh')}<span style="font-size:13px;">Exchange</span><span style="font-size:11px;color:var(--ink-faint);font-weight:500;">Get a different item</span>
        </button>
      </div>
      <div class="form-group">
        <label class="form-label">Reason</label>
        <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:10px;">
          ${['Wrong size / doesn\'t fit','Wrong item delivered','Damaged / defective product','Different from description','Changed my mind','Other'].map(r=>`
            <label style="display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:500;cursor:pointer;">
              <input type="radio" name="rsReason" value="${r}" style="accent-color:var(--brand);width:16px;height:16px;"> ${r}
            </label>`).join('')}
        </div>
        <textarea class="form-textarea" id="rsNote" placeholder="Add more details (optional)…" style="min-height:60px;"></textarea>
      </div>

      <!-- Refund payment details — shown only when Refund is selected -->
      <div id="rsRefundSection" style="display:none;">
        <div style="background:var(--warn-bg);border-radius:var(--radius-md);padding:12px 14px;margin-bottom:14px;">
          <p style="font-size:12.5px;font-weight:600;color:var(--warn);">Enter your refund account details. Refund will be processed within 5–7 business days after pickup.</p>
        </div>
        <div class="form-group">
          <label class="form-label">Refund Method</label>
          <div style="display:flex;gap:10px;margin-bottom:12px;">
            <button class="btn btn-secondary rs-pay-btn" data-pay="UPI" style="flex:1;">UPI</button>
            <button class="btn btn-secondary rs-pay-btn" data-pay="Bank" style="flex:1;">Bank Transfer</button>
          </div>
        </div>
        <div id="rsUpiFields" style="display:none;">
          <div class="form-group"><label class="form-label">UPI ID</label><input class="form-input" id="rsUpiId" placeholder="e.g. name@upi or 9999999999@paytm"></div>
        </div>
        <div id="rsBankFields" style="display:none;">
          <div class="form-group"><label class="form-label">Account Holder Name</label><input class="form-input" id="rsBankName" placeholder="Full name as per bank"></div>
          <div class="form-group"><label class="form-label">Account Number</label><input class="form-input" id="rsBankAccNo" type="tel" placeholder="Bank account number"></div>
          <div class="form-group"><label class="form-label">IFSC Code</label><input class="form-input" id="rsBankIfsc" placeholder="e.g. HDFC0001234"></div>
          <div class="form-group"><label class="form-label">Bank Name</label><input class="form-input" id="rsBankBankName" placeholder="e.g. HDFC Bank"></div>
        </div>
      </div>

      <div id="rsTypeError" style="color:var(--danger);font-size:12px;display:none;margin-bottom:8px;">Please choose Refund or Exchange.</div>
      <div id="rsReasonError" style="color:var(--danger);font-size:12px;display:none;margin-bottom:8px;">Please select a reason.</div>
      <div id="rsPayError" style="color:var(--danger);font-size:12px;display:none;margin-bottom:8px;">Please enter your refund account details.</div>
      <button class="btn btn-primary btn-block" id="rsSubmit">Submit Request</button>
    </div>`;
  document.body.appendChild(overlay);

  let selectedType = '';
  let selectedPayMethod = '';

  // Type selection
  overlay.querySelectorAll('.rs-type-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      selectedType = btn.dataset.type;
      overlay.querySelectorAll('.rs-type-btn').forEach(b=>{ b.style.boxShadow=''; b.style.background=''; });
      btn.style.boxShadow = '0 0 0 2px var(--brand)';
      overlay.querySelector('#rsRefundSection').style.display = selectedType==='Refund' ? 'block' : 'none';
    });
  });

  // Pay method selection
  overlay.querySelectorAll('.rs-pay-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      selectedPayMethod = btn.dataset.pay;
      overlay.querySelectorAll('.rs-pay-btn').forEach(b=>{ b.style.boxShadow=''; });
      btn.style.boxShadow = '0 0 0 2px var(--brand)';
      overlay.querySelector('#rsUpiFields').style.display = selectedPayMethod==='UPI' ? 'block' : 'none';
      overlay.querySelector('#rsBankFields').style.display = selectedPayMethod==='Bank' ? 'block' : 'none';
    });
  });

  overlay.querySelector('#rsClose').addEventListener('click', ()=> overlay.remove());
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });

  overlay.querySelector('#rsSubmit').addEventListener('click', ()=>{
    const typeErr = overlay.querySelector('#rsTypeError');
    const reasonErr = overlay.querySelector('#rsReasonError');
    const payErr = overlay.querySelector('#rsPayError');
    const selectedReason = overlay.querySelector('input[name="rsReason"]:checked');
    typeErr.style.display = selectedType ? 'none' : 'block';
    reasonErr.style.display = selectedReason ? 'none' : 'block';

    // Validate refund details
    let refundDetails = null;
    if(selectedType === 'Refund'){
      if(!selectedPayMethod){ payErr.style.display='block'; return; }
      payErr.style.display='none';
      if(selectedPayMethod==='UPI'){
        const upi = overlay.querySelector('#rsUpiId').value.trim();
        if(!upi){ showToast('Please enter your UPI ID'); return; }
        refundDetails = { method:'UPI', upiId: upi };
      } else {
        const bankName = overlay.querySelector('#rsBankName').value.trim();
        const accNo = overlay.querySelector('#rsBankAccNo').value.trim();
        const ifsc = overlay.querySelector('#rsBankIfsc').value.trim();
        const bankBankName = overlay.querySelector('#rsBankBankName').value.trim();
        if(!bankName||!accNo||!ifsc){ showToast('Please fill all bank details'); return; }
        refundDetails = { method:'Bank', accountName:bankName, accountNo:accNo, ifsc, bankName:bankBankName };
      }
    }

    if(!selectedType || !selectedReason) return;
    const note = overlay.querySelector('#rsNote').value.trim();
    order.status = selectedType==='Refund' ? 'Return Requested' : 'Return Requested';
    order.returnType = selectedType;
    order.returnReason = selectedReason.value + (note ? ' — ' + note : '');
    if(refundDetails) order.refundDetails = refundDetails;
    order.timeline.push({ stage:`${selectedType} Requested`, at: Date.now(), city: order.currentCity });
    persist();
    overlay.remove();
    showToast(`${selectedType} request submitted`, 'checkCircle');
    onDone();
  });
}

// Generic confirm modal (bottom sheet style)
function confirmAction(title, desc, onConfirm){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  // Must sit above the admin shell (z-index 400) and the PIN modal (200),
  // otherwise confirmations triggered from those screens render underneath
  // them and cannot be tapped.
  overlay.style.zIndex = '500';
  overlay.innerHTML = `
    <div class="modal-card">
      <h3>${title}</h3>
      <p class="muted" style="margin-top:6px;">${desc}</p>
      <div style="display:flex;gap:10px;margin-top:20px;">
        <button class="btn btn-secondary btn-block" id="cfCancel">No, Keep it</button>
        <button class="btn btn-primary btn-block" id="cfOk">Yes, Confirm</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#cfCancel').addEventListener('click', ()=> overlay.remove());
  overlay.querySelector('#cfOk').addEventListener('click', ()=>{ overlay.remove(); onConfirm(); });
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) overlay.remove(); });
}

                ${list.length>1?`<button class="danger" data-del="${a.id}">Delete</button>`:''}
              </div>

      $('#addAddrBtn').addEventListener('click', ()=> addressForm(null, render));

        addressForm(b.dataset.edit, render);
      }));
      $$('[data-def]', main).forEach(b=> b.addEventListener('click', ()=>{
        DB.user.addresses.forEach(a=> a.isDefault = (a.id === b.dataset.def));
        persist();
        render();
        showToast('Default address updated', 'checkCircle');
      }));
      $$('[data-del]', main).forEach(b=> b.addEventListener('click', ()=>{
        const a = DB.user.addresses.find(x=>x.id===b.dataset.del);
        confirmAction('Delete address?', `${a.label} — ${a.line}, ${a.city}`, ()=>{
          DB.user.addresses = DB.user.addresses.filter(x=>x.id!==b.dataset.del);
          if(!DB.user.addresses.some(x=>x.isDefault) && DB.user.addresses.length)

      overlay.querySelectorAll('.af-label').forEach(x=>x.classList.remove('selected'));
      b.classList.add('selected');
    });
  });

  const close = ()=> overlay.remove();
  overlay.querySelector('#afClose').addEventListener('click', close);
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) close(); });

  overlay.querySelector('#afSave').addEventListener('click', ()=>{
    const name  = overlay.querySelector('#afName').value.trim();
    const phone = overlay.querySelector('#afPhone').value.trim();
    const line  = overlay.querySelector('#afLine').value.trim();
    const city  = overlay.querySelector('#afCity').value.trim();
    const pin   = overlay.querySelector('#afPin').value.trim();
    const state = overlay.querySelector('#afState').value.trim();

    if(!name){ showToast('Enter your name'); return; }
    if(!/^\d{10}$/.test(phone)){ showToast('Enter a valid 10-digit phone'); return; }
    if(!line){ showToast('Enter your address'); return; }
    if(!city){ showToast('Enter your city'); return; }
    if(!/^\d{6}$/.test(pin)){ showToast('Enter a valid 6-digit pincode'); return; }
    if(!state){ showToast('Enter your state'); return; }

    DB.user.name = name;
    DB.user.phone = '+91 ' + phone;
    if(a){
      Object.assign(a, { label:chosenLabel, line, city, state, pincode:pin });
    } else {
      const isFirst = DB.user.addresses.length === 0;
      DB.user.addresses.push({
        id:'a'+Date.now(), label:chosenLabel, line, city, state, pincode:pin, isDefault:isFirst
      });
    }
    persist();
    close();
    if(onSaved) onSaved();
    showToast(a?'Address updated':'Address added', 'checkCircle');
  });
}

// ============================================================
// ADMIN TRIGGER
// Three ways in, because a hidden gesture that silently fails is worse
// than no gesture at all:
//   1. tap the logo 12x (window resets 3s after the last tap)
//   2. press and hold the logo for 1.2s
//   3. open the file with #admin on the end of the URL
// ============================================================
const ADMIN_TAPS_NEEDED  = 12;
const ADMIN_TAP_WINDOW_MS = 3000;
const ADMIN_HOLD_MS      = 1200;
const ADMIN_PIN_DEFAULT  = '1234';

function initAdminTrigger(){
  // Delegated on document so the trigger keeps working even if the topbar
  // is re-rendered and the original element is replaced.
  document.addEventListener('click', (e)=>{
    if(!(e.target instanceof Element) || !e.target.closest('#brandTapZone')) return;
    registerAdminTap();
  });

  let holdTimer = null;
  const cancelHold = ()=>{ if(holdTimer){ clearTimeout(holdTimer); holdTimer = null; } };
  document.addEventListener('pointerdown', (e)=>{
    if(!(e.target instanceof Element) || !e.target.closest('#brandTapZone')) return;
    cancelHold();
    holdTimer = window.setTimeout(()=>{ holdTimer = null; openAdminPin(); }, ADMIN_HOLD_MS);
  }, true);
  document.addEventListener('pointerup', cancelHold, true);
  document.addEventListener('pointercancel', cancelHold, true);

  if(String(location.hash).replace('#','').toLowerCase() === 'admin'){
    try{ history.replaceState(null, '', location.pathname + location.search); }catch(_){}
    window.setTimeout(openAdminPin, 500);
  }
}
function registerAdminTap(){
  logoTapCount++;
  clearTimeout(logoTapTimer);
  logoTapTimer = setTimeout(()=>{ logoTapCount = 0; }, ADMIN_TAP_WINDOW_MS);
  if(logoTapCount >= ADMIN_TAPS_NEEDED){
    logoTapCount = 0;
    openAdminPin();
  }
  // Deliberately silent: a hidden entry point must not advertise itself.
}

      $$('#otpKeypad [data-k]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          if(btn.dataset.k==='back') otpInput=otpInput.slice(0,-1);
          else if(otpInput.length<4) otpInput+=btn.dataset.k;
          updateDots();
          if(otpInput.length===4){
            setTimeout(()=>{
              if(otpInput===generatedOtp){ step='name'; renderStep(); }
              else { $('#otpError').style.display='block'; otpInput=''; updateDots(); }
            },150);
          }
        });
      });
      $('#otpBack').addEventListener('click', ()=>{ step='phone'; renderStep(); });
      $('#otpResend').addEventListener('click', ()=>{ generatedOtp=Math.floor(1000+Math.random()*9000).toString(); showToast('New OTP: '+generatedOtp); });

          <input class="form-input" id="loginName" placeholder="Full name" value="${isNew?'':DB.user.name}" style="margin-bottom:14px;">
          <button class="btn btn-primary btn-block" id="loginFinish">Start Shopping</button>
        </div>`;
      $('#loginFinish').addEventListener('click', ()=>{
        const name = $('#loginName').value.trim();
        if(!name){ showToast('Please enter your name'); return; }
        doLogin(enteredPhone, name);
        loginEl.classList.remove('active');
        updateWishlistTopIcon();
        showToast(`Welcome, ${name}!`, 'checkCircle');
        if(onSuccess) onSuccess();
      });
    }
  }
  renderStep();
}

function registerServiceWorker(){
  if(!('serviceWorker' in navigator)) return;
  // Service workers need https:// or http://localhost — silently skip on file://
  if(location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') return;
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{ /* offline/install just unavailable */ });
  });
}

window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  updateInstallRow();
});

/* Show the "Install App" row only when installing is actually possible */
function updateInstallRow(){
  const row = $('#installAppRow');
  if(!row) return;
  const standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
                     || window.navigator.standalone === true;
  if(standalone){ row.style.display = 'none'; return; }
  row.style.display = (isIOS() || deferredInstallPrompt) ? 'flex' : 'none';
}

function promptInstallApp(){
  if(deferredInstallPrompt){
    deferredInstallPrompt.prompt();
    deferredInstallPrompt.userChoice.then((res)=>{
      if(res.outcome === 'accepted') showToast('Installing NEXCART…', 'checkCircle');
      deferredInstallPrompt = null;
    });
    return;
  }
  // iOS Safari + browsers without the prompt event — show manual steps
  confirmAction(
    'Install NEXCART on your phone',
    isIOS()
      ? 'Tap the Share button in Safari, then choose "Add to Home Screen".'
      : 'Open the browser menu (⋮) and choose "Install app" or "Add to Home screen".'
  );
}
function isIOS(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
}

/* Gate an action behind login. Browsing is always open — this only fires when
   the customer tries to do something that genuinely needs an account. */
function requireLogin(what, onOk){
  if(isLoggedIn()){ onOk && onOk(); return true; }
  const reasons = {
    checkout: 'place your order',
    wishlist: 'save items to your wishlist',
    profile:  'view your profile',
    review:   'write a review',
    orders:   'see your orders'
  };
  showLoginScreen(()=> onOk && onOk(), reasons[what] || 'continue');
  return false;
}
function isGuest(){ return !isLoggedIn(); }

function boot(){
  applyBranding();
  registerServiceWorker();
  // Guests can browse the whole store. Login is only asked for at the point
  // of checkout / wishlist / profile / reviews.
  launchApp();
}

document.addEventListener('DOMContentLoaded', boot);

let pinInput = '';
let adminUnlocked = false;
let adminStack = [];

function initPinKeypad(){
  const keys = ['1','2','3','4','5','6','7','8','9','','0','back'];
  const pad = $('#pinKeypad');
  pad.innerHTML = keys.map(k=>{
    if(k==='') return `<div class="pin-key empty"></div>`;
    if(k==='back') return `<button class="pin-key" data-key="back">${icon('back')}</button>`;
    return `<button class="pin-key" data-key="${k}">${k}</button>`;
  }).join('');
  $$('.pin-key[data-key]', pad).forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const key = btn.dataset.key;
      if(key==='back'){ pinInput = pinInput.slice(0,-1); }
      else if(pinInput.length < 10){ pinInput += key; }   // PIN can be 4–10 digits
      $('#pinError').style.display = 'none';
      updatePinDots();
    });
  });
  $('#pinUnlockBtn').addEventListener('click', checkPin);
  $('#pinCancelBtn').addEventListener('click', closePinModal);
  const resetBtn = $('#pinResetBtn');
  if(resetBtn) resetBtn.addEventListener('click', resetAdminPin);
}
/* The stored PIN is only trusted when it is actually a 4–10 digit code.
   Anything else (missing key, legacy value from an older build, corrupt
   storage) falls back to the documented default instead of locking the owner
   out of their own shop. */
function adminPinValue(){
  const p = String((DB.settings && DB.settings.adminPin) || '');
  return /^\d{4,10}$/.test(p) ? p : ADMIN_PIN_DEFAULT;
}
function resetAdminPin(){
  confirmAction(
    'Reset admin access?',
    'The admin PIN goes back to ' + ADMIN_PIN_DEFAULT + '. Your products, orders, categories and branding are kept.',
    ()=>{
      DB.settings.adminPin = ADMIN_PIN_DEFAULT;
      persist();
      pinInput = '';
      updatePinDots();
      $('#pinError').style.display = 'none';
      showToast('Admin PIN reset to ' + ADMIN_PIN_DEFAULT, 'checkCircle');
    }
  );
}
function updatePinDots(){
  // One dot per entered digit (grows as you type, up to 10)
  const wrap = $('#pinDots');
  const n = Math.max(pinInput.length, 4);   // show at least 4 placeholders
  let h = '';
  for(let i=0;i<n;i++) h += `<span class="${i < pinInput.length ? 'filled' : ''}"></span>`;
  wrap.innerHTML = h;
}
function openAdminPin(){
  pinInput = '';
  updatePinDots();
  $('#pinError').style.display = 'none';
  $('#pinModal').style.display = 'flex';
}
function closePinModal(){
  $('#pinModal').style.display = 'none';
  pinInput = '';
}
function checkPin(){
  if(pinInput.length < 4){
    $('#pinError').textContent = 'PIN must be at least 4 digits.';
    $('#pinError').style.display = 'block';
    return;
  }
  if(pinInput === adminPinValue()){
    closePinModal();
    openAdminPanel();
  } else {
    $('#pinError').textContent = 'Incorrect PIN. Try again.';
    $('#pinError').style.display = 'block';
    pinInput = '';
    updatePinDots();
  }
}

function bindAdminNav(){
  $$('#adminShell [data-admin-page]').forEach(btn=>{

function renderAdminTab(tab){

  else if(tab==='orders') renderAdminOrders(shell);
  else if(tab==='customers') renderAdminCustomers(shell);
  else if(tab==='offers') renderAdminOffers(shell);
  else if(tab==='branding') renderAdminBranding(shell);
  else if(tab==='settings') renderAdminSettings(shell);

function openProductForm(pid){
  const editing = !!pid;
  const p = editing ? getProduct(pid) : { name:'', price:'', mrp:'', category: DB.categories[0]?.id, stock:'', desc:'', img:'', sizes:[], hasSizes: false };
  const ALL_SIZES = ['XS','S','M','L','XL','XXL','XXXL','Free Size'];
  const NUM_SIZES = ['28','30','32','34','36','38','40','42','44','46'];
  const overlay = document.createElement('div');
  overlay.className = 'bottom-sheet-overlay';
  overlay.innerHTML = `
    <div class="bottom-sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title"><span>${editing?'Edit Product':'Add Product'}</span><button class="icon-btn" id="pfClose">${icon('close')}</button></div>
      <div class="form-group">
        <label class="form-label">Product Photo</label>
        <div class="file-drop ${p.img?'has-file':''}" id="pfFileDrop">
          ${p.img ? `<div class="file-preview-grid"><div class="file-preview"><img src="${p.img}"></div></div>` : `${icon('upload')}<p>Choose file</p><span>PNG, JPG up to 5MB</span>`}
        </div>
        <input type="file" id="pfFileInput" accept="image/*" style="display:none;">
      </div>
      <div class="form-group"><label class="form-label">Product Name</label><input class="form-input" id="pfName" value="${p.name}" placeholder="e.g. Women Floral Kurta"></div>
      <div class="form-group">
        <label class="form-label">Category</label>
        <div style="display:flex;gap:8px;">
          <select class="form-select" id="pfCategory" style="flex:1;">${DB.categories.map(c=>`<option value="${c.id}" ${c.id===p.category?'selected':''}>${c.name}</option>`).join('')}</select>
          <button class="btn btn-secondary btn-sm" id="pfAddCatBtn" style="white-space:nowrap;">${icon('plus')} New</button>
        </div>
        <div id="pfNewCatWrap" style="display:none;margin-top:8px;">
          <div style="display:flex;gap:8px;">
            <input class="form-input" id="pfNewCatName" placeholder="Category name (e.g. Toys)" style="flex:1;">
            <button class="btn btn-primary btn-sm" id="pfSaveCatBtn">Add</button>
          </div>
          <p style="font-size:11.5px;color:var(--ink-faint);margin-top:10px;">Pick an icon</p>
          <div class="cat-icon-pick" id="pfNewCatIcons">
            ${CATEGORY_ICON_OPTIONS.map((n,i)=>`<button type="button" data-icon="${n}" class="${i===0?'selected':''}">${icon(n)}</button>`).join('')}
          </div>
        </div>
      </div>
      <div style="display:flex;gap:10px;">
        <div class="form-group" style="flex:1;"><label class="form-label">Selling Price (₹)</label><input class="form-input" id="pfPrice" type="number" value="${p.price}" placeholder="499"></div>
        <div class="form-group" style="flex:1;"><label class="form-label">MRP (₹)</label><input class="form-input" id="pfMrp" type="number" value="${p.mrp}" placeholder="999"></div>
      </div>
      <div class="form-group"><label class="form-label">Stock Quantity</label><input class="form-input" id="pfStock" type="number" value="${p.stock}" placeholder="50"></div>

      <!-- Sizes -->
      <div class="form-group">
        <label class="form-label" style="display:flex;align-items:center;justify-content:space-between;">
          <span>Sizes Available</span>
          <label style="display:flex;align-items:center;gap:6px;font-weight:500;font-size:12px;cursor:pointer;">
            <input type="checkbox" id="pfHasSizes" ${p.hasSizes?'checked':''} style="accent-color:var(--brand);"> Enable sizes
          </label>
        </label>
        <div id="pfSizesWrap" style="${p.hasSizes?'':'display:none;'}">
          <p style="font-size:11.5px;color:var(--ink-faint);margin-bottom:8px;">Clothing sizes</p>
          <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;">
            ${ALL_SIZES.map(s=>`<button class="size-chip ${(p.sizes||[]).includes(s)?'selected':''}" data-size="${s}">${s}</button>`).join('')}
          </div>
          <p style="font-size:11.5px;color:var(--ink-faint);margin-bottom:8px;">Number sizes (jeans/trousers)</p>
          <div style="display:flex;flex-wrap:wrap;gap:8px;">
            ${NUM_SIZES.map(s=>`<button class="size-chip ${(p.sizes||[]).includes(s)?'selected':''}" data-size="${s}">${s}</button>`).join('')}

  const fileInput = overlay.querySelector('#pfFileInput');
  overlay.querySelector('#pfFileDrop').addEventListener('click', ()=> fileInput.click());
  fileInput.addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{
      chosenImg = ev.target.result;
      overlay.querySelector('#pfFileDrop').classList.add('has-file');
      overlay.querySelector('#pfFileDrop').innerHTML = `<div class="file-preview-grid"><div class="file-preview"><img src="${chosenImg}"></div></div>`;

    reader.readAsDataURL(file);
  });

  addCatBtn.addEventListener('click', ()=>{
    newCatWrap.style.display = newCatWrap.style.display==='none'||!newCatWrap.style.display ? 'block' : 'none';

  let newCatIcon = CATEGORY_ICON_OPTIONS[0];

      overlay.querySelectorAll('#pfNewCatIcons button').forEach(x=> x.classList.remove('selected'));
      b.classList.add('selected');
    });
  });

    const newCat = { id:'c'+Date.now(), name:catName, icon:newCatIcon, img:'' };
    DB.categories.push(newCat);
    persist();
    const sel = overlay.querySelector('#pfCategory');
    const opt = document.createElement('option');
    opt.value = newCat.id; opt.textContent = catName; opt.selected = true;
    sel.appendChild(opt);
    newCatWrap.style.display='none';
    overlay.querySelector('#pfNewCatName').value='';
    showToast('Category added', 'checkCircle');
  });

  // Sizes toggle
  overlay.querySelector('#pfHasSizes').addEventListener('change', (e)=>{
    overlay.querySelector('#pfSizesWrap').style.display = e.target.checked ? 'block' : 'none';
  });
  overlay.querySelectorAll('.size-chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      const sz = chip.dataset.size;
      if(selectedSizes.includes(sz)){ selectedSizes=selectedSizes.filter(s=>s!==sz); chip.classList.remove('selected'); }
      else { selectedSizes.push(sz); chip.classList.add('selected'); }
    });
  });

  overlay.querySelector('#pfClose').addEventListener('click', ()=> overlay.remove());
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) overlay.remove(); });

  overlay.querySelector('#pfSave').addEventListener('click', ()=>{
    const name = overlay.querySelector('#pfName').value.trim();
    const price = Number(overlay.querySelector('#pfPrice').value);
    const mrp = Number(overlay.querySelector('#pfMrp').value) || price;
    const category = overlay.querySelector('#pfCategory').value;
    const stock = Number(overlay.querySelector('#pfStock').value) || 0;
    const desc = overlay.querySelector('#pfDesc').value.trim();
    const hasSizes = overlay.querySelector('#pfHasSizes').checked;
    if(!name || !price){ showToast('Please fill product name and price'); return; }
    const finalImg = chosenImg || PLACEHOLDER_IMG('newproduct'+Date.now());
    const sizes = hasSizes ? selectedSizes : [];
    if(editing){
      Object.assign(p, { name, price, mrp, category, stock, desc, img: finalImg, hasSizes, sizes });
    } else {
      DB.products.push({ id:'p'+Date.now(), name, price, mrp, category, stock, desc, img: finalImg, hasSizes, sizes, rating:0, ratingCount:0 });
    }
    persist();
    overlay.remove();
    showToast(editing?'Product updated':'Product added', 'checkCircle');
    renderAdminProducts($('#adminShell'));
  });
}

  list.innerHTML = DB.categories.map(c=>{
    const n = productCountForCategory(c.id);
    const thumb = c.img
      ? `<img src="${c.img}" loading="lazy" decoding="async" width="54" height="54" alt="">`
      : `<div class="cat-admin-thumb">${categoryThumbHTML(c)}</div>`;
    return `
    <div class="admin-list-item">
      ${thumb}
      <div class="ali-info">
        <div class="ali-title">${c.name}</div>
        <div class="ali-sub">${n} product${n===1?'':'s'}</div>
      </div>
      <div class="admin-list-actions">
        <button class="admin-icon-action" data-catedit="${c.id}">${icon('edit')}</button>
        <button class="admin-icon-action danger" data-catdel="${c.id}">${icon('trash')}</button>
      </div>
    </div>`;
  }).join('');

  $$('[data-catedit]', list).forEach(b=> b.addEventListener('click', ()=> categoryForm(b.dataset.catedit, ()=> renderAdminCategories(shell))));
  $$('[data-catdel]', list).forEach(b=> b.addEventListener('click', ()=>{
    const c = DB.categories.find(x=>x.id===b.dataset.catdel);
    if(!c) return;
    const n = productCountForCategory(c.id);
    const others = DB.categories.filter(x=>x.id!==c.id);
    if(n>0 && others.length===0){
      showToast('Add another category before deleting this one', 'xCircle');
      return;
    }
    const msg = n>0
      ? `${n} product${n===1?'':'s'} in "${c.name}" will be moved to "${others[0].name}".`
      : 'Products in this category are not affected.';
    confirmAction('Delete category?', msg, ()=>{
      if(n>0) DB.products.forEach(p=>{ if(p.category===c.id) p.category = others[0].id; });
      DB.categories = DB.categories.filter(x=>x.id!==c.id);
      persist();
      renderAdminCategories(shell);
      showToast('Category deleted', 'checkCircle');
    });
  }));
}

function categoryForm(cid, onSaved){
  const editing = !!cid;
  const c = editing ? DB.categories.find(x=>x.id===cid) : { name:'', emoji:'', img:'' };
  let chosenEmoji = c.emoji || '';
  let chosenImg = c.img || '';
  let chosenIcon = editing ? categoryIcon(c) : CATEGORY_ICON_OPTIONS[0];

  const overlay = document.createElement('div');
  overlay.className = 'bottom-sheet-overlay';
  overlay.innerHTML = `
    <div class="bottom-sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title"><span>${editing?'Edit Category':'Add Category'}</span><button class="icon-btn" id="catClose">${icon('close')}</button></div>

      <div class="form-group">
        <label class="form-label">Category Image (optional)</label>
        <div class="file-drop ${chosenImg?'has-file':''}" id="catFileDrop">
          ${chosenImg ? `<div class="file-preview-grid"><div class="file-preview"><img src="${chosenImg}"></div></div>` : `${icon('upload')}<p>Choose file</p><span>PNG, JPG up to 5MB</span>`}
        </div>
        <input type="file" id="catFileInput" accept="image/*" style="display:none;">
        ${chosenImg ? `<button class="text-btn" id="catRemoveImg" style="color:var(--danger);margin-top:8px;">Remove image</button>` : ''}
      </div>

      <div class="form-group">
        <label class="form-label">Category Name</label>
        <input class="form-input" id="catName" value="${c.name}" placeholder="e.g. Footwear">
      </div>

      <div class="form-group">
        <label class="form-label">Emoji (shown on the storefront)</label>
        <div class="cat-emoji-grid" id="catEmojiGrid">
          ${CATEGORY_EMOJI_CHOICES.map(e=>`<button class="cat-emoji-btn ${chosenEmoji===e?'selected':''}" data-emoji="${e}">${e}</button>`).join('')}
        </div>
        <button class="text-btn" id="catClearEmoji" style="color:var(--ink-faint);margin-top:8px;">Clear emoji (use line icon instead)</button>
      </div>

      <div class="form-group">
        <label class="form-label">Line Icon (fallback when no emoji)</label>
        <div class="cat-emoji-grid" id="catIconGrid">
          ${CATEGORY_ICON_OPTIONS.map(n=>`<button class="cat-emoji-btn ${chosenIcon===n?'selected':''}" data-icon="${n}">${icon(n)}</button>`).join('')}
        </div>
      </div>

      <button class="btn btn-primary btn-block" id="catSave">${editing?'Save Changes':'Add Category'}</button>
    </div>`;
  document.body.appendChild(overlay);

  overlay.querySelector('#catFileDrop').addEventListener('click', ()=> overlay.querySelector('#catFileInput').click());
  overlay.querySelector('#catFileInput').addEventListener('change', (e)=>{
    const file = e.target.files[0]; if(!file) return;
    if(file.size > 5*1024*1024){ showToast('Image must be under 5MB', 'xCircle'); return; }
    const reader = new FileReader();
    reader.onload = (ev)=>{
      chosenImg = ev.target.result;
      overlay.querySelector('#catFileDrop').classList.add('has-file');
      overlay.querySelector('#catFileDrop').innerHTML = `<div class="file-preview-grid"><div class="file-preview"><img src="${chosenImg}"></div></div>`;
    };
    reader.readAsDataURL(file);
  });
  const rmImg = overlay.querySelector('#catRemoveImg');
  if(rmImg) rmImg.addEventListener('click', ()=>{
    chosenImg = '';
    const drop = overlay.querySelector('#catFileDrop');
    drop.classList.remove('has-file');
    drop.innerHTML = `${icon('upload')}<p>Choose file</p><span>PNG, JPG up to 5MB</span>`;
    rmImg.remove();
  });

  overlay.querySelectorAll('#catEmojiGrid [data-emoji]').forEach(b=>{
    b.addEventListener('click', ()=>{
      chosenEmoji = (chosenEmoji === b.dataset.emoji) ? '' : b.dataset.emoji;
      overlay.querySelectorAll('#catEmojiGrid [data-emoji]').forEach(x=> x.classList.toggle('selected', !!chosenEmoji && x.dataset.emoji===chosenEmoji));
    });
  });
  overlay.querySelector('#catClearEmoji').addEventListener('click', ()=>{
    chosenEmoji = '';
    overlay.querySelectorAll('#catEmojiGrid [data-emoji]').forEach(x=> x.classList.remove('selected'));
  });
  overlay.querySelectorAll('#catIconGrid [data-icon]').forEach(b=>{
    b.addEventListener('click', ()=>{
      chosenIcon = b.dataset.icon;
      overlay.querySelectorAll('#catIconGrid [data-icon]').forEach(x=> x.classList.remove('selected'));
      b.classList.add('selected');
    });
  });

  overlay.querySelector('#catClose').addEventListener('click', ()=> overlay.remove());
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) overlay.remove(); });

  overlay.querySelector('#catSave').addEventListener('click', ()=>{
    const name = overlay.querySelector('#catName').value.trim();
    if(!name){ showToast('Enter a category name'); return; }
    const dup = DB.categories.find(x=> x.name.toLowerCase()===name.toLowerCase() && (!editing || x.id!==cid));
    if(dup){ showToast('That category already exists', 'xCircle'); return; }
    const data = { name, emoji: chosenEmoji, icon: chosenIcon, img: chosenImg };
    if(editing) Object.assign(c, data);
    else DB.categories.push(Object.assign({ id:'c'+Date.now() }, data));
    persist();
    overlay.remove();
    onSaved && onSaved();
    showToast(editing?'Category updated':'Category added', 'checkCircle');
  });
}

// Phone numbers are stored in mixed formats across the app
// ("+91 98765 43210", "+919876543210", "9876543210"), so key customers on the
// last 10 digits — otherwise one person becomes several customer records.
function normalizePhone(p){
  const d = String(p||'').replace(/\D/g,'');
  return d.length > 10 ? d.slice(-10) : d;
}
function buildCustomerIndex(){
  const map = new Map();
  DB.orders.forEach(o=>{
    const key = normalizePhone(o.customerPhone) || (o.customerName||'Guest').toLowerCase();
    if(!map.has(key)) map.set(key, { key, name:o.customerName||'Guest', phone:'', orders:[], spend:0, last:0 });
    const c = map.get(key);
    c.orders.push(o);
    if(o.status!=='Cancelled') c.spend += o.total;
    c.last = Math.max(c.last, o.placedAt||0);
    if(o.customerName) c.name = o.customerName;
    // Keep the most readable variant of the number (e.g. "+91 98765 43210").
    if(o.customerPhone && o.customerPhone.length > (c.phone||'').length) c.phone = o.customerPhone;
  });
  return [...map.values()].sort((a,b)=> b.last - a.last);
}
function customerInitials(name){
  const parts = String(name||'G').trim().split(/\s+/);
  return ((parts[0][0]||'G') + (parts[1] ? parts[1][0] : '')).toUpperCase();
}
function renderAdminCustomers(shell){

function renderAdminOrders(shell){

  }

    const custLine = [o.customerName, o.customerPhone].filter(Boolean).join(' · ') || 'Customer details not recorded';

    <div style="background:var(--surface);border-radius:var(--radius-md);margin:0 14px 12px;padding:14px;box-shadow:var(--shadow-2);">
      <!-- Row 1: Order ID + status badge -->

      <!-- Row 2: Customer -->

      <!-- Row 3: Address -->
      <div style="font-size:12px;color:var(--ink-soft);margin-bottom:4px;">${(o.address||o.currentCity||'').replace(/\n/g,' · ')}</div>
      <!-- Row 4: Items text only -->
      <div style="font-size:12px;color:var(--ink-soft);margin-bottom:4px;">${o.items.map(i=>{ const p=getProduct(i.productId); return p?`${p.name} ×${i.qty}`:''; }).join(' · ')}</div>
      <!-- Row 5: Total + date -->
      <div style="font-size:13px;font-weight:700;color:var(--ink);margin-bottom:8px;">${formatMoney(o.total)} · COD · ${new Date(o.placedAt).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}</div>

      ${o.returnType ? `<div style="display:flex;align-items:flex-start;gap:7px;font-size:12px;color:var(--danger);background:var(--danger-bg);border-radius:8px;padding:7px 10px;margin-bottom:8px;">${icon('refresh','xs-ic')}<span><b>${o.returnType}:</b> ${o.returnReason||''}</span></div>` : ''}
      ${o.refundDetails ? `<div style="display:flex;align-items:flex-start;gap:7px;font-size:12px;color:var(--success);background:var(--success-bg);border-radius:8px;padding:7px 10px;margin-bottom:8px;">${icon('wallet','xs-ic')}<span><b>Refund (${o.refundDetails.method}):</b> ${o.refundDetails.method==='UPI'?o.refundDetails.upiId:`${o.refundDetails.accountName} · ${o.refundDetails.accountNo} · ${o.refundDetails.ifsc}`}</span></div>` : ''}

      <!-- Controls: status + city + tracking + push -->
      <div style="display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:10px;margin-top:4px;">
        <div style="display:flex;gap:8px;">
          <select class="form-select ao-status" data-oid="${o.id}" style="flex:1;padding:9px 10px;font-size:13px;">
            ${ALL_STATUSES.map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}
          </select>
          <input class="form-input ao-city" data-oid="${o.id}" placeholder="City, State" value="${o.currentCity||''}" style="flex:1;padding:9px 10px;font-size:12.5px;">
        </div>
        <div style="display:flex;gap:8px;">
          <input class="form-input ao-tid" data-oid="${o.id}" placeholder="Tracking ID" value="${o.trackingId||''}" style="flex:1;padding:9px 10px;font-size:12.5px;">
          <input class="form-input ao-courier" data-oid="${o.id}" placeholder="Courier name" value="${o.trackingDetail||''}" style="flex:1;padding:9px 10px;font-size:12.5px;">
        </div>
        <button class="btn btn-primary btn-block ao-push" data-oid="${o.id}" style="padding:11px;">Push Update</button>
        ${lastUpdate ? `<div style="font-size:11px;color:var(--ink-faint);text-align:center;">Last: ${lastUpdate.stage} — ${lastUpdate.city} · ${new Date(lastUpdate.at).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</div>` : ''}
      </div>
    </div>`;
  }).join('');

  // Single "Push Update" handler — updates status + city + tracking + timeline all at once
  $$('.ao-push', list).forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const oid = btn.dataset.oid;
      const order = DB.orders.find(o=>o.id===oid);
      const newStatus = list.querySelector(`.ao-status[data-oid="${oid}"]`).value;
      const newCity   = list.querySelector(`.ao-city[data-oid="${oid}"]`).value.trim() || order.currentCity;
      const newTid    = list.querySelector(`.ao-tid[data-oid="${oid}"]`).value.trim();

      persist();
      showToast(`#${oid} updated → ${newStatus}`, 'checkCircle');
      // Refresh the last-update line
      renderAdminOrders(shell);
    });
  });
}

function couponForm(cid, onSaved){
  const c = cid ? DB.coupons.find(x=>x.id===cid) : null;
  const overlay = document.createElement('div');
  overlay.className = 'bottom-sheet-overlay';
  overlay.innerHTML = `
    <div class="bottom-sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title"><span>${c?'Edit Coupon':'Add Coupon'}</span><button class="icon-btn" id="cfClose">${icon('close')}</button></div>
      <div style="max-height:60vh;overflow-y:auto;">
        <div class="form-group"><label class="form-label">Coupon code</label>
          <input class="form-input" id="cfCode" placeholder="e.g. SAVE10" style="text-transform:uppercase;" value="${c?c.code:''}"></div>
        <div class="form-group"><label class="form-label">Discount type</label>
          <div style="display:flex;gap:8px;">
            <button type="button" class="size-chip cf-type ${(c?c.type:'percent')==='percent'?'selected':''}" data-type="percent">Percentage %</button>
            <button type="button" class="size-chip cf-type ${(c&&c.type==='flat')?'selected':''}" data-type="flat">Flat ₹</button>
          </div>
        </div>
        <div style="display:flex;gap:10px;">
          <div class="form-group" style="flex:1;"><label class="form-label">Value</label>
            <input class="form-input" id="cfValue" inputmode="numeric" placeholder="10" value="${c?c.value:''}"></div>
          <div class="form-group" style="flex:1;"><label class="form-label">Min order ₹</label>
            <input class="form-input" id="cfMin" inputmode="numeric" placeholder="499" value="${c?c.minOrder:''}"></div>
        </div>
        <div class="form-group"><label class="form-label">Max discount ₹ (for % coupons)</label>
          <input class="form-input" id="cfMax" inputmode="numeric" placeholder="200" value="${c?(c.maxDiscount||''):''}"></div>
        <div class="form-group"><label class="form-label">Description shown to customers</label>
          <input class="form-input" id="cfDesc" placeholder="e.g. 10% off on orders above ₹499" value="${c?(c.desc||''):''}"></div>
      </div>
      <button class="btn btn-primary btn-block" id="cfSave" style="margin-top:10px;">${c?'Save Changes':'Add Coupon'}</button>
    </div>`;
  document.body.appendChild(overlay);

  let chosenType = c ? c.type : 'percent';
  overlay.querySelectorAll('.cf-type').forEach(b=>{
    b.addEventListener('click', ()=>{
      chosenType = b.dataset.type;
      overlay.querySelectorAll('.cf-type').forEach(x=>x.classList.remove('selected'));
      b.classList.add('selected');
    });
  });

  const close = ()=> overlay.remove();
  overlay.querySelector('#cfClose').addEventListener('click', close);
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });

  overlay.querySelector('#cfSave').addEventListener('click', ()=>{
    const code = overlay.querySelector('#cfCode').value.trim().toUpperCase();
    const value = parseInt(overlay.querySelector('#cfValue').value, 10);
    const minOrder = parseInt(overlay.querySelector('#cfMin').value, 10) || 0;
    const maxDiscount = parseInt(overlay.querySelector('#cfMax').value, 10) || (chosenType==='flat'?value:0);
    const desc = overlay.querySelector('#cfDesc').value.trim();

    if(!code){ showToast('Enter a coupon code'); return; }
    if(!/^[A-Z0-9]{3,15}$/.test(code)){ showToast('Code: 3-15 letters/numbers only'); return; }
    if(!value || value <= 0){ showToast('Enter a discount value'); return; }
    if(chosenType === 'percent' && value > 90){ showToast('Percentage cannot exceed 90%'); return; }
    const dup = DB.coupons.find(x=> x.code === code && (!c || x.id !== c.id));
    if(dup){ showToast('That code already exists', 'xCircle'); return; }

    const data = { code, type:chosenType, value, minOrder, maxDiscount,
                   desc: desc || (chosenType==='percent'
                     ? `${value}% off on orders above ₹${minOrder}`
                     : `₹${value} off on orders above ₹${minOrder}`) };
    if(c) Object.assign(c, data);
    else DB.coupons.push(Object.assign({ id:'cp'+Date.now(), active:true }, data));
    persist(); close(); onSaved && onSaved();
    showToast(c?'Coupon updated':'Coupon added', 'checkCircle');
  });
}

<!-- ============================================================
     SERVER SYNC  —  THIS APP IS CONNECTED TO YOUR BACKEND
     Backend: https://nexcart-p9ms.onrender.com
     Products and orders are shared through it, so every phone sees the
     same shop. To point somewhere else, edit the URL on the next line.
     ============================================================ -->
<script>window.NC_API_BASE = 'https://nexcart-p9ms.onrender.com';</script>
<script>
/* ============================================================
   NEXCART — server sync adapter

   HOW TO TURN IT ON  —  edit ONE line, no other file needed
   Scroll down slightly to API_BASE_DEFAULT and paste your backend
   link inside the quotes. Save it (Commit changes on GitHub) and
   the shop goes online. You can do this straight from your phone.

   While that line is empty the shop still works exactly as it does
   today — nothing breaks.

   Every network call is wrapped in try/catch: a dead server or a
   patchy connection must never break the shop.
   ============================================================ */
(function () {
  'use strict';

  /* ============================================================
     ✏️  EDIT THIS ONE LINE  —  paste your backend link here
     ============================================================
     Example:  var API_BASE_DEFAULT = 'https://nexcart-api.onrender.com';
     Leave it empty ('') and the app stays offline-only.        */

  var API_BASE_DEFAULT = '';

  /* ============================================================ */

  var BASE = '';
  try {
    BASE = (API_BASE_DEFAULT || window.NC_API_BASE || localStorage.getItem('nc_api_base') || '').replace(/\/+$/, '');
  } catch (e) { BASE = API_BASE_DEFAULT || window.NC_API_BASE || ''; }

  var KEY_STORE = 'nc_admin_key';
  var POLL_MS   = 15000;
  var lastOrderSeen = 0;
  var lastCatalogHash = '';
  var busy = false;

  function getKey()   { try { return localStorage.getItem(KEY_STORE) || ''; } catch (e) { return ''; } }
  function setKey(k)  { try { localStorage.setItem(KEY_STORE, k); } catch (e) {} }

  function api(path, opts) {
    opts = opts || {};
    var headers = { 'Content-Type': 'application/json' };
    if (opts.admin) headers['x-admin-key'] = getKey();
    return fetch(BASE + path, {
      method: opts.method || 'GET',
      headers: headers,
      body: opts.body ? JSON.stringify(opts.body) : undefined
    }).then(function (r) {
      return r.text().then(function (t) {
        var data;
        try { data = t ? JSON.parse(t) : {}; } catch (e) { data = {}; }
        if (!r.ok) { var err = new Error(data.error || ('HTTP ' + r.status)); err.status = r.status; throw err; }
        return data;
      });
    });
  }

  /* ---------- local helpers ---------- */

  function db() { return (typeof DB !== 'undefined') ? DB : null; }

  function toast(msg, iconName) {
    try { if (typeof showToast === 'function') showToast(msg, iconName || 'checkCircle'); } catch (e) {}
  }

  function refreshVisibleCatalog() {
    try {
      var grid = document.getElementById('homeProductGrid');
      if (grid && typeof renderProductGrid === 'function') renderProductGrid(grid, DB.products);
      var chips = document.getElementById('catChipRow');
      if (chips && typeof renderCategoryChips === 'function') renderCategoryChips(chips);
    } catch (e) {}
  }

  function catalogHash() {
    try { return JSON.stringify([DB.products, DB.categories]).length + ':' +
                 (DB.products || []).map(function (p) { return p.id + p.price + p.stock; }).join(','); }
    catch (e) { return ''; }
  }

  /* ---------- 1. pull the catalogue down ---------- */

  function pullCatalog() {
    return api('/api/bootstrap').then(function (d) {
      var D = db(); if (!D) return;
      // Only adopt the server's catalogue once it actually holds something.
      // Before the owner's first push it is empty, and overwriting would wipe
      // the products they already created in the app.
      if (Array.isArray(d.products) && d.products.length) {
        D.products   = d.products;
        D.categories = Array.isArray(d.categories) && d.categories.length ? d.categories : D.categories;
        if (typeof persist === 'function') persist();
        refreshVisibleCatalog();
      }
    }).catch(function () { /* offline — keep local data */ });
  }

  /* ---------- 2. push the catalogue up (admin) ---------- */

  function pushCatalog(silent) {
    var D = db(); if (!D || !getKey()) return Promise.resolve();
    return api('/api/admin/push', {
      method: 'POST', admin: true,
      body: { products: D.products || [], categories: D.categories || [] }
    }).then(function (r) {
      lastCatalogHash = catalogHash();
      if (!silent) toast('Catalogue uploaded (' + r.products + ' products)');
    }).catch(function (e) {
      if (!silent) toast('Upload failed: ' + e.message);
    });
  }

  /* ---------- 3. send an order to the server ---------- */

  function submitOrder(order) {
    var D = db(); if (!D || !order) return;
    var items = (order.items || []).filter(function (i) { return i && i.productId; })
      .map(function (i) { return { productId: i.productId, qty: i.qty }; });
    if (!items.length) return;

    api('/api/orders', {
      method: 'POST',
      body: {
        customerName:  order.customerName || (D.user && D.user.name) || '',
        customerPhone: order.customerPhone || (D.user && D.user.phone) || '',
        address:       String(order.address || '').replace(/\n/g, ', '),
        items:         items,
        delivery:      Number(order.deliveryFee) || 0,
        claimedTotal:  Number(order.total) || 0,
        couponCode:    order.couponCode || null
      }
    }).catch(function (e) {
      // Queue for retry instead of losing the order.
      try {
        var q = JSON.parse(localStorage.getItem('nc_order_queue') || '[]');
        q.push({ order: order, at: Date.now() });
        localStorage.setItem('nc_order_queue', JSON.stringify(q.slice(-50)));
      } catch (e2) {}
      toast('Order saved on this phone. It will upload when online.', 'warn');
    });
  }

  function flushQueue() {
    var q;
    try { q = JSON.parse(localStorage.getItem('nc_order_queue') || '[]'); } catch (e) { return; }
    if (!q.length) return;
    // Empty the queue first; submitOrder re-queues anything that fails, so a
    // dropped connection can never silently lose a customer's order.
    try { localStorage.setItem('nc_order_queue', '[]'); } catch (e) {}
    q.forEach(function (entry) { submitOrder(entry.order); });
  }

  /* ---------- 4. admin: poll for new orders ---------- */

  function pollOrders() {
    if (!getKey() || busy) return;
    busy = true;
    api('/api/orders?since=' + lastOrderSeen, { admin: true }).then(function (d) {
      var D = db(); if (!D) return;
      var existing = {};
      (D.orders || []).forEach(function (o) { existing[o.id] = true; });
      var fresh = (d.orders || []).filter(function (o) { return !existing[o.id]; });
      if (fresh.length) {
        D.orders = fresh.concat(D.orders || []);
        if (typeof persist === 'function') persist();
        toast(fresh.length === 1 ? 'New order received!' : fresh.length + ' new orders!', 'package');
      }
      if (d.serverTime) lastOrderSeen = d.serverTime;
      // Keep the local catalogue in step with stock the server has reduced.
      if (!(d.orders || []).length) { /* no catalogue touch needed */ }
      // Auto-push the catalogue when the owner edits products in the app.
      var h = catalogHash();
      if (h !== lastCatalogHash && lastCatalogHash) pushCatalog(true);
      lastCatalogHash = h;
    }).catch(function (e) {
      if (e && e.status === 401) askForKey(true);
    }).then(function () { busy = false; });
  }

  function askForKey(isRetry) {
    if (!BASE) return;
    var msg = (isRetry ? 'Saved sync key was rejected.\n\n' : '') +
              'Enter your ADMIN_KEY to sync orders with the server:';
    var k = window.prompt(msg, getKey());
    if (k) { setKey(k.trim()); lastOrderSeen = 0; toast('Sync key saved'); }
  }

  /* ---------- 5. install hooks ---------- */

  function wrapPlaceOrder() {
    if (typeof window.placeOrder !== 'function' || window.placeOrder.__ncWrapped) return;
    var original = window.placeOrder;
    var wrapped = function () {
      var before = {};
      try { (db() && db().orders || []).forEach(function (o) { before[o.id] = true; }); } catch (e) {}
      var result = original.apply(this, arguments);
      try {
        ((db() && db().orders) || []).forEach(function (o) {
          if (!before[o.id]) submitOrder(o);
        });
      } catch (e) {}
      return result;
    };
    wrapped.__ncWrapped = true;
    window.placeOrder = wrapped;
  }

  var keyAsked = false;

  /* The backend key is only needed to READ orders and PUSH the catalogue —
     in other words, only inside the admin panel. Asking for it on a normal
     page load would throw a popup in front of every shopper, so we never
     do that. It is requested the moment the owner opens the admin panel. */
  function wrapAdminOpen() {
    if (typeof window.openAdminPanel !== 'function' || window.openAdminPanel.__ncWrapped) return;
    var orig = window.openAdminPanel;
    var wrapped = function () {
      var result = orig.apply(this, arguments);
      try {
        if (!getKey() && !keyAsked) {
          keyAsked = true;
          window.setTimeout(function () { askForKey(false); }, 600);
        }
      } catch (e) {}
      return result;
    };
    wrapped.__ncWrapped = true;
    window.openAdminPanel = wrapped;
  }

  function startPolling() {
    window.setInterval(function () {
      if (typeof adminUnlocked === 'undefined' || !adminUnlocked) return;
      // Backup path, in case the admin panel was opened some other way.
      if (!getKey() && !keyAsked) { keyAsked = true; askForKey(false); return; }
      pollOrders();
    }, POLL_MS);
  }

  function boot() {
    if (!BASE) return;               // switched off — do nothing at all
    wrapPlaceOrder();
    wrapAdminOpen();
    pullCatalog();
    flushQueue();
    startPolling();
  }

  // Public surface, handy for debugging or a custom admin button.
  window.NC = {
    base: BASE,
    sync: function () { return pullCatalog().then(function () { return pushCatalog(); }); },
    pushCatalog: pushCatalog,
    pollOrders: pollOrders,
    setKey: setKey,
    getKey: getKey
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { window.setTimeout(boot, 800); });
  } else {
    window.setTimeout(boot, 800);
  }
})();

</script>
</body>
</html>
